function shardsFromAny(j) {
  if (Array.isArray(j) && j[0] && j[0].data) return j[0].data;
  if (j && j.shards) return j.shards;
  if (j && j.data && j.data.items) {           // v1 manual backup
    const out = { settings: j.data.settings || {}, counters: j.data.counters || {} };
    for (const coll of Object.keys(MAP_COLLS).concat(['history'])) for (const [k, r] of Object.entries(j.data[coll] || {})) { const sh = shardOf(coll, k, r); (out[sh] = out[sh] || {})[k] = r; }
    return out;
  }
  if (j && (j.settings || Object.keys(j).some(k => k.startsWith('items')))) return j;
  throw new Error('This file is not an Inventory Manager backup');
}
// Full roll-back to a snapshot: snapshot records win, records created after the snapshot are removed.
// Every record gets a fresh timestamp so all stations accept the restored state.
async function restoreShards(shards) {
  const t = Date.now();
  const snap = {};
  for (const [sh, data] of Object.entries(shards)) { const coll = sh.split(':')[0]; if (coll === 'settings' || coll === 'counters') continue; snap[coll] = Object.assign(snap[coll] || {}, data); }
  // safety copy of the current state before overwriting
  try { await IDB.set('_pre_restore_' + today(), allShards()); } catch (e) { }
  for (const coll of Object.keys(MAP_COLLS).concat(['history'])) {
    const want = snap[coll] || {};
    for (const k of Object.keys(DB[coll])) if (!want[k]) { const tomb = { _del: true, _ts: t }; if (coll === 'history') tomb.date = DB[coll][k].date; DB[coll][k] = tomb; markDirty(coll, k, tomb); Undo.shadow(coll, k); }
    for (const [k, r] of Object.entries(want)) { const rec = Object.assign({}, r, { _ts: t + 1 }); DB[coll][k] = rec; markDirty(coll, k, rec); Undo.shadow(coll, k); }
  }
  if (shards.settings) { DB.settings = Object.assign(clone(DEFAULT_SETTINGS), shards.settings, { _ts: t + 1 }); markDirty('settings'); }
  if (shards.counters) { for (const k in shards.counters) DB.counters[k] = Math.max(num(DB.counters[k]), num(shards.counters[k])); markDirty('counters'); }
  dataVer++;
  await flush();
}

/* ---------- cloud backups (Supabase: table inv_backups + daily pg_cron job) ---------- */
const Cloud = {
  base(path) { return Sync.cfg().url.replace(/\/+$/, '') + '/rest/v1/' + path; },
  async list() { const r = await fetch(Cloud.base('inv_backups?select=day,created_at,size_kb&order=day.desc&limit=200'), { headers: Sync.headers() }); if (!r.ok) throw new Error(r.status === 404 ? 'Backup table not found — run the backup setup SQL' : 'Supabase ' + r.status + ': ' + (await r.text()).slice(0, 140)); return r.json(); },
  async get(day) { const r = await fetch(Cloud.base('inv_backups?select=day,data&day=eq.' + day), { headers: Sync.headers() }); if (!r.ok) throw new Error('Supabase ' + r.status); const rows = await r.json(); if (!rows[0]) throw new Error('Backup not found'); return rows[0].data; },
  async now() { const r = await fetch(Cloud.base('rpc/inv_backup_now'), { method: 'POST', headers: Sync.headers(), body: '{}' }); if (!r.ok) throw new Error(r.status === 404 ? 'Backup function not found — run the backup setup SQL' : 'Supabase ' + r.status + ': ' + (await r.text()).slice(0, 140)); return r.json(); }
};

// Oct 2026 update for an existing set-up: shorter cloud-backup retention + space gauge.
// Does NOT touch the backup schedule (cron) — the daily backup keeps running at its current time.
function backupUpdateSQL() {
  const t = Sync.cfg().table || 'inv_store';
  return `-- Inventory Manager — update (run once): keep 14 daily + 8 weekly cloud backups, add the space gauge.
-- Your backup schedule is NOT changed.
create or replace function public.inv_backup_now() returns text
language plpgsql security definer set search_path = public as $$
declare d jsonb;
begin
  select jsonb_object_agg(id, data) into d from public.${t};
  if d is null then return 'nothing to back up'; end if;
  insert into public.inv_backups(day, created_at, data, size_kb)
    values (current_date, now(), d, octet_length(d::text) / 1024)
    on conflict (day) do update set created_at = now(), data = excluded.data, size_kb = excluded.size_kb;
  -- keep every day for 14 days, then one per week (Sundays) for 8 more weeks
  delete from public.inv_backups
   where day < current_date - 14
     and not (extract(dow from day) = 0 and day >= current_date - 70);
  return 'ok';
end $$;
grant execute on function public.inv_backup_now() to anon;

${SPACE_SQL}

-- apply the new retention right away (removes the older backups)
select public.inv_backup_now();`;
}
function backupSQL() {

);

-- note: no insert/update/delete policy = the app can NOT delete or change backups

create or replace function public.inv_backup_now() returns text
language plpgsql security definer set search_path = public as $$
declare d jsonb;
begin
  select jsonb_object_agg(id, data) into d from public.${t};
  if d is null then return 'nothing to back up'; end if;
  insert into public.inv_backups(day, created_at, data, size_kb)
    values (current_date, now(), d, octet_length(d::text) / 1024)
    on conflict (day) do update set created_at = now(), data = excluded.data, size_kb = excluded.size_kb;
  -- keep every day for 14 days, then one per week (Sundays) for 8 more weeks

   where day < current_date - 14
     and not (extract(dow from day) = 0 and day >= current_date - 70);

${SPACE_SQL}

/* ---------- PC backup (Windows scheduled task, runs even when the app is closed) ---------- */
function pcScript() {
  const c = Sync.cfg();
  const ps = s => "'" + String(s).replace(/'/g, "''") + "'";
  return `# Inventory Manager - daily backup to this computer
# Right-click this file > "Run with PowerShell" ONCE. It installs itself and runs every day at 7:00 AM
# (or as soon as the computer is turned on if it was off at 7:00).
$SupabaseUrl = ${ps(c.url.replace(/\/+$/, ''))}
$Key         = ${ps(c.key)}
$Folder      = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Inventory Manager Backups'
$KeepDays    = 90

$ErrorActionPreference = 'Stop'
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
New-Item -ItemType Directory -Force -Path $Folder | Out-Null
$Self = Join-Path $Folder 'inventory-backup.ps1'
$Log  = Join-Path $Folder 'backup-log.txt'
function Log($m) { Add-Content -Path $Log -Value ("{0:yyyy-MM-dd HH:mm}  {1}" -f (Get-Date), $m); Write-Host $m }

# --- first run: copy this script into the backup folder and create the daily task ---
if ($PSCommandPath -ne $Self) {
  Copy-Item -Path $PSCommandPath -Destination $Self -Force
  try { Unblock-File -Path $Self } catch {}
  $action   = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "' + $Self + '"')
  $trigger  = New-ScheduledTaskTrigger -Daily -At 7:00am
  $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Minutes 30)
  Register-ScheduledTask -TaskName 'Inventory Manager Backup' -Action $action -Trigger $trigger -Settings $settings -Description 'Downloads the daily Inventory Manager backup from Supabase' -Force | Out-Null
  Log "Installed. Daily backup task created. Backups go to: $Folder"
}

try {
  $h = @{ apikey = $Key }
  if (-not $Key.StartsWith('sb_')) { $h['Authorization'] = "Bearer $Key" }
  # make sure today's cloud backup exists, then download the newest one
  try { Invoke-RestMethod -Method Post -Uri "$SupabaseUrl/rest/v1/rpc/inv_backup_now" -Headers $h -ContentType 'application/json' -Body '{}' | Out-Null } catch { Log "Note: could not trigger cloud backup ($($_.Exception.Message))" }
  $resp = Invoke-WebRequest -UseBasicParsing -Uri "$SupabaseUrl/rest/v1/inv_backups?select=day,data&order=day.desc&limit=1" -Headers $h
  $text = [System.Text.Encoding]::UTF8.GetString($resp.RawContentStream.ToArray())
  if ($text.Length -lt 20) { throw 'No backup found in the cloud yet' }
  $day = ([regex]::Match($text, '"day"\\s*:\\s*"(\\d{4}-\\d{2}-\\d{2})"')).Groups[1].Value
  if (-not $day) { $day = Get-Date -Format 'yyyy-MM-dd' }
  $file = Join-Path $Folder ("inventory_backup_$day.json")
  [System.IO.File]::WriteAllText($file, $text, (New-Object System.Text.UTF8Encoding($false)))
  Log ("Saved $file ({0:N0} KB)" -f ((Get-Item $file).Length / 1KB))
  # --- documents: download any file not yet on this computer ---
  try {
    $docRoot = Join-Path $Folder 'Documents'
    New-Item -ItemType Directory -Force -Path $docRoot | Out-Null
    $list = Invoke-RestMethod -Uri "$SupabaseUrl/rest/v1/inv_files?select=id,owner_kind,owner_label,name&order=created_at.asc" -Headers $h
    $new = 0
    foreach ($f in $list) {
      $bad = [IO.Path]::GetInvalidFileNameChars()
      $sub = if ($f.owner_kind -eq 'po') { 'Purchase orders' } else { 'Suppliers' }
      $owner = ((("" + $f.owner_label) -split '') | Where-Object { $bad -notcontains $_ }) -join ''
      $fname = ((("" + $f.name) -split '') | Where-Object { $bad -notcontains $_ }) -join ''
      if (-not $owner.Trim()) { $owner = 'Other' }
      if (-not $fname.Trim()) { $fname = 'file' }
      $dir = Join-Path (Join-Path $docRoot $sub) $owner.Trim()
      $target = Join-Path $dir ($f.id.Substring(0, 6) + '_' + $fname)
      if (Test-Path $target) { continue }
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      $one = Invoke-RestMethod -Uri ("$SupabaseUrl/rest/v1/inv_files?select=data&id=eq." + $f.id) -Headers $h
      [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($one[0].data))
      $new++
    }
    Log "Documents: $new new file(s) saved ($($list.Count) in the cloud)"
  } catch { Log "Documents: skipped ($($_.Exception.Message))" }
  Get-ChildItem $Folder -Filter 'inventory_backup_*.json' | Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-$KeepDays) } | Remove-Item -Force
} catch {
  Log "BACKUP FAILED: $($_.Exception.Message)"
}
if ($Host.Name -eq 'ConsoleHost' -and [Environment]::UserInteractive -and $PSCommandPath -ne $Self) { Read-Host 'Done - press Enter to close' }
`;
}

/* ---------- space gauge (top bar): database space used vs. the Supabase plan limit ---------- */
const Space = {
  info: null, err: null,
  limitMB() { return Math.max(1, num(S().spaceLimitMB) || 500); },
  async check() {
    const p = $('#spacePill'); if (!p) return;
    if (!Sync.enabled() || !isAdmin()) { p.classList.add('hide'); return; }
    try {
      const r = await fetch(Sync.cfg().url.replace(/\/+$/, '') + '/rest/v1/rpc/inv_space', { method: 'POST', headers: Sync.headers(), body: '{}' });
      if (!r.ok) throw new Error(r.status === 404 ? 'not set up' : 'HTTP ' + r.status);
      Space.info = await r.json(); Space.err = null;
    } catch (e) { Space.info = null; Space.err = e.message; }
    Space.draw();
  },
  pct() { return Space.info ? Space.info.db / (Space.limitMB() * 1048576) * 100 : null; },
  draw() {
    const p = $('#spacePill'); p.classList.remove('hide', 'warn', 'bad');

  }
};

const FILES_SQL = `-- Documents (attachments) — files can be added and read, never deleted by the app
create table if not exists public.inv_files (

  owner_kind text,
  owner_id text,
  owner_label text,
  name text not null,
  mime text,
  size int,
  data text not null,
  created_at timestamptz not null default now(),
  created_by text
);

drop policy if exists "files read" on public.inv_files;

drop policy if exists "files add" on public.inv_files;
create policy "files add" on public.inv_files for insert to anon with check (true);`;

const Files = {
  url(q) { return Sync.cfg().url.replace(/\/+$/, '') + '/rest/v1/inv_files' + (q || ''); },
  async put(meta, b64) {
    await IDB.set('file:' + meta.id, Object.assign({}, meta, { data: b64 }));          // local copy first
    if (Sync.enabled()) {
      const r = await fetch(Files.url(), { method: 'POST', headers: Object.assign(Sync.headers(), { Prefer: 'return=minimal' }), body: JSON.stringify([{ id: meta.id, owner_kind: meta.kind, owner_id: meta.ownerId, owner_label: meta.ownerLabel, name: meta.name, mime: meta.mime, size: meta.size, data: b64, created_by: meta.by }]) });
      if (!r.ok) { const t = await r.text(); throw new Error(r.status === 404 || /inv_files/.test(t) ? 'The documents table is not set up yet — run the SQL in Settings → Backups (Step A) again' : 'Upload failed (' + r.status + '): ' + t.slice(0, 120)); }
    }
  },
  async get(id) {
    const local = await IDB.get('file:' + id); if (local && local.data) return local.data;
    if (!Sync.enabled()) throw new Error('File not found on this computer');
    const r = await fetch(Files.url('?select=data&id=eq.' + encodeURIComponent(id)), { headers: Sync.headers() });
    if (!r.ok) throw new Error('Download failed (' + r.status + ')');
    const rows = await r.json(); if (!rows[0]) throw new Error('File not found in the cloud');
    try { const meta = await IDB.get('file:' + id); await IDB.set('file:' + id, Object.assign(meta || { id }, { data: rows[0].data })); } catch (e) { }
    return rows[0].data;
  },
  async list() { const r = await fetch(Files.url('?select=id,owner_kind,owner_label,name,size,created_at&order=created_at.desc'), { headers: Sync.headers() }); if (!r.ok) throw new Error('Documents table not set up (' + r.status + ')'); return r.json(); }
};
function fileToB64(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); }); }
function b64ToBlob(b64, mime) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime || 'application/octet-stream' }); }
function fmtSize(n) { n = num(n); return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function docIcon(name) { const e = String(name).split('.').pop().toLowerCase(); return { pdf: '📕', xls: '📗', xlsx: '📗', csv: '📗', doc: '📘', docx: '📘', jpg: '🖼️', jpeg: '🖼️', png: '🖼️', msg: '✉️', eml: '✉️', zip: '🗜️' }[e] || '📄'; }
async function openDoc(doc, download) {
  try {
    toast('Opening ' + doc.name + '…');
    const blob = b64ToBlob(await Files.get(doc.id), doc.mime);
    const url = URL.createObjectURL(blob);
    const viewable = /pdf|image|text/.test(doc.mime || '');
    if (!download && viewable) { const w = window.open(url, '_blank'); if (!w) saveBlob(blob, doc.name); }
    else saveBlob(blob, doc.name);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast(e.message, true); }
}

/* Documents box used inside the supplier and PO windows.
   opts: { kind:'supplier'|'po', coll:'suppliers'|'pos', rec, label:()=>string, canEdit } */
function docsBox(el, opts) {
  const rec = opts.rec; rec.docs = rec.docs || [];
  const draw = () => {
    const docs = rec.docs.filter(d => !d.removed);
    el.innerHTML = `<div class="bar" style="margin:0 0 6px"><b>Documents</b><span class="muted small">${docs.length ? docs.length + ' file(s)' : 'none yet'} — PDF, Excel, Word, pictures… (max ${DOC_MAX_MB} MB each)</span><div class="sp"></div>
      ${opts.canEdit ? `<label class="btn sm">📎 Attach files… <input type="file" multiple class="hide" data-up></label>` : opts.hint ? `<span class="small muted">${esc(opts.hint)}</span>` : ''}</div>
      ${docs.length ? `<div class="tbl-wrap" style="max-height:none"><table class="t"><tbody>${docs.map(d => `<tr><td>${docIcon(d.name)} <a href="#" data-open="${d.id}">${esc(d.name)}</a></td><td class="muted small">${fmtSize(d.size)}</td><td class="muted small">${fmtDT(d.date)} · ${esc(d.by || '')}</td>
        <td class="r"><button class="btn sm" data-dl="${d.id}" type="button">Download</button>${opts.canEdit ? ` <button class="btn sm danger" data-rm="${d.id}" type="button">Remove</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty" style="padding:10px;border:1px dashed var(--line);border-radius:6px">${opts.canEdit ? 'Drop files here or use "Attach files…"' : 'No documents'}</div>`}`;
  };
  const persist = () => { const cur = DB[opts.coll][rec.id]; if (cur && live(cur)) { cur.docs = clone(rec.docs); putRec(opts.coll, rec.id, cur); } };
  const upload = async files => {
    for (const f of files) {
      if (f.size > DOC_MAX_MB * 1048576) { toast(`${f.name} is larger than ${DOC_MAX_MB} MB — not attached`, true); continue; }
      const meta = { id: uid() + uid(), name: f.name, mime: f.type || '', size: f.size, date: nowIso(), by: user(), kind: opts.kind, ownerId: rec.id, ownerLabel: opts.label() };
      try { toast('Uploading ' + f.name + '…'); await Files.put(meta, await fileToB64(f)); rec.docs.push({ id: meta.id, name: meta.name, mime: meta.mime, size: meta.size, date: meta.date, by: meta.by }); persist(); draw(); toast(f.name + ' attached'); }
      catch (e) { toast(e.message, true); }
    }
  };
  el.addEventListener('change', e => { if (e.target.matches('[data-up]')) { upload(Array.from(e.target.files)); e.target.value = ''; } });
  el.addEventListener('click', async e => {
    const o = e.target.closest('[data-open]'), dl = e.target.closest('[data-dl]'), rm = e.target.closest('[data-rm]');
    if (o) { e.preventDefault(); openDoc(rec.docs.find(d => d.id === o.dataset.open)); }
    if (dl) openDoc(rec.docs.find(d => d.id === dl.dataset.dl), true);
    if (rm) { const d = rec.docs.find(x => x.id === rm.dataset.rm); if (!await confirmBox(`Remove "${d.name}" from this record?\n(The file stays in the cloud backup — it can be recovered.)`, 'Remove', true)) return; d.removed = nowIso(); d.removedBy = user(); persist(); draw(); }
  });
  if (opts.canEdit) {
    el.addEventListener('dragover', e => { e.preventDefault(); el.style.outline = '2px dashed var(--accent)'; });
    el.addEventListener('dragleave', () => { el.style.outline = ''; });
    el.addEventListener('drop', e => { e.preventDefault(); el.style.outline = ''; if (e.dataTransfer.files.length) upload(Array.from(e.dataTransfer.files)); });
  }
  draw();
}

async function loadJSZip() {
  if (window.JSZip) return window.JSZip;
  await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the zip library (offline?)')); document.head.appendChild(s); });
  return window.JSZip;
}
function allDocRefs() {
  const out = [];
  for (const s of Object.values(DB.suppliers)) if (live(s)) (s.docs || []).forEach(d => out.push({ d, folder: 'Suppliers/' + (s.code ? s.code + ' ' : '') + s.name, removed: !!d.removed }));
  for (const p of Object.values(DB.pos)) if (live(p)) (p.docs || []).forEach(d => out.push({ d, folder: 'Purchase orders/' + p.no + ' ' + supplierName(p.supplier), removed: !!d.removed }));
  return out;
}
async function downloadAllDocs(includeRemoved) {
  const refs = allDocRefs().filter(r => includeRemoved || !r.removed);
  if (!refs.length) { toast('No documents attached yet'); return; }
  try {
    const JSZip = await loadJSZip(); const zip = new JSZip(); let n = 0, fail = 0;
    for (const r of refs) {
      try { const b64 = await Files.get(r.d.id); const safe = s => String(s).replace(/[\\/:*?"<>|]+/g, '_').trim(); zip.file(r.folder.split('/').map(safe).join('/') + '/' + safe(r.d.name), b64, { base64: true }); n++; toast(`Collecting documents… ${n}/${refs.length}`); }
      catch (e) { fail++; }
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    saveBlob(blob, `inventory_documents_${today()}.zip`);
    toast(`${n} document(s) zipped${fail ? ` — ${fail} could not be read` : ''}`, !!fail);
  } catch (e) { toast(e.message, true); }
}

// remove spaces while typing in part-number and serial fields anywhere in the app
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.matches || !el.matches('[data-k=pn],[data-k=serBatch],[data-k=supersededBy],[data-k=supersedes],[data-k=alternates],[data-k=rpn],[data-k=rser],[data-f=ser],[data-f=recvPn],[data-c=pn]')) return;
  const isPn = el.matches('[data-k=pn],[data-k=supersededBy],[data-k=supersedes],[data-k=alternates],[data-k=rpn],[data-f=recvPn],[data-c=pn]');
  const isList = el.matches('[data-k=alternates]');
  if (!(isList ? /[a-z]/ : isPn ? /\s|[a-z]/ : /\s/).test(el.value)) return;
  const pos = el.selectionStart, before = isList ? pos : el.value.slice(0, pos).replace(/\s+/g, '').length;
  el.value = isList ? el.value.toUpperCase() : isPn ? el.value.replace(/\s+/g, '').toUpperCase() : el.value.replace(/\s+/g, '');
  try { el.setSelectionRange(before, before); } catch (err) { }
});

// scan existing data
function spaceScan(withSerials) {
  const bad = v => /\s|[a-z]/.test(v || '');
  const parts = Object.entries(DB.parts).filter(([k, p]) => live(p) && (bad(p.pn) || k !== pnKey(p.pn) || /[a-z]/.test(p.alternates || '') || /\S\s+\S/.test(String(p.alternates || '').replace(/\s*,\s*/g, ',')) || bad(p.supersededBy) || bad(p.supersedes)));
  const items = Object.values(DB.items).filter(i => live(i) && (bad(i.pn) || (withSerials && /\s/.test(i.serBatch || ''))));
  const merges = parts.filter(([k, p]) => { const nk = pnKey(p.pn); return nk !== k && DB.parts[nk] && live(DB.parts[nk]); });
  return { parts, items, merges };
}
function cleanSpaces(withSerials) {
  const sc = spaceScan(withSerials);
  let nParts = 0, nMerged = 0, nItems = 0, nSer = 0, nLines = 0, nHist = 0;
  const fixAlt = v => pnFixList(v, ', ');
  // 1. part records (re-key, merge duplicates)
  for (const [oldKey, p] of sc.parts) {
    const newPn = pnFix(p.pn), newKey = pnKey(newPn);
    const tgt = DB.parts[newKey];
    if (newKey !== oldKey && tgt && live(tgt)) {
      for (const f of ['desc', 'type', 'make', 'model', 'um', 'nsn', 'location', 'tariff', 'prefSupplier', 'note', 'marketPrice', 'listPrice']) if (!tgt[f] && p[f]) tgt[f] = p[f];
      if (!num(tgt.min) && num(p.min)) tgt.min = p.min; if (!num(tgt.max) && num(p.max)) tgt.max = p.max;
      const a = new Set(String(tgt.alternates || '').split(',').map(pnFix).filter(Boolean)); String(p.alternates || '').split(',').map(pnFix).filter(Boolean).forEach(x => a.add(x)); a.delete(newPn);
      tgt.alternates = Array.from(a).join(', '); tgt.serialized = tgt.serialized || p.serialized; tgt.lifeLimited = tgt.lifeLimited || p.lifeLimited;
      tgt.supersededBy = pnFix(tgt.supersededBy || p.supersededBy); tgt.supersedes = pnFix(tgt.supersedes || p.supersedes);
      putRec('parts', newKey, tgt); delRec('parts', oldKey); nMerged++;
    } else {
      const np = Object.assign({}, p, { pn: newPn, alternates: fixAlt(p.alternates), supersededBy: pnFix(p.supersededBy), supersedes: pnFix(p.supersedes) });
      if (newKey !== oldKey) delRec('parts', oldKey);
      putRec('parts', newKey, np);
    }
    nParts++;
  }
  // 2. items
  for (const i of Object.values(DB.items)) {
    if (!live(i)) continue; let ch = false;
    if (/\s|[a-z]/.test(i.pn || '')) { i.pn = pnFix(i.pn); ch = true; nItems++; }
    if (withSerials && /\s/.test(i.serBatch || '')) { i.serBatch = noSpaceList(i.serBatch); ch = true; nSer++; }
    if (ch) setItem(i);
  }
  // 3. lines on requisitions, POs, repair orders, invoices
  for (const coll of ['reqs', 'pos', 'ps', 'invoices']) for (const r of Object.values(DB[coll])) {
    if (!live(r)) continue; let ch = false;
    for (const l of r.lines || []) { if (/\s|[a-z]/.test(l.pn || '')) { l.pn = pnFix(l.pn); ch = true; nLines++; } if (withSerials && /\s/.test(l.serBatch || '')) { l.serBatch = noSpaceList(l.serBatch); ch = true; } }
    if (ch) putRec(coll, r.id, r);
  }
  // 4. history (so searches by part number still find old transactions)
  for (const h of Object.values(DB.history)) if (live(h) && /\s|[a-z]/.test(h.pn || '')) { h.pn = pnFix(h.pn); putRec('history', h.id, h); nHist++; }
  dataVer++;
  addHistory({ tran: 'Adjusted', entry: 'Clean-up', qty: 0, pn: '', note: `Part numbers cleaned (spaces removed / capitals): ${nParts} part numbers (${nMerged} merged into an existing part), ${nItems} items, ${nLines} document lines, ${nHist} history lines${withSerials ? ', ' + nSer + ' serial/batch numbers' : ''}` });
  refreshDatalists();
  return { nParts, nMerged, nItems, nSer, nLines, nHist };
}
function spaceCleanupModal(auto) {
  const body = document.createElement('div');
  const draw = () => {

    const r = cleanSpaces(ser);
    toast(`Done — ${r.nParts} part numbers cleaned${r.nMerged ? ', ' + r.nMerged + ' merged' : ''}${ser ? ', ' + r.nSer + ' serials' : ''}`);
    Render.full();
  } }] });
}

function excelDate(v) {

  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  if (typeof v === 'number' && v > 20000 && v < 80000) { const c = XLSX.SSF.parse_date_code(v); return c.y + '-' + String(c.m).padStart(2, '0') + '-' + String(c.d).padStart(2, '0'); }
  const s = String(v).trim(); const d = new Date(s); if (/\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); if (!isNaN(d)) return d.toISOString().slice(0, 10); return '';
}
function supplierIdByName(name) {
  const n = name.trim().toLowerCase();
  const found = Object.values(DB.suppliers).find(s => live(s) && s.name.trim().toLowerCase() === n);
  if (found) return found.id;
  const s = { id: uid(), name: name.trim(), type: '', approved: true, country: '', note: 'Created by Excel import' };
  putRec('suppliers', s.id, s); return s.id;
}

      const idata = { pn: p.pn, qty, location: cleanId(g(r, 'location')) || p.location || '', condition: String(g(r, 'condition') ?? '').trim() || defCond, base: String(g(r, 'base') ?? '').trim() || defBase };
      if (g(r, 'serBatch') !== undefined) idata.serBatch = noSpaceList(cleanId(g(r, 'serBatch')));
      if (g(r, 'expiry') !== undefined) idata.expiry = excelDate(g(r, 'expiry'));
      if (g(r, 'price') !== undefined && g(r, 'price') !== '') idata.price = num(g(r, 'price'));
      if (g(r, 'rn') !== undefined) idata.rn = cleanId(g(r, 'rn'));
      if (g(r, 'waybill') !== undefined) idata.waybill = cleanId(g(r, 'waybill'));
      if (g(r, 'date') !== undefined && excelDate(g(r, 'date'))) idata.date = excelDate(g(r, 'date'));
      if (g(r, 'um') !== undefined && String(g(r, 'um')).trim()) idata.um = String(g(r, 'um')).trim();
      if (g(r, 'cureDate') !== undefined) idata.cureDate = excelDate(g(r, 'cureDate'));
      if (g(r, 'freight') !== undefined && g(r, 'freight') !== '') idata.freight = num(g(r, 'freight'));
      if (g(r, 'retail') !== undefined && g(r, 'retail') !== '' && num(g(r, 'retail'))) idata.retail = num(g(r, 'retail'));
      if (g(r, 'currency') !== undefined && String(g(r, 'currency')).trim()) idata.currency = String(g(r, 'currency')).trim().toUpperCase();
      if (g(r, 'supplier') !== undefined && String(g(r, 'supplier')).trim()) idata.supplier = supplierIdByName(String(g(r, 'supplier')).trim());
      if (g(r, 'poNo') !== undefined && cleanId(g(r, 'poNo'))) idata.poNo = cleanId(g(r, 'poNo'));
      if (g(r, 'psNo') !== undefined && cleanId(g(r, 'psNo'))) idata.psNo = cleanId(g(r, 'psNo'));
      if (g(r, 'acReg') !== undefined && cleanId(g(r, 'acReg'))) idata.acReg = cleanId(g(r, 'acReg'));
      { const nt = [g(r, 'note'), g(r, 'remark')].map(x => String(x ?? '').trim()).filter(Boolean).join(' — '); if (nt) idata.note = nt; }
      const ex = tn && DB.items[tn];
      if (ex && live(ex)) { if (upd) { if (ex.status !== 'stock') { delete idata.qty; delete idata.location; } Object.assign(ex, idata); setItem(ex); ui++; } continue; }
      const it = Object.assign({ tn: tn || nextTN(), serBatch: '', um: p.um || 'Each', status: 'stock', price: 0, freight: 0, retail: '', currency: S().defaultCurrency, supplier: '', poNo: '', psNo: '', rn: '', waybill: '', acReg: '', expiry: '', cureDate: '', date: today(), note: '', notePO: '', noteInstall: '' }, idata);
      setItem(it); ni++;
      if (hist) addHistory({ tn: it.tn, tran: 'Entered', entry: 'Import', qty: num(it.qty), note: 'Imported from ' + file.name });
    }
    // make sure values found in the file appear in the drop-down lists (bases, conditions, U/M, part types)
    const addList = (key, vals) => { const have = new Set(S()[key].map(x => String(x).toUpperCase())); let ch = false; for (const v of vals) { const t = String(v || '').trim(); if (t && !have.has(t.toUpperCase())) { S()[key].push(t); have.add(t.toUpperCase()); ch = true; } } return ch; };
    const touched = Object.values(DB.items).filter(i => live(i));
    const ch1 = addList('bases', touched.map(i => i.base)), ch2 = addList('conditions', touched.map(i => i.condition)), ch3 = addList('ums', touched.map(i => i.um)), ch4 = addList('pnTypes', Object.values(DB.parts).filter(live).map(p => p.type)), ch5 = addList('fleet', touched.map(i => String(i.acReg || '').toUpperCase()));
    if (ch1 || ch2 || ch3 || ch4 || ch5) saveSettings();
    addHistory({ tran: 'Adjusted', entry: 'Import', qty: 0, pn: '', note: `Imported ${file.name}: ${np} new parts, ${up} parts updated, ${ni} new items, ${ui} items updated${skipped ? ', ' + skipped + ' rows without part number skipped' : ''}` });
    refreshDatalists();
    modal({ title: 'Import complete', size: 'narrow', body: `<p><b>${np.toLocaleString()}</b> new part numbers<br><b>${up.toLocaleString()}</b> part numbers updated<br><b>${ni.toLocaleString()}</b> new items<br><b>${ui.toLocaleString()}</b> items updated${skipped ? `<br>${skipped} rows skipped (no part number)` : ''}</p>`, buttons: [{ label: 'OK', cls: 'pri' }] });
    Render.full();
  } }] });
}

/* ===================== Boot ===================== */
function updateHeader() { $('#userName').textContent = CURRENT ? CURRENT.name + (isAdmin() ? ' (admin)' : '') : ''; $('#brandCo').textContent = S().company.name ? (document.body.classList.contains('has-ws') ? '' : '· ') + S().company.name : ''; const lg = $('#brandLogo'); if (lg) { const src = S().company.logo || ''; if (src) { if (lg.src !== src) lg.src = src; lg.classList.remove('hide'); } else lg.classList.add('hide'); } }
$('#userBtn').onclick = () => CURRENT && accountMenu();
$('#syncPill').style.cursor = 'pointer';
$('#syncPill').onclick = () => {
  const e = Sync.lastError, err = $('#syncPill').classList.contains('err');
  modal({ title: 'Sharing status', size: 'narrow', body: `<p><b>${esc($('#syncTxt').textContent)}</b></p>${err && e ? `<p class="small">Last problem: ${esc(fmtDT(e.when))}<br>${esc(e.msg || '')}<br><span class="muted">Part(s): ${esc((e.shards || []).join(', '))}</span></p><p class="small muted">Your work is safe on this computer and will be sent as soon as the connection works again (the app retries every few seconds). If this message stays, check the internet connection, or send me this text.</p>` : !Sync.enabled() ? '<p class="small muted">Data is stored in this browser only. Set up Supabase in Settings → Sharing to share between stations.</p>' : '<p class="small muted">Everything is saved to the shared database.</p>'}`,
    buttons: Sync.enabled() ? [{ label: 'Close' }, { label: 'Retry now', cls: 'pri', onClick: async () => { await Sync.pull(true).catch(() => { }); await flush(); toast($('#syncTxt').textContent); } }] : [{ label: 'Close' }] });
};
(async function boot() {
  document.body.classList.add('locked');
  try { await IDB.open(); await loadLocal(); } catch (e) { console.error(e); toast('Local storage unavailable — data will not be kept after closing', true); }
  // station setup link: #setup=<base64 json>
  const hs = location.hash.match(/^#setup=(.+)$/);
  if (hs) { history.replaceState(null, '', location.pathname); try { const c = JSON.parse(atob(decodeURIComponent(hs[1]))); await connectShared(c); toast('This computer is now connected to the shared database'); } catch (e) { toast('Setup link did not work: ' + e.message, true); } }
  else if (Sync.enabled()) { Sync.status('busy'); await Sync.pull(); }
  else Sync.status('local');
  refreshDatalists();
  // one-time list set-up (admin): fleet from existing registrations, "Packing slip" repair-order type
  const migrate = () => {
    if (!isAdmin()) return; let ch = false;
    if (!Array.isArray(S().fleet) || !S()._fleetSeeded) { const regs = new Set(S().fleet || []); Object.values(DB.items).forEach(i => live(i) && i.acReg && regs.add(String(i.acReg).toUpperCase())); Object.values(DB.invoices).forEach(v => live(v) && v.acReg && regs.add(String(v.acReg).toUpperCase())); S().fleet = Array.from(regs).sort(); S()._fleetSeeded = true; ch = true; }
    if (!S()._psTypeMig) { if (!(S().psTypes || []).some(t => /^packing slip$/i.test(t))) S().psTypes = ['Packing slip'].concat(S().psTypes || []); S()._psTypeMig = true; ch = true; }
    if (!S().poStart) { S().poStart = 4000; ch = true; }
    if (!(S().departments || []).length) { S().departments = ['Maintenance', 'Operations', 'Other']; ch = true; }
    if (!(S().poTitles || []).length) { S().poTitles = ['Purchase Order', 'Rental PO', 'Overhaul PO', 'Exchange PO', 'Repair PO']; ch = true; }
    if (ch) saveSettings();
  };
  const su0 = sessionUser();
  CURRENT = (su0 && !su0.mustChange) ? su0 : await authScreen();
  document.body.classList.remove('locked');
  updateHeader(); migrate(); migrateRoles(); migratePoLock(); migrateBinsPerm(); migratePickPerm(); seedPickLists(); renumberPickLists(); renumberOpCosts(); renumberPS();
  const h = location.hash.replace('#', ''); if (VIEWS[h]) currentView = h;
  Render.full(); wsInit(); Space.check(); setInterval(() => { if (!document.hidden) Space.check(); }, 30 * 60000);
  if (isAdmin() && spaceScan(false).parts.length) setTimeout(() => spaceCleanupModal(true), 800);
  if (Sync.enabled()) setInterval(() => { if (!document.hidden) Sync.pull(true); }, 20000);
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (VIEWS[h] && h !== currentView) { currentView = h; viewState = {}; Render.full(); } });
  setInterval(() => { if (Render._pending && !document.querySelector('.mask')) { Render._pending = false; Render.full(); } }, 1500);
  window.addEventListener('beforeunload', e => { if (dirty.size || flushing) { flush(); e.preventDefault(); e.returnValue = ''; } });
})();
</script>
