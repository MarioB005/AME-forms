  // ---------- Pilot Training Card entry form ----------
  function renderPilotTrainCard(existingRecord, prefillPilot){
    showView('PilotTrainCard');
    const el = document.getElementById('viewPilotTrainCard');
    el.innerHTML = backToPtBtn() + '<div class="panel"><p class="form-sub">Loading…</p></div>';
    document.getElementById('ptBackBtn').onclick = ()=> renderPilotTraining();

    Promise.all([loadPtrainSettings(), ptrainBuildRoster(), loadPtrainRecords(), ptrainEnsureDefaultPrm()]).then(([settings, roster, records])=>{
      function ameLicenceFor(name){ const a=(state.settings.ames||[]).find(a=>a.name===name); return a?(a.aca||''):''; }
      const defaultPrmAca = ameLicenceFor(PTRAIN_DEFAULT_PRM_NAME);
      const rec = existingRecord || {
        id: ptrainNextId(records),
        traineeName: prefillPilot ? prefillPilot.name : '',
        traineeLicence: prefillPilot ? (prefillPilot.licence||'') : '',
        trainerName: PTRAIN_DEFAULT_PRM_NAME,
        trainerLicence: defaultPrmAca ? (defaultPrmAca + ', ' + PTRAIN_AMO_NUMBER) : '',
        originalTrainingDate: todayISO(), additionalTrainingDate: '',
        acTypes: prefillPilot ? PTRAIN_AIRCRAFT.filter(t=> prefillPilot[t.toLowerCase()]) : [],
        tasks: [], ads: [], hdOverrides: {}, heOverrides: {},
      };
      if(!rec.hdOverrides) rec.hdOverrides = {};
      if(!rec.heOverrides) rec.heOverrides = {};
      const isExisting = !!existingRecord;
      let selectedTypes = rec.acTypes.slice();

      const taskItems = ptrainBuildTaskChecklist(settings.tasks, isExisting ? rec.tasks : null);
      const adState = ptrainInitAdState(settings.ads, isExisting ? rec.ads : null, isExisting ? rec.adsExcluded : null);

      const ameNames = (state.settings.ames||[]).map(a=>a.name);
      function traineeLicenceFor(name){ const r = roster.find(r=>r.name===name); return r ? (r.licence||'') : ''; }
      function adIsApplicable(a){ return selectedTypes.length>0 && (a.models||[]).some(m=>selectedTypes.includes(m)); }
      function adIsChecked(text, a){
        const st = adState[text];
        if(!st) return false;
        return st.manualOverride !== null ? st.manualOverride : adIsApplicable(a);
      }

      // Only one presentation of the task checklist here -- grouped by site category, labelled with the
      // MCM number ("1b. …") wherever the task is tied to one. The Hb/Hc manual-page layout itself only
      // appears on the printed Full Report (see buildPtrainFullReportPrintHtml); the Hd/He applicability
      // tables, though, are edited right on this same card (see hdHeTableHtml below).
      function renderTaskChecklistHtml(){
        let html = '';
        let lastCat = null;
        taskItems.forEach((item,idx)=>{
          if(item.cat !== lastCat){ html += '<div class="pt-check-cat">'+escapeHTML(item.cat)+'</div>'; lastCat = item.cat; }
          html += '<label class="pt-check-row'+(item.extra?' pt-extra':'')+'"><input type="checkbox" data-role="task" data-idx="'+idx+'" '+(item.checked?'checked':'')+'> <span>'+escapeHTML(item.label)+'</span></label>';
        });
        return html;
      }

      function renderAdChecklistHtml(){
        const applicable = [], other = [], extra = [];
        settings.ads.filter(a=>!a.archived).forEach(a=>{
          const isApplicable = adIsApplicable(a);
          (isApplicable ? applicable : other).push({ text:a.text, checked: adIsChecked(a.text, a) });
        });
        Object.keys(adState).forEach(text=>{
          if(adState[text].extra) extra.push({ text, checked: adState[text].manualOverride !== null ? adState[text].manualOverride : true });
        });
        function rowsHtml(list, extraCls){
          return list.map(it=>'<label class="pt-check-row'+(extraCls?' pt-extra':'')+'"><input type="checkbox" data-role="ad" data-text="'+escapeHTML(it.text)+'" '+(it.checked?'checked':'')+'> <span>'+escapeHTML(it.text)+'</span></label>').join('');
        }
        return (
          '<div class="pt-ad-groups">' +
            '<div class="pt-ad-col"><div class="pt-check-cat">Applicable to selected A/C type'+(selectedTypes.length===1?'':'s')+'</div>' +
              (applicable.length ? rowsHtml(applicable) : '<p class="note">Select an A/C Type above to see the ADs tagged for it.</p>') +
            '</div>' +
            '<div class="pt-ad-col"><div class="pt-check-cat">Other ADs (not tagged for the selected type — check if additional training was given)</div>' +
              (other.length ? rowsHtml(other) : '<p class="note">None.</p>') +
              (extra.length ? '<div class="pt-check-cat">As recorded</div>'+rowsHtml(extra,true) : '') +
            '</div>' +
          '</div>'
        );
      }

      // Appendix "Hd"/"He" applicability tables, editable inline here (per-registration manual override) --
      // this used to be its own "Full Training Record" screen; it now lives directly on the card since
      // that's the one thing beyond the checklist itself that needs setting up before printing the report.
      function hdHeTableHtml(items, colLabel, overrides){
        if(!items || !items.length) return '<p class="note">None configured yet — add rows in Manage Task &amp; AD Lists.</p>';
        return '<div style="overflow-x:auto;"><table class="pt-table"><thead><tr><th style="width:20%;">Registration(s)</th><th style="width:20%;">'+escapeHTML(colLabel)+'</th><th>Description</th><th style="width:13%;">Interval</th><th style="width:12%;">Pilot training</th></tr></thead><tbody>' +
          items.map(r=>{
            const key = ptrainHdHeMapKey(colLabel, r);
            const auto = ptrainRegsApplicableToTypes(r.regs, selectedTypes);
            const effective = ptrainOverrideEffective(overrides, key, auto);
            const overridden = Object.prototype.hasOwnProperty.call(overrides, key);
            const dispVal = colLabel==='Task' ? (r.task||'') : (r.doc||'');
            return '<tr>' +
              '<td>'+escapeHTML((r.regs||[]).join(', '))+'</td>' +
              '<td>'+escapeHTML(dispVal).replace(/\n/g,'<br>')+'</td>' +
              '<td>'+escapeHTML(r.desc||'')+'</td>' +
              '<td>'+escapeHTML(r.interval||'')+'</td>' +
              '<td style="text-align:center;">' +
                '<input type="checkbox" data-hhkey="'+escapeHTML(key)+'" '+(effective?'checked':'')+'>' +
                (overridden ? ' <a href="#" class="hh-clear" data-hhkey="'+escapeHTML(key)+'" title="Clear manual override — back to automatic">↺</a>' : '') +
              '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>';
      }

      el.innerHTML =
        backToPtBtn() +
        '<div class="panel">' +
          '<h2 class="form-title">Pilot Training Card <span style="font-weight:400;color:var(--grey-strong);font-size:14px;">— ID '+rec.id+'</span></h2>' +
          '<p class="form-sub">Valid for two years from date of issue. Everything below starts checked as it typically applies — uncheck anything this trainee was NOT trained and supervised to carry out.</p>' +

          '<div class="pt-section-title">A/C Type trained on</div>' +
          '<div class="pt-ac-grid" id="ptAcGrid">' +
            PTRAIN_AIRCRAFT.map(t=>'<label><input type="checkbox" data-ac="'+t+'" '+(selectedTypes.includes(t)?'checked':'')+'> '+t+'</label>').join('') +
          '</div>' +

          '<div class="pt-section-title">Elementary Work, Servicing &amp; Additional Training</div>' +
          '<div id="ptTaskChecklist" class="pt-check-grid">' + renderTaskChecklistHtml() + '</div>' +

          '<div class="pt-section-title">Airworthiness Directives</div>' +
          '<div id="ptAdChecklist">' + renderAdChecklistHtml() + '</div>' +

          '<div class="pt-section-title">Appendix &quot;Hd&quot; — Airworthiness Inspection Check</div>' +
          '<div id="ptHdTable">' + hdHeTableHtml(settings.hdItems||[], 'Task', rec.hdOverrides) + '</div>' +

          '<div class="pt-section-title">Appendix &quot;He&quot; — AD &amp; AMOC List</div>' +
          '<div id="ptHeTable">' + hdHeTableHtml(settings.heItems||[], 'Document', rec.heOverrides) + '</div>' +

          '<div class="pt-section-title">Trainee &amp; AME</div>' +
          '<div class="field-grid">' +
            '<div class="field"><label for="ptTraineeName">Trainee Name</label><select id="ptTraineeName"><option value="">— select —</option>' + Array.from(new Set(roster.map(r=>r.name).filter(Boolean))).sort().map(n=>'<option value="'+escapeHTML(n)+'"'+(n===rec.traineeName?' selected':'')+'>'+escapeHTML(n)+'</option>').join('') + '</select></div>' +
            '<div class="field"><label for="ptTraineeLicence">Trainee Licence</label><input type="text" id="ptTraineeLicence" value="'+escapeHTML(rec.traineeLicence||'')+'"></div>' +
            '<div class="field"><label for="ptTrainerName">AME (trains this pilot)</label><select id="ptTrainerName"><option value="">— select —</option>' + ameNames.map(n=>'<option value="'+escapeHTML(n)+'"'+(n===rec.trainerName?' selected':'')+'>'+escapeHTML(n)+'</option>').join('') + '</select></div>' +
            '<div class="field"><label for="ptTrainerLicence">AME ACA #</label><input type="text" id="ptTrainerLicence" value="'+escapeHTML(rec.trainerLicence||'')+'"></div>' +
            '<div class="field"><label for="ptOriginalDate">Original Training Date</label><input type="date" id="ptOriginalDate" value="'+(rec.originalTrainingDate||'')+'"></div>' +
            '<div class="field"><label for="ptAdditionalDate">Additional Training Date</label><input type="date" id="ptAdditionalDate" value="'+(rec.additionalTrainingDate||'')+'"></div>' +
          '</div>' +
          '<p class="note">The AME selected above prints on the &quot;AME Signature&quot; line of the Full Report only. The printed Pilot Training Card (4×2 label) always shows Mario Blais'+(defaultPrmAca?' — ACA # '+escapeHTML(defaultPrmAca):' — <span style="color:#b00020;">⚠ his ACA # isn&rsquo;t set yet, add it in Settings → AMEs</span>')+', AMO 100-96 as the PRM, regardless of which AME is selected here.</p>' +

          '<div class="btn-row" style="justify-content:flex-end;align-items:center;">' +
            '<span id="ptSaveStatus" style="font-size:13px;color:var(--grey-strong);"></span>' +
            '<button type="button" class="btn" id="ptPrintBtn">🖨️ Print Training Card (4in × 2in labels)</button>' +
            '<button type="button" class="btn primary" id="ptFullBtn">🖨️ Print Full Report (Hb–He, 8.5×11)</button>' +
          '</div>' +
        '</div>';

      document.getElementById('ptBackBtn').onclick = ()=> renderPilotTraining();

      document.getElementById('ptTraineeName').addEventListener('change', (e)=>{
        const lic = traineeLicenceFor(e.target.value);
        if(lic) document.getElementById('ptTraineeLicence').value = lic;
      });
      document.getElementById('ptTrainerName').addEventListener('change', (e)=>{
        const lic = ameLicenceFor(e.target.value);
        if(lic) document.getElementById('ptTrainerLicence').value = lic + ', ' + PTRAIN_AMO_NUMBER;
      });

      function paintTaskChecklist(){
        const holder = document.getElementById('ptTaskChecklist');
        holder.innerHTML = renderTaskChecklistHtml();
        holder.querySelectorAll('input[data-role="task"]').forEach(cb=>{
          cb.onchange = ()=>{ taskItems[parseInt(cb.dataset.idx,10)].checked = cb.checked; };
        });
      }
      paintTaskChecklist();

      function paintAdChecklist(){
        const holder = document.getElementById('ptAdChecklist');
        holder.innerHTML = renderAdChecklistHtml();
        holder.querySelectorAll('input[data-role="ad"]').forEach(cb=>{
          cb.onchange = ()=>{
            const t = cb.dataset.text;
            if(!adState[t]) adState[t] = { manualOverride:cb.checked, extra:false };
            else adState[t].manualOverride = cb.checked;
          };
        });
      }
      paintAdChecklist();

      function paintHdHeTable(which){
        if(which==='Hd') document.getElementById('ptHdTable').innerHTML = hdHeTableHtml(settings.hdItems||[], 'Task', rec.hdOverrides);
        else document.getElementById('ptHeTable').innerHTML = hdHeTableHtml(settings.heItems||[], 'Document', rec.heOverrides);
        wireHdHeOverrides();
      }
      function wireHdHeOverrides(){
        document.getElementById('ptHdTable').querySelectorAll('input[type="checkbox"]').forEach(cb=>{
          cb.onchange = ()=>{ rec.hdOverrides[cb.dataset.hhkey] = cb.checked; paintHdHeTable('Hd'); };
        });
        document.getElementById('ptHeTable').querySelectorAll('input[type="checkbox"]').forEach(cb=>{
          cb.onchange = ()=>{ rec.heOverrides[cb.dataset.hhkey] = cb.checked; paintHdHeTable('He'); };
        });
        document.getElementById('ptHdTable').querySelectorAll('a.hh-clear').forEach(a=>{
          a.onclick = (e)=>{ e.preventDefault(); delete rec.hdOverrides[a.dataset.hhkey]; paintHdHeTable('Hd'); };
        });
        document.getElementById('ptHeTable').querySelectorAll('a.hh-clear').forEach(a=>{
          a.onclick = (e)=>{ e.preventDefault(); delete rec.heOverrides[a.dataset.hhkey]; paintHdHeTable('He'); };
        });
      }
      wireHdHeOverrides();

      document.getElementById('ptAcGrid').querySelectorAll('input[data-ac]').forEach(cb=>{
        cb.onchange = ()=>{
          selectedTypes = PTRAIN_AIRCRAFT.filter(t=> document.querySelector('[data-ac="'+t+'"]').checked);
          paintAdChecklist();
          paintHdHeTable('Hd');
          paintHdHeTable('He');
        };
      });

      function collectRecord(){
        // appendix/num/cardText travel with each checked task so a later load can match it back to the
        // master list by MCM key (see ptrainTaskKey) instead of by text -- text is expected to change
        // whenever the MCM itself is revised.
        const tasks = taskItems.filter(i=>i.checked).map(i=> ({ text:i.text, cardText:i.cardText||i.text, appendix:i.appendix||'', num:(i.num!=null?i.num:null), additional: i.extra ? !!i.wasAdditional : !!i.isAdditionalCategory }));
        const ads = [];
        // An AD that's auto-applicable by aircraft type but was manually UNCHECKED has to be recorded
        // explicitly (adsExcluded), not just left out of `ads` -- otherwise reopening the record recomputes
        // it as applicable again (via adIsApplicable) and it silently reverts back to checked. This is what
        // made unchecking a box on the card look like it "didn't save".
        const adsExcluded = [];
        settings.ads.filter(a=>!a.archived).forEach(a=>{
          if(adIsChecked(a.text, a)) ads.push({ text:a.text, additional: !adIsApplicable(a) });
          else if(adIsApplicable(a)) adsExcluded.push(a.text);
        });
        Object.keys(adState).forEach(text=>{
          if(!adState[text].extra) return;
          const checked = adState[text].manualOverride !== null ? adState[text].manualOverride : true;
          if(checked) ads.push({ text, additional: !!adState[text].wasAdditional });
        });
        return {
          id: rec.id,
          traineeName: document.getElementById('ptTraineeName').value,
          traineeLicence: document.getElementById('ptTraineeLicence').value,
          trainerName: document.getElementById('ptTrainerName').value,
          trainerLicence: document.getElementById('ptTrainerLicence').value,
          originalTrainingDate: document.getElementById('ptOriginalDate').value || null,
          additionalTrainingDate: document.getElementById('ptAdditionalDate').value || null,
          acTypes: selectedTypes.slice(),
          tasks: tasks,
          ads: ads,
          adsExcluded: adsExcluded,
          hdOverrides: rec.hdOverrides || {},
          heOverrides: rec.heOverrides || {},
          imported: false,
          createdAt: rec.createdAt || new Date().toISOString(),
        };
      }

      // Shared by both Save and Full Training Record (which also has to save first, since the report
      // is generated from the saved record) so the roster/due-date sync only lives in one place.
      async function ptrainSaveAndSyncStatus(){
        const newRec = collectRecord();
        const idx = records.findIndex(r=>r.id===newRec.id);
        if(idx>=0) records[idx] = newRec; else records.push(newRec);
        const synced = await savePtrainRecords(records);

        if(newRec.traineeName){
          const status = await loadPtrainPilotStatus();
          const cur = Object.assign(ptrainEmptyStatus(), ptrainMigrateStatusEntry(status[newRec.traineeName])||{});
          if(newRec.traineeLicence) cur.licence = newRec.traineeLicence;
          newRec.acTypes.forEach(t=>{ cur[t.toLowerCase()] = true; });
          const latest = [newRec.originalTrainingDate, newRec.additionalTrainingDate].filter(Boolean).sort().pop();
          if(latest && (!cur.trainingDate || latest > cur.trainingDate)) cur.trainingDate = latest;
          status[newRec.traineeName] = cur;
          await savePtrainPilotStatus(status);
        }
        newRec.__synced = synced;
        return newRec;
      }

      // Both print buttons save the record first (there's no separate "Save Record" button any more --
      // printing IS the save action, per Mario's instructions) then perform their own print, staying on
      // this exact page throughout. Keep this card's own `rec` (id, createdAt, etc.) in sync with what was
      // just saved, WITHOUT navigating away or rebuilding the form.
      async function saveThenReport(){
        const statusEl = document.getElementById('ptSaveStatus');
        if(statusEl) statusEl.textContent = 'Saving…';
        const saved = await ptrainSaveAndSyncStatus();
        Object.assign(rec, saved);
        // The record's own local copy (and this browser's cache) is always updated regardless -- this
        // warning only fires when the write to the shared cloud database itself was rejected, which is
        // exactly the failure mode that used to look like "I unchecked a box and it didn't save": the
        // change looked fine here but never actually reached the database, so it reverted on next load.
        if(saved.__synced === false){
          if(statusEl) statusEl.textContent = '';
          alert('Saved on this device, but the cloud sync failed, so this change may not show up elsewhere or after a reload.\n\nDetails: ' + (window.__storageLastError || 'unknown error') + '\n\nPlease try again, and let Mario know if this keeps happening.');
        } else if(statusEl){
          statusEl.textContent = '✅ Saved';
          setTimeout(()=>{ if(statusEl.textContent==='✅ Saved') statusEl.textContent=''; }, 4000);
        }
        return saved;
      }

      document.getElementById('ptPrintBtn').onclick = async ()=>{
        const saved = await saveThenReport();
        openPrint(buildPtrainLabelHtml(saved));
      };

      document.getElementById('ptFullBtn').onclick = async ()=>{
        const saved = await saveThenReport();
        const { manualItems, extraTasks } = ptrainComputeManualItems(taskItems);
        openPrint(buildPtrainFullReportPrintHtml(saved, settings, selectedTypes, taskItems, manualItems, extraTasks));
      };
    });
  }

  // ---------- print: two 4in x 2in labels (front = tasks, back = A/C types, ADs, names, dates) ----------
  // A 4x2in label has a fixed, non-scrolling height (overflow:hidden), so a long selection has to
  // spill onto extra labels of the same size rather than get silently clipped at the bottom.
  // These capacities were re-measured (headless-render + overflow check) against the current label
  // font sizes/weights — do not raise them without re-measuring, or text will clip silently.
  // The front label no longer carries a disclaimer paragraph (moved to the back label), so every
  // front page has identical capacity -- no more first/rest split needed.
  const PTRAIN_TASKS_PER_LABEL = 16;
  const PTRAIN_ADS_PER_COLUMN = 8;     // per column on the back label (2 columns -> 16 ADs per label)
  function ptrainChunk(arr, size){
    const out = [];
    for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
    return out;
  }
  // The printed 4x2 Training Card always names Mario Blais as the PRM, regardless of which AME is
  // recorded on the record as having trained this particular pilot (that AME prints on the Full Report's
  // "AME Signature" line instead -- see buildPtrainFullReportPrintHtml / ptrainSignRow).
  function ptrainCardPrmLicence(){
    const a = (state.settings.ames||[]).find(a=>a.name===PTRAIN_DEFAULT_PRM_NAME);
    const aca = a ? (a.aca||'') : '';
    return aca ? (aca + ', ' + PTRAIN_AMO_NUMBER) : '';
  }
  function buildPtrainLabelHtml(rec){
    const tasks = rec.tasks||[];
    const ads = rec.ads||[];
    const cardPrmLicence = ptrainCardPrmLicence();
    const taskChunks = ptrainChunk(tasks, PTRAIN_TASKS_PER_LABEL);
    if(!taskChunks.length) taskChunks.push([]);
    const adChunks = ptrainChunk(ads, PTRAIN_ADS_PER_COLUMN*2);
    if(!adChunks.length) adChunks.push([]);

    const frontLabels = taskChunks.map((chunk,pageIdx)=>{
      const pageTag = taskChunks.length>1 ? ' <span style="font-weight:400;">('+(pageIdx+1)+'/'+taskChunks.length+')</span>' : '';
      const taskLines = chunk.map(t=>'<div>'+escapeHTML((t.additional?'* ':'')+t.text)+'</div>').join('');
      return (
        '<div class="ptl-label">' +
          '<div class="ptl-head">' +
            '<img src="'+PHOENIX_LOGO_TIGHT_DATA_URI+'" alt="">' +
            '<h1>Pilot Training Card'+pageTag+'</h1>' +
            '<span class="ptl-id">ID '+escapeHTML(rec.id)+'</span>' +
          '</div>' +
          '<div class="ptl-tasks">' + (taskLines || '<div>&nbsp;</div>') + '</div>' +
        '</div>'
      );
    }).join('');

    const adColHtml = (col)=> col.map(a=>'<div>'+escapeHTML((a.additional?'* ':'')+a.text)+'</div>').join('');
    const trainedTypes = PTRAIN_AIRCRAFT.filter(t=> rec.acTypes.includes(t));
    const backLabels = adChunks.map((chunk,pageIdx)=>{
      const isLast = pageIdx === adChunks.length-1;
      const pageTag = adChunks.length>1 ? ' ('+(pageIdx+1)+'/'+adChunks.length+')' : '';
      const col0 = chunk.slice(0, PTRAIN_ADS_PER_COLUMN);
      const col1 = chunk.slice(PTRAIN_ADS_PER_COLUMN);
      return (
        '<div class="ptl-label">' +
          (pageIdx===0 ? '<div class="ptl-sub">Valid for two years from date of issue. This individual has received the above indicated Elementary work training on the following aircraft and has also received training on the ADs indicated below. The signature below certifies that the individual has been trained and supervised to carry out the following tasks &amp; ADs. Note: "*" Indicates additional training received.</div>' : '') +
          '<div class="ptl-back-top">A/C Type Trained on'+pageTag+': '+ (trainedTypes.length ? trainedTypes.map(t=>'<u>'+t+'</u>').join('&nbsp;&nbsp;&nbsp;') : '—') +'</div>' +
          '<div class="ptl-ads"><div>'+adColHtml(col0)+'</div><div>'+adColHtml(col1)+'</div></div>' +
          (isLast ?
            '<div class="ptl-meta">' +
              '<div class="ptl-sig-row"><b>Trainee Name/Licence:</b> '+escapeHTML(rec.traineeName||'')+(rec.traineeLicence?' / '+escapeHTML(rec.traineeLicence):'')+'<span class="ptl-sig-label">Signature:</span><span class="ptl-sig-line"></span></div>' +
              '<div><b>PRM Name:</b> '+escapeHTML(PTRAIN_DEFAULT_PRM_NAME)+(cardPrmLicence?'&nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;ACA # '+escapeHTML(cardPrmLicence):'')+'<span class="ptl-sig-label">Signature:</span><span class="ptl-sig-line"></span></div>' +
              '<div><b>Original Training Date:</b> '+(rec.originalTrainingDate?fmtDateNice(rec.originalTrainingDate):'')+'<span class="ptl-date-gap"></span><b>Additional Training Date:</b> '+(rec.additionalTrainingDate?fmtDateNice(rec.additionalTrainingDate):'')+'</div>' +
            '</div>'
          : '') +
        '</div>'
      );
    }).join('');

    return '<style>@page{size:4in 2in;margin:0;} @media print{ body{margin:0;} }</style>' + frontLabels + backLabels;
  }

  // ---------- helpers shared by the Hd/He tables (now inline on the Training Card itself) ----------
  // A specific tail's actual inspection programme can differ from its type's default, so each Hd/He row
  // can be manually overridden; ptrainOverrideEffective resolves the override (if any) or falls back to
  // the automatic aircraft-type match.
  function ptrainOverrideEffective(map, key, auto){
    return Object.prototype.hasOwnProperty.call(map||{}, key) ? !!map[key] : auto;
  }
  function ptrainHdHeMapKey(colLabel, r){
    return colLabel==='Task' ? (r.task||'') : String(r.doc||'').split('\n')[0];
  }
  // Styled to match the real D.I.R.-to-MCM appendix pages (serif type, "Phoenix Heli-Flight" running
  // header, centered APPENDIX heading, boxed revision footer) instead of the site's usual form look --
  // this is the one printed report meant to sit next to the actual manual pages. Checkboxes print
  // pre-filled (✓ / X) from the pilot's card, and the "I understand" + signature lines are pre-filled
  // with the trainee/PRM names, licence numbers and training date already on the record -- only the
  // physical signature itself is left blank.
  // Font sizes here are +2pt over the original tuning (Mario's request), and the subtitle's
  // margin-bottom carries the extra "2 lines" gap he asked for between the title block and the body
  // text below it. Bumping every font size back up eats into the page-margin headroom this was
  // originally tuned against, so @page margin came down slightly (0.55in -> 0.4in) and a few of the
  // tighter paddings/margins were trimmed a touch to compensate -- re-check with a real print/PDF
  // after any further size change here, since Hb/Hc/Hd/He/Hf/Hg each still need to fit one page.
  const PTRAIN_FULL_PRINT_STYLES = '<style>' +
    '@page{size:letter;margin:0.3in;}' +
    '.rpt-page,.rpt-page *{font-family:Georgia,Cambria,"Times New Roman","Liberation Serif",serif;}' +
    '.rpt-page{color:#000;page-break-after:always;min-height:9.9in;display:flex;flex-direction:column;}' +
    '.rpt-page:last-child{page-break-after:auto;}' +
    '.rpt-hdrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;}' +
    '.rpt-doctitle{text-align:center;font-style:italic;font-size:14px;margin-bottom:2px;}' +
    '.rpt-apptitle{text-align:center;font-size:20px;margin:3px 0 2px;}' +
    '.rpt-plaintitle{text-align:center;font-weight:700;font-size:18px;margin:14px 0 10px;}' +
    '.rpt-subtitle{text-align:center;font-weight:700;font-size:15px;margin-bottom:28px;}' +
    '.rpt-subtitle .small{font-size:12px;}' +
    '.rpt-intro{font-size:13px;line-height:1.3;margin-bottom:4px;}' +
    '.rpt-tasklabel{font-weight:700;font-size:15px;margin:5px 0 2px;}' +
    '.rpt-grouphead{font-size:13px;margin:4px 0 1px;padding-left:24px;font-weight:700;text-decoration:underline;}' +
    '.rpt-groupintro{font-size:13px;line-height:1.2;margin:3px 0 1px;}' +
    '.rpt-item{display:flex;gap:8px;font-size:13px;line-height:1.2;margin:2px 0;}' +
    '.rpt-item.top{padding-left:0;}' +
    '.rpt-item.sub{padding-left:34px;}' +
    '.rpt-item .box{flex:0 0 auto;display:inline-block;width:14px;height:14px;border:1.1px solid #000;text-align:center;line-height:13px;font-size:12px;font-weight:800;margin-top:1px;}' +
    '.rpt-item .lbl{font-weight:700;margin-right:2px;}' +
    '.rpt-note{font-size:13px;line-height:1.25;margin:6px 0;}' +
    '.rpt-understand{font-size:13px;margin:6px 0 8px;}' +

  // Revision/page metadata for each real manual page -- transcribed from the D.I.R.-to-MCM PDF Mario
  // provided (Hb Rev.6/15-Apr-2020, Hc+Hd Rev.13/13-Sep-2024, He Rev.14/08-Apr-2026). Update these three
  // if/when he sends a newer manual revision -- there's no live link to the manual PDF's own metadata.
  const PTRAIN_MANUAL_REVISIONS = {
    Hb: { revision:'6',  date:'15-Apr-2020', page:'H-2' },
    Hc: { revision:'13', date:'13-Sep-2024', page:'H-3' },
    Hd: { revision:'13', date:'13-Sep-2024', page:'H-4' },
    He: { revision:'14', date:'08-Apr-2026', page:'H-5' },
    Hf: { revision:'9',  date:'26-Aug-2021', page:'H-6' },
    Hg: { revision:'9',  date:'26-Aug-2021', page:'H-7' },
  };
  const PTRAIN_HC_GROUP_INTRO = {
    '1': 'Removal and replacement of role equipment designed for rapid removal and replacement:',
    '2': 'Repetitive visual inspections or operational checks, not involving disassembly and not performed as part of the aircraft maintenance schedule, that are required at intervals of less than 100 hr. air time, provided they will be performed by an appropriately rated aircraft maintenance engineer at the next scheduled maintenance check:',
  };
  function ptrainRptBox(on){ return '<span class="box">'+(on?'✓':'X')+'</span>'; }
  // One sign-off row (Signature / Licence # / Date): the pre-filled value sits ABOVE its blank rule,
  // with just the plain caption below it -- the signature column itself stays blank above the line
  // since that one's filled in by hand. The PRM's licence value carries the full "ACA #, AMO 100-96"
  // string (rec.trainerLicence already includes the AMO suffix -- see PTRAIN_AMO_NUMBER) rather than
  // just the bare ACA number.
  function ptrainSignRow(signerCaption, licenceVal, dateVal, licenceCaption){
    return '<div class="rpt-signgrid">' +
      '<div class="rpt-signcol"><div class="rpt-signval">&nbsp;</div><div class="rpt-signline"></div><div class="rpt-signcap">'+signerCaption+'</div></div>' +
      '<div class="rpt-signcol"><div class="rpt-signval">'+escapeHTML(licenceVal||'')+'</div><div class="rpt-signline"></div><div class="rpt-signcap">'+(licenceCaption||'Licence #')+'</div></div>' +
      '<div class="rpt-signcol"><div class="rpt-signval">'+(dateVal?fmtDateNice(dateVal):'')+'</div><div class="rpt-signline"></div><div class="rpt-signcap">Date</div></div>' +
    '</div>';
  }
  // One printed page in the manual's own layout: running header, centered APPENDIX title, the section
  // body, the standard grounding note, an "I understand" line pre-filled with the trainee's name, and
  // Pilot/PRM sign-off rows with licence # and date already filled in above their lines -- everything
  // except the physical signature itself.
  function ptrainAppendixPage(rec, opts){
    const rev = opts.appendix ? PTRAIN_MANUAL_REVISIONS[opts.appendix] : null;
    const dateVal = rec.originalTrainingDate || rec.additionalTrainingDate || null;
    return '<div class="rpt-page">' +
      '<div class="rpt-hdrow"><span>Phoenix Heli-Flight</span><span>Phoenix Heli-Flight</span></div>' +
      (opts.appendix ?
        ('<div class="rpt-doctitle">D.I.R. Appendix to MCM</div>' +
         '<div class="rpt-apptitle">APPENDIX &quot;'+opts.appendix+'&quot;</div>' +
         '<div class="rpt-subtitle">'+opts.subtitle+(opts.subtitleSmall?' <span class="small">'+opts.subtitleSmall+'</span>':'')+'</div>')
        : '<div class="rpt-plaintitle">'+opts.subtitle+'</div>'
      ) +
      (opts.intro ? '<div class="rpt-intro">'+opts.intro+'</div>' : '') +
      opts.bodyHtml +
      (opts.noteInline ? '' : '<div class="rpt-note">Note: If as a result of these checks, a defect is found or suspected, the aircraft shall be grounded until a qualified AME can inspect it.</div>') +
      '<div class="rpt-understand">I, <span class="ln">'+escapeHTML(rec.traineeName||'')+'</span>, understand each point mentioned above.</div>' +
      ptrainSignRow('Pilot Signature', rec.traineeLicence, dateVal) +
      ptrainSignRow('AME Signature', (rec.trainerName ? rec.trainerName+' — ' : '')+(rec.trainerLicence||''), dateVal, 'AME Name / Licence #') +
      (rev ? (
        '<div class="rpt-footerbox">' +
          '<div class="r1"><span>Revision: # '+rev.revision+'</span><span>Page '+rev.page+'</span></div>' +
          '<div class="r2">Revision Date: '+rev.date+'</div>' +
        '</div>'
      ) : '') +
    '</div>';
  }
  function buildPtrainFullReportPrintHtml(rec, settings, selectedTypes, taskItems, manualItems, extraTasks){
    // ---- Hb page ----
    let hbBody = '<div class="rpt-tasklabel">Task #</div>';
    let lastHbGroup = null;
    manualItems.filter(i=>i.appendix==='Hb').forEach(item=>{
      const group = ptrainManualGroupLabel('Hb', item.num);
      if(group !== lastHbGroup){ hbBody += '<div class="rpt-grouphead">'+escapeHTML(group)+'</div>'; lastHbGroup = group; }
      hbBody += '<div class="rpt-item sub">'+ptrainRptBox(item.checked)+'<span><span class="lbl">'+escapeHTML(item.num)+'.</span> '+escapeHTML(item.text)+'</span></div>';
    });

    // ---- Hc page (Task #1 / Task #2, each with its own manual-wording intro sentence) ----
    let hcBody = '<div class="rpt-tasklabel">Task #</div>';
    ['1','2'].forEach(taskNum=>{
      const items = manualItems.filter(i=> i.appendix==='Hc' && new RegExp('^'+taskNum).test(String(i.num)));
      if(!items.length) return;
      hcBody += '<div class="rpt-item top"><span class="lbl">'+taskNum+'.</span> <span class="rpt-groupintro">'+escapeHTML(PTRAIN_HC_GROUP_INTRO[taskNum]||'')+'</span></div>';
      items.forEach(item=>{
        hcBody += '<div class="rpt-item sub">'+ptrainRptBox(item.checked)+'<span><span class="lbl">'+escapeHTML(ptrainManualItemLabel(item.appendix,item.num))+'</span> '+escapeHTML(item.text)+'</span></div>';
      });
    });
    if(extraTasks.length){
      hcBody += '<div class="rpt-grouphead">Additional (not yet numbered in the manual):</div>';
      extraTasks.forEach(item=>{
        hcBody += '<div class="rpt-item sub">'+ptrainRptBox(item.checked)+'<span>'+escapeHTML(item.text)+'</span></div>';
      });
    }

    // Note: there is no separate "Airworthiness Directives Training" page here -- AD/AMOC training is
    // already fully covered by the Appendix "He" table below (and by item 2c on the Appendix "Hc" page),
    // so a standalone AD checklist page would just duplicate it.

    // ---- Hd / He tables (same bordered manual look; "Pilot training" stays a single computed ✓/X
    // column per Mario's earlier instruction, rather than reverting to blank Pilot/AME Initials columns) ----
    function hdHeTable(items, colLabel, overrides){
      if(!items || !items.length) return '<p class="rpt-intro">None configured yet.</p>';
      return '<table class="rpt-table"><thead><tr><th>Aircraft applicability</th><th>'+escapeHTML(colLabel)+'</th><th>Description</th><th>Interval</th><th>Pilot training</th></tr></thead><tbody>' +
        items.map(r=>{
          const key = ptrainHdHeMapKey(colLabel, r);
          const auto = ptrainRegsApplicableToTypes(r.regs, selectedTypes);
          const effective = ptrainOverrideEffective(overrides, key, auto);
          const dispVal = colLabel==='Task' ? (r.task||'') : (r.doc||'');
          return '<tr>' +
            '<td class="appl">'+escapeHTML((r.regs||[]).join(', '))+'</td>' +
            '<td>'+escapeHTML(dispVal).replace(/\n/g,'<br>')+'</td>' +
            '<td>'+escapeHTML(r.desc||'')+'</td>' +
            '<td>'+escapeHTML(r.interval||'')+'</td>' +
            '<td class="ctr">'+(effective?'✓':'X')+'</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table>';
    }

    // ---- Hf / Hg pages -- fixed procedure text transcribed from the manual (not derived from the
    // checklist, unlike Hb/Hc/Hd/He), so every pilot's Full Report gets the same wording; only the
    // trainee name and sign-off rows (handled by ptrainAppendixPage itself) are pilot-specific. ----
    const hfBody =
      [
        'Check Cyclic for a red flag indicating that maintenance is being performed.',
        'Ask the AME to show you what he did and review form D.I.R to MPM Appendix 22 &quot;Anticipation of Aircraft Behavior after Maintenance Form&quot;.',
        'Carefully read the work report entry in the journey log and perform visual / tactile check of the components that were affected.',
        'Feel the rotation of the components and check for proper installation.',
        'Check for proper direction of installation of bolts (Head normally in the direction of flight or direction of rotation).',
        'Check for presence of nuts, cotter pins, lockwire, etc.',
        'Perform ground run/test flight as per Flight Manual chapter 8 (Note: Autorotation shall be checked whenever the (Pitch Links, Trim Tabs, were disturbed and / or Main Rotor Blades were replaced).',
        'Check Journey Log Entry: Complete logbook entry.',
      ].map((t,i)=>'<div class="rpt-item top"><span class="lbl">'+(i+1)+'.</span><span>'+t+'</span></div>').join('') +
      '<div class="rpt-groupintro">The signatures indicate that the person trained understands and feels capable of conducting independent checks on all aircrafts operated by Phoenix Heli-flight and is considered competent in the performance of the checks by the person who has given the training.</div>';

    const hgBody =
      '<div class="rpt-groupintro">The following shall be carried out by the pilot when a Main Gear Box, Tail rotor Gear Box or an Engine &quot;Chip Light&quot; has illuminated when an aircraft is operated away from the main base:</div>' +
      '<div class="rpt-groupintro">The pilot will take a digital photo of the material collected on the chip detector and send electronically to the DOM via e-mail or text.</div>' +
      '<div class="rpt-groupintro">Based on the results the DOM will make a determination referencing the aircraft manufacturers documentation and then either allow the aircraft to continue flying or ground the aircraft on site.</div>' +
      '<div class="rpt-groupintro">Should the analysis of the material found on the detector be considered minor, the DOM will respond to the pilots in writing and allow the A/C to return to base.</div>' +
      '<div class="rpt-groupintro">Following the cleaning and reinstallation of the chip detector, the pilot in command will make an entry in the logbook as follows: &quot;MGB or Engine or TRGB chip light illuminated. Chip detector checked for material and photo sent to DOM for analysis. Material found to be minor and aircraft released for flight under DOM&rsquo;s approval. A 10-minute hover will be performed prior to flight. Upon aircraft return to base a filter check will be performed if required as per the Maintenance manual. Pilot record of training for above mentioned shall be kept electronically in DATS system.&quot;</div>';

    return PRINT_STYLES + PTRAIN_FULL_PRINT_STYLES +
      ptrainAppendixPage(rec, {
        appendix:'Hb', subtitle:'Servicing / Additional Training',
        intro:'This training form is used by Phoenix Heli-Flight to certify that the following employee has received the following training. These tasks may be carried out by a pilot trained under the direct supervision of AME.',
        bodyHtml: hbBody,
      }) +
      ptrainAppendixPage(rec, {
        appendix:'Hc', subtitle:'Elementary Task Training Form',
        intro:'This training form is used by Phoenix Heli-Flight to certify that the following employee has received the following training for the performance of Elementary Task as per Standards 625 Appendix A. These tasks may be carried out by a pilot trained under the direct supervision of an AME.',
        bodyHtml: hcBody,
      }) +
      ptrainAppendixPage(rec, {
        appendix:'Hd', subtitle:'Airworthiness Inspection Check', subtitleSmall:'(as per Airworthiness Limitations Section ALS)',
        intro:'The following Airworthiness Inspection Checks may be carried out by a trained pilot. The pilot must be trained under the direct supervision of an AME who may then sign the pilot training document which will be kept electronically in the DATS system. This information will be available to the pilots at any time. All Tasks with a &quot;DAILY OR 10 HOURS&quot; &amp; Tasks with a &quot;EVERY 15 HOURS&quot; interval will not be tracked in AMS and will be signed as part of the Pilots Daily Inspection (ID) / Airworthiness Check (AWC). Note: If as a result of these checks, a defect is found or suspected, the aircraft shall be grounded until a qualified AME can inspect it.',
        noteInline: true,
        bodyHtml: hdHeTable(settings.hdItems||[], 'Task', rec.hdOverrides),
      }) +
      ptrainAppendixPage(rec, {
        appendix:'He', subtitle:'AD &amp; AMOC List',
        intro:'The following Airworthiness Directives may be carried out by a trained pilot. The pilot must be trained under the direct supervision of an AME who may then sign the pilot training document which will be kept electronically in the DATS system. This information will be available to the pilots at any time. Note: If as a result of these checks, a defect is found or suspected, the aircraft shall be grounded until a qualified AME can inspect it.',
        noteInline: true,
        bodyHtml: hdHeTable(settings.heItems||[], 'Document', rec.heOverrides),
      }) +
      ptrainAppendixPage(rec, {
        appendix:'Hf', subtitle:'Dual Control Check / Independent Check Training Procedure',
        intro:'The following points were discussed during training. Independent Checks (ICC) are carried out when flight controls or engine controls have been disturbed (removed, disassembled, replaced, or adjusted including dual control installation). This training is applicable to all aircraft types operated by Phoenix Heli-Flight.',
        bodyHtml: hfBody,
      }) +
      ptrainAppendixPage(rec, {
        appendix:'Hg', subtitle:'Checking of Self-Sealing Chip Detectors Procedure',
        bodyHtml: hgBody,
      });
  }

  // ---------- admin: manage the task / AD master lists (add an MCM link once your manual is hosted online) ----------
  async function renderPilotTrainManage(){
    showView('PilotTrainManage');
    const el = document.getElementById('viewPilotTrainManage');
    el.innerHTML = backToPtBtn() + '<div class="panel"><p class="form-sub">Loading…</p></div>';
    document.getElementById('ptBackBtn').onclick = ()=> renderPilotTraining();
    const settings = await loadPtrainSettings();
    ptrainManageBody(settings);
  }
  function ptrainManageBody(settings){
    const el = document.getElementById('viewPilotTrainManage');
    if(!el) return;
    if(!Array.isArray(settings.hdItems)) settings.hdItems = ptrainDefaultHdItems();
    if(!Array.isArray(settings.heItems)) settings.heItems = ptrainDefaultHeItems();
    el.innerHTML =
      backToPtBtn() +
      '<div class="panel">' +
        '<h2 class="form-title">Manage Task &amp; AD Lists</h2>' +
        '<p class="form-sub">These are the options offered on every Pilot Training Card. Tag each AD with the aircraft model(s) it applies to so the entry form can show it automatically for that model — archive an AD instead of deleting it to keep it out of new cards without losing it from past records. Add an MCM link once your Maintenance Control Manual is hosted online.</p>' +
        '<div class="pt-section-title">Elementary Work / Servicing / Opp. Check tasks</div>' +
        '<p class="note">"Appendix" + "#" are the manual reference (e.g. Hc / 1b) shown on the Full Training Record report — leave blank for tasks not yet in the manual. "Text" is the canonical MCM wording (editing it here IS revising the MCM — the change flows through to the card and the full report automatically). "Card Text" is an optional shortened version for the small 4×2 card/label only; leave it blank to print the same wording as the MCM. Auto-fill matches by wording against the real Hb/Hc pages and only ever sets Appendix/#; review before saving, it never touches either text field.</p>' +
        '<div class="btn-row"><button class="btn small" id="ptmAutoNumber">🪄 Auto-fill Hb/Hc numbering from manual</button></div>' +
        '<div style="overflow-x:auto;"><table class="list-table"><thead><tr><th>Appendix</th><th>#</th><th>Category</th><th>Text (MCM wording)</th><th>Card Text (optional)</th><th>MCM Link</th><th></th></tr></thead><tbody id="ptmTaskRows"></tbody></table></div>' +
        '<div class="btn-row"><button class="btn small" id="ptmAddTask">+ Add task</button></div>' +
        '<div class="pt-section-title">Airworthiness Directives</div>' +
        '<div style="overflow-x:auto;"><table class="list-table"><thead><tr><th>AD</th>' + PTRAIN_AIRCRAFT.map(t=>'<th>'+t+'</th>').join('') + '<th>MCM / AD Link</th><th>Status</th><th></th></tr></thead><tbody id="ptmAdRows"></tbody></table></div>' +
        '<div class="btn-row"><button class="btn small" id="ptmAddAd">+ Add AD</button></div>' +
        '<div class="pt-section-title">Appendix Hd — Airworthiness Inspection Check</div>' +
        '<p class="note">Applicability is by aircraft registration (comma-separated). The training card resolves each registration\'s current model (Settings → Aircraft) to decide whether a given pilot shows as trained for that row — no need to re-tag rows when the fleet changes.</p>' +
        '<div style="overflow-x:auto;"><table class="list-table"><thead><tr><th>Registrations</th><th>Task</th><th>Description</th><th>Interval</th><th></th></tr></thead><tbody id="ptmHdRows"></tbody></table></div>' +
        '<div class="btn-row"><button class="btn small" id="ptmAddHd">+ Add Hd row</button></div>' +
        '<div class="pt-section-title">Appendix He — AD &amp; AMOC List</div>' +
        '<div style="overflow-x:auto;"><table class="list-table"><thead><tr><th>Registrations</th><th>Document</th><th>Description</th><th>Interval</th><th></th></tr></thead><tbody id="ptmHeRows"></tbody></table></div>' +
        '<div class="btn-row"><button class="btn small" id="ptmAddHe">+ Add He row</button></div>' +
        '<div class="btn-row" style="margin-top:16px;"><button class="btn primary" id="ptmSaveBtn">💾 Save Lists</button></div>' +
      '</div>';

    const taskBody = document.getElementById('ptmTaskRows');
    taskBody.innerHTML = settings.tasks.map((t,i)=>
      '<tr>' +
        '<td><input data-i="'+i+'" data-f="appendix" value="'+escapeHTML(t.appendix||'')+'" style="width:60px;" placeholder="Hc"></td>' +
        '<td><input data-i="'+i+'" data-f="num" value="'+(t.num!=null?t.num:'')+'" style="width:50px;" placeholder="1b"></td>' +
        '<td><input data-i="'+i+'" data-f="category" value="'+escapeHTML(t.category||'')+'" style="width:100px;"></td>' +
        '<td><input data-i="'+i+'" data-f="text" value="'+escapeHTML(t.text)+'" style="min-width:220px;width:100%;"></td>' +
        '<td><input data-i="'+i+'" data-f="cardText" value="'+escapeHTML(t.cardText||'')+'" placeholder="(same as MCM text)" style="min-width:180px;width:100%;"></td>' +
        '<td><input data-i="'+i+'" data-f="mcmLink" value="'+escapeHTML(t.mcmLink||'')+'" placeholder="https://…" style="min-width:160px;width:100%;"></td>' +
        '<td><button class="rm-btn" data-role="rmTask" data-i="'+i+'">✕</button></td>' +
      '</tr>'
    ).join('');

    const adBody = document.getElementById('ptmAdRows');
    adBody.innerHTML = settings.ads.map((a,i)=>
      '<tr style="'+(a.archived?'opacity:0.5;':'')+'">' +
        '<td><input data-i="'+i+'" data-f="text" value="'+escapeHTML(a.text)+'" style="min-width:150px;"></td>' +
        PTRAIN_AIRCRAFT.map(t=>'<td style="text-align:center;"><input type="checkbox" data-role="model" data-i="'+i+'" data-model="'+t+'" '+((a.models||[]).includes(t)?'checked':'')+'></td>').join('') +
        '<td><input data-i="'+i+'" data-f="mcmLink" value="'+escapeHTML(a.mcmLink||'')+'" placeholder="https://…" style="min-width:150px;width:100%;"></td>' +
        '<td>'+(a.archived?'Archived':'Active')+'</td>' +
        '<td style="white-space:nowrap;"><button class="btn small" data-role="toggleArchiveAd" data-i="'+i+'">'+(a.archived?'Restore':'Archive')+'</button></td>' +
      '</tr>'
    ).join('');

    function regsToStr(regs){ return (regs||[]).join(', '); }
    function strToRegs(str){ return String(str||'').split(',').map(s=>s.trim()).filter(Boolean); }

    const hdBody = document.getElementById('ptmHdRows');
    hdBody.innerHTML = settings.hdItems.map((r,i)=>
      '<tr>' +
        '<td><input data-i="'+i+'" data-f="regs" value="'+escapeHTML(regsToStr(r.regs))+'" style="min-width:160px;" placeholder="C-FHLF, C-GTWN"></td>' +
        '<td><input data-i="'+i+'" data-f="task" value="'+escapeHTML(r.task||'')+'" style="min-width:160px;width:100%;"></td>' +
        '<td><textarea data-i="'+i+'" data-f="desc" rows="2" style="min-width:220px;width:100%;">'+escapeHTML(r.desc||'')+'</textarea></td>' +
        '<td><input data-i="'+i+'" data-f="interval" value="'+escapeHTML(r.interval||'')+'" style="width:120px;"></td>' +
        '<td><button class="rm-btn" data-role="rmHd" data-i="'+i+'">✕</button></td>' +
      '</tr>'
    ).join('');

    const heBody = document.getElementById('ptmHeRows');
    heBody.innerHTML = settings.heItems.map((r,i)=>
      '<tr>' +
        '<td><input data-i="'+i+'" data-f="regs" value="'+escapeHTML(regsToStr(r.regs))+'" style="min-width:160px;" placeholder="C-FHLF, C-GTWN"></td>' +
        '<td><textarea data-i="'+i+'" data-f="doc" rows="2" style="min-width:160px;width:100%;">'+escapeHTML(r.doc||'')+'</textarea></td>' +
        '<td><textarea data-i="'+i+'" data-f="desc" rows="2" style="min-width:220px;width:100%;">'+escapeHTML(r.desc||'')+'</textarea></td>' +
        '<td><input data-i="'+i+'" data-f="interval" value="'+escapeHTML(r.interval||'')+'" style="width:120px;"></td>' +
        '<td><button class="rm-btn" data-role="rmHe" data-i="'+i+'">✕</button></td>' +
      '</tr>'
    ).join('');

    taskBody.querySelectorAll('input').forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.i,10), f = inp.dataset.f;
        settings.tasks[i][f] = (f==='num' && inp.value==='') ? null : inp.value;
      };
    });
    taskBody.querySelectorAll('button[data-role="rmTask"]').forEach(b=>{
      b.onclick = ()=>{ settings.tasks.splice(parseInt(b.dataset.i,10),1); ptrainManageBody(settings); };
    });

    adBody.querySelectorAll('input[data-f]').forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.i,10), f = inp.dataset.f;
        settings.ads[i][f] = inp.value;
      };
    });
    adBody.querySelectorAll('input[data-role="model"]').forEach(cb=>{
      cb.onchange = ()=>{
        const i = parseInt(cb.dataset.i,10), m = cb.dataset.model;
        const set = new Set(settings.ads[i].models||[]);
        if(cb.checked) set.add(m); else set.delete(m);
        settings.ads[i].models = Array.from(set);
      };
    });
    adBody.querySelectorAll('button[data-role="toggleArchiveAd"]').forEach(b=>{
      b.onclick = ()=>{
        const i = parseInt(b.dataset.i,10);
        settings.ads[i].archived = !settings.ads[i].archived;
        ptrainManageBody(settings);
      };
    });

    hdBody.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.i,10), f = inp.dataset.f;
        settings.hdItems[i][f] = (f==='regs') ? strToRegs(inp.value) : inp.value;
      };
    });
    hdBody.querySelectorAll('button[data-role="rmHd"]').forEach(b=>{
      b.onclick = ()=>{ settings.hdItems.splice(parseInt(b.dataset.i,10),1); ptrainManageBody(settings); };
    });
    heBody.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.i,10), f = inp.dataset.f;
        settings.heItems[i][f] = (f==='regs') ? strToRegs(inp.value) : inp.value;
      };
    });
    heBody.querySelectorAll('button[data-role="rmHe"]').forEach(b=>{
      b.onclick = ()=>{ settings.heItems.splice(parseInt(b.dataset.i,10),1); ptrainManageBody(settings); };
    });

    document.getElementById('ptmAutoNumber').onclick = ()=>{
      const n = ptrainSuggestManualNumbering(settings.tasks);
      ptrainManageBody(settings);
      alert(n ? ('Filled in appendix/# for '+n+' task(s) that matched the manual\'s wording. Review the highlighted columns, then Save Lists.') : 'No new matches found — every task\'s wording either already matches or isn\'t in Hb/Hc yet.');
    };
    document.getElementById('ptmAddTask').onclick = ()=>{ settings.tasks.push({num:null,category:'Additional',text:'',cardText:'',appendix:'',mcmLink:''}); ptrainManageBody(settings); };
    document.getElementById('ptmAddAd').onclick = ()=>{ settings.ads.push({text:'',mcmLink:'',models:[],archived:false}); ptrainManageBody(settings); };
    document.getElementById('ptmAddHd').onclick = ()=>{ settings.hdItems.push({regs:[],task:'',desc:'',interval:''}); ptrainManageBody(settings); };
    document.getElementById('ptmAddHe').onclick = ()=>{ settings.heItems.push({regs:[],doc:'',desc:'',interval:''}); ptrainManageBody(settings); };
    document.getElementById('ptmSaveBtn').onclick = async ()=>{ await savePtrainSettings(settings); flashSaved('ptmSaveBtn'); };
    document.getElementById('ptBackBtn').onclick = ()=> renderPilotTraining();
  }

  window.__formsApp = { state, storageGet, storageSet, sha256, escapeHTML, todayISO, fmtDateNice, loadSettings, saveSettings, PHOENIX_LOGO_DATA_URI, SUPABASE_CONFIGURED };

  // init
  initGate();
})();
</script>
</body>
</html>
