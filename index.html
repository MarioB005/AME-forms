  // Two-series trend chart (opening/closing margin), adapted from ec135DrawTrendChart.
  function bvDrawTrendChart(canvas, records){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const padL = 48, padR = 14, padT = 20, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const seriesColors = { open: pcCssVar('--accent'), close: pcCssVar('--warn') };
    const allVals = [];
    records.forEach(r=>{ allVals.push(r.data.openResult.margin); allVals.push(r.data.closeResult.margin); });
    if(!allVals.length) return;
    let vMin = Math.min(0, Math.min.apply(null, allVals));
    let vMax = Math.max.apply(null, allVals);
    const pad = (vMax - vMin) * 0.15 || 1;
    vMin -= pad; vMax += pad;

    function xFor(i){ return padL + (records.length<=1 ? plotW/2 : plotW * i/(records.length-1)); }
    function yFor(v){ return padT + plotH * (1 - (v - vMin)/(vMax - vMin)); }

    ctx.strokeStyle = pcCssVar('--line');
    ctx.lineWidth = 1;
    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for(let t=0;t<=ticks;t++){
      const v = vMin + (vMax-vMin)*t/ticks;
      const y = yFor(v);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL-6, y);
    }
    if(vMin < 0 && vMax > 0){
      ctx.strokeStyle = pcCssVar('--bad');
      ctx.setLineDash([4,3]);
      const y0 = yFor(0);
      ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawSeries(field, color){
      const pts = records.map((r,i)=>({ x:xFor(i), y:yFor(r.data[field].margin) }));
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
      ctx.stroke();
      pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); });
    }
    drawSeries('openResult', seriesColors.open);
    drawSeries('closeResult', seriesColors.close);

    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelIdxs = records.length>1 ? [0, Math.floor((records.length-1)/2), records.length-1] : [0];
    labelIdxs.forEach(i=>{
      const label = (fmtDateNice(records[i].date) || records[i].date || '').split(',')[0];
      ctx.fillText(label, xFor(i), H-padB+8);
    });

    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = seriesColors.open; ctx.fillRect(padL, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Opening', padL+14, 7);
    ctx.fillStyle = seriesColors.close; ctx.fillRect(padL+80, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Closing', padL+94, 7);
  }


  // ---------- EC135 T2+ Power Check (Arriel 2B2) ----------
  // Chart data digitized from Airbus Helicopters EC135 T2+ Flight Manual, Section 5
  // Performance Data, Rev. 17: Fig. 5-1 (ground power check, 75% torque), Fig. 5-2
  // (ground power check, 60% torque - high altitude / high OAT reference) and Fig. 5-3
  // (N1/TOT check). Fig. 5-1/5-2 are near-planar in OAT and pressure altitude, so each is
  // stored as a fitted plane (N1max = n0 + a*OAT + b*PA/1000ft). Fig. 5-3 is a two-panel
  // nomograph (N1,OAT -> linking position -> TOT via pressure altitude); each panel is
  // digitized per labeled line and read the same way a pilot reads the chart: bracket the
  // two nearest labeled lines and interpolate linearly between them (AFM 5.1.2 permits
  // interpolation between charted data). Cross-checked against the AFM's own worked
  // example (Fig. 5-1: 75% torque, Zp 2000ft, OAT 14degC -> N1 limit 95.5%, this model:
  // 95.50%; Fig. 5-3: N1 94.5%, OAT 14degC, Zp 2000ft -> max TOT 808degC, this model: 807degC).
  let ec135State = null;
  const EC135_POWERCHECK_DATA = {
    ch75: { n0: 92.842, a: 0.1385, b: 0.3594 },
    ch60: { n0: 90.916, a: 0.1446, b: 0.3450 },
    topOats: [-35,-20,0,20,40,50],
    topCoeffs: {
      '-35': [4.12500000, -635.30000000, 25303.6938],
      '-20': [1.73214286, -230.58571429, 8246.85982],
      '0'  : [1.47321429, -194.45714286, 7151.36027],
      '20' : [2.30357143, -349.25714286, 14426.5527],
      '40' : [2.33928571, -363.71428571, 15511.2723],
      '50' : [3.23214286, -525.10000000, 22845.2420]
    },
    botPAs: [-1500, 10000, 18000],
    botLines: {
      '-1500': { m: 4.55,  b: -1715.0 },
      '10000': { m: 4.517, b: -1631.66 },
      '18000': { m: 4.53,  b: -1745.4 }
    },
    limits: { pa:[-1500,18000], oat:[-35,50], n1:[80,100], tot:[500,900] }
  };

  function ec135Quad(c, x){ return c[0]*x*x + c[1]*x + c[2]; }

  // The two AFM charts (Fig. 5-1 @ 75% torque, Fig. 5-2 @ 60% torque) are each fitted as a
  // plane in OAT/Zp. Torque actually observed during the check rarely lands exactly on
  // 75.0 or 60.0, so the N1-limit plane is linearly interpolated (and, within +/-3%,
  // mildly extrapolated) between those two calibrated torque settings.
  function ec135PlaneAt(torque){
    const c60 = EC135_POWERCHECK_DATA.ch60, c75 = EC135_POWERCHECK_DATA.ch75;
    const t = (torque - 60) / (75 - 60);
    return {
      n0: c60.n0 + t*(c75.n0 - c60.n0),
      a:  c60.a  + t*(c75.a  - c60.a),
      b:  c60.b  + t*(c75.b  - c60.b)
    };
  }

  function ec135TopX(n1, oat){
    const d = EC135_POWERCHECK_DATA;
    const oatC = Math.max(d.topOats[0], Math.min(d.topOats[d.topOats.length-1], oat));
    const ys = d.topOats.map(o => ec135Quad(d.topCoeffs[String(o)], n1));
    return pcInterpAscending(oatC, d.topOats, ys).y;
  }

  function ec135BottomTOT(x, pa){
    const d = EC135_POWERCHECK_DATA;
    const paC = Math.max(d.botPAs[0], Math.min(d.botPAs[d.botPAs.length-1], pa));
    const ys = d.botPAs.map(p => { const L = d.botLines[String(p)]; return (x - L.b) / L.m; });
    return pcInterpAscending(paC, d.botPAs, ys).y;
  }

  function ec135Compute(inputs){
    const { target, torque, pa, oat, n1, tot } = inputs;
    const plane = ec135PlaneAt(torque);
    const n1Limit = plane.n0 + plane.a*oat + plane.b*(pa/1000);
    const n1Margin = n1Limit - n1;
    const x = ec135TopX(n1, oat);
    const totLimit = ec135BottomTOT(x, pa);
    const totMargin = totLimit - tot;

    const notes = [];
    if (torque < 60 || torque > 75){
      notes.push('Torque is outside the digitized 60–75% range: the N1-limit relationship is extrapolated beyond the two charted torque settings.');
    }
    if (target === 75 && pa >= 15000){
      notes.push('Zp ≥ 15,000 ft: Fig. 5-1’s 16,000 ft line departs from a straight line above N1 ≈97% (collective/topping limit). Cross-check Fig. 5-1 directly.');
    }
    if (target === 60 && (pa < 8000 || oat < 10)){
      notes.push('The 60% chart (Fig. 5-2) is intended for high altitude / high OAT conditions (Zp &gt; 10,000 ft, OAT &gt; ISA+20°C). Outside that corner the result is extrapolated — prefer the 75% check when it can be reached within limits.');
    }
    if (n1 > 95.5){
      notes.push('Indicated N1 is above ~95.5%: Fig. 5-3’s OAT lines converge in this region, so the computed max TOT is approximate — confirm against Fig. 5-3.');
    }
    if (pa < -1500 || pa > 18000){
      notes.push('Pressure altitude is outside the charted range (−1,500 to 18,000 ft) — result is extrapolated.');
    }
    if (n1Limit > 99.5 || n1Limit < 87){
      notes.push('This OAT/altitude combination falls outside Fig. 5-'+(target===60?'2':'1')+'’s plotted grid — treat the chart limit N1 as an extrapolation and verify against the AFM.');
    }

    const passed = n1Margin >= 0 && totMargin >= 0;
    return { n1Limit, n1Margin, totLimit, totMargin, passed, notes };
  }

  function ec135AngleFor(v, gmin, gmax){
    const t = Math.max(0, Math.min(1, (v - gmin) / (gmax - gmin)));
    return Math.PI - t * Math.PI;
  }

  function ec135DrawGauge(canvas, margin, gmin, gmax, gwarn){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H - 26, r = 118, rInner = 92;
    ctx.clearRect(0,0,W,H);

    const badC = pcCssVar('--bad') || '#b0281e';
    const warnC = pcCssVar('--warn') || '#b3791b';
    const goodC = pcCssVar('--good') || '#2f7d4f';
    const lineC = pcCssVar('--line') || '#dfe2da';
    const grey = pcCssVar('--grey-strong') || '#6b6558';
    const ink = pcCssVar('--ink') || '#1c2b24';

    ctx.lineWidth = r - rInner;
    ctx.lineCap = 'butt';
    const zones = [
      { from: gmin, to: 0, color: badC },
      { from: 0, to: gwarn, color: warnC },
      { from: gwarn, to: gmax, color: goodC },
    ];
    zones.forEach(z => {
      ctx.beginPath();
      ctx.strokeStyle = z.color;
      ctx.globalAlpha = 0.88;
      ctx.arc(cx, cy, (r+rInner)/2, -ec135AngleFor(z.from,gmin,gmax), -ec135AngleFor(z.to,gmin,gmax), false);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    ctx.font = '9px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.fillStyle = grey;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const step = (gmax-gmin) > 6 ? 2 : 1;
    for (let v = gmin; v <= gmax + 0.001; v += step){
      const a = ec135AngleFor(v,gmin,gmax);
      const x1 = cx + Math.cos(a) * (r + 2);
      const y1 = cy - Math.sin(a) * (r + 2);
      const x2 = cx + Math.cos(a) * (rInner - 2);
      const y2 = cy - Math.sin(a) * (rInner - 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineC;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lx = cx + Math.cos(a) * (r + 13);
      const ly = cy - Math.sin(a) * (r + 13);
      ctx.fillText((v>0?'+':'') + Math.round(v), lx, ly);
    }

    const clamped = Math.max(gmin, Math.min(gmax, margin));
    const a = ec135AngleFor(clamped,gmin,gmax);
    const nx = cx + Math.cos(a) * (rInner - 4);
    const ny = cy - Math.sin(a) * (rInner - 4);
    const needleC = margin < 0 ? badC : (margin < gwarn ? warnC : goodC);
    ctx.strokeStyle = needleC;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = needleC; ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = ink; ctx.arc(cx, cy, 2.5, 0, Math.PI*2); ctx.fill();
  }

  function ec135FormatFieldVal(f, val){
    if (f.step < 1) return val.toFixed(1);
    return Math.round(val).toLocaleString();
  }

  // Range slider + fine-adjustment up/down steppers, shared by every EC135 field.
  function ec135FieldHTML(f){
    return (
      '<div class="pc-field">' +
        '<div class="pc-field-head"><span class="pc-field-name">'+f.label+'<span class="pc-field-unit">'+f.unit+'</span></span><span class="pc-field-val" id="'+f.id+'Val">'+ec135FormatFieldVal(f, f.value)+'</span></div>' +
        '<div class="pc-field-row">' +
          '<input type="range" id="'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+f.value+'">' +
          '<div class="pc-stepper">' +
            '<button type="button" class="pc-step-btn" data-target="'+f.id+'" data-dir="-1" aria-label="Decrease '+f.label+'">&minus;</button>' +
            '<button type="button" class="pc-step-btn" data-target="'+f.id+'" data-dir="1" aria-label="Increase '+f.label+'">+</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function ec135AmbientFields(defaults){
    return [

      { id:'ecOat', label:'OAT', unit:'outside air temp, °C (both engines)', min:-35, max:50, step:0.1, value:defaults.oat },

    return [
      { id:p+'Tq',  label:'Torque', unit:'observed, % ('+target+'% ±3)', min:target-3, max:target+3, step:0.1, value:defaults.torque },

      { id:p+'Tot', label:'TOT', unit:'indicated, °C', min:500, max:900, step:1, value:defaults.tot },
    ];
  }

  // ---------- EC135 print report ----------
  const EC135_PRINT_STYLES = '<style>' +
    '.ec-pf-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px;}' +

      '</div>' +

  function renderEc135Powercheck(prefill){
    showView('Ec135pc');
    const el = document.getElementById('viewEc135pc');
    const s = state.settings;
    const pfEngine = (p, fallback)=> (prefill && prefill.engines) ? (prefill.engines.find(e=>e.p===p) || fallback) : fallback;

    const ambientDefaults = prefill ? { pa: prefill.pa, oat: prefill.oat } : { pa:2000, oat:14 };
    const engineDefs = [
      { p:'e1', label:'Engine 1', defaults: (()=>{ const e = pfEngine('e1', {torque:75, n1:94.5, tot:760, sn:''}); return { torque:e.torque, n1:e.n1, tot:e.tot, sn:e.sn||'' }; })() },
      { p:'e2', label:'Engine 2', defaults: (()=>{ const e = pfEngine('e2', {torque:75, n1:93.8, tot:745, sn:''}); return { torque:e.torque, n1:e.n1, tot:e.tot, sn:e.sn||'' }; })() },
    ];
    ec135State = prefill
      ? { e1:{target: pfEngine('e1',{target:75}).target}, e2:{target: pfEngine('e2',{target:75}).target} }
      : (ec135State || { e1:{target:75}, e2:{target:75} });

    function engineBlock(def){

      return (

          '<div class="ec-engine-head"><span class="ec-engine-title">'+def.label+'</span>' +

            '<div class="pc-toggle" style="width:200px;margin-top:0;">' +

              fields.map(ec135FieldHTML).join('') +

            '<div>' +

                '<canvas id="'+def.p+'Gauge" width="280" height="170" style="width:100%;height:auto;display:block;"></canvas>' +

              '<div class="pc-readout-row"><span>TOT margin</span><span class="v" id="'+def.p+'TotMarginOut">&mdash;</span></div>' +

    }

    el.innerHTML =
      backButton() +
      '<div class="panel">' +
        '<h2 class="form-title">EC135 T2+ Power Check</h2>' +
        '<p class="form-sub">Ground power check &amp; N1/TOT check &mdash; Turbomeca Arriel 2B2 &mdash; chart data digitized from the EC135 T2+ Flight Manual, Section 5.1.3 &amp; Figs. 5-1/5-2/5-3 (Rev. 17). For training and reference use only &mdash; not a substitute for the approved Flight Manual. If power is not assured, refer to the Maintenance Manual before further flight.</p>' +
        '<div class="field-grid" style="margin-bottom:16px;">' +
          '<div class="field"><label for="ecReg">A/C registration</label><input type="text" id="ecReg" placeholder="C-XXXX"></div>' +
          '<div class="field"><label for="ecDate">Date</label><input type="date" id="ecDate"></div>' +

        '<div class="btn-row" style="justify-content:flex-end;">' +

    document.getElementById('ecReg').value = prefill ? (prefill.reg||'') : 'C-GERP';
    document.getElementById('ecDate').value = prefill ? (prefill.date||todayISO()) : todayISO();
    if (prefill && prefill.by) document.getElementById('ecBy').value = prefill.by;
    if (prefill && prefill.pilot) document.getElementById('ecPilot').value = prefill.pilot;
    document.getElementById('ecTrendBtn').onclick = ()=> renderEc135Trend();

    const ambEls = {};
    ec135AmbientFields(ambientDefaults).forEach(f=>{ ambEls[f.id] = document.getElementById(f.id); });

    const fEls = {};
    function bindEngineFieldEls(def){
      const target = ec135State[def.p].target;
      ec135EngineFields(def.p, target, def.defaults).forEach(f=>{ fEls[f.id] = document.getElementById(f.id); });
    }
    engineDefs.forEach(bindEngineFieldEls);

    // single delegated handler drives every slider AND its +/- fine-adjust buttons
    function wireField(inputEl){
      inputEl.addEventListener('input', ()=>{
        const f = { step: parseFloat(inputEl.step) };
        document.getElementById(inputEl.id+'Val').textContent = ec135FormatFieldVal(f, parseFloat(inputEl.value));
        update();
      });
    }
    Object.values(ambEls).forEach(wireField);
    Object.values(fEls).forEach(wireField);

    el.addEventListener('click', (e)=>{
      const btn = e.target.closest('.pc-step-btn');
      if (!btn) return;
      const inp = document.getElementById(btn.dataset.target);
      if (!inp) return;
      const step = parseFloat(inp.step) || 1;
      const min = parseFloat(inp.min), max = parseFloat(inp.max);
      const dir = parseFloat(btn.dataset.dir);
      let val = parseFloat(inp.value) + dir*step;
      val = Math.round(val/step)*step;
      val = Math.max(min, Math.min(max, val));
      inp.value = val;
      inp.dispatchEvent(new Event('input', { bubbles:true }));
    });

    function syncToggle(p){
      document.getElementById(p+'Tq75').setAttribute('aria-pressed', String(ec135State[p].target===75));
      document.getElementById(p+'Tq60').setAttribute('aria-pressed', String(ec135State[p].target===60));
    }
    function retargetEngine(p, newTarget){
      ec135State[p].target = newTarget;
      syncToggle(p);
      // rescale the torque slider around the new target, keep it centered on target
      const tq = fEls[p+'Tq'];
      tq.min = newTarget - 3;
      tq.max = newTarget + 3;
      tq.value = newTarget;
      document.getElementById(p+'Tq').closest('.pc-field').querySelector('.pc-field-unit').textContent = 'observed, % ('+newTarget+'% ±3)';
      document.getElementById(p+'TqVal').textContent = ec135FormatFieldVal({step:0.1}, newTarget);
      update();
    }
    engineDefs.forEach(def=>{
      const p = def.p;
      document.getElementById(p+'Tq75').onclick = ()=> retargetEngine(p, 75);
      document.getElementById(p+'Tq60').onclick = ()=> retargetEngine(p, 60);
      syncToggle(p);
    });

    const EC_GMIN = -3, EC_GMAX = 6, EC_GWARN = 1;
    let lastResults = null;

    function updateEngine(def){
      const p = def.p;
      const inputs = {
        target: ec135State[p].target,
        torque: parseFloat(fEls[p+'Tq'].value),
        pa: parseFloat(ambEls.ecPa.value),
        oat: parseFloat(ambEls.ecOat.value),
        n1: parseFloat(fEls[p+'N1'].value),
        tot: parseFloat(fEls[p+'Tot'].value),
      };
      const out = ec135Compute(inputs);

      const marginFigure = document.getElementById(p+'MarginFigure');
      const sign = out.n1Margin >= 0 ? '+' : '−';
      marginFigure.textContent = sign + Math.abs(out.n1Margin).toFixed(2) + '%';
      marginFigure.style.color = out.n1Margin < 0 ? 'var(--bad)' : (out.n1Margin < EC_GWARN ? 'var(--warn)' : 'var(--good)');

      document.getElementById(p+'N1LimOut').textContent = out.n1Limit.toFixed(2) + '%';
      document.getElementById(p+'TotLimOut').textContent = out.totLimit.toFixed(0) + '°C';
      const totOut = document.getElementById(p+'TotMarginOut');
      const totSign = out.totMargin >= 0 ? '+' : '−';
      totOut.textContent = totSign + Math.abs(out.totMargin).toFixed(0) + '°C';
      totOut.style.color = out.totMargin < 0 ? 'var(--bad)' : (out.totMargin < 20 ? 'var(--warn)' : 'var(--good)');

      const chip = document.getElementById(p+'Chip');
      chip.classList.remove('pass','fail');
      chip.classList.add(out.passed ? 'pass' : 'fail');
      document.getElementById(p+'StatusText').textContent = out.passed ? 'PASSED' : 'FAILED';

      const noteEl = document.getElementById(p+'Note');
      if (out.notes.length){
        noteEl.hidden = false;
        document.getElementById(p+'NoteText').innerHTML = out.notes.join('<br>');
      } else {
        noteEl.hidden = true;
      }

      ec135DrawGauge(document.getElementById(p+'Gauge'), out.n1Margin, EC_GMIN, EC_GMAX, EC_GWARN);
      return { p, label: def.label, target: inputs.target, torque: inputs.torque, n1: inputs.n1, tot: inputs.tot, out };
    }

    function update(){
      lastResults = engineDefs.map(updateEngine);
      const overallChip = document.getElementById('ecOverallChip');
      overallChip.classList.remove('pass','fail');
      const allPass = lastResults.every(r=>r.out.passed);
      overallChip.classList.add(allPass ? 'pass' : 'fail');
      document.getElementById('ecOverallText').textContent = allPass ? 'POWER ASSURED — BOTH ENGINES' : 'POWER NOT ASSURED';
    }

    document.getElementById('ecPrintBtn').onclick = ()=>{
      const dateISO = document.getElementById('ecDate').value;
      const reg = document.getElementById('ecReg').value;
      const by = document.getElementById('ecBy').value;
      const pilot = document.getElementById('ecPilot').value;
      // read S/N fresh from the DOM rather than from lastResults, since typing into it alone
      // (with no slider touched) doesn't trigger update() and would otherwise print stale S/Ns
      const engines = lastResults.map(r=> Object.assign({}, r, { sn: (document.getElementById(r.p+'Sn')||{}).value || '' }));
      const recordData = {
        date: dateISO,
        reg: reg,
        by: by,
        pilot: pilot,
        pa: parseFloat(ambEls.ecPa.value),
        oat: parseFloat(ambEls.ecOat.value),
        engines: engines,
        allPass: engines.every(r=>r.out.passed),
      };
      openPrint(buildEc135PrintHtml(Object.assign({}, recordData, { date: fmtDateNice(dateISO) })));
      // keep a record of every printed report (searchable in Saved Forms, and plotted in Trend monitoring) —
      // best-effort: saveRecord/storageSet never reject, so this never blocks or breaks the print itself.
      const desc = 'AME: '+(by||'—')+' — Pilot: '+(pilot||'—')+' — '+(recordData.allPass?'PASSED':'FAILED');
      saveRecord(buildRecord('ec135pc', 'EC135 T2+ Power Check', reg, dateISO, desc, recordData)).catch(()=>{});
    };

    update();
  }

  function ec135DrawTrendChart(canvas, records, valueFn){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const padL = 48, padR = 14, padT = 20, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const seriesColors = { e1: pcCssVar('--accent'), e2: pcCssVar('--warn') };
    const allVals = [];
    records.forEach(r=> (r.data.engines||[]).forEach(e=> allVals.push(valueFn(e))));
    if(!allVals.length) return;
    let vMin = Math.min(0, Math.min.apply(null, allVals));
    let vMax = Math.max.apply(null, allVals);
    const pad = (vMax - vMin) * 0.15 || 1;
    vMin -= pad; vMax += pad;

    function xFor(i){ return padL + (records.length<=1 ? plotW/2 : plotW * i/(records.length-1)); }
    function yFor(v){ return padT + plotH * (1 - (v - vMin)/(vMax - vMin)); }

    ctx.strokeStyle = pcCssVar('--line');
    ctx.lineWidth = 1;
    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for(let t=0;t<=ticks;t++){
      const v = vMin + (vMax-vMin)*t/ticks;
      const y = yFor(v);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL-6, y);
    }
    if(vMin < 0 && vMax > 0){
      ctx.strokeStyle = pcCssVar('--bad');
      ctx.setLineDash([4,3]);
      const y0 = yFor(0);
      ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
      ctx.setLineDash([]);
    }

    ['e1','e2'].forEach(p=>{
      const pts = records.map((r,i)=>{
        const e = (r.data.engines||[]).find(en=>en.p===p);
        return e ? {x:xFor(i), y:yFor(valueFn(e))} : null;
      }).filter(Boolean);
      if(!pts.length) return;
      ctx.strokeStyle = seriesColors[p];
      ctx.fillStyle = seriesColors[p];
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
      ctx.stroke();
      pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); });
    });

    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelIdxs = records.length>1 ? [0, Math.floor((records.length-1)/2), records.length-1] : [0];
    labelIdxs.forEach(i=>{
      const label = (fmtDateNice(records[i].date) || records[i].date || '').split(',')[0];
      ctx.fillText(label, xFor(i), H-padB+8);
    });

    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = seriesColors.e1; ctx.fillRect(padL, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Engine 1', padL+14, 7);
    ctx.fillStyle = seriesColors.e2; ctx.fillRect(padL+90, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Engine 2', padL+104, 7);
  }

  // Maps an aircraft MODEL string (Settings -> Aircraft, e.g. "AS350B2", "EC130T2") to the A/C Type keys used
  // on the Pilot Training Card (PTRAIN_AIRCRAFT). Airbus renamed the EC130 to "H130" -- that's why EC130
  // maps to the "H130" type instead of a separate one. Models with no mapping (e.g. "Cabri G2") return null:
  // rows for those tails just never show a Pilot Training checkmark, since that type isn't tracked on the card.
  // AS350B3 must be checked before the bare "AS350" fallback, or a B3 tail would be misread as a B2.
  function ptrainModelToType(model){
    if(!model) return null;
    const m = String(model).toUpperCase();
    if(m.indexOf('EC120')===0) return 'EC120';
    if(m.indexOf('EC130')===0) return 'H130';
    if(m.indexOf('H130')===0) return 'H130';
    if(m.indexOf('AS355')===0) return 'AS355';
    if(m.indexOf('AS350B3')===0) return 'AS350B3';
    if(m.indexOf('AS350')===0) return 'AS350B2'; // covers "AS350B2" and a bare/legacy "AS350" model string
    if(m.indexOf('EC135')===0) return 'EC135';
    return null;
  }
  function ptrainRegToType(reg){
    const a = (state.settings.aircraft||[]).find(x=>x.reg===reg);
    return a ? ptrainModelToType(a.model) : null;
  }
  function ptrainRegsApplicableToTypes(regs, types){
    if(!types || !types.length) return false;
    return (regs||[]).some(r=> types.includes(ptrainRegToType(r)));
  }

  // ---------- match today's task list against the manual's Hb/Hc wording, to suggest appendix/num values ----------
  // This is what powers the "Auto-fill Hb/Hc numbering from manual" button in Manage Task & AD Lists: it never
  // overwrites text, only fills in appendix+num for a row whose text closely matches a known manual item, so a
  // site's already-customized task list can be lined up with the manual without retyping everything by hand.
  function ptrainNormalizeMatchText(s){
    return String(s||'').toLowerCase().replace(/[“”"'.,\/\-–—()]/g,' ').replace(/\s+/g,' ').trim();
  }
  const PTRAIN_HC_REFERENCE = ptrainDefaultTasks().filter(t=>t.appendix).map(t=>({ appendix:t.appendix, num:t.num, key:ptrainNormalizeMatchText(t.text) }));
  function ptrainSuggestManualNumbering(tasks){
    let changedCount = 0;
    tasks.forEach(t=>{
      const key = ptrainNormalizeMatchText(t.text);
      if(!key) return;
      // Containment only counts as a match when the shorter string covers almost all of the longer one --
      // a bare "contains" check would wrongly match a legacy/combined-wording variant that merely shares a
      // long common phrase with a real numbered item (e.g. "...(legacy combined wording)" entries).
      const hit = PTRAIN_HC_REFERENCE.find(ref=>{
        if(ref.key===key) return true;
        const shorter = Math.min(ref.key.length, key.length), longer = Math.max(ref.key.length, key.length);
        return longer>0 && shorter/longer >= 0.92 && (ref.key.indexOf(key)>=0 || key.indexOf(ref.key)>=0);
      });
      if(hit && (t.appendix!==hit.appendix || t.num!==hit.num)){
        t.appendix = hit.appendix; t.num = hit.num; changedCount++;
      }
    });
    return changedCount;
  }
  // Which manual heading a task falls under, purely from its own appendix+num -- no separate lookup table to
  // keep in sync. Hb only ever has 3 items (hard-coded); Hc's grouping is just "Task #<the leading digit>".
  function ptrainManualGroupLabel(appendix, num){
    if(appendix==='Hb'){
      if(num==='1') return 'Servicing:';
      if(num==='2' || num==='3') return 'Additional Training:';
      return '';
    }
    if(appendix==='Hc' && num){
      const m = /^(\d+)/.exec(num);
      if(m) return 'Task #'+m[1]+':';
    }
    return '';
  }
  // The bullet/letter shown in front of an individual manual-numbered item -- "1b" -> "b.", a bare Hb
  // item like "2" -> "2.". Shared by the full training-record report (the Pilot Training Card itself no
  // longer has its own "Manual view"; that presentation now lives only in that report).
  function ptrainManualItemLabel(appendix, num){
    if(appendix==='Hc' && num){ const m = /^\d+([a-z]+)$/.exec(num); if(m) return m[1]+'.'; }
    return (num!=null?num:'')+'.';
  }

    const btn = document.getElementById('ptrainGateBtn');
    err.textContent = ''; p1.value=''; p2.value='';

    const existingHash = await storageGet('ptrain:app_password');
    const settingUp = !existingHash;
    if(settingUp){
      title.textContent = 'Set a password';
      sub.textContent = 'This section is kept separate from the rest of the site — create a password just for it. Anyone who knows it (in addition to the site password) can open Reserved.';
      p2.style.display = 'block';
      btn.textContent = 'Set password';

      sub.textContent = 'Reserved is separately protected.';
      p2.style.display = 'none';
      btn.textContent = 'Unlock';
    }

    document.getElementById('ptrainGateForm').onsubmit = async (e)=>{
      e.preventDefault();
      err.textContent = '';
      if(settingUp){
        if(!p1.value || p1.value.length<4){ err.textContent='Use at least 4 characters.'; return; }
        if(p1.value !== p2.value){ err.textContent='Passwords do not match.'; return; }
        const hash = await sha256(p1.value);
        await storageSet('ptrain:app_password', hash);
        ptrainFinishUnlock();
      } else {
        const hash = await sha256(p1.value);
        if(hash === existingHash){ ptrainFinishUnlock(); }
        else { err.textContent = 'Incorrect password.'; p1.value=''; }
      }
    };

  // ---------- data layer (Supabase-backed via storageGet/storageSet, same as the rest of the site) ----------
  function ptrainNormalizeSettings(s){
    let changed = false;
    (s.ads||[]).forEach(a=>{
      if(!Array.isArray(a.models)){ a.models = []; changed = true; }
      if(typeof a.archived !== 'boolean'){ a.archived = false; changed = true; }
      // Sites tagged before the AS350B2/B3 split only ever had a generic "AS350" model tag -- fold it
      // forward onto BOTH sub-models (never distinguished at the time) rather than silently dropping
      // the applicability. A site that re-tags a specific AD to just one sub-model afterwards is fine;
      // this only fires once, for the still-generic "AS350" tag.
      if(a.models.includes('AS350')){
        const set = new Set(a.models.filter(m=>m!=='AS350'));
        set.add('AS350B2'); set.add('AS350B3');
        a.models = Array.from(set);
        changed = true;
      }
    });
    (s.tasks||[]).forEach(t=>{
      if(t.cardText===undefined){ t.cardText = ''; changed = true; }
    });
    // Backfill any numbered manual item (Appendix + #) that's missing from this site's saved task list.
    // A numbered task should never just silently vanish from the checklist/report -- but a site's list
    // can drift out of sync with the current numbered set (a row edited away by accident, or a site that
    // predates one being added), and unlike the cardText/hdItems/heItems repairs above this checks every
    // individual numbered item, not just the list as a whole. This only ADDS a missing key back with its
    // current default wording -- it never touches or reorders an item that's already on file, so any
    // custom text already saved for an existing Appendix+# is left exactly as-is.
    if(!Array.isArray(s.tasks)) s.tasks = [];
    const existingTaskKeys = new Set(s.tasks.filter(t=>t.appendix && t.num!=null).map(t=> t.appendix+'|'+t.num));
    ptrainDefaultTasks().forEach(defTask=>{
      if(!defTask.appendix || defTask.num==null) return;
      const key = defTask.appendix+'|'+defTask.num;
      if(!existingTaskKeys.has(key)){
        s.tasks.push(Object.assign({}, defTask));
        existingTaskKeys.add(key);
        changed = true;
      }
    });
    // Sites that already existed before Hd/He tracking was added won't have these keys yet -- seed them
    // once from the manual so "Manage Task & AD Lists" has something to show and edit going forward.
    if(!Array.isArray(s.hdItems)){ s.hdItems = ptrainDefaultHdItems(); changed = true; }
    if(!Array.isArray(s.heItems)){ s.heItems = ptrainDefaultHeItems(); changed = true; }
    return changed;
  }

  async function loadPtrainSettings(){

    ptrainSettingsCache = { tasks: ptrainDefaultTasks(), ads: ptrainDefaultAds(), hdItems: ptrainDefaultHdItems(), heItems: ptrainDefaultHeItems() };
    await storageSet('ptrain:settings', JSON.stringify(ptrainSettingsCache));
    return ptrainSettingsCache;
  }

  function mcmGeneratedTableHtml(which, doc){
    if(which==='effectivePages') return mcmEffectivePagesTableHtml(doc);
    if(which==='amendmentLog') return mcmAmendmentLogTableHtml(doc);
    return '';
  }
  function mcmCertificationOfAmendmentsHtml(doc){
    const amend = (doc.amendments||[]).find(a=>a.amendmentNo===doc.lastAmendmentNo) || (doc.amendments||[])[doc.amendments.length-1];
    if(!amend){
      return '<p class="mcm-b-paragraph">No amendments have been published yet.</p>';

    const pages = (amend.pagesChanged||[]).join(', ') || '—';

      '<p class="mcm-b-paragraph"><b>Company name:</b> Phoenix Heli-Flight Inc.</p>' +
      '<p class="mcm-b-paragraph"><b>Address:</b> 1001 Saline Pkwy, Fort McMurray, Alberta, T9H 0H8</p>' +
      '<p class="mcm-b-paragraph"><b>Amendment No.:</b> '+escapeHTML(amend.amendmentNo)+'</p>' +
      '<p class="mcm-b-paragraph">This manual has been revised and amended to reflect the following changes:</p>' +
      '<p class="mcm-b-paragraph"><b>Pages removed:</b> '+escapeHTML(pages)+'</p>' +
      '<p class="mcm-b-paragraph"><b>Pages added:</b> '+escapeHTML(pages)+'</p>' +
      '<p class="mcm-b-paragraph" style="margin-top:26px;">DOM (Director of Maintenance): ______________________________</p>' +

  // ---- view-mode block rendering ----
  function mcmBlockViewHtml(b, changed, doc){
    const cls = 'mcm-b '+(changed?'mcm-changed ':'');
    switch(b.type){
      case 'heading': return '<h3 class="'+cls+'mcm-b-heading">'+b.html+'</h3>';
      case 'subheading': return '<h4 class="'+cls+'mcm-b-subheading">'+b.html+'</h4>';
      case 'paragraph': return '<p class="'+cls+'mcm-b-paragraph">'+b.html+'</p>';
      case 'table': return '<div class="'+cls+'"><table class="mcm-table"><tbody>'+
          b.rows.map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
        '</tbody></table></div>';
      case 'image': return '<div class="'+cls+'mcm-b-image">'+(b.src?('<img src="'+b.src+'" alt="Diagram">'):'<p class="mcm-b-paragraph"><i>(image not available)</i></p>')+'</div>';
      case 'generatedTable': return '<div class="'+cls+'"><div class="mcm-generated-note">This table is generated automatically and can\'t be edited directly.</div>'+mcmGeneratedTableHtml(b.which, doc)+'</div>';
      default: return '';
    }
  }

              '<td><input type="text" data-idx="'+idx+'" data-r="'+ri+'" data-c="'+ci+'" value="'+escapeHTML(c)+'"></td>'

  function mcmEmptyBlock(type){
    if(type==='table') return {type:'table', rows:[['','',''],['','','']]};
    return {type:type, html:''};

  // ---- main render ----
  async function renderMcmDocument(pageId){
    showView('McmDoc');
    const el = document.getElementById('viewMcmDoc');
    el.innerHTML = backToReservedBtn() + '<div class="panel"><h2 class="form-title">MCM</h2><p class="form-sub">Loading…</p></div>';
    document.getElementById('resBackBtn').onclick = ()=> renderReservedMenu();
    const doc = await loadMcmDocument();
    if(!doc.pages.length) return;
    if(pageId) mcmCurrentPageId = pageId;
    if(!mcmCurrentPageId || !mcmFindPage(doc, mcmCurrentPageId)) mcmCurrentPageId = doc.pages[0].id;
    mcmEditingPage = false;
    mcmPublishPanelOpen = false;
    mcmPaintDocument(doc);
  }

  function mcmPaintDocument(doc){
    const el = document.getElementById('viewMcmDoc');
    if(!el) return;
    const idx = mcmPageIndex(doc, mcmCurrentPageId);
    const page = doc.pages[idx];
    const pendingCount = (doc.pendingPageIds||[]).length;

    const pageOptions = doc.pages.map(p=>
      '<option value="'+p.id+'" '+(p.id===page.id?'selected':'')+'>'+
        escapeHTML(p.label)+(p.heading?(' — '+escapeHTML(p.heading)):'')+
        ((doc.pendingPageIds||[]).includes(p.id)?' (editing…)':'')+
      '</option>'
    ).join('');

    el.innerHTML =
      backToReservedBtn() +
      '<div class="panel">' +
        '<h2 class="form-title">MCM — Maintenance Control Manual</h2>' +
        '<p class="form-sub">Editable, revision-controlled copy of the manual. Edits are saved as drafts until you Publish a Revision, which stamps the revision number/date on just the pages you changed and marks them with a change bar.</p>' +
        '<div class="mcm-toolbar">' +
          '<button type="button" class="btn small" id="mcmPrevBtn" '+(idx<=0?'disabled':'')+'>‹ Prev</button>' +
          '<select id="mcmPageSelect">'+pageOptions+'</select>' +
          '<button type="button" class="btn small" id="mcmNextBtn" '+(idx>=doc.pages.length-1?'disabled':'')+'>Next ›</button>' +
          '<span style="margin-left:auto;"></span>' +
          '<button type="button" class="btn small" id="mcmPrintPageBtn">🖨 Print this page</button>' +
          '<button type="button" class="btn small" id="mcmPrintAllBtn">🖨 Print entire manual</button>' +
          '<button type="button" class="btn small" id="mcmEditToggleBtn">'+(mcmEditingPage?'Done editing':'✏️ Edit this page')+'</button>' +
          '<button type="button" class="btn primary small" id="mcmPublishBtn">📌 Publish Revision'+(pendingCount?('<span class="mcm-badge">'+pendingCount+'</span>'):'')+'</button>' +
        '</div>' +
        (mcmPublishPanelOpen ? mcmPublishPanelHtml(doc) : '') +
        '<div class="mcm-meta-bar">' +
          '<span><b>Page:</b> '+escapeHTML(page.label)+'</span>' +
          '<span><b>Revision:</b> '+escapeHTML(page.revision)+'</span>' +
          '<span><b>Revision Date:</b> '+escapeHTML(page.revisionDate)+'</span>' +
          (page.heading?('<span><b>Section:</b> '+escapeHTML(page.heading)+'</span>'):'') +
          ((doc.pendingPageIds||[]).includes(page.id)?'<span style="color:var(--warn);font-weight:800;">● unpublished edits on this page</span>':'') +
        '</div>' +
        '<div class="mcm-page" id="mcmPageBody"></div>' +
      '</div>';

    mcmPaintPageBody(doc, page);

    document.getElementById('resBackBtn').onclick = ()=> renderReservedMenu();
    document.getElementById('mcmPrevBtn').onclick = ()=>{ if(idx>0){ mcmCurrentPageId = doc.pages[idx-1].id; mcmEditingPage=false; mcmPublishPanelOpen=false; mcmPaintDocument(doc); } };
    document.getElementById('mcmNextBtn').onclick = ()=>{ if(idx<doc.pages.length-1){ mcmCurrentPageId = doc.pages[idx+1].id; mcmEditingPage=false; mcmPublishPanelOpen=false; mcmPaintDocument(doc); } };
    document.getElementById('mcmPageSelect').onchange = (e)=>{ mcmCurrentPageId = e.target.value; mcmEditingPage=false; mcmPublishPanelOpen=false; mcmPaintDocument(doc); };
    document.getElementById('mcmPrintPageBtn').onclick = ()=> mcmPrintPage(doc, page);
    document.getElementById('mcmPrintAllBtn').onclick = ()=> mcmPrintManual(doc);
    document.getElementById('mcmEditToggleBtn').onclick = ()=>{ mcmEditingPage = !mcmEditingPage; mcmPaintPageBody(doc, doc.pages[mcmPageIndex(doc,mcmCurrentPageId)]); document.getElementById('mcmEditToggleBtn').textContent = mcmEditingPage?'Done editing':'✏️ Edit this page'; };
    document.getElementById('mcmPublishBtn').onclick = ()=>{ mcmPublishPanelOpen = !mcmPublishPanelOpen; mcmPaintDocument(doc); };
    if(mcmPublishPanelOpen) mcmWirePublishPanel(doc);
  }

  function mcmPublishPanelHtml(doc){
    const nextNo = (doc.lastAmendmentNo||0)+1;
    const pendingCount = (doc.pendingPageIds||[]).length;
    const pendingLabels = (doc.pendingPageIds||[]).map(id=>{ const p = mcmFindPage(doc,id); return p?p.label:id; }).join(', ');
    return (
      '<div class="mcm-publish-panel">' +
        (pendingCount
          ? ('<p style="margin:0 0 6px;font-size:12.5px;"><b>'+pendingCount+' page(s)</b> have unpublished edits: '+escapeHTML(pendingLabels)+'. Publishing will stamp these with the new revision # and date, and clear the change bar from every other page.</p>')
          : '<p style="margin:0 0 6px;font-size:12.5px;">No pages have unpublished edits yet — edit a page first, or publish anyway to record a no-change amendment entry.</p>'
        ) +
        '<label>Amendment / Revision #</label><input type="number" id="mcmAmendNo" value="'+nextNo+'" style="width:100px;">' +
        '<label>Date</label><input type="date" id="mcmAmendDate" value="'+todayISO()+'">' +
        '<div class="btn-row" style="margin-top:10px;">' +
          '<button type="button" class="btn primary small" id="mcmConfirmPublishBtn">Confirm Publish</button>' +
          '<button type="button" class="btn small" id="mcmCancelPublishBtn">Cancel</button>' +
        '</div>' +
      '</div>'
    );
  }
  function mcmWirePublishPanel(doc){
    document.getElementById('mcmCancelPublishBtn').onclick = ()=>{ mcmPublishPanelOpen=false; mcmPaintDocument(doc); };
    document.getElementById('mcmConfirmPublishBtn').onclick = async ()=>{
      const amendNo = parseInt(document.getElementById('mcmAmendNo').value,10);
      const dateIso = document.getElementById('mcmAmendDate').value;
      if(!amendNo || !dateIso){ alert('Please provide both an amendment number and a date.'); return; }
      await mcmPublishRevision(doc, { amendmentNo:amendNo, date:dateIso });
      mcmPublishPanelOpen = false;
      mcmPaintDocument(doc);
    };
  }

  async function mcmPublishRevision(doc, opts){
    const niceDate = fmtDateNice(opts.date);
    const pending = doc.pendingPageIds||[];
    const changedLabels = [];
    doc.pages.forEach(p=>{
      if(pending.includes(p.id)){
        p.revision = String(opts.amendmentNo);
        p.revisionDate = niceDate;
        p.changedInCurrentRevision = true;
        changedLabels.push(p.label);
      } else {
        p.changedInCurrentRevision = false;
      }
    });
    if(!Array.isArray(doc.amendments)) doc.amendments = [];
    doc.amendments.push({
      amendmentNo: opts.amendmentNo,
      dateIssued: niceDate,
      dateReceived: '',
      dateInserted: '',
      insertedBy: '',
      pagesChanged: changedLabels,
    });
    doc.lastAmendmentNo = opts.amendmentNo;
    doc.pendingPageIds = [];
    await saveMcmDocument(doc);
  }

  function mcmPaintPageBody(doc, page){
    const body = document.getElementById('mcmPageBody');
    if(!body) return;
    const changed = !!page.changedInCurrentRevision;

    if(page.generated==='amendmentCert'){
      body.innerHTML = '<div class="mcm-generated-note">This page is generated automatically from the most recent published amendment — it is not edited directly.</div>' + mcmCertificationOfAmendmentsHtml(doc);
      return;
    }

    let html = '';
    if(page.isCertificationPage){
      html += '<div class="mcm-cert-scan">';
      if(page.certificationImage){
        html += '<img src="'+page.certificationImage+'" alt="Signed certification page scan">';
        html += '<div class="btn-row"><button type="button" class="btn small" id="mcmRemoveScanBtn">Remove scan (use typed text below)</button></div>';
      } else {
        html += '<p class="mcm-generated-note">No signed scan uploaded yet — showing the typed certification text below.</p>';
        html += '<div class="btn-row"><label class="btn small" style="cursor:pointer;">Upload signed scan<input type="file" accept="image/*,application/pdf" id="mcmCertScanInput" style="display:none;"></label></div>';
      }
      html += '</div>';
      if(page.certificationImage){
        body.innerHTML = html;
        document.getElementById('mcmRemoveScanBtn').onclick = async ()=>{
          page.certificationImage = null;
          await saveMcmDocument(doc);
          mcmPaintPageBody(doc, page);
        };
        return;
      }
    }

    if(mcmEditingPage){
      html += (page.blocks||[]).map((b,i)=> mcmBlockEditHtml(b, i, doc)).join('');
      html +=
        '<div class="mcm-add-block-row">' +
          '<span>Add block:</span>' +
          '<button type="button" class="btn small" data-add="heading">+ Heading</button>' +
          '<button type="button" class="btn small" data-add="subheading">+ Subheading</button>' +
          '<button type="button" class="btn small" data-add="paragraph">+ Paragraph</button>' +
          '<button type="button" class="btn small" data-add="table">+ Table</button>' +
          '<button type="button" class="btn small" data-add="image">+ Image</button>' +
        '</div>';
      body.innerHTML = html;
      mcmWireEditBody(doc, page);
    } else {
      html += (page.blocks||[]).map(b=> mcmBlockViewHtml(b, changed, doc)).join('');
      if(!html) html = '<p class="mcm-generated-note">This page has no content blocks yet.</p>';
      body.innerHTML = html;
      if(page.isCertificationPage && !page.certificationImage){
        const input = document.getElementById('mcmCertScanInput');
        if(input) input.onchange = ()=> mcmHandleScanUpload(doc, page, input);
      }
    }
  }

  function mcmHandleScanUpload(doc, page, input){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      page.certificationImage = reader.result;
      await saveMcmDocument(doc);
      mcmPaintPageBody(doc, page);
    };
    reader.readAsDataURL(file);
  }

  function mcmWireEditBody(doc, page){
    const body = document.getElementById('mcmPageBody');

    body.querySelectorAll('.mcm-edit-textarea').forEach(ta=>{
      ta.addEventListener('change', async ()=>{
        const i = parseInt(ta.dataset.idx,10);
        page.blocks[i].html = ta.value;
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPatchPendingBadge(doc);
      });
    });
    body.querySelectorAll('input[type="text"][data-r]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const i = parseInt(inp.dataset.idx,10), r = parseInt(inp.dataset.r,10), c = parseInt(inp.dataset.c,10);
        page.blocks[i].rows[r][c] = inp.value;
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPatchPendingBadge(doc);
      });
    });
    body.querySelectorAll('.mcm-img-replace-input').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const i = parseInt(inp.dataset.idx,10);
        const file = inp.files && inp.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async ()=>{
          page.blocks[i].src = reader.result;
          mcmMarkPending(doc, page.id);
          await saveMcmDocument(doc);
          mcmPaintPageBody(doc, page);
        };
        reader.readAsDataURL(file);
      });
    });
    body.querySelectorAll('.mcm-fmt-btn[data-action="wrap"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        const tag = btn.dataset.tag;
        const ta = body.querySelector('textarea[data-idx="'+i+'"]');
        const s = ta.selectionStart, e = ta.selectionEnd;
        if(s===e) return;
        const before = ta.value.slice(0,s), sel = ta.value.slice(s,e), after = ta.value.slice(e);
        ta.value = before+'<'+tag+'>'+sel+'</'+tag+'>'+after;
        page.blocks[i].html = ta.value;
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPatchPendingBadge(doc);
      };
    });
    body.querySelectorAll('[data-action="delblock"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        if(!confirm('Remove this block from the page?')) return;
        page.blocks.splice(i,1);
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPaintPageBody(doc, page);
      };
    });
    body.querySelectorAll('[data-action="addrow"]').forEach(btn=>{
      btn.onclick = async ()=>{
        const i = parseInt(btn.dataset.idx,10);
        const cols = (page.blocks[i].rows[0]||['']).length || 1;
        page.blocks[i].rows.push(new Array(cols).fill(''));
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPaintPageBody(doc, page);
      };
    });
    body.querySelectorAll('[data-add]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!Array.isArray(page.blocks)) page.blocks = [];
        page.blocks.push(mcmEmptyBlock(btn.dataset.add));
        mcmMarkPending(doc, page.id);
        await saveMcmDocument(doc);
        mcmPaintPageBody(doc, page);
      };
    });
  }

  function mcmPatchPendingBadge(doc){
    const btn = document.getElementById('mcmPublishBtn');
    if(!btn) return;
    const n = (doc.pendingPageIds||[]).length;
    btn.innerHTML = '📌 Publish Revision'+(n?('<span class="mcm-badge">'+n+'</span>'):'');
    const sel = document.getElementById('mcmPageSelect');
    if(sel){
      Array.from(sel.options).forEach(opt=>{
        const p = mcmFindPage(doc, opt.value);
        if(!p) return;
        const pending = (doc.pendingPageIds||[]).includes(p.id);
        opt.textContent = p.label + (p.heading?(' — '+p.heading):'') + (pending?' (editing…)':'');
      });
    }
  }

  // Per-pilot qualification/training overlay, keyed by pilot NAME so it joins directly onto the
  // shared roster at state.settings.pilots (Settings → Pilots). This is what makes "is this pilot
  // linked to Settings" actually true: the grid is built by walking state.settings.pilots and
  // looking up each name here, rather than keeping a second, separately-typed pilot list.
  function ptrainEmptyStatus(){ return { ec120:false,h130:false,as350b2:false,as350b3:false,as355:false,ec135:false,trainingDate:'',exEmployee:false,licence:'' }; }
  function ptrainNormalizeName(n){ return (n||'').replace(/\s*\([^)]*\)\s*$/, '').trim(); }
  // Historical status entries (saved before the AS350B2/B3 split) only ever had a single "as350" flag --
  // fold it forward onto BOTH new sub-model flags (never distinguished at the time, so this is the only
  // safe default) whenever the new flags aren't already present. Read-side only; a real save via the
  // roster grid persists the split flags going forward.
  function ptrainMigrateStatusEntry(st){
    if(st && st.as350 && st.as350b2===undefined && st.as350b3===undefined){
      st = Object.assign({}, st, { as350b2:true, as350b3:true });
    }
    return st;
  }
  function ptrainMergeStatus(a,b){
    a = ptrainMigrateStatusEntry(a); b = ptrainMigrateStatusEntry(b);
    return {
      ec120: !!(a.ec120||b.ec120), h130: !!(a.h130||b.h130), as350b2: !!(a.as350b2||b.as350b2), as350b3: !!(a.as350b3||b.as350b3),
      as355: !!(a.as355||b.as355), ec135: !!(a.ec135||b.ec135),
      exEmployee: !!(a.exEmployee||b.exEmployee),
      trainingDate: [a.trainingDate,b.trainingDate].filter(Boolean).sort().pop() || '',
      licence: a.licence || b.licence || '',
    };
  }
  let ptrainPilotStatusCache = null;
  async function loadPtrainPilotStatus(){
    if(ptrainPilotStatusCache) return ptrainPilotStatusCache;
    try{
      const raw = await storageGet('ptrain:pilotStatus');
      if(raw){ ptrainPilotStatusCache = JSON.parse(raw); return ptrainPilotStatusCache; }
    }catch(e){}
    // one-time migration: fold the old flat "ptrain:pilots" list into this name-keyed overlay,
    // merging any duplicate names (e.g. "Steve Harmer" / "Steve Harmer (135)") into one entry.
    let source = null;
    try{
      const rawOld = await storageGet('ptrain:pilots');
      if(rawOld) source = JSON.parse(rawOld);
    }catch(e){}
    if(!source) source = ptrainDefaultPilots();
    const map = {};
    source.forEach(p=>{
      const key = ptrainNormalizeName(p.name);
      if(!key) return;
      const entry = { ec120:!!p.ec120, h130:!!p.h130, as350b2:!!p.as350, as350b3:!!p.as350, as355:!!p.as355, ec135:!!p.ec135, trainingDate:p.trainingDate||'', exEmployee:!!p.exEmployee, licence:p.licence||'' };
      map[key] = map[key] ? ptrainMergeStatus(map[key], entry) : entry;
    });
    ptrainPilotStatusCache = map;
    await storageSet('ptrain:pilotStatus', JSON.stringify(map));
    return ptrainPilotStatusCache;
  }
  async function savePtrainPilotStatus(map){ ptrainPilotStatusCache = map; await storageSet('ptrain:pilotStatus', JSON.stringify(map)); }

  // The grid's row list: every pilot in Settings → Pilots (linked:true), plus any name tracked here
  // that Settings doesn't know about (linked:false) so nothing already on file gets silently dropped.
  async function ptrainBuildRoster(){
    const status = await loadPtrainPilotStatus();
    const sharedRaw = (state.settings.pilots||[]);
    // guard against an accidental exact-duplicate name in Settings -> Pilots itself (same overlay
    // key either way, so this only affects how many rows are shown, not the underlying data) —
    // the extra Settings row should still be deleted there via Settings -> Pilots.
    const seenNames = new Set();
    const shared = sharedRaw.filter(p=>{
      if(!p.name) return true;
      if(seenNames.has(p.name)) return false;
      seenNames.add(p.name);
      return true;
    });
    const sharedNames = shared.map(p=>p.name);
    const rows = shared.map(p=>{
      const st = ptrainMigrateStatusEntry(status[p.name] || ptrainEmptyStatus());
      return Object.assign({}, ptrainEmptyStatus(), st, { name:p.name, licence: st.licence || p.license || '', linked:true });
    });
    Object.keys(status).forEach(name=>{
      if(!sharedNames.includes(name)){
        rows.push(Object.assign({}, ptrainEmptyStatus(), ptrainMigrateStatusEntry(status[name]), { name, linked:false }));
      }
    });
    return rows;
  }
  function ptrainRowToStatus(r){
    return { ec120:!!r.ec120, h130:!!r.h130, as350b2:!!r.as350b2, as350b3:!!r.as350b3, as355:!!r.as355, ec135:!!r.ec135, trainingDate:r.trainingDate||'', exEmployee:!!r.exEmployee, licence:r.licence||'' };
  }
  async function ptrainPersistRows(rows){
    const map = {};
    rows.forEach(r=>{ if(r.name && r.name.trim()) map[r.name.trim()] = ptrainRowToStatus(r); });
    await savePtrainPilotStatus(map);
  }

  async function loadPtrainRecords(){
    if(ptrainRecordsCache) return ptrainRecordsCache;
    try{
      const raw = await storageGet('ptrain:records');
      if(raw){ ptrainRecordsCache = JSON.parse(raw); return ptrainRecordsCache; }
    }catch(e){}

    try{

      const data = await res.json();
      ptrainRecordsCache = data;
      await storageSet('ptrain:records', JSON.stringify(data));

  async function savePtrainRecords(list){ ptrainRecordsCache = list; return await storageSet('ptrain:records', JSON.stringify(list)); }

  function ptrainNextId(records){
    let max = 0;
    records.forEach(r=>{ if(typeof r.id==='number' && r.id>max) max = r.id; });
    return max+1;
  }
  function ptrainDueInfo(trainingDateISO){
    if(!trainingDateISO) return { days:null, cls:'' };
    const due = new Date(trainingDateISO+'T00:00:00');
    due.setFullYear(due.getFullYear()+1);
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((due - today) / 86400000);
    let cls = 'ok';
    if(days < 0) cls = 'bad'; else if(days < 30) cls = 'warn';
    return { days, cls };
  }

  // ---------- checklist builders for the entry form (show everything; uncheck what doesn't apply) ----------
  // A saved record's task is matched back to the master task by MCM key (appendix+num) whenever both sides
  // have one -- NOT by text -- so re-wording a task in Manage (i.e. revising the MCM) never orphans a
  // previously-checked box. Older saved records made before this only ever stored {text}, so those still
  // fall back to a text match for backward compatibility.
  function ptrainTaskKey(t){ return (t && t.appendix && t.num!=null) ? (t.appendix+'|'+t.num) : null; }
  // A record's task matches a master task by MCM key (appendix+num) when BOTH sides have one; otherwise
  // falls back to a text match. This is what makes an old record (saved before keys existed, so it only
  // has {text}) still line up correctly with a master list that now carries keys.
  function ptrainTaskMatches(rt, t, key){
    const rtKey = ptrainTaskKey(rt);
    if(rtKey && key) return rtKey===key;
    return rt.text===t.text;
  }
  // Shared by the Training Card's "Print Full Report" handler: splits the checklist into the numbered
  // manual items (grouped/sorted by Appendix+#, used on the Hb/Hc pages) and the un-numbered "Additional"
  // items (their own section on the report).
  function ptrainComputeManualItems(taskItems){
    const manualItems = [];
    taskItems.forEach(item=>{ if(item.appendix) manualItems.push(item); });
    manualItems.sort((a,b)=>{
      if(a.appendix !== b.appendix) return a.appendix < b.appendix ? -1 : 1;
      return String(a.num).localeCompare(String(b.num), undefined, {numeric:true});
    });
    const extraTasks = taskItems.filter(i=>!i.appendix);
    return { manualItems, extraTasks };
  }
  function ptrainBuildTaskChecklist(masterTasks, existingRecordTasks){
    const matchedKeys = new Set(), matchedText = new Set();
    const items = masterTasks.map(t=>{
      const key = ptrainTaskKey(t);
      let checked = false;
      if(existingRecordTasks){
        checked = existingRecordTasks.some(rt=> ptrainTaskMatches(rt, t, key));
        if(checked){ if(key) matchedKeys.add(key); matchedText.add(t.text); }
      } else {
        checked = (t.num!=null); // current numbered items on by default; legacy "Additional" items off by default
      }
      const cardText = t.cardText || t.text;
      return { text:t.text, cardText, label:(t.num!=null?(t.num+'. '):'')+cardText, cat:t.category||'Other', checked, extra:false, isAdditionalCategory:(t.num==null), appendix:t.appendix||'', num:t.num };
    });
    if(existingRecordTasks){
      existingRecordTasks.forEach(rt=>{
        const rtKey = ptrainTaskKey(rt);
        const already = (rtKey && matchedKeys.has(rtKey)) || matchedText.has(rt.text);
        if(!already) items.push({ text:rt.text, cardText: rt.cardText||rt.text, label:rt.text, cat:'Other (as recorded)', checked:true, extra:true, wasAdditional: !!rt.additional, appendix:rt.appendix||'', num:rt.num!=null?rt.num:null });
      });
    }
    return items;
  }
  // manualOverride stays null until the user actually clicks the checkbox — while it's null the
  // checked state simply follows whichever A/C Type(s) are selected, so ticking a new A/C Type
  // auto-selects the ADs tagged for it (and clears again if the type is unchecked), live.
  function ptrainInitAdState(masterAds, existingRecordAds, existingRecordAdsExcluded){
    const st = {};
    masterAds.filter(a=>!a.archived).forEach(a=>{
      let manualOverride = null;
      if(existingRecordAds && existingRecordAds.some(ra=>ra.text===a.text)) manualOverride = true;
      else if(existingRecordAdsExcluded && existingRecordAdsExcluded.includes(a.text)) manualOverride = false;
      st[a.text] = { manualOverride, extra:false };
    });
    if(existingRecordAds){
      existingRecordAds.forEach(ra=>{
        if(!(ra.text in st)) st[ra.text] = { manualOverride:true, extra:true, wasAdditional: !!ra.additional };
      });
    }
    return st;
  }
