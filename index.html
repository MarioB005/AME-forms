  // ---------- EC120 Tail Rotor Balancing (VIBREX 177 M6 / ROTORTUNER / VIBREX 2000 / CHADWICK 8500C+) ----------
  // Digitizes AMM 64-21-00,5-1 "Balancing - Tail Rotor Hub" (EC120). Unlike the EC130 procedure, the
  // EC120 hub has 8 balance points 45 deg apart, and the AMM's own method is a discretized sector
  // chart rather than a continuous phase interpolation: each 45 deg gap between two adjacent points is
  // split into exact thirds, and depending on where the measured (corrected) phase falls, the
  // correction is applied as a single point, as two points each independently loaded with the same
  // charted weight ("2 symmetrical points"), or as two points loaded 2:1 ("3 asymmetrical points" --
  // the AMM's own name for this refers to the three-digit sector label, e.g. "3/4/4", not to three
  // distinct points). Landing exactly on a point's own position is the single-point case.
  //
  // The three amplitude -> weight lines on the AMM's chart (Figure 1 Sheet 3) are rebuilt as three
  // separately-calibrated straight lines anchored on the AMM's own three worked examples:
  //   1 point:            0.5 ips  -> 1.2 g
  //   2 symmetrical:      0.65 ips -> 0.75 g (installed at EACH of the two points independently)
  //   3 asymmetrical:     0.5 ips  -> 0.4 g "unit" (the doubled point gets 2x this)
  // As with the EC130 tool, the weight -> washer-part-number step is left to the AME: washers can be
  // trimmed by grinding in 0.01 g steps, so this tool states the exact target weight per point and
  // lets the AME enter the actual total left installed there (which can be lower than the current
  // total if material is removed rather than added). This is a maintenance aid, not a substitute for
  // the approved AMM procedure -- always follow the current AMM for the actual job.
  const ECTRB120_POINTS = ['1','2','3','4','5','6','7','8'];
  // Walking order around the hub, 45 deg (90 min) apart. Anchored on the AMM's own example (Point 4
  // sits exactly at phase 12h45 = 45 min with a calibration offset of 0); the rest follow from "from
  // Point 1, clockwise, other points numbered 2 to 8" at even 90-minute spacing. Confirmed against
  // the AMM's other two examples (Point 3 / Point 4 symmetric boundary at exactly 12h00, and the
  // stated opposite pairs 3<->7 and 4<->8, both exactly 360 min apart with this mapping).
  const ECTRB120_POINT_SEQ = ['1','2','3','4','5','6','7','8','1'];
  const ECTRB120_POINT_POS_MIN = { '1':495, '2':585, '3':675, '4':45, '5':135, '6':225, '7':315, '8':405 };
  const ECTRB120_UNBALANCE_THRESHOLD_IPS = 0.05;
  // g per ips, from the AMM's own three worked examples.
  const ECTRB120_PURE_SLOPE = 1.2 / 0.5;      // 1-point line
  const ECTRB120_SYM_SLOPE = 0.75 / 0.65;     // 2-symmetrical-points line (per point)
  const ECTRB120_ASYM_UNIT_SLOPE = 0.4 / 0.5; // 3-asymmetrical-points line ("unit"; doubled point = 2x)

  function ectrb120BlankPoints(){
    const pts = {};
    ECTRB120_POINTS.forEach(p=>{ pts[p] = { currentG: 0 }; });
    return pts;
  }
  function ectrb120NewJob(){
    return { reg:'', date: todayISO(), ame:'', points: ectrb120BlankPoints(), runs: [] };
  }
  function ectrb120NormalizePoint(pt){
    if(!pt) return { currentG: 0 };
    if(typeof pt.currentG === 'number') return pt;
    return { currentG: trbRound2(pt.existingG||0) };
  }
  function ectrb120PointTotalG(pt){ return trbRound2(pt.currentG||0); }

  // Splits the 45 deg gap between two adjacent points into exact thirds: the outer thirds go to the
  // nearer point at double weight ("3 asymmetrical points"), the middle third is the "2 symmetrical
  // points" case, and landing exactly on a point (f essentially 0) is the single-point case.
  function ectrb120Bracket(correctedMin){
    const shifted = ((correctedMin - 495) % 720 + 720) % 720;
    let k = Math.floor(shifted / 90);
    if(k > 7) k = 7;
    if(k < 0) k = 0;
    const r = shifted - k*90;
    return { lowerPoint: ECTRB120_POINT_SEQ[k], upperPoint: ECTRB120_POINT_SEQ[k+1], f: r/90 };
  }
  function ectrb120Analyze(ampIps, rawPhaseMin, calOffsetMin, job){
    const correctedMin = trbApplyCalOffset(rawPhaseMin, calOffsetMin);
    if(ampIps <= ECTRB120_UNBALANCE_THRESHOLD_IPS){
      return { balanced:true, correctedMin: correctedMin };
    }
    const br = ectrb120Bracket(correctedMin);
    let regime, targets; // targets: [{point, targetAddG}]
    if(br.f < 1e-6){
      regime = 'pure';
      targets = [ { point: br.lowerPoint, targetAddG: trbRound2(ampIps * ECTRB120_PURE_SLOPE) } ];
    } else if(br.f < 1/3){
      regime = 'asym';
      targets = [
        { point: br.lowerPoint, targetAddG: trbRound2(2 * ampIps * ECTRB120_ASYM_UNIT_SLOPE) },
        { point: br.upperPoint, targetAddG: trbRound2(1 * ampIps * ECTRB120_ASYM_UNIT_SLOPE) },
      ];
    } else if(br.f <= 2/3){
      regime = 'sym';
      const g = trbRound2(ampIps * ECTRB120_SYM_SLOPE);
      targets = [ { point: br.lowerPoint, targetAddG: g }, { point: br.upperPoint, targetAddG: g } ];
    } else {
      regime = 'asym';
      targets = [
        { point: br.upperPoint, targetAddG: trbRound2(2 * ampIps * ECTRB120_ASYM_UNIT_SLOPE) },
        { point: br.lowerPoint, targetAddG: trbRound2(1 * ampIps * ECTRB120_ASYM_UNIT_SLOPE) },
      ];
    }
    const points = targets.map(t=>{
      const currentTotal = trbRound2((job.points[t.point]||{}).currentG||0);
      const suggestedTotal = trbRound2(currentTotal + t.targetAddG);
      return { point: t.point, targetAddG: t.targetAddG, currentTotal: currentTotal, suggestedTotal: suggestedTotal };
    });
    return { balanced:false, correctedMin: correctedMin, regime: regime, points: points };
  }
  function ectrb120RegimeLabel(a){
    if(a.regime==='pure') return 'Single point';
    if(a.regime==='sym') return '2 symmetrical points';
    if(a.regime==='asym') return '3 asymmetrical points (Point '+a.points[0].point+' doubled)';
    return '';
  }

  // ---------- automatic clock-angle calibration ----------
  // Same method as the EC130 tool (see trbAutoCalOffset): the offset needed to rotate two raw
  // readings into the hub's own reference frame is solved for from angles alone, independent of any
  // amplitude mismatch. Because EC120's suggested corrections can be sized off three different
  // calibration lines (pure/symmetrical/asymmetrical) depending on how the load is split, but a gram
  // of tuning washer at a given point has one single physical effect regardless of which line was
  // used to decide to put it there, the correction vector for this calibration step always uses the
  // 1-point line's gram<->ips relationship as the common physical reference -- an approximation where
  // the three lines don't already agree exactly, but the most direct one available from the AMM.
  function ectrb120CorrectionVectorXY(points){
    let x = 0, y = 0;
    (points||[]).forEach(p=>{
      const delta = (p.actualTotal||0) - (p.previousTotal||0);
      if(!delta) return;
      const v = trbPolarToXY(delta/ECTRB120_PURE_SLOPE, ECTRB120_POINT_POS_MIN[p.point]);
      x += v.x; y += v.y;
    });
    return { x: x, y: y };
  }
  function ectrb120AutoCalOffset(prevRun, newAmpIps, newRawPhaseMin){
    if(!prevRun || !prevRun.points || !prevRun.points.length) return null;
    if(newAmpIps==null || isNaN(newAmpIps) || newRawPhaseMin==null || isNaN(newRawPhaseMin)) return null;
    const before = trbPolarToXY(prevRun.ampIps, prevRun.rawPhaseMin);
    const after = trbPolarToXY(newAmpIps, newRawPhaseMin);
    const diff = { x: before.x - after.x, y: before.y - after.y };
    const angleDiff = trbXYToAngleMin(diff.x, diff.y);
    if(angleDiff === null) return null;
    const c = ectrb120CorrectionVectorXY(prevRun.points);
    const angleC = trbXYToAngleMin(c.x, c.y);
    if(angleC === null) return null;
    return ((angleC - angleDiff) % 720 + 720) % 720;
  }

  // ---------- EC135 Tail Rotor Balancing (device-independent, per AMM 18-11-00,5-2) ----------
  // Digitizes AMM 18-11-00,5-2 "Measurement of Unbalance - Tail Rotor" (EC135, without Balance/
  // Vibration Monitoring System). 6 balance bolts, 60° (2 clock-hours) apart. Unlike the EC130 tool
  // (which uses a simple linear-percentage split of a fixed total weight across the two nearest
  // points) and the EC120 tool (a discretized 3-regime sector chart), the EC135 AMM's own worksheet
  // describes a literal geometric construction on its polar chart: plot the measured amplitude/phase
  // as point M, draw a line through M parallel to one of the two adjacent bolt radii (Radius 1) to
  // find its intersection N with the other radius (Radius 2), then the length M-to-N gives the
  // weight for Radius 1's bolt and the length N-to-center gives the weight for Radius 2's bolt, both
  // via the chart's stated formula 1.2 g (0.04 oz) = 0.1 IPS. This is the standard decomposition of a
  // vector into two oblique (non-orthogonal) basis directions, so it's rebuilt here as exact
  // trigonometry rather than approximated as a simple percentage split -- the two target weights
  // don't have to add up to a fixed total the way the EC130 tool's do; a reading that falls exactly
  // between two bolts calls for a bit more combined weight than one landing right on a bolt, which is
  // the correct physical behaviour for this chart's actual construction.
  // As with the other tools in this family, the weight -> washer-part-number step (the AMM's own
  // washer table: washer 1=0.26g, 2=0.45g, 3=0.77g, 4=2.06g, bolt=5.45g) is left to the AME: washers
  // can be trimmed by grinding in 0.01 g steps, so this tool states the exact target weight per bolt
  // and lets the AME enter the actual total they leave installed there, which can be less than what's
  // currently there if material is removed rather than added. This is a maintenance aid, not a
  // substitute for the approved AMM procedure -- always follow the current AMM for the actual job.
  const ECTRB135_POINTS = ['1','2','3','4','5','6'];
  // Walking order clockwise from 12 o'clock, per the AMM's own polar chart (Figure 1: bolt 1 at
  // 12:00, then clockwise 6 at 2:00, 5 at 4:00, 4 at 6:00, 3 at 8:00, 2 at 10:00, back to 1).
  const ECTRB135_POINT_SEQ = ['1','6','5','4','3','2','1'];
  const ECTRB135_POINT_POS_MIN = { '1':0, '6':120, '5':240, '4':360, '3':480, '2':600 };
  const ECTRB135_UNBALANCE_THRESHOLD_IPS = 0.05;
  // g per ips, printed directly on the AMM's own chart: "1.2 g per 0.1 ips".
  const ECTRB135_SLOPE_G_PER_IPS = 1.2 / 0.1;
  // The angle (in the same 720-minutes-per-circle units as trbPolarToXY/trbXYToAngleMin) between two
  // adjacent bolts: 120 minutes = 60°.
  const ECTRB135_BRACKET_MIN = 120;

  function ectrb135BlankPoints(){
    const pts = {};
    ECTRB135_POINTS.forEach(p=>{ pts[p] = { currentG: 0 }; });
    return pts;
  }
  function ectrb135NewJob(){
    return { reg:'', date: todayISO(), ame:'', points: ectrb135BlankPoints(), runs: [] };
  }
  function ectrb135NormalizePoint(pt){
    if(!pt) return { currentG: 0 };
    if(typeof pt.currentG === 'number') return pt;
    return { currentG: trbRound2(pt.existingG||0) };
  }
  function ectrb135PointTotalG(pt){ return trbRound2(pt.currentG||0); }

  function ectrb135Bracket(correctedMin){
    let k = Math.floor(correctedMin / ECTRB135_BRACKET_MIN);
    if(k > 5) k = 5;
    if(k < 0) k = 0;
    const r = correctedMin - k*ECTRB135_BRACKET_MIN;
    return { lowerPoint: ECTRB135_POINT_SEQ[k], upperPoint: ECTRB135_POINT_SEQ[k+1], offsetMin: r };
  }
  // Decomposes the measured (amplitude, corrected phase) reading into the two oblique weight
  // components at the bracket's two adjacent bolts, exactly matching the AMM's "draw a parallel
  // line... measure the length" construction: w_lower = r*sin(gamma-phi)/sin(gamma), w_upper =
  // r*sin(phi)/sin(gamma), where gamma is the 60° angle between adjacent bolts and phi is how far
  // (in angle) the reading has moved from the lower bolt toward the upper one.
  function ectrb135Analyze(ampIps, rawPhaseMin, calOffsetMin, job){
    const correctedMin = trbApplyCalOffset(rawPhaseMin, calOffsetMin);
    if(ampIps <= ECTRB135_UNBALANCE_THRESHOLD_IPS){
      return { balanced:true, correctedMin: correctedMin };
    }
    const br = ectrb135Bracket(correctedMin);
    const gammaRad = ECTRB135_BRACKET_MIN * Math.PI/360;
    const phiRad = br.offsetMin * Math.PI/360;
    const sinGamma = Math.sin(gammaRad);
    const wLowerIps = ampIps * Math.sin(gammaRad - phiRad) / sinGamma;
    const wUpperIps = ampIps * Math.sin(phiRad) / sinGamma;
    const cand = [
      { point: br.lowerPoint, addIps: wLowerIps },
      { point: br.upperPoint, addIps: wUpperIps },
    ].filter(c => trbRound2(c.addIps * ECTRB135_SLOPE_G_PER_IPS) > 0);
    const points = cand.map(c=>{
      const targetAddG = trbRound2(c.addIps * ECTRB135_SLOPE_G_PER_IPS);
      const currentTotal = trbRound2((job.points[c.point]||{}).currentG||0);
      const suggestedTotal = trbRound2(currentTotal + targetAddG);
      return { point: c.point, targetAddG: targetAddG, currentTotal: currentTotal, suggestedTotal: suggestedTotal };
    });
    return { balanced:false, correctedMin: correctedMin, points: points };
  }

  // ---------- automatic clock-angle calibration ----------
  // Same method as the EC130/EC120 tools (see trbAutoCalOffset): the offset needed to rotate two raw
  // readings into the hub's own reference frame is solved for from angles alone. EC135 has a single
  // slope (unlike EC120's three regimes), so the conversion from a confirmed weight change back to an
  // "ips-equivalent" vector is exact, not an approximation.
  function ectrb135CorrectionVectorXY(points){
    let x = 0, y = 0;
    (points||[]).forEach(p=>{
      const delta = (p.actualTotal||0) - (p.previousTotal||0);
      if(!delta) return;
      const v = trbPolarToXY(delta/ECTRB135_SLOPE_G_PER_IPS, ECTRB135_POINT_POS_MIN[p.point]);
      x += v.x; y += v.y;
    });
    return { x: x, y: y };
  }
  function ectrb135AutoCalOffset(prevRun, newAmpIps, newRawPhaseMin){
    if(!prevRun || !prevRun.points || !prevRun.points.length) return null;
    if(newAmpIps==null || isNaN(newAmpIps) || newRawPhaseMin==null || isNaN(newRawPhaseMin)) return null;
    const before = trbPolarToXY(prevRun.ampIps, prevRun.rawPhaseMin);
    const after = trbPolarToXY(newAmpIps, newRawPhaseMin);
    const diff = { x: before.x - after.x, y: before.y - after.y };
    const angleDiff = trbXYToAngleMin(diff.x, diff.y);
    if(angleDiff === null) return null;
    const c = ectrb135CorrectionVectorXY(prevRun.points);
    const angleC = trbXYToAngleMin(c.x, c.y);
    if(angleC === null) return null;
    return ((angleC - angleDiff) % 720 + 720) % 720;
  }

                    }).join('; ');

                      '<td>'+r.runNumber+'</td>' +

                      '<td>'+(r.balanced ? '<span style="color:var(--good);font-weight:800;">BALANCED</span>' : '<span style="color:var(--warn);font-weight:800;">CORRECTION</span>')+'</td>' +
                      '<td>'+adj+'</td>' +
                    '</tr>';
                  }).join('') +

              '</table>' +
              '</div>'
            ) : '<p class="trb-note">No runs logged yet.</p>') +

      const ec135trbCalOffsetInput = document.getElementById('ec135trbCalOffset');
      if(ec135trbCalOffsetInput){
        ec135trbCalOffsetInput.addEventListener('change', ()=>{
          const v = parseFloat(ec135trbCalOffsetInput.value);

        });
      }
      const ec135trbCalOverrideBtn = document.getElementById('ec135trbCalOverrideBtn');
      if(ec135trbCalOverrideBtn){
        ec135trbCalOverrideBtn.onclick = ()=>{

      const ec135trbCalAutoBtn = document.getElementById('ec135trbCalAutoBtn');

      document.getElementById('ec135trbAnalyzeBtn').onclick = ()=>{
        const ampIps = parseFloat(document.getElementById('ec135trbAmp').value);

        if(isNaN(ampIps) || ampIps < 0){ alert('Please enter a valid measured amplitude (IPS).'); return; }
        if(isNaN(hour) || isNaN(minute)){ alert('Please enter a valid measured phase (hour and minute).'); return; }
        const rawPhaseMin = trbPhaseToMinutes(hour, minute);
        let calOffsetMin, calOffsetAuto;
        if(canAutoCalibrate && !calOffsetOverridden){
          const auto = ectrb135AutoCalOffset(lastRun, ampIps, rawPhaseMin);
          calOffsetMin = (auto!=null) ? Math.round(auto) : 0;
          calOffsetAuto = (auto!=null);
          if(auto==null){ calOffsetOverridden = true; manualCalOffsetMin = 0; calOffsetAutoFailed = true; }
        } else {
          calOffsetMin = parseFloat(document.getElementById('ec135trbCalOffset').value)||0;
          calOffsetAuto = false;
        }
        const analysis = ectrb135Analyze(ampIps, rawPhaseMin, calOffsetMin, job);
        pending = { ampIps: ampIps, rawPhaseMin: rawPhaseMin, calOffsetMin: calOffsetMin, calOffsetAuto: calOffsetAuto, analysis: analysis, actual: {} };
        if(!analysis.balanced){

  // ---------- Tail Rotor Drive Shaft / Fan Balancing (AS350 / EC130 T2 / AS355N) ----------
  // Merges what used to be a standalone AS350-only tool with two more digitized procedures (EC130 T2
  // AMM 65-11-00,5-1A "Balancing of the Tail Rotor Drive Line", and AS355N MET 65-10-00-604
  // "Balancing of the first section of the tail rotor drive shaft") behind one "Aircraft / system"
  // selector, since all three are the same family of procedure: 3 correction points 120° apart on a
  // drive-shaft flange, read off an oblique two-axis "draw a line parallel to the weight scale" chart,
  // with the clock-angle phase offset auto-solved from the run after a logged correction (same
  // principle as the EC130/EC120/EC135 tail-ROTOR balancing tools above -- this is the drive-SHAFT
  // family instead). EC130 T2 has two independent balancing planes (Bearing No.1 front, Bearing No.5
  // rear) that are both worked under one job; AS350 and AS355N each have a single plane.
  //
  // Every washer in all three procedures can be ground down to an exact weight (per the AME) rather
  // than picked from the printed catalog sizes, so -- unlike the tool's first version -- nothing here
  // suggests a nearest catalog size or P/N: only the grams to add or remove, which is what actually
  // needs grinding to.
  //
  // Point 1's own chart position and each chart's grams-per-ips scale aren't stated as plain numbers
  // in either manual, so they're solved once, algebraically, from each manual's own worked example --
  // never read off chart pixels. AS350's example (AMM F.3.c(3)(a): 0.8 ips @ 2 o'clock -> 2.3 g onto
  // point 1, 3.8 g onto point 2) and EC130 T2's own Bearing No.5 example (AMM F.10, the identical
  // washer catalog and the identical 2.3 g / 3.8 g result for the identical input) solve to the exact
  // same calibration, so that one calibration ("TDS_V2K_CAL") is shared by AS350, EC130 T2's Bearing
  // No.5, and AS355N (same washer catalog, same chart family, no worked example of its own in the MET
  // to solve separately). EC130 T2's Bearing No.1 has its own independent example (AMM F.11: the same
  // 0.8 ips @ 2 o'clock giving an even 3.8 g / 3.8 g split), solved separately below.
  function tdsCalibrateFromExample(A, thetaMin, w1, w2, deltaMin){
    const deltaRad = deltaMin * Math.PI/360;
    const ratio = w1/w2;
    const phi1Rad = Math.atan2(Math.sin(deltaRad), ratio + Math.cos(deltaRad));
    const phi1Min = phi1Rad * 360/Math.PI;
    const theta1Min = ((thetaMin - phi1Min) % 720 + 720) % 720;
    const phi2Min = deltaMin - phi1Min;
    const C = w1 / (A * Math.sin(phi2Min*Math.PI/360) / Math.sin(deltaRad));
    return { theta1Min: theta1Min, C: C };
  }
  const TDS_V2K_CAL = tdsCalibrateFromExample(0.8, 120, 2.3, 3.8, 240); // AS350 F.3.c(3)(a) / EC130 T2 F.10 (bearing No.5)
  const TDS_EC130_B1_CAL = tdsCalibrateFromExample(0.8, 120, 3.8, 3.8, 240); // EC130 T2 F.11 (bearing No.1)

  const TDS_POINTS = ['1','2','3'];
  const TDS_POINT_SEQ = ['1','2','3','1'];
  function tdsPointPos(theta1Min){
    return { '1': theta1Min, '2': (theta1Min+240)%720, '3': (theta1Min+480)%720 };
  }

  const TDS_TYPES = {
    as350: {
      label: 'AS350 (tail rotor drive shaft)',
      amm: 'AMM 65-11-00,5-1A',
      procedureLabel: 'Adjustment - Balancing of the tail rotor drive shaft - Tail drive line',
      aircraftTypes: ['AS350B2','AS350B3'],
      equipmentNote: 'VIBREX 2000 / CHADWICK 8500C+ / ROTORTUNER tuning equipment',
      planes: [
        { id:'main', label:'Tail rotor drive shaft', pointPos: tdsPointPos(TDS_V2K_CAL.theta1Min), slopeGPerIps: TDS_V2K_CAL.C,
          maxWeightG: 5.6, maxWeightRef: 'AMM F.4.a', minWeightRef: 'AMM E.4',
          thresholdDefaultIps: 0.1, thresholdMinIps: 0.1, thresholdMaxIps: 0.8, thresholdMaxRef: 'AMM F.4.b', ampMaxIps: 2.5 },
      ],
    },
    ec130t2: {
      label: 'EC130 T2 (tail rotor drive line)',
      amm: 'AMM 65-11-00,5-1A',
      procedureLabel: 'Adjustment - Balancing of the Tail Rotor Drive Line',
      aircraftTypes: ['H130'],
      equipmentNote: 'VIBREX 2000 / CHADWICK 8500C+ / ROTORTUNER tuning equipment',
      planes: [
        { id:'b1', label:'Bearing No. 1 (front)', pointPos: tdsPointPos(TDS_EC130_B1_CAL.theta1Min), slopeGPerIps: TDS_EC130_B1_CAL.C,
          maxWeightG: 5.6, maxWeightRef: 'AMM F.14', minWeightRef: 'AMM F.16',
          thresholdDefaultIps: 0.1, thresholdMinIps: 0.1, thresholdMaxIps: 0.2, thresholdMaxRef: 'AMM F.7', ampMaxIps: 1.8 },
        { id:'b5', label:'Bearing No. 5 (rear)', pointPos: tdsPointPos(TDS_V2K_CAL.theta1Min), slopeGPerIps: TDS_V2K_CAL.C,
          maxWeightG: 5.6, maxWeightRef: 'AMM F.14', minWeightRef: 'AMM F.16',
          thresholdDefaultIps: 0.1, thresholdMinIps: 0.1, thresholdMaxIps: 0.8, thresholdMaxRef: 'AMM F.7', ampMaxIps: 1.8 },
      ],
    },
    as355: {
      label: 'AS355N (tail rotor drive / fan shaft)',
      amm: 'MET 65-10-00-604',
      procedureLabel: 'Balancing of the first section of the tail rotor drive shaft - Tail rotor drive line',
      aircraftTypes: ['AS355'],
      equipmentNote: 'VIBREX 2000 / CHADWICK 8500C+ / ROTORTUNER tuning equipment',
      planes: [
        { id:'main', label:'Tail rotor drive shaft (fan inlet flange)', pointPos: tdsPointPos(TDS_V2K_CAL.theta1Min), slopeGPerIps: TDS_V2K_CAL.C,
          maxWeightG: 8, maxWeightRef: 'MET K.1', minWeightRef: 'MET G.1.c(4)',
          thresholdDefaultIps: 0.1, thresholdMinIps: 0.1, thresholdMaxIps: 1.75, thresholdMaxRef: 'MET K.2', ampMaxIps: 2.5 },
      ],
    },
  };
  const TDS_TYPE_IDS = ['as350','ec130t2','as355'];

  // ---------- generic per-plane engine (shared by all three aircraft types) ----------
  function tdsRound2(n){ return Math.round((n||0) * 100) / 100; }
  function tdsBlankPoints(){
    const pts = {};
    TDS_POINTS.forEach(p=>{ pts[p] = { currentG: 0 }; });
    return pts;
  }
  function tdsNormalizePoint(pt){
    if(!pt) return { currentG: 0 };
    if(typeof pt.currentG === 'number') return pt;
    return { currentG: tdsRound2(pt.existingG||0) };
  }
  function tdsPointTotalG(pt){ return tdsRound2(pt.currentG||0); }
  function tdsClampThreshold(plane, v){
    if(isNaN(v)) return plane.thresholdDefaultIps;
    return Math.min(plane.thresholdMaxIps, Math.max(plane.thresholdMinIps, v));
  }
  function tdsNewPlaneData(plane){
    return { thresholdIps: plane.thresholdDefaultIps, points: tdsBlankPoints(), runs: [] };
  }
  function tdsNewJob(typeId){
    const planeData = {};
    TDS_TYPES[typeId].planes.forEach(pl=>{ planeData[pl.id] = tdsNewPlaneData(pl); });
    return { reg:'', date: todayISO(), ame:'', type: typeId, planeData: planeData };
  }
  function tdsNormalizeJob(job){
    if(!TDS_TYPES[job.type]) job.type = 'as350';
    if(!job.planeData) job.planeData = {};
    TDS_TYPES[job.type].planes.forEach(pl=>{
      if(!job.planeData[pl.id]) job.planeData[pl.id] = tdsNewPlaneData(pl);
      const pd = job.planeData[pl.id];
      TDS_POINTS.forEach(p=>{ pd.points[p] = tdsNormalizePoint(pd.points[p]); });
      if(pd.thresholdIps == null) pd.thresholdIps = pl.thresholdDefaultIps;
      if(!pd.runs) pd.runs = [];
    });
    return job;
  }

  function tdsBracket(plane, correctedMin){
    const shifted = ((correctedMin - plane.pointPos['1']) % 720 + 720) % 720;
    let k = Math.floor(shifted / 240);
    if(k > 2) k = 2;
    if(k < 0) k = 0;
    const r = shifted - k*240;
    return { lowerPoint: TDS_POINT_SEQ[k], upperPoint: TDS_POINT_SEQ[k+1], offsetMin: r };
  }
  // Resolves a measured (amplitude, corrected-phase) reading into its two oblique-axis components
  // along the nearest pair of correction points -- the same trig used both by tdsAnalyze() (to size
  // the suggested correction) and by the balance chart (to place the parallel-construction guide
  // lines), so the chart always shows exactly what was suggested.
  function tdsDecomposeVector(plane, ampIps, correctedMin){
    const br = tdsBracket(plane, correctedMin);
    const gammaRad = 240 * Math.PI/360; // 120° between adjacent points
    const phiRad = br.offsetMin * Math.PI/360;
    const sinGamma = Math.sin(gammaRad);
    const wLowerIps = ampIps * Math.sin(gammaRad - phiRad) / sinGamma;
    const wUpperIps = ampIps * Math.sin(phiRad) / sinGamma;
    return { br: br, wLowerIps: wLowerIps, wUpperIps: wUpperIps };
  }
  function tdsAnalyze(plane, ampIps, rawPhaseMin, calOffsetMin, planeData, thresholdIps){
    const correctedMin = trbApplyCalOffset(rawPhaseMin, calOffsetMin);
    if(ampIps <= thresholdIps){
      return { balanced:true, correctedMin: correctedMin };
    }
    const dec = tdsDecomposeVector(plane, ampIps, correctedMin);
    const cand = [
      { point: dec.br.lowerPoint, addIps: dec.wLowerIps },
      { point: dec.br.upperPoint, addIps: dec.wUpperIps },
    ].filter(c => tdsRound2(c.addIps * plane.slopeGPerIps) > 0);
    const points = cand.map(c=>{
      const targetAddG = tdsRound2(c.addIps * plane.slopeGPerIps);
      const currentTotal = tdsRound2((planeData.points[c.point]||{}).currentG||0);
      const suggestedTotal = tdsRound2(currentTotal + targetAddG);
      return { point: c.point, targetAddG: targetAddG, currentTotal: currentTotal, suggestedTotal: suggestedTotal };
    });
    const unchanged = TDS_POINTS.filter(p => !points.some(pt=>pt.point===p));
    return { balanced:false, correctedMin: correctedMin, points: points, unchanged: unchanged };
  }

  // ---------- automatic clock-angle calibration (identical method to the tail-ROTOR balancing tools) ----------
  function tdsCorrectionVectorXY(plane, points){
    let x = 0, y = 0;
    (points||[]).forEach(p=>{
      const delta = (p.actualTotal||0) - (p.previousTotal||0);
      if(!delta) return;
      const v = trbPolarToXY(delta/plane.slopeGPerIps, plane.pointPos[p.point]);
      x += v.x; y += v.y;
    });
    return { x: x, y: y };
  }
  function tdsAutoCalOffset(plane, prevRun, newAmpIps, newRawPhaseMin){
    if(!prevRun || !prevRun.points || !prevRun.points.length) return null;
    if(newAmpIps==null || isNaN(newAmpIps) || newRawPhaseMin==null || isNaN(newRawPhaseMin)) return null;
    const before = trbPolarToXY(prevRun.ampIps, prevRun.rawPhaseMin);
    const after = trbPolarToXY(newAmpIps, newRawPhaseMin);
    const diff = { x: before.x - after.x, y: before.y - after.y };
    const angleDiff = trbXYToAngleMin(diff.x, diff.y);
    if(angleDiff === null) return null;
    const c = tdsCorrectionVectorXY(plane, prevRun.points);
    const angleC = trbXYToAngleMin(c.x, c.y);
    if(angleC === null) return null;
    return ((angleC - angleDiff) % 720 + 720) % 720;
  }

  // ---------- balance chart (each manual's own Figure equivalent) ----------
  const TDS_CHART_SIZE = 440;
  const TDS_CHART_CX = 220;
  const TDS_CHART_CY = 220;
  const TDS_CHART_R = 150;
  function tdsRingStep(ampMaxIps){
    const raw = ampMaxIps/5;
    const niceSteps = [0.1, 0.2, 0.25, 0.3, 0.5, 1];
    let best = niceSteps[0];
    niceSteps.forEach(s=>{ if(Math.abs(s-raw) < Math.abs(best-raw)) best = s; });
    return best;
  }
  function tdsRingValues(ampMaxIps){
    const step = tdsRingStep(ampMaxIps);
    const vals = [];
    for(let v=step; v<ampMaxIps-1e-9; v+=step) vals.push(Math.round(v*100)/100);
    vals.push(Math.round(ampMaxIps*100)/100);
    return vals;
  }
  function tdsGramTicks(maxWeightG){
    const step = maxWeightG > 6 ? 2 : 1;
    const ticks = [];
    for(let g=step; g<maxWeightG-1e-9; g+=step) ticks.push(g);
    ticks.push(Math.round(maxWeightG*10)/10);
    return ticks;
  }
  // 0 min = 12 o'clock (top), increasing clockwise -- matches how the AME reads the analyzer's clock
  // dial, and is independent of trbPolarToXY's own math-angle convention (used only for the
  // auto-calibration vector algebra, never for on-screen layout).
  function tdsChartXY(chartMaxIps, minutes, ips){
    const angle = (minutes/720) * 2*Math.PI;
    const r = Math.max(0, Math.min(ips, chartMaxIps)) / chartMaxIps * TDS_CHART_R;
    return { x: TDS_CHART_CX + r*Math.sin(angle), y: TDS_CHART_CY - r*Math.cos(angle) };
  }
  // What (if anything) a plane's chart should currently plot: the not-yet-confirmed analysis if one
  // is pending, else the most recent logged run, else nothing (no readings yet for this plane).
  function tdsChartDisplayState(planeData, pending){
    if(pending && pending.analysis){
      return { ampIps: pending.ampIps, correctedMin: pending.analysis.correctedMin, balanced: pending.analysis.balanced };
    }
    if(planeData.runs && planeData.runs.length){
      const r = planeData.runs[planeData.runs.length-1];
      return { ampIps: r.ampIps, correctedMin: r.correctedMin, balanced: r.balanced };
    }
    return null;
  }
  function tdsChartSvg(plane, display, thresholdIps){
    const cx = TDS_CHART_CX, cy = TDS_CHART_CY, R = TDS_CHART_R;
    const chartMaxIps = plane.ampMaxIps * 1.04; // a hair above the ceiling so a max-value point still sits inside the rim
    let svg = '';

    tdsRingValues(plane.ampMaxIps).forEach(function(ips){
      const rr = ips/chartMaxIps*R;
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rr.toFixed(1)+'" fill="none" stroke="var(--line)" stroke-width="1"></circle>';
      svg += '<text x="'+(cx+4).toFixed(1)+'" y="'+(cy-rr+11).toFixed(1)+'" font-size="9" fill="var(--grey-strong)">'+ips.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'</text>';
    });

    const thr = thresholdIps || plane.thresholdDefaultIps;
    const thrR = thr/chartMaxIps*R;
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+thrR.toFixed(1)+'" fill="var(--good-bg)" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3"></circle>';
    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="1.5"></circle>';

    for(let h=0; h<12; h++){
      const min = h*60;
      const angle = (min/720)*2*Math.PI;
      const x1 = cx + R*Math.sin(angle), y1 = cy - R*Math.cos(angle);
      const x2 = cx + (R+7)*Math.sin(angle), y2 = cy - (R+7)*Math.cos(angle);
      svg += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--grey-strong)" stroke-width="1"></line>';
      const lx = cx + (R+18)*Math.sin(angle), ly = cy - (R+18)*Math.cos(angle);
      svg += '<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" font-size="10" fill="var(--grey-strong)" text-anchor="middle">'+(h===0?'12':h)+'</text>';
    }

    TDS_POINTS.forEach(function(p){
      const posMin = plane.pointPos[p];
      const end = tdsChartXY(chartMaxIps, posMin, chartMaxIps);
      svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+end.x.toFixed(1)+'" y2="'+end.y.toFixed(1)+'" stroke="var(--accent)" stroke-width="2"></line>';
      const lbl = tdsChartXY(chartMaxIps, posMin, chartMaxIps + plane.ampMaxIps*0.085);
      svg += '<text x="'+lbl.x.toFixed(1)+'" y="'+(lbl.y+3).toFixed(1)+'" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="middle">N°'+p+'</text>';
      const angle = (posMin/720)*2*Math.PI;
      const perpX = Math.cos(angle), perpY = Math.sin(angle);
      tdsGramTicks(plane.maxWeightG).forEach(function(g){
        const ips = g/plane.slopeGPerIps;
        if(ips > chartMaxIps) return;
        const pt = tdsChartXY(chartMaxIps, posMin, ips);
        svg += '<line x1="'+(pt.x-perpX*3).toFixed(1)+'" y1="'+(pt.y+perpY*3).toFixed(1)+'" x2="'+(pt.x+perpX*3).toFixed(1)+'" y2="'+(pt.y-perpY*3).toFixed(1)+'" stroke="var(--ink)" stroke-width="1"></line>';
        svg += '<text x="'+(pt.x+perpX*8).toFixed(1)+'" y="'+(pt.y-perpY*8+3).toFixed(1)+'" font-size="7" fill="var(--grey-strong)">'+g.toFixed(1)+'g</text>';
      });
    });

    svg += '<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--ink)"></circle>';

    if(display){
      const M = tdsChartXY(chartMaxIps, display.correctedMin, display.ampIps);
      if(display.balanced){
        svg += '<circle cx="'+M.x.toFixed(1)+'" cy="'+M.y.toFixed(1)+'" r="6" fill="var(--good)" stroke="#fff" stroke-width="1.5"></circle>';
        svg += '<text x="'+(M.x+9).toFixed(1)+'" y="'+(M.y-9).toFixed(1)+'" font-size="11" font-weight="700" fill="var(--good)">M '+display.ampIps.toFixed(2)+' ips</text>';
      } else {
        const dec = tdsDecomposeVector(plane, display.ampIps, display.correctedMin);
        const pLower = tdsChartXY(chartMaxIps, plane.pointPos[dec.br.lowerPoint], dec.wLowerIps);
        const pUpper = tdsChartXY(chartMaxIps, plane.pointPos[dec.br.upperPoint], dec.wUpperIps);
        svg += '<line x1="'+pLower.x.toFixed(1)+'" y1="'+pLower.y.toFixed(1)+'" x2="'+M.x.toFixed(1)+'" y2="'+M.y.toFixed(1)+'" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 3"></line>';
        svg += '<line x1="'+pUpper.x.toFixed(1)+'" y1="'+pUpper.y.toFixed(1)+'" x2="'+M.x.toFixed(1)+'" y2="'+M.y.toFixed(1)+'" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="5 3"></line>';
        const gLower = tdsRound2(dec.wLowerIps*plane.slopeGPerIps);
        const gUpper = tdsRound2(dec.wUpperIps*plane.slopeGPerIps);
        if(gLower > 0){
          svg += '<circle cx="'+pLower.x.toFixed(1)+'" cy="'+pLower.y.toFixed(1)+'" r="4" fill="var(--warn)"></circle>';
          svg += '<text x="'+(pLower.x+7).toFixed(1)+'" y="'+(pLower.y-6).toFixed(1)+'" font-size="10" font-weight="700" fill="var(--warn)">'+gLower.toFixed(2)+'g</text>';
        }
        if(gUpper > 0){
          svg += '<circle cx="'+pUpper.x.toFixed(1)+'" cy="'+pUpper.y.toFixed(1)+'" r="4" fill="var(--warn)"></circle>';
          svg += '<text x="'+(pUpper.x+7).toFixed(1)+'" y="'+(pUpper.y-6).toFixed(1)+'" font-size="10" font-weight="700" fill="var(--warn)">'+gUpper.toFixed(2)+'g</text>';
        }
        svg += '<circle cx="'+M.x.toFixed(1)+'" cy="'+M.y.toFixed(1)+'" r="6" fill="var(--bad)" stroke="#fff" stroke-width="1.5"></circle>';
        svg += '<text x="'+(M.x+9).toFixed(1)+'" y="'+(M.y-9).toFixed(1)+'" font-size="11" font-weight="700" fill="var(--bad)">M '+display.ampIps.toFixed(2)+' ips</text>';
      }
    }

    return '<svg viewBox="0 0 '+TDS_CHART_SIZE+' '+TDS_CHART_SIZE+'" style="width:100%;max-width:440px;height:auto;display:block;margin:0 auto;" role="img" aria-label="Balance chart">' + svg + '</svg>';
  }

  // ---------- UI ----------
  function renderDriveShaftBalance(prefill){
    showView('DriveShaftBalance');
    const el = document.getElementById('viewDriveShaftBalance');
    const s = state.settings;
    let job = prefill ? tdsNormalizeJob(JSON.parse(JSON.stringify(prefill))) : tdsNewJob('as350');

    // One controller per plane of the CURRENT type, holding that plane's not-yet-saved UI state
    // (pending analysis, calibration override) -- rebuilt whenever the type (or a new/loaded job)
    // changes, since a different type means a different set of planes entirely.
    let planeCtrls = [];
    function rebuildPlaneCtrls(){
      planeCtrls = TDS_TYPES[job.type].planes.map(plane=> makePlaneCtrl(plane));
    }
    rebuildPlaneCtrls();

    function makePlaneCtrl(plane){
      const idp = 'tds_'+plane.id+'_';
      let pending = null; // { ampIps, rawPhaseMin, calOffsetMin, calOffsetAuto, analysis, actual: {point: newTotalG} }
      let calOffsetOverridden = false;
      let manualCalOffsetMin = 0;
      let calOffsetAutoFailed = false;

      function planeData(){ return job.planeData[plane.id]; }

      function sectionHtml(){
        const pd = planeData();
        const nextRunNumber = pd.runs.length + 1;
        const lastRun = pd.runs.length ? pd.runs[pd.runs.length-1] : null;
        const canAutoCalibrate = !!(lastRun && lastRun.points && lastRun.points.length);

        let calOffsetFieldHtml, calOffsetNoteHtml;
        if(!canAutoCalibrate){
          calOffsetFieldHtml = '<input type="number" step="1" id="'+idp+'calOffset" value="'+(pending?pending.calOffsetMin:manualCalOffsetMin)+'">';
          calOffsetNoteHtml = 'Compensates for the accelerometer/target/photoelectric-cell installation shifting slightly between runs — leave at 0 unless you have a known offset. Once a correction from a run is logged below, this will be calculated automatically for the next run.';
        } else if(calOffsetOverridden){
          calOffsetFieldHtml = '<input type="number" step="1" id="'+idp+'calOffset" value="'+(pending?pending.calOffsetMin:manualCalOffsetMin)+'"> <button type="button" class="btn" id="'+idp+'calAutoBtn" style="margin-left:8px;">Use automatic calculation</button>';
          calOffsetNoteHtml = calOffsetAutoFailed ?
            ('Could not calculate automatically from Run '+lastRun.runNumber+' (its reading and this one\'s were the same, so no rotation could be measured) — defaulted to 0 min. Enter a known offset if you have one, or leave at 0.') :
            'Manually overridden — enter a known calibration offset.';
        } else {
          calOffsetFieldHtml = '<input type="number" id="'+idp+'calOffset" value="'+(pending?pending.calOffsetMin:'')+'" placeholder="auto" disabled> <button type="button" class="btn" id="'+idp+'calOverrideBtn" style="margin-left:8px;">Override manually</button>';
          calOffsetNoteHtml = pending ?
            ('Calculated automatically from Run '+lastRun.runNumber+'\'s confirmed correction: '+pending.calOffsetMin+' min.') :
            ('Calculated automatically from Run '+lastRun.runNumber+'\'s confirmed correction and this run\'s reading, once you click Analyze.');
        }

        const disp = tdsChartDisplayState(pd, pending);

        return (
          '<div class="trb-section" style="border-top:3px solid var(--accent);padding-top:14px;margin-top:26px;">' +
            '<h3 style="margin-bottom:2px;">'+escapeHTML(plane.label)+'</h3>' +
            '<div class="field-grid">' +
              '<div class="field"><label for="'+idp+'threshold">Unbalance threshold (IPS)</label><input type="number" step="0.1" min="'+plane.thresholdMinIps+'" max="'+plane.thresholdMaxIps+'" id="'+idp+'threshold" value="'+pd.thresholdIps.toFixed(2)+'"></div>' +
            '</div>' +
            '<p class="trb-note">Defaults to '+plane.thresholdDefaultIps.toFixed(2)+' IPS, so the system keeps suggesting a correction until the reading drops below that. '+plane.thresholdMaxRef+' treats '+plane.thresholdMaxIps.toFixed(2)+' IPS as satisfactory — loosen this up to that if the manual\'s own minimum is all you need (it can\'t be set any looser).</p>' +
          '</div>' +

          '<div class="trb-section">' +
            '<h4 style="margin-bottom:2px;">Current weight per point</h4>' +
            '<p class="trb-note">Enter what’s already installed at each of the 3 attachment points before this job starts, in grams. Washers can be ground down to the exact weight needed — there\'s no fixed catalog size to match. This figure updates automatically once a run\'s correction is logged below.</p>' +
            '<div style="overflow-x:auto;">' +
            '<table class="pt-table trb-points-table">' +
              '<thead><tr><th>Point</th><th>Current weight (g)</th></tr></thead>' +
              '<tbody>' +
                TDS_POINTS.map(p=>{
                  const pt = pd.points[p];
                  return '<tr>' +
                    '<td><b>N°'+p+'</b></td>' +
                    '<td><input type="number" step="0.01" min="0" class="'+idp+'existing-input" data-point="'+p+'" value="'+tdsPointTotalG(pt).toFixed(2)+'" style="width:90px;"> g</td>' +
                  '</tr>';
                }).join('') +
              '</tbody>' +
            '</table>' +
            '</div>' +
          '</div>' +

          '<div class="trb-section">' +
            '<h4 style="margin-bottom:2px;">Run '+nextRunNumber+' — new measurement</h4>' +
            '<div class="field-grid">' +
              '<div class="field"><label for="'+idp+'amp">Measured amplitude (IPS)</label><input type="number" step="0.01" min="0" max="'+plane.ampMaxIps+'" id="'+idp+'amp" value="'+(pending?pending.ampIps:'')+'"></div>' +
              '<div class="field"><label>Measured phase (clock position)</label><div class="trb-phase-inputs"><input type="number" min="0" max="12" id="'+idp+'phaseHour" value="'+(pending?Math.floor(pending.rawPhaseMin/60):'')+'" placeholder="H">:<input type="number" min="0" max="59" id="'+idp+'phaseMin" value="'+(pending?String(pending.rawPhaseMin%60).padStart(2,'0'):'')+'" placeholder="MM"></div></div>' +
              '<div class="field"><label for="'+idp+'calOffset">Clock angle calibration offset (min)</label>'+calOffsetFieldHtml+'</div>' +
            '</div>' +
            '<p class="trb-note">Readings up to '+plane.ampMaxIps.toFixed(1)+' IPS are accepted for an initial/as-found check on a shaft that has never been balanced -- in-service corrections afterward are almost always much smaller. Readings above '+plane.ampMaxIps.toFixed(1)+' IPS aren\'t supported here.</p>' +
            '<p class="trb-note">'+calOffsetNoteHtml+'</p>' +
            '<div class="btn-row"><button type="button" class="btn primary" id="'+idp+'analyzeBtn">Analyze</button></div>' +
          '</div>' +

          '<div class="trb-section">' +
            '<h4 style="margin-bottom:2px;">Balance chart</h4>' +
            '<p class="trb-note">The measured unbalance (M) is broken into the two nearest correction points by drawing lines parallel to each point\'s weight-scale axis. Shaded ring = current '+pd.thresholdIps.toFixed(2)+' IPS threshold.</p>' +
            tdsChartSvg(plane, disp, pd.thresholdIps) +
            (disp ? '' : '<p class="trb-note" style="text-align:center;">Enter a reading above and click Analyze to plot it here.</p>') +
          '</div>' +

          (pending && pending.analysis ? analysisSectionHtml(pd) : '') +

          '<div class="trb-section">' +
            '<h4 style="margin-bottom:2px;">Run history</h4>' +
            (pd.runs.length ? (
              '<div style="overflow-x:auto;">' +
              '<table class="pt-table trb-history-table">' +
                '<thead><tr><th>Run</th><th>Amplitude</th><th>Raw phase</th><th>Cal. offset</th><th>Corrected phase</th><th>Result</th><th>Points adjusted</th></tr></thead>' +
                '<tbody>' +
                  pd.runs.map(r=>{
                    const adj = r.balanced ? '—' : (r.points||[]).map(p=>{
                      const delta = tdsRound2(p.actualTotal - p.previousTotal);
                      const dir = delta > 0 ? ('+'+delta.toFixed(2)+' g added') : (delta < 0 ? (delta.toFixed(2)+' g removed') : 'no change');
                      return 'N°'+p.point+': '+p.previousTotal.toFixed(2)+' → '+p.actualTotal.toFixed(2)+' g ('+dir+')';
                    }).join('; ');
                    return '<tr>' +
                      '<td>'+r.runNumber+'</td>' +
                      '<td>'+r.ampIps.toFixed(2)+' ips</td>' +
                      '<td>'+trbMinutesToClockStr(r.rawPhaseMin)+'</td>' +
                      '<td>'+(r.calOffsetMin||0)+' min'+(r.calOffsetAuto?' <i>(auto)</i>':'')+'</td>' +
                      '<td>'+trbMinutesToClockStr(r.correctedMin)+'</td>' +
                      '<td>'+(r.balanced ? '<span style="color:var(--good);font-weight:800;">BALANCED</span>' : '<span style="color:var(--warn);font-weight:800;">CORRECTION</span>')+'</td>' +
                      '<td>'+adj+'</td>' +
                    '</tr>';
                  }).join('') +
                '</tbody>' +
              '</table>' +
              '</div>'
            ) : '<p class="trb-note">No runs logged yet.</p>') +
          '</div>'
        );
      }

      function analysisSectionHtml(pd){
        const a = pending.analysis;
        const thresh = pd.thresholdIps;
        if(a.balanced){
          return (
            '<div class="trb-section">' +
              '<div class="trb-banner ok">Unbalance is '+pending.ampIps.toFixed(2)+' IPS — at or below the '+thresh.toFixed(2)+' IPS threshold. No correction needed.</div>' +
              '<p class="trb-note">Corrected phase used: '+trbMinutesToClockStr(a.correctedMin)+' (calibration offset '+pending.calOffsetMin+' min'+(pending.calOffsetAuto?', calculated automatically':(pending.calOffsetMin?', entered manually':''))+').</p>' +
              '<div class="btn-row"><button type="button" class="btn primary" id="'+idp+'logRunBtn">Log this run as final check</button></div>' +
            '</div>'
          );
        }
        return (
          '<div class="trb-section">' +
            '<div class="trb-banner warn">Unbalance is '+pending.ampIps.toFixed(2)+' IPS — above the '+thresh.toFixed(2)+' IPS threshold. Suggested correction below.</div>' +
            '<p class="trb-note">Corrected phase used: '+trbMinutesToClockStr(a.correctedMin)+' (calibration offset '+pending.calOffsetMin+' min'+(pending.calOffsetAuto?', calculated automatically':(pending.calOffsetMin?', entered manually':''))+').</p>' +
            a.points.map(p=>{
              const actualTotal = (pending.actual[p.point]!==undefined) ? pending.actual[p.point] : p.suggestedTotal;
              const delta = tdsRound2(actualTotal - p.currentTotal);
              const dirText = delta > 0 ? ('<span style="color:var(--warn);">+'+delta.toFixed(2)+' g to add</span>') :
                              (delta < 0 ? ('<span style="color:var(--good);">'+delta.toFixed(2)+' g to remove</span>') : '<span>no change</span>');
              const over = p.suggestedTotal > plane.maxWeightG;
              return (
                '<div class="trb-point-card">' +
                  '<h4>Point N°'+p.point+' — '+p.targetAddG.toFixed(2)+' g additional weight needed</h4>' +
                  '<p class="trb-note">Current weight at this point: '+p.currentTotal.toFixed(2)+' g. Suggested new total: <b>'+p.suggestedTotal.toFixed(2)+' g</b>. Grind a washer to this exact weight and enter the exact total you actually leave installed here.</p>' +
                  (over ? '<p class="trb-note" style="color:var(--warn);font-weight:700;">Exceeds the '+plane.maxWeightG.toFixed(1)+' g max per screw ('+plane.maxWeightRef+') — re-inspect before continuing rather than installing an overweight washer.</p>' : '') +
                  '<div class="trb-qty-row">' +
                    '<label>Actual total weight left installed: <input type="number" step="0.01" min="0" class="'+idp+'actual-total" data-point="'+p.point+'" value="'+actualTotal.toFixed(2)+'" style="width:90px;"> g</label>' +
                    '<span>('+dirText+' vs. current)</span>' +
                  '</div>' +
                '</div>'
              );
            }).join('') +
            (a.unchanged && a.unchanged.length ? '<p class="trb-note">Point'+(a.unchanged.length>1?'s':'')+' N°'+a.unchanged.join(', N°')+' — no change suggested; keep current washer ('+plane.minWeightRef+' requires at least one of the 3 screws keep its original/minimum washer).</p>' : '') +
            '<div class="btn-row"><button type="button" class="btn primary" id="'+idp+'confirmRunBtn">Confirm &amp; log this correction</button></div>' +
          '</div>'
        );
      }

      function wire(repaint){
        const pd = planeData();
        document.getElementById(idp+'threshold').onchange = (e)=>{ pd.thresholdIps = tdsClampThreshold(plane, parseFloat(e.target.value)); e.target.value = pd.thresholdIps.toFixed(2); };

        el.querySelectorAll('.'+idp+'existing-input').forEach(inp=>{
          inp.addEventListener('change', ()=>{
            const p = inp.dataset.point;
            pd.points[p].currentG = Math.max(0, parseFloat(inp.value)||0);
            repaint();
          });
        });

        const calOffsetInput = document.getElementById(idp+'calOffset');
        if(calOffsetInput){
          calOffsetInput.addEventListener('change', ()=>{
            const v = parseFloat(calOffsetInput.value);
            manualCalOffsetMin = isNaN(v) ? 0 : v;
          });
        }
        const calOverrideBtn = document.getElementById(idp+'calOverrideBtn');
        if(calOverrideBtn){
          calOverrideBtn.onclick = ()=>{ calOffsetOverridden = true; manualCalOffsetMin = 0; calOffsetAutoFailed = false; repaint(); };
        }
        const calAutoBtn = document.getElementById(idp+'calAutoBtn');
        if(calAutoBtn){
          calAutoBtn.onclick = ()=>{ calOffsetOverridden = false; calOffsetAutoFailed = false; repaint(); };
        }

        document.getElementById(idp+'analyzeBtn').onclick = ()=>{
          const lastRun = pd.runs.length ? pd.runs[pd.runs.length-1] : null;
          const canAutoCalibrate = !!(lastRun && lastRun.points && lastRun.points.length);
          const ampIps = parseFloat(document.getElementById(idp+'amp').value);
          const hour = parseInt(document.getElementById(idp+'phaseHour').value,10);
          const minute = parseInt(document.getElementById(idp+'phaseMin').value,10);
          if(isNaN(ampIps) || ampIps < 0){ alert('Please enter a valid measured amplitude (IPS).'); return; }
          if(ampIps > plane.ampMaxIps){ alert('Measured amplitude readings above '+plane.ampMaxIps.toFixed(1)+' IPS aren\'t supported by this tool (well beyond the chart\'s range) -- double-check the pickup/target installation and the reading before proceeding.'); return; }
          if(isNaN(hour) || isNaN(minute)){ alert('Please enter a valid measured phase (hour and minute).'); return; }
          const rawPhaseMin = trbPhaseToMinutes(hour, minute);
          let calOffsetMin, calOffsetAuto;
          if(canAutoCalibrate && !calOffsetOverridden){
            const auto = tdsAutoCalOffset(plane, lastRun, ampIps, rawPhaseMin);
            calOffsetMin = (auto!=null) ? Math.round(auto) : 0;
            calOffsetAuto = (auto!=null);
            if(auto==null){ calOffsetOverridden = true; manualCalOffsetMin = 0; calOffsetAutoFailed = true; }
          } else {
            calOffsetMin = parseFloat(document.getElementById(idp+'calOffset').value)||0;
            calOffsetAuto = false;
          }
          const analysis = tdsAnalyze(plane, ampIps, rawPhaseMin, calOffsetMin, pd, pd.thresholdIps);
          pending = { ampIps: ampIps, rawPhaseMin: rawPhaseMin, calOffsetMin: calOffsetMin, calOffsetAuto: calOffsetAuto, analysis: analysis, actual: {} };
          if(!analysis.balanced){
            analysis.points.forEach(p=>{ pending.actual[p.point] = p.suggestedTotal; });
          }
          repaint();
        };

        if(pending && pending.analysis){
          const logBtn = document.getElementById(idp+'logRunBtn');
          if(logBtn){
            logBtn.onclick = ()=>{
              pd.runs.push({
                runNumber: pd.runs.length+1, ampIps: pending.ampIps, rawPhaseMin: pending.rawPhaseMin,
                calOffsetMin: pending.calOffsetMin, calOffsetAuto: pending.calOffsetAuto,
                correctedMin: pending.analysis.correctedMin, balanced: true, timestamp: new Date().toISOString(),
              });
              pending = null; calOffsetOverridden = false; manualCalOffsetMin = 0; calOffsetAutoFailed = false;
              repaint();
            };
          }
          el.querySelectorAll('.'+idp+'actual-total').forEach(inp=>{
            inp.addEventListener('change', ()=>{
              const p = inp.dataset.point;
              pending.actual[p] = Math.max(0, parseFloat(inp.value)||0);
              repaint();
            });
          });
          const confirmBtn = document.getElementById(idp+'confirmRunBtn');
          if(confirmBtn){
            confirmBtn.onclick = ()=>{
              const pointResults = pending.analysis.points.map(p=>{
                const actualTotal = tdsRound2(pending.actual[p.point]!==undefined ? pending.actual[p.point] : p.suggestedTotal);
                const previousTotal = p.currentTotal;
                pd.points[p.point].currentG = actualTotal;
                return { point: p.point, previousTotal: previousTotal, targetAddG: p.targetAddG, suggestedTotal: p.suggestedTotal, actualTotal: actualTotal };
              });
              pd.runs.push({
                runNumber: pd.runs.length+1, ampIps: pending.ampIps, rawPhaseMin: pending.rawPhaseMin,
                calOffsetMin: pending.calOffsetMin, calOffsetAuto: pending.calOffsetAuto,
                correctedMin: pending.analysis.correctedMin, balanced: false, points: pointResults, timestamp: new Date().toISOString(),
              });
              pending = null; calOffsetOverridden = false; manualCalOffsetMin = 0; calOffsetAutoFailed = false;
              repaint();
            };
          }
        }
      }

      function resetUi(){ pending = null; calOffsetOverridden = false; manualCalOffsetMin = 0; calOffsetAutoFailed = false; }

      return { sectionHtml: sectionHtml, wire: wire, resetUi: resetUi };
    }

    function paint(){
      const type = TDS_TYPES[job.type];
      const typeAircraft = (s.aircraft||[]).filter(a => type.aircraftTypes.includes(ptrainModelToType(a.model)));

          '<div class="trb-section">' +
            '<h3>Job</h3>' +
            '<div class="field-grid">' +
              '<div class="field"><label for="tdsType">Aircraft / system</label><select id="tdsType">'+TDS_TYPE_IDS.map(tid=>'<option value="'+tid+'"'+(job.type===tid?' selected':'')+'>'+escapeHTML(TDS_TYPES[tid].label)+'</option>').join('')+'</select></div>' +

            '<p class="trb-note">'+escapeHTML(type.amm)+' — '+escapeHTML(type.procedureLabel)+'.'+(type.planes.length>1 ? ' This system has '+type.planes.length+' independent balancing planes, both worked below under the same job.' : '')+'</p>' +
          '</div>' +

          planeCtrls.map(c=>c.sectionHtml()).join('') +

          '<div class="btn-row" style="justify-content:flex-end;margin-top:16px;">' +
            '<button type="button" class="btn" id="tdsNewJobBtn">✖ New job</button>' +
            '<button type="button" class="btn" id="tdsPrintBtn">🖨️ Print report</button>' +
            '<button type="button" class="btn primary" id="tdsSaveBtn">💾 Save job</button>' +

        '</div>';

      document.getElementById('tdsReg').value = job.reg||'';

      document.getElementById('tdsType').onchange = (e)=>{
        const newType = e.target.value;
        if(newType === job.type) return;
        const hasData = TDS_TYPES[job.type].planes.some(pl=>{
          const pd = job.planeData[pl.id];
          return pd && (pd.runs.length || TDS_POINTS.some(p=>(pd.points[p].currentG||0) > 0));
        });
        if(hasData && !confirm('Switch aircraft / system? This clears the points and run history entered for '+TDS_TYPES[job.type].label+' below (the job header — registration, date, AME — is kept).')){
          e.target.value = job.type;
          return;
        }
        const reg = job.reg, date = job.date, ame = job.ame;
        job = tdsNewJob(newType);
        job.reg = ''; job.date = date; job.ame = ame; // registration list differs per type, so it's cleared rather than carried over
        rebuildPlaneCtrls();
        paint();
      };

      planeCtrls.forEach(c=> c.wire(paint));

      document.getElementById('tdsNewJobBtn').onclick = ()=>{
        if(!confirm('Start a new job? This clears the current points, run history and job header (any unsaved data is lost — saved jobs remain in Saved Forms).')) return;
        job = tdsNewJob(job.type);
        rebuildPlaneCtrls();
        paint();
      };

      document.getElementById('tdsPrintBtn').onclick = ()=>{
        openPrint(buildDriveShaftPrintHtml(Object.assign({}, job, { date: fmtDateNice(job.date) })));
      };

      document.getElementById('tdsSaveBtn').onclick = ()=>{
        const type = TDS_TYPES[job.type];
        const runCount = type.planes.reduce((sum,pl)=> sum + (job.planeData[pl.id].runs.length||0), 0);
        const lastPlaneBalanced = type.planes.every(pl=>{ const r=job.planeData[pl.id].runs; return r.length && r[r.length-1].balanced; });
        const desc = type.label+' — AME: '+(job.ame||'—')+' — '+runCount+' run(s) logged'+(runCount && lastPlaneBalanced ? ', balanced' : '');
        saveRecord(buildRecord('driveshaftbalance', 'Tail Rotor Drive Shaft / Fan Balancing', job.reg, job.date, desc, job)).then(()=>{
          alert('Job saved. You can reopen and continue it later from Saved Forms.');
        }).catch(()=>{ alert('Could not save the job right now, but you can keep working — try Save again in a moment.'); });
      };
    }

    paint();
  }

        '<table class="mcm-table"><thead><tr><th>Point</th><th>Current weight (g)</th></tr></thead><tbody>'+pointsRows+'</tbody></table>' +

      '</div>' +

    );
  }

  // Two-series trend chart (opening/closing margin), adapted from ec135DrawTrendChart.
  function bvDrawTrendChart(canvas, records){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const padL = 48, padR = 14, padT = 20, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const seriesColors = { open: pcCssVar('--accent'), close: pcCssVar('--warn') };
    const allVals = [];
    records.forEach(r=>{ allVals.push(r.data.openResult.margin); allVals.push(r.data.closeResult.margin); });
    if(!allVals.length) return;
    let vMin = Math.min(0, Math.min.apply(null, allVals));
    let vMax = Math.max.apply(null, allVals);
    const pad = (vMax - vMin) * 0.15 || 1;
    vMin -= pad; vMax += pad;

    function xFor(i){ return padL + (records.length<=1 ? plotW/2 : plotW * i/(records.length-1)); }
    function yFor(v){ return padT + plotH * (1 - (v - vMin)/(vMax - vMin)); }

    ctx.strokeStyle = pcCssVar('--line');
    ctx.lineWidth = 1;
    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for(let t=0;t<=ticks;t++){
      const v = vMin + (vMax-vMin)*t/ticks;
      const y = yFor(v);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL-6, y);
    }
    if(vMin < 0 && vMax > 0){
      ctx.strokeStyle = pcCssVar('--bad');
      ctx.setLineDash([4,3]);
      const y0 = yFor(0);
      ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawSeries(field, color){
      const pts = records.map((r,i)=>({ x:xFor(i), y:yFor(r.data[field].margin) }));
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
      ctx.stroke();
      pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); });
    }
    drawSeries('openResult', seriesColors.open);
    drawSeries('closeResult', seriesColors.close);

    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelIdxs = records.length>1 ? [0, Math.floor((records.length-1)/2), records.length-1] : [0];
    labelIdxs.forEach(i=>{
      const label = (fmtDateNice(records[i].date) || records[i].date || '').split(',')[0];
      ctx.fillText(label, xFor(i), H-padB+8);
    });

    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle = seriesColors.open; ctx.fillRect(padL, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Opening', padL+14, 7);
    ctx.fillStyle = seriesColors.close; ctx.fillRect(padL+80, 2, 10, 10);
    ctx.fillStyle = pcCssVar('--ink'); ctx.fillText('Closing', padL+94, 7);
  }


  // ---------- EC135 T2+ Power Check (Arriel 2B2) ----------
  // Chart data digitized from Airbus Helicopters EC135 T2+ Flight Manual, Section 5
  // Performance Data, Rev. 17: Fig. 5-1 (ground power check, 75% torque), Fig. 5-2
  // (ground power check, 60% torque - high altitude / high OAT reference) and Fig. 5-3
  // (N1/TOT check). Fig. 5-1/5-2 are near-planar in OAT and pressure altitude, so each is
  // stored as a fitted plane (N1max = n0 + a*OAT + b*PA/1000ft). Fig. 5-3 is a two-panel
  // nomograph (N1,OAT -> linking position -> TOT via pressure altitude); each panel is
  // digitized per labeled line and read the same way a pilot reads the chart: bracket the
  // two nearest labeled lines and interpolate linearly between them (AFM 5.1.2 permits
  // interpolation between charted data). Cross-checked against the AFM's own worked
  // example (Fig. 5-1: 75% torque, Zp 2000ft, OAT 14degC -> N1 limit 95.5%, this model:
  // 95.50%; Fig. 5-3: N1 94.5%, OAT 14degC, Zp 2000ft -> max TOT 808degC, this model: 807degC).
  let ec135State = null;
  const EC135_POWERCHECK_DATA = {
    ch75: { n0: 92.842, a: 0.1385, b: 0.3594 },
    ch60: { n0: 90.916, a: 0.1446, b: 0.3450 },
    topOats: [-35,-20,0,20,40,50],
    topCoeffs: {
      '-35': [4.12500000, -635.30000000, 25303.6938],
      '-20': [1.73214286, -230.58571429, 8246.85982],
      '0'  : [1.47321429, -194.45714286, 7151.36027],
      '20' : [2.30357143, -349.25714286, 14426.5527],
      '40' : [2.33928571, -363.71428571, 15511.2723],
      '50' : [3.23214286, -525.10000000, 22845.2420]
    },
    botPAs: [-1500, 10000, 18000],
    botLines: {
      '-1500': { m: 4.55,  b: -1715.0 },
      '10000': { m: 4.517, b: -1631.66 },
      '18000': { m: 4.53,  b: -1745.4 }
    },
    limits: { pa:[-1500,18000], oat:[-35,50], n1:[80,100], tot:[500,900] }
  };

  function ec135Quad(c, x){ return c[0]*x*x + c[1]*x + c[2]; }

  // The two AFM charts (Fig. 5-1 @ 75% torque, Fig. 5-2 @ 60% torque) are each fitted as a
  // plane in OAT/Zp. Torque actually observed during the check rarely lands exactly on
  // 75.0 or 60.0, so the N1-limit plane is linearly interpolated (and, within +/-3%,
  // mildly extrapolated) between those two calibrated torque settings.
  function ec135PlaneAt(torque){
    const c60 = EC135_POWERCHECK_DATA.ch60, c75 = EC135_POWERCHECK_DATA.ch75;
    const t = (torque - 60) / (75 - 60);
    return {
      n0: c60.n0 + t*(c75.n0 - c60.n0),
      a:  c60.a  + t*(c75.a  - c60.a),
      b:  c60.b  + t*(c75.b  - c60.b)
    };
  }

  function ec135TopX(n1, oat){
    const d = EC135_POWERCHECK_DATA;
    const oatC = Math.max(d.topOats[0], Math.min(d.topOats[d.topOats.length-1], oat));
    const ys = d.topOats.map(o => ec135Quad(d.topCoeffs[String(o)], n1));
    return pcInterpAscending(oatC, d.topOats, ys).y;
  }

  function ec135BottomTOT(x, pa){
    const d = EC135_POWERCHECK_DATA;
    const paC = Math.max(d.botPAs[0], Math.min(d.botPAs[d.botPAs.length-1], pa));
    const ys = d.botPAs.map(p => { const L = d.botLines[String(p)]; return (x - L.b) / L.m; });
    return pcInterpAscending(paC, d.botPAs, ys).y;
  }

  function ec135Compute(inputs){
    const { target, torque, pa, oat, n1, tot } = inputs;
    const plane = ec135PlaneAt(torque);
    const n1Limit = plane.n0 + plane.a*oat + plane.b*(pa/1000);
    const n1Margin = n1Limit - n1;
    const x = ec135TopX(n1, oat);
    const totLimit = ec135BottomTOT(x, pa);
    const totMargin = totLimit - tot;

    const notes = [];
    if (torque < 60 || torque > 75){
      notes.push('Torque is outside the digitized 60–75% range: the N1-limit relationship is extrapolated beyond the two charted torque settings.');
    }
    if (target === 75 && pa >= 15000){
      notes.push('Zp ≥ 15,000 ft: Fig. 5-1’s 16,000 ft line departs from a straight line above N1 ≈97% (collective/topping limit). Cross-check Fig. 5-1 directly.');
    }
    if (target === 60 && (pa < 8000 || oat < 10)){
      notes.push('The 60% chart (Fig. 5-2) is intended for high altitude / high OAT conditions (Zp &gt; 10,000 ft, OAT &gt; ISA+20°C). Outside that corner the result is extrapolated — prefer the 75% check when it can be reached within limits.');
    }
    if (n1 > 95.5){
      notes.push('Indicated N1 is above ~95.5%: Fig. 5-3’s OAT lines converge in this region, so the computed max TOT is approximate — confirm against Fig. 5-3.');
    }
    if (pa < -1500 || pa > 18000){
      notes.push('Pressure altitude is outside the charted range (−1,500 to 18,000 ft) — result is extrapolated.');
    }
    if (n1Limit > 99.5 || n1Limit < 87){
      notes.push('This OAT/altitude combination falls outside Fig. 5-'+(target===60?'2':'1')+'’s plotted grid — treat the chart limit N1 as an extrapolation and verify against the AFM.');
    }

    const passed = n1Margin >= 0 && totMargin >= 0;
    return { n1Limit, n1Margin, totLimit, totMargin, passed, notes };
  }

  function ec135AngleFor(v, gmin, gmax){
    const t = Math.max(0, Math.min(1, (v - gmin) / (gmax - gmin)));
    return Math.PI - t * Math.PI;
  }

  function ec135DrawGauge(canvas, margin, gmin, gmax, gwarn){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H - 26, r = 118, rInner = 92;
    ctx.clearRect(0,0,W,H);

    const badC = pcCssVar('--bad') || '#b0281e';
    const warnC = pcCssVar('--warn') || '#b3791b';
    const goodC = pcCssVar('--good') || '#2f7d4f';
    const lineC = pcCssVar('--line') || '#dfe2da';
    const grey = pcCssVar('--grey-strong') || '#6b6558';
    const ink = pcCssVar('--ink') || '#1c2b24';

    ctx.lineWidth = r - rInner;
    ctx.lineCap = 'butt';
    const zones = [
      { from: gmin, to: 0, color: badC },
      { from: 0, to: gwarn, color: warnC },
      { from: gwarn, to: gmax, color: goodC },
    ];
    zones.forEach(z => {
      ctx.beginPath();
      ctx.strokeStyle = z.color;
      ctx.globalAlpha = 0.88;
      ctx.arc(cx, cy, (r+rInner)/2, -ec135AngleFor(z.from,gmin,gmax), -ec135AngleFor(z.to,gmin,gmax), false);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    ctx.font = '9px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.fillStyle = grey;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const step = (gmax-gmin) > 6 ? 2 : 1;
    for (let v = gmin; v <= gmax + 0.001; v += step){
      const a = ec135AngleFor(v,gmin,gmax);
      const x1 = cx + Math.cos(a) * (r + 2);
      const y1 = cy - Math.sin(a) * (r + 2);
      const x2 = cx + Math.cos(a) * (rInner - 2);
      const y2 = cy - Math.sin(a) * (rInner - 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineC;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lx = cx + Math.cos(a) * (r + 13);
      const ly = cy - Math.sin(a) * (r + 13);
      ctx.fillText((v>0?'+':'') + Math.round(v), lx, ly);
    }

    const clamped = Math.max(gmin, Math.min(gmax, margin));
    const a = ec135AngleFor(clamped,gmin,gmax);
    const nx = cx + Math.cos(a) * (rInner - 4);
    const ny = cy - Math.sin(a) * (rInner - 4);
    const needleC = margin < 0 ? badC : (margin < gwarn ? warnC : goodC);
    ctx.strokeStyle = needleC;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = needleC; ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = ink; ctx.arc(cx, cy, 2.5, 0, Math.PI*2); ctx.fill();
  }

  function ec135FormatFieldVal(f, val){
    if (f.step < 1) return val.toFixed(1);
    return Math.round(val).toLocaleString();
  }

  // Range slider + fine-adjustment up/down steppers, shared by every EC135 field.
  function ec135FieldHTML(f){
    return (
      '<div class="pc-field">' +
        '<div class="pc-field-head"><span class="pc-field-name">'+f.label+'<span class="pc-field-unit">'+f.unit+'</span></span><span class="pc-field-val" id="'+f.id+'Val">'+ec135FormatFieldVal(f, f.value)+'</span></div>' +
        '<div class="pc-field-row">' +
          '<input type="range" id="'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+f.value+'">' +
          '<div class="pc-stepper">' +
            '<button type="button" class="pc-step-btn" data-target="'+f.id+'" data-dir="-1" aria-label="Decrease '+f.label+'">&minus;</button>' +
            '<button type="button" class="pc-step-btn" data-target="'+f.id+'" data-dir="1" aria-label="Increase '+f.label+'">+</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function ec135AmbientFields(defaults){
    return [
      { id:'ecPa',  label:'Zp',  unit:'pressure altitude, ft (both engines)', min:-1500, max:10000, step:10,  value:defaults.pa },
      { id:'ecOat', label:'OAT', unit:'outside air temp, °C (both engines)', min:-35, max:50, step:0.1, value:defaults.oat },
    ];
  }

  function ec135EngineFields(p, target, defaults){
    return [
      { id:p+'Tq',  label:'Torque', unit:'observed, % ('+target+'% ±3)', min:target-3, max:target+3, step:0.1, value:defaults.torque },
      { id:p+'N1',  label:'N1',  unit:'indicated, %', min:80, max:100, step:0.1, value:defaults.n1 },
      { id:p+'Tot', label:'TOT', unit:'indicated, °C', min:500, max:900, step:1, value:defaults.tot },
    ];
  }

  // ---------- EC135 print report ----------
  const EC135_PRINT_STYLES = '<style>' +
    '.ec-pf-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px;}' +
    '.ec-pf-head .pf-logo{grid-column:1;justify-self:start;}' +
    '.ec-pf-head .pf-title-block{grid-column:2;text-align:center;}' +
    '.ec-pf-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}' +
    '.ec-pf-table th{text-align:left;background:#eee;border:1px solid #000;padding:5px 8px;font-size:11px;text-transform:uppercase;}' +
    '.ec-pf-table td{border:1px solid #000;padding:5px 8px;}' +
    '.ec-pf-table td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}' +
    '.ec-pf-result{font-weight:800;}' +
    '.ec-pf-result.pass{color:#1a6b3f;}' +
    '.ec-pf-result.fail{color:#a3221a;}' +
    '.ec-pf-margin-row td{padding:6px 8px;}' +
    '.ec-pf-margin-row .ec-pf-margin-item{display:inline-block;width:49%;}' +

    '.ec-pf-overall{border:1.5px solid #000;padding:8px 12px;margin-top:14px;font-size:14px;font-weight:800;text-align:center;}' +
    '.ec-pf-foot{font-size:9.5px;color:#333;margin-top:14px;line-height:1.5;}' +
  '</style>';

  function ec135PrintRow(name, val, unit){
    return '<tr><td>'+name+'</td><td class="num">'+val+(unit||'')+'</td></tr>';
  }

  function buildEc135PrintHtml(data){
    const engineTable = (e)=>(
      '<table class="ec-pf-table">' +
        '<tr><th colspan="2">'+e.label+' — S/N '+escapeHTML(e.sn||'—')+' — <span class="ec-pf-result '+(e.out.passed?'pass':'fail')+'">'+(e.out.passed?'PASSED':'FAILED')+'</span></th></tr>' +
        ec135PrintRow('Torque target', e.target+'%') +
        ec135PrintRow('Torque observed', e.torque.toFixed(1),'%') +
        ec135PrintRow('Indicated N1', e.n1.toFixed(1),'%') +
        ec135PrintRow('Chart limit N1 (Fig. 5-'+(e.target===60?'2':'1')+')', e.out.n1Limit.toFixed(2),'%') +
        ec135PrintRow('Indicated TOT', e.tot.toFixed(0),'°C') +
        ec135PrintRow('Max TOT (Fig. 5-3)', e.out.totLimit.toFixed(0),'°C') +
        '<tr class="ec-pf-margin-row"><td colspan="2">' +
          '<span class="ec-pf-margin-item">N1 margin: <span class="ec-pf-margin-val">'+(e.out.n1Margin>=0?'+':'−')+Math.abs(e.out.n1Margin).toFixed(2)+'%</span></span>' +
          '<span class="ec-pf-margin-item">TOT margin: <span class="ec-pf-margin-val">'+(e.out.totMargin>=0?'+':'−')+Math.abs(e.out.totMargin).toFixed(0)+'°C</span></span>' +
        '</td></tr>' +
