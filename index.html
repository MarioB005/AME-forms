<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Heli-Flight — Maintenance Forms</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#fbfaf6;
    --panel:#ffffff;
    --line:#dfe2da;
    --accent:#c05a2c;
    --grey-strong:#6b6558;
    --radius:10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;}
  #app{max-width:1000px;margin:0 auto;padding:20px 24px 60px;}

  .dark-banner{
    background:#12172b; color:#fff; display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px; border-bottom:2px solid var(--ink); margin:0 0 20px;
  }
  .db-left{display:flex;align-items:center;gap:10px;}
  .db-icon{font-size:20px;}
  .db-title{font-weight:800;font-size:16px;letter-spacing:.3px;color:#fff;}
  .db-right{display:flex;align-items:center;gap:10px;}
  .db-icon-btn{
    background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;width:34px;height:34px;
    border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  }
  .db-icon-btn:hover{background:rgba(255,255,255,.1);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}

  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:6px;}
  .home-btn{
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:26px 18px;
    cursor:pointer;text-align:center;font-size:16px;font-weight:700;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:10px;transition:border-color .15s, transform .1s;
  }
  .home-btn:hover{border-color:var(--accent);transform:translateY(-1px);}
  .home-btn .hb-icon{font-size:34px;}

  .back-btn{
    background:none;border:none;color:var(--grey-strong);cursor:pointer;font-size:13px;font-weight:600;
    padding:4px 0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px;
  }
  .back-btn:hover{color:var(--ink);}

  h2.form-title{margin:0 0 4px;font-size:19px;}
  p.form-sub{margin:0 0 18px;color:var(--grey-strong);font-size:12.5px;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--grey-strong);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:var(--panel);color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:span 3;}

  .yn-group{display:flex;align-items:center;gap:16px;padding:9px 0;}
  .yn-group .yn-label{font-size:13px;flex:1;min-width:220px;}
  .yn-opt{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;}

  .check-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;}
  .check-row input{width:16px;height:16px;}

  .btn{
    padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;font-size:13.5px;color:var(--ink);font-weight:600;
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn.danger{color:#b0281e;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

  .settings-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .settings-tab{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;font-size:12.5px;font-weight:600;color:var(--grey-strong);
  }
  .settings-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  table.list-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.list-table th{text-align:left;padding:6px 8px;color:var(--grey-strong);font-size:11px;text-transform:uppercase;border-bottom:2px solid var(--line);}
  table.list-table td{padding:6px 8px;border-bottom:1px solid var(--line);}
  table.list-table td input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;}
  table.list-table .rm-btn{border:none;background:none;color:#b0281e;cursor:pointer;font-size:16px;line-height:1;}
  .add-row-btn{margin-top:8px;}

  .note{font-size:11.5px;color:var(--grey-strong);line-height:1.5;}

  #gate{position:fixed;inset:0;background:var(--paper);z-index:100;display:flex;align-items:center;justify-content:center;}
  #gate.hidden{display:none;}
  .gate-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:90%;max-width:320px;text-align:center;}
  .gate-box h2{margin:0 0 6px;font-size:18px;}
  .gate-box p{margin:0 0 16px;font-size:12.5px;color:var(--grey-strong);}
  .gate-box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;margin-bottom:10px;}
  .gate-box button{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:14px;cursor:pointer;}
  .gate-error{color:#b0281e;font-size:12px;min-height:16px;margin-bottom:6px;}

  #printArea{display:none;}
  @page{margin:12mm;}
  @media print{
    #gate, #app{display:none !important;}
    #printArea{display:block !important;}
  }

  /* ---------- Powercheck ---------- */
  :root{
    --good:#2f7d4f;
    --good-bg:#e6f2ea;
    --warn:#b3791b;
    --warn-bg:#faf1de;
    --bad:#b0281e;
    --bad-bg:#fbe9e7;
  }
  .pc-grid{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.2fr);gap:20px;align-items:start;}
  @media (max-width:720px){ .pc-grid{grid-template-columns:1fr;} }
  .pc-field{padding:10px 0;border-bottom:1px solid var(--line);}
  .pc-field:last-child{border-bottom:none;}
  .pc-field-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .pc-field-name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .pc-field-unit{font-size:11px;color:var(--grey-strong);font-weight:500;margin-left:4px;}
  .pc-field-val{font-size:14px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
  .pc-field input[type="range"]{width:100%;accent-color:var(--accent);}
  .pc-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px;}
  .pc-toggle button{flex:1;padding:8px 10px;border:none;background:var(--panel);color:var(--grey-strong);font-size:12.5px;font-weight:700;cursor:pointer;}
  .pc-toggle button + button{border-left:1px solid var(--line);}
  .pc-toggle button[aria-pressed="true"]{background:var(--ink);color:#fff;}
  .pc-gauge-wrap{max-width:420px;margin:0 auto;}
  .pc-gauge-readout{text-align:center;margin-top:2px;}
  .pc-gauge-figure{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
  .pc-gauge-caption{font-size:11px;color:var(--grey-strong);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
  .pc-status-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.3px;margin-bottom:12px;}
  .pc-status-chip.pass{background:var(--good-bg);color:var(--good);}
  .pc-status-chip.fail{background:var(--bad-bg);color:var(--bad);}
  .pc-status-chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .pc-readout-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .pc-readout-row:last-child{border-bottom:none;}
  .pc-readout-row .v{font-weight:800;font-variant-numeric:tabular-nums;}
  .pc-note-strip{display:flex;gap:8px;align-items:flex-start;background:var(--warn-bg);color:#7a5410;border:1px solid #e7d3a4;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;margin-top:14px;}
  .pc-note-strip[hidden]{display:none;}
  .pc-note-strip .ico{font-size:14px;line-height:1.3;}
  .pc-tech{margin-top:14px;font-size:12px;}
  .pc-tech summary{cursor:pointer;color:var(--grey-strong);font-weight:700;}
  .pc-tech-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 16px;margin-top:10px;}
  .pc-tech-grid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0;color:var(--grey-strong);}
  .pc-tech-grid span{color:var(--ink);font-weight:700;}

  /* ---------- EC135 T2+ Power Check ---------- */
  .ec-engine{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .ec-engine:last-child{margin-bottom:0;}
  .ec-engine-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .ec-engine-title{font-weight:800;font-size:15px;}
  .ec-gauge-wrap{max-width:280px;margin:0 auto;}
  .ec-overall{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:10px;background:var(--paper);border:1px solid var(--line);margin-bottom:16px;}
  .ec-overall .lbl{font-weight:800;font-size:14px;}
  .ec-ambient{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;padding:12px 16px 2px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;background:var(--paper);}
  @media (max-width:560px){ .ec-ambient{grid-template-columns:1fr;} }
  .pc-field-row{display:flex;align-items:center;gap:10px;}
  .pc-field-row input[type="range"]{flex:1;width:auto;}
  .pc-stepper{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .pc-step-btn{width:28px;height:28px;border:none;background:var(--panel);color:var(--ink);font-size:15px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .pc-step-btn:active{background:var(--accent);color:#fff;}
  .pc-step-btn + .pc-step-btn{border-left:1px solid var(--line);}
  .pc-step-btn.wide{width:auto;height:28px;padding:0 12px;font-size:11.5px;font-weight:700;white-space:nowrap;}

  /* ---------- Bleed Valve Test ---------- */
  .bv-check{padding:12px 0;border-bottom:1px solid var(--line);}
  .bv-check:last-child{border-bottom:none;}
  .bv-check-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
  .bv-check-title{font-weight:800;font-size:14px;}

  /* ---------- Pilot Elementary Task Training ---------- */
  .pt-table{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;}
  .pt-table th,.pt-table td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:middle;overflow:hidden;}
  .pt-table th{font-size:9.5px;text-transform:uppercase;color:var(--grey-strong);white-space:nowrap;}
  .pt-table td.chk{text-align:center;}
  .pt-table td.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pt-table td.lic{white-space:nowrap;}
  .pt-orphan-tag{display:inline-block;font-size:9px;font-weight:700;color:var(--warn);margin-left:4px;white-space:normal;}
  .pt-table input[type="date"],.pt-table input[type="text"]{border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:11px;width:100%;}
  .pt-due{font-weight:800;}
  .pt-due.ok{color:var(--good);}
  .pt-due.warn{color:var(--warn);}
  .pt-due.bad{color:var(--bad);}
  .pt-table .rm-btn{border:none;background:none;color:#b0281e;cursor:pointer;font-size:15px;line-height:1;}
  .pt-icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;font-size:12px;line-height:1;padding:3px 5px;}
  .pt-actions-cell{white-space:nowrap;}
  .pt-ac-grid{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;}
  .pt-ac-grid label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .pt-section-title{font-weight:800;font-size:13.5px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ink);}
  .pt-check-grid{display:flex;flex-direction:column;}
  .pt-check-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-bottom:1px solid var(--line);font-size:13px;}
  .pt-check-row:last-child{border-bottom:none;}
  .pt-check-row input[type="checkbox"]{margin-top:2px;flex-shrink:0;}
  .pt-check-row.pt-extra{background:rgba(240,180,40,0.10);}
  .pt-check-cat{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--grey-strong);margin:10px 0 2px;}
  .pt-ad-groups{display:flex;flex-wrap:wrap;gap:24px;}
  .pt-ad-col{flex:1;min-width:260px;}

  /* ---------- MCM (Maintenance Control Manual) document ---------- */
  .mcm-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;}
  .mcm-toolbar select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12.5px;max-width:340px;}
  .mcm-badge{display:inline-block;background:var(--warn);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:1px 7px;margin-left:5px;vertical-align:middle;}
  .mcm-meta-bar{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:11.5px;color:var(--grey-strong);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
  .mcm-meta-bar b{color:var(--ink);}
  .mcm-page{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 22px;}
  .mcm-b{position:relative;padding:4px 14px 4px 2px;margin:0 0 8px;}
  .mcm-b.mcm-changed{border-right:4px solid var(--warn);padding-right:12px;background:rgba(240,180,40,0.06);}
  .mcm-b-heading{font-size:15px;font-weight:800;margin-top:14px;}
  .mcm-b-subheading{font-size:13.5px;font-weight:700;font-style:italic;margin-top:10px;}
  .mcm-b-paragraph{font-size:12.5px;line-height:1.6;white-space:pre-wrap;}
  .mcm-table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:11.5px;}
  .mcm-table td,.mcm-table th{border:1px solid var(--line);padding:4px 6px;vertical-align:top;}
  .mcm-table.mcm-edit-table td{padding:2px;}
  .mcm-table.mcm-edit-table input{width:100%;border:1px solid transparent;border-radius:4px;padding:3px 4px;font-size:11.5px;}
  .mcm-table.mcm-edit-table input:focus{border-color:var(--line);}
  .mcm-b-image img{max-width:100%;height:auto;display:block;margin:8px auto;}
  .mcm-generated-note{font-size:10.5px;color:var(--grey-strong);font-style:italic;margin-bottom:6px;}
  .mcm-edit-block{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .mcm-edit-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .mcm-edit-type{font-size:9.5px;text-transform:uppercase;font-weight:800;color:var(--grey-strong);margin-right:auto;}
  .mcm-fmt-btn,.mcm-del-btn,.mcm-img-replace-btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;font-size:11px;padding:2px 8px;}
  .mcm-del-btn{color:#b0281e;}
  .mcm-edit-textarea{width:100%;min-height:56px;font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical;}
  .mcm-add-block-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0;padding-top:12px;border-top:1px solid var(--line);}
  .mcm-add-block-row span{font-size:11px;font-weight:700;color:var(--grey-strong);}
  .mcm-publish-panel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:rgba(240,180,40,0.08);}
  .mcm-publish-panel label{display:block;font-size:11px;font-weight:700;margin:6px 0 2px;}
  .mcm-publish-panel input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;}
  .mcm-cert-scan img{max-width:100%;border:1px solid var(--line);border-radius:6px;margin:8px 0;}

  /* ---------- EC130 Tail Rotor Balancing ---------- */
  .trb-section{margin:18px 0;padding-top:14px;border-top:1px solid var(--line);}
  .trb-section:first-of-type{border-top:none;padding-top:0;}
  .trb-section h3{font-size:14px;margin:0 0 8px;}
  .trb-note{font-size:11.5px;color:var(--grey-strong);margin:0 0 10px;line-height:1.5;}
  .trb-banner{border-radius:8px;padding:10px 14px;font-weight:700;font-size:13px;margin-bottom:10px;}
  .trb-banner.ok{background:rgba(40,180,100,0.12);color:#1a7a44;border:1px solid rgba(40,180,100,0.35);}
  .trb-banner.warn{background:rgba(240,180,40,0.12);color:#8a6100;border:1px solid rgba(240,180,40,0.4);}
  .trb-point-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .trb-point-card h4{margin:0 0 6px;font-size:12.5px;}
  .trb-qty-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;}
  .trb-qty-row label{display:flex;align-items:center;gap:4px;}
  .trb-qty-row input[type="number"]{width:52px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;}
  .trb-phase-inputs{display:flex;gap:4px;align-items:center;}
  .trb-phase-inputs input{width:52px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;}
  .trb-points-table td,.trb-history-table td{font-size:11.5px;}
  /* two 4in x 2in labels, front + back */
  .ptl-label{width:4in;height:2in;box-sizing:border-box;padding:0.05in 0.09in;font-family:Calibri,Tahoma,"Segoe UI",Arial,Helvetica,sans-serif;letter-spacing:0.25px;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;color:#000;background:#fff;}
  .ptl-label, .ptl-label *{font-weight:400 !important;}   /* no bold anywhere -- bold strokes were smearing/skewing on print */
  .ptl-label + .ptl-label{margin-top:0.1in;}
  .ptl-head{display:flex;align-items:center;gap:6px;margin-bottom:1px;}
  .ptl-head img{height:0.22in;width:auto;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}
  .ptl-head h1{font-size:10.7px;margin:0;flex:1;}
  .ptl-head .ptl-id{font-size:9.7px;}
  /* Quick note / placard label, 4in wide x 2in high -- font size is chosen by the user on the entry
     form (default: last size used) and applied inline to .nl-body at print time, not fixed here.
     Top/bottom padding (the label's "header"/"footer" margin) is kept to 1/8in so as much of the
     label as possible goes to the note text itself. */
  .note-label{width:4in;height:2in;box-sizing:border-box;padding:0.125in 0.18in;font-family:Calibri,Tahoma,"Segoe UI",Arial,Helvetica,sans-serif;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;color:#000;background:#fff;display:flex;flex-direction:column;}
  .note-label .nl-body{flex:1;white-space:pre-wrap;overflow:hidden;line-height:1.28;}
  .ptl-sub{font-size:6.3px;line-height:1.2;margin-bottom:2px;}
  /* Rule lines: Chrome snaps any CSS border under 1px up to a full 1px (0.75pt) when printing, so the old
     0.3px/0.5px borders were all really 0.75pt. For a genuinely thinner (half-weight, 0.375pt) line, the
     1px border is kept for layout but made transparent, and the visible line is a 1px pseudo-element
     squashed to half height with transform:scaleY(.5). (A 0.5px background strip was tried first, but
     Chrome's pixel snapping randomly dropped some of the lines.) */
  .ptl-tasks{font-size:6.9px;line-height:1.15;border-top:1px solid transparent;position:relative;}
  .ptl-tasks::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:#000;transform:scaleY(.5);transform-origin:top;}
  .ptl-tasks div{border-bottom:1px solid transparent;padding:0.3px 0;position:relative;}
  .ptl-tasks div::after, .ptl-ads div div::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#000;transform:scaleY(.5);transform-origin:bottom;}
  .ptl-back-top{font-size:8.7px;margin-bottom:2.5px;}
  .ptl-ads{display:flex;gap:6px;font-size:7.9px;margin-bottom:2.5px;}
  .ptl-ads > div{flex:1;}
  .ptl-ads div div{border-bottom:1px solid transparent;padding:0.4px 0;position:relative;}
  .ptl-meta{font-size:8px;line-height:1.4;}
  .ptl-meta b{display:inline-block;min-width:0.62in;}
  .ptl-sig-label{margin-left:6px;}

<script>
(function(){
  // ---------- storage: Supabase (same project as AME Work Schedule) with localStorage cache ----------
  // Every key here is prefixed "forms:" so this app can share the same Supabase table
  // (app_data, a plain key/value store) without ever colliding with the schedule app's keys.
  const SUPABASE_URL = 'https://frlehxadkvgwzyxovwua.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ioAPLi8DWuC0HCUUYEeQ3Q_dildZYKI';
  const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');

  // Surfaced so a caller that cares (e.g. the Pilot Training Card save button) can tell the user their
  // change didn't actually reach the cloud, instead of the write failing completely silently -- which is
  // exactly what was making edits (an unchecked box, etc.) look like they "didn't save": the POST below
  // was never checking its response status, so a rejected write (auth, RLS, whatever) looked identical to
  // a successful one, and the next load elsewhere would pull the old un-edited row right back down.
  window.__storageLastError = null;

  async function storageGet(key){
    if(SUPABASE_CONFIGURED){
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + encodeURIComponent(key) + '&select=value', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if(res.ok){
          const rows = await res.json();
          if(rows && rows.length){
            try{ localStorage.setItem('cache:'+key, rows[0].value); }catch(e){}
            return rows[0].value;
          }
          // No row on the server yet for this key -- fall through to whatever's cached locally rather
          // than treating "server has nothing" as "the answer is nothing" (a transient/empty response
          // here should never be able to stomp a value we already have cached from a previous save).
        } else {
          window.__storageLastError = 'GET ' + key + ': HTTP ' + res.status;
        }
      }catch(e){ window.__storageLastError = 'GET ' + key + ': ' + e; /* offline — fall back to cache */ }
    }
    try{ return localStorage.getItem('cache:'+key); }catch(e){ return null; }
  }

  // Every write is chained onto this single queue so two saves fired close together
  // always reach the network in the order they were made — otherwise an older, smaller
  // snapshot could land after a newer one and silently overwrite it.
  let __storageWriteQueue = Promise.resolve();

  // Returns true only once the row has actually been confirmed written (HTTP 2xx) -- callers that skip
  // checking this will keep behaving exactly as before (local cache is always updated first), but a
  // caller that DOES check it can now tell the user "this didn't actually sync" instead of staying quiet.
  // In-memory (not persisted) history of the last few values saved to each key, so "Undo" can
  // offer the last few states to jump back to. Resets on reload -- a short-term working-session
  // convenience, not a durable audit trail synced anywhere.
  const SAVE_HISTORY_BY_KEY = {};
  const SAVE_HISTORY_LIMIT = 5; // current state + up to 4 prior states to restore
  function recordSaveHistory(key, value){
    const hist = SAVE_HISTORY_BY_KEY[key] || (SAVE_HISTORY_BY_KEY[key] = []);
    if(!hist.length || hist[hist.length-1].value !== value){
      hist.push({ ts: Date.now(), value: value });
      if(hist.length > SAVE_HISTORY_LIMIT) hist.shift();
    }
  }

  async function storageSet(key, value){
    try{ localStorage.setItem('cache:'+key, value); }catch(e){}
    recordSaveHistory(key, value);
    if(!SUPABASE_CONFIGURED) return true;
    let ok = true;
    const doWrite = async ()=>{
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?on_conflict=key', {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify({ key: key, value: value })
        });
        if(!res.ok){
          ok = false;
          let detail = '';
          try{ detail = await res.text(); }catch(e2){}
          window.__storageLastError = 'PUT ' + key + ': HTTP ' + res.status + (detail?(' — '+detail.slice(0,300)):'');
          console.error('storageSet failed', key, res.status, detail);
        }
      }catch(e){
        ok = false;
        window.__storageLastError = 'PUT ' + key + ': ' + e;
        console.error('storageSet failed', key, e);
        /* best effort — local cache above still has it */
      }
    };
    __storageWriteQueue = __storageWriteQueue.then(doWrite, doWrite);
    await __storageWriteQueue;
    return ok;
  }

  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function escapeHTML(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayISO(){
    const d = new Date();
    const m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function fmtDateNice(iso){
    if(!iso) return '';
    const parts = iso.split('-'); if(parts.length!==3) return iso;
    const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return parseInt(parts[2],10)+'-'+MONTHS[parseInt(parts[1],10)-1]+'-'+parts[0];
  }

      docControl: {

    };
  }

  async function loadSettings(){
    try{
      const raw = await storageGet('forms:settings', true);
      if(raw){
        const parsed = JSON.parse(raw);
        // migrate old shared docControl {revision,revisionDate} to the new per-form shape
        if(parsed.docControl && 'revision' in parsed.docControl){
          delete parsed.docControl;
        }
        state.settings = Object.assign(defaultSettings(), parsed);
      } else {
        state.settings = defaultSettings();
      }
    }catch(e){
      state.settings = defaultSettings();
    }
    // back-fill any per-form docControl keys (e.g. "page") added after a station last saved settings —
    // the shallow merge above replaces each form's whole docControl entry, so older saved blobs
    // can be missing newer fields entirely.
    const defaultDocControl = defaultSettings().docControl;
    Object.keys(defaultDocControl).forEach(k=>{
      state.settings.docControl[k] = Object.assign({}, defaultDocControl[k], state.settings.docControl[k]||{});
    });
  }
  async function saveSettings(){
    await storageSet('forms:settings', JSON.stringify(state.settings), true);
  }

  // ---------- saved form records (searchable history + "new form from this") ----------
  function newRecordId(){
    return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }
  async function loadRecords(){
    try{
      const raw = await storageGet('forms:records', true);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  async function saveRecord(rec){
    // fetch-then-append — if two stations hit "Prepare PDF" at the exact same instant this can
    // race and one save could be lost, same limitation the rest of this shared backend already has.
    const records = await loadRecords();
    records.push(rec);
    await storageSet('forms:records', JSON.stringify(records), true);
    return rec;
  }
  function buildRecord(formType, formLabel, reg, dateISO, description, data){
    return {
      id: newRecordId(),
      formType: formType,
      formLabel: formLabel,
      reg: reg || '',
      date: dateISO || '',
      description: description || '',
      data: data,
      createdAt: new Date().toISOString()
    };
  }

  // ---------- Undo (single most recent change, per storage key) ----------
  // Generic describer for a "list of records" key (forms:records, ptrain:records): compares two
  // JSON-array snapshots by their .id field and explains, in plain language, what changed between
  // them, regardless of which specific form/screen made the save.
  function describeRecordsChange(prevJSON, nextJSON){
    try{
      const prev = prevJSON ? JSON.parse(prevJSON) : [];
      const next = JSON.parse(nextJSON);
      if(!Array.isArray(prev) || !Array.isArray(next)) return 'Changes saved';
      const prevById = new Map(prev.map(r=>[r.id,r]));
      const nextById = new Map(next.map(r=>[r.id,r]));
      const added = next.filter(r=>!prevById.has(r.id));
      const removed = prev.filter(r=>!nextById.has(r.id));
      const labelOf = r => {
        const name = r.formLabel || r.traineeName || r.name || r.title || ('Record #' + (r.id!=null?r.id:''));
        const sub = r.reg || r.originalTrainingDate || r.date || '';
        return name + (sub ? ' ('+sub+')' : '');
      };
      if(added.length && !removed.length){
        return added.length === 1 ? ('Saved "'+labelOf(added[0])+'"') : (added.length+' records saved');
      }
      if(removed.length && !added.length){
        return removed.length === 1 ? ('Removed "'+labelOf(removed[0])+'"') : (removed.length+' records removed');
      }
      if(!added.length && !removed.length && next.length === prev.length){
        const changed = next.filter(n => JSON.stringify(n) !== JSON.stringify(prevById.get(n.id)));
        if(!changed.length) return 'No change';
        return changed.length === 1 ? ('Edited "'+labelOf(changed[0])+'"') : (changed.length+' records edited');
      }
      const parts = [];
      if(added.length) parts.push(added.length+' added');
      if(removed.length) parts.push(removed.length+' removed');
      return parts.length ? parts.join(', ') : 'Changes saved';
    }catch(e){ return 'Changes saved'; }
  }

  // Areas the single global Undo button can revert -- one entry per tracked storage key. "restore"
  // is called with the historical raw value to write back; it should persist it and refresh
  // whatever's currently on screen so the change is actually visible.
  const UNDO_SOURCES = [
    {
      key: 'forms:records',
      title: 'Maintenance Forms',
      describe: describeRecordsChange,
      restore: async (value)=>{
        await storageSet('forms:records', value);
        if(document.getElementById('viewSavedForms').style.display !== 'none') renderSavedForms();
      }
    }
  ];

  // Small non-blocking confirmation banner (auto-hides), used for Undo feedback so a click
  // doesn't need a modal or dialog to confirm what just happened.
  let undoToastTimer = null;
  function showUndoToast(msg){
    let el = document.getElementById('undoToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'undoToast';
      el.className = 'undo-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3000);
  }

  // One click undoes just the single most recent change made anywhere in the app this session --
  // whichever tracked area (Maintenance Forms, Pilot Training Records, MCM Document) was saved to
  // most recently is the one that gets reverted, so an accidental delete on any screen can be
  // reversed in one tap without picking from a list.
  async function undoLastChange(){
    let latest = null;
    for(const src of UNDO_SOURCES){
      const hist = SAVE_HISTORY_BY_KEY[src.key] || [];
      if(hist.length < 2) continue;
      const ts = hist[hist.length-1].ts;
      if(!latest || ts > latest.ts) latest = { src, hist, ts };
    }
    if(!latest){
      showUndoToast('Nothing to undo yet this session.');
      return;
    }
    const { src, hist } = latest;
    const current = hist[hist.length-1];
    const prior = hist[hist.length-2];
    const label = src.describe(prior.value, current.value);
    await src.restore(prior.value);
    showUndoToast('Undone: ' + label);
  }

  async function renderSavedForms(){
    showView('SavedForms');

    el.innerHTML = backButton() + '<div class="panel"><h2 class="form-title">Saved Forms</h2><p class="form-sub">Loading…</p></div>';

  function renderSavedFormsBody(){
    const el = document.getElementById('viewSavedForms');
    if(!el) return; // user navigated away before the records finished loading
    const s = state.settings;
    const records = savedFormsCache || [];
    const f = savedFormsFilter;
    const filtered = records.filter(r=>{

  // ---------- gate (password) ----------
  async function initGate(){
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const title = document.getElementById('gateTitle');
    const sub = document.getElementById('gateSub');
    const err = document.getElementById('gateError');
    const p1 = document.getElementById('gatePass');
    const p2 = document.getElementById('gatePass2');
    const btn = document.getElementById('gateBtn');

    if(!SUPABASE_CONFIGURED){
      err.textContent = 'Heads up: this copy isn\'t connected to the shared database yet (still using this browser only).';
    }

    let existingHash = await storageGet('forms:app_password', true);
    const settingUp = !existingHash;
    if(settingUp){
      title.textContent = 'Set a password';
      sub.textContent = 'Create a password to protect these forms. Anyone who has this link and the password can view and submit them.';
      p2.style.display = 'block';
      btn.textContent = 'Set password';
      p1.autocomplete = 'new-password';
      p2.autocomplete = 'new-password';
    } else {
      title.textContent = 'Enter password';
      sub.textContent = 'These forms are password-protected.';
      p2.style.display = 'none';
      btn.textContent = 'Unlock';
      p1.autocomplete = 'current-password';
    }

    function unlock(){
      gate.classList.add('hidden');
      app.style.display = 'block';
      // If the person has already tapped into some other screen by the time settings finish
      // loading (slow/flaky connection), don't yank them back to Home out from under them.
      loadSettings().then(()=>{ if(!userHasNavigatedFromHome) showHome(); });
      initAutoLock();
    }

    document.getElementById('gateForm').onsubmit = async (e)=>{
      e.preventDefault();
      err.textContent = '';
      if(settingUp){
        if(!p1.value || p1.value.length<4){ err.textContent='Use at least 4 characters.'; return; }
        if(p1.value !== p2.value){ err.textContent='Passwords do not match.'; return; }
        const hash = await sha256(p1.value);
        await storageSet('forms:app_password', hash, true);
        unlock();
      } else {
        const hash = await sha256(p1.value);
        if(hash === existingHash){ unlock(); }
        else { err.textContent = 'Incorrect password.'; p1.value=''; }
      }
    };
  }

  // ---------- auto-lock: a real reload, plus a catch-up check for backgrounded/sleeping tabs ----------
  let sessionTimeoutMinutes = 30;
  let inactivityTimer = null;
  let lastActivityAt = Date.now();
  function lockApp(){ location.reload(); }
  function resetInactivityTimer(){
    lastActivityAt = Date.now();
    if(inactivityTimer) clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(lockApp, sessionTimeoutMinutes * 60 * 1000);
  }
  ['mousemove','keydown','mousedown','scroll','touchstart'].forEach(evt=>{
    document.addEventListener(evt, ()=>{ if(document.getElementById('app').style.display !== 'none') resetInactivityTimer(); }, {passive:true});
  });
  function checkStaleOnReturn(){
    if(document.getElementById('app').style.display === 'none') return;
    if((Date.now() - lastActivityAt) >= sessionTimeoutMinutes * 60 * 1000) lockApp();
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') checkStaleOnReturn(); });
  window.addEventListener('focus', checkStaleOnReturn);

  const VIEWS = ['Home','Settings','SavedForms','FleetForecast','Forms','Checks','Balancing','Tolerance','TrackBalance','MajorMod','MinorMod','Anticipation','Powercheck','PowercheckTrend','Ec135pc','Ec135Trend','BleedValve','BleedValveTrend','TailRotorBalance','Ec120TailRotorBalance','Ec135TailRotorBalance','DriveShaftBalance'];
  // Tracks whether the person has clicked into any screen other than Home yet. unlock() kicks off
  // loadSettings() in the background and only shows Home once it resolves -- on a slow/flaky
  // connection that can take a moment, and without this flag its completion would silently yank
  // the person back to Home even if they'd already tapped into a form in the meantime.
  let userHasNavigatedFromHome = false;
  function showView(name){
    if(name !== 'Home') userHasNavigatedFromHome = true;
    // ToolTracker's (and OpsGearTracker's) view div sits outside #app (see the comment where
    // #viewToolTracker is declared) to escape #app's max-width:1000px, but #app's own
    // padding-bottom:60px still applies regardless of which children are hidden -- zero it out
    // while either is showing so its own wrapper padding is the only spacing in play, and
    // restore it for every other view.
    const appEl = document.getElementById('app');
    if(appEl) appEl.style.paddingBottom = (name === 'ToolTracker' || name === 'OpsGearTracker') ? '0px' : '';
    VIEWS.forEach(v=>{
      const el = document.getElementById('view'+v);
      if(!el) return;
      const isTarget = (v===name);
      el.style.display = isTarget ? 'block' : 'none';
      // Clear a view's content as soon as it's no longer the active one (Home's markup is
      // static, not re-rendered, so it's left alone). Otherwise every hidden view keeps its
      // last-rendered DOM around forever — harmless to a real mouse click, but it leaves
      // stale duplicate elements (e.g. every form's back button shares the same class)
      // sitting in the document, which is exactly the kind of thing that causes confusing
      // bugs later.
      if(!isTarget && v!=='Home') el.innerHTML = '';
    });
    window.scrollTo(0,0);
  }

  function flashSaved(btnId){
    const b = document.getElementById(btnId);
    if(!b) return;
    const orig = b.textContent;
    b.textContent = 'Saved ✓';
    setTimeout(()=>{ if(document.getElementById(btnId)) document.getElementById(btnId).textContent = orig; }, 1200);
  }

  // Rebuilt from the original dynamic (XFA) PDF's own field definitions — its captions,

  function nowDatetimeLocal(){
    const d = new Date();
    const pad = n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  function fmtDatetimeNice(val){
    if(!val) return '';
    const d = new Date(val);
    if(isNaN(d)) return val;
    const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const pad = n=>String(n).padStart(2,'0');
    return d.getDate()+'-'+MONTHS[d.getMonth()]+'-'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function pcInterpAscending(x, xs, ys) {
    const n = xs.length;
    if (n === 1) return { y: ys[0], extrapolated: false };
    let i, extrapolated = false;
    if (x <= xs[0]) { i = 0; extrapolated = x < xs[0]; }
    else if (x >= xs[n - 1]) { i = n - 2; extrapolated = x > xs[n - 1]; }
    else {
      let lo = 0, hi = n - 1;
      while (lo < hi - 1) {
        const mid = (lo + hi) >> 1;
        if (xs[mid] <= x) lo = mid; else hi = mid;
      }
      i = lo;
    }
    const x0 = xs[i], x1 = xs[i + 1], y0 = ys[i], y1 = ys[i + 1];
    const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
    return { y: y0 + t * (y1 - y0), extrapolated };
  }

  function pcBracketIndex(x, xs) {
    const n = xs.length;
    if (x <= xs[0]) return 0;
    if (x >= xs[n - 1]) return n - 2;
    let lo = 0, hi = n - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (xs[mid] <= x) lo = mid; else hi = mid;
    }
    return lo;
  }

  function pcKAtHpForBand(targetHp, points) {
    const rev = points.slice().reverse();
    const hps = rev.map(p => p[1]);
    const ks = rev.map(p => p[0]);
    return pcInterpAscending(targetHp, hps, ks);
  }

  function pcMakeEngine(data) {
    const { tqnrBands, hpBands, sandFilterNone, sandFilterInstalled, threshold, limits } = data;

    function kFromTorque(nr, torque) {
      const kAtNr = tqnrBands.map(b => {
        const t = (b.nrTop - nr) / (b.nrTop - b.nrBot);
        return b.kTop + t * (b.kBot - b.kTop);
      });
      const torques = tqnrBands.map(b => b.torque);
      const torqueAsc = torques.slice().reverse();
      const kDesc = kAtNr.slice().reverse();
      const r = pcInterpAscending(torque, torqueAsc, kDesc);
      return { k: r.y, extrapolated: r.extrapolated, kAtNr, torques };
    }

    function torqueFromK(targetK, kAtNr, torques) {
      return pcInterpAscending(targetK, kAtNr, torques);
    }

    function hpChain(hp, targetK, anchorAtActual) {
      const actualK = hpBands.map(b => pcKAtHpForBand(hp, b.points).y);
      const groundK = hpBands.map(b => pcKAtHpForBand(0, b.points).y);
      if (!anchorAtActual) {
        const n = hpBands.length - 1;
        const arr = groundK.slice(0, n);
        const idx = pcBracketIndex(targetK, arr);
        const gL = groundK[idx], gR = groundK[idx + 1];
        const aL = actualK[idx], aR = actualK[idx + 1];
        const t = gR === gL ? 0 : (targetK - gL) / (gR - gL);
        return aL + t * (aR - aL);
      } else {
        const arr = actualK;
        const idx = pcBracketIndex(targetK, arr);
        const aL = actualK[idx], aR = actualK[idx + 1];
        const gL = groundK[idx], gR = groundK[idx + 1];
        const t = aR === aL ? 0 : (targetK - aL) / (aR - aL);
        return gL + t * (gR - gL);
      }
    }

    function marginKFromOatNg(oat, ng, sandInstalled) {
      const bands = sandInstalled ? sandFilterInstalled : sandFilterNone;
      const kAtOat = bands.map(b => {
        const oats = b.points.map(p => p[1]);
        const ks = b.points.map(p => p[0]);
        return pcInterpAscending(oat, oats, ks).y;
      });
      const ngVals = bands.map(b => b.ng);
      const ngAsc = ngVals.slice().reverse();
      const kDesc = kAtOat.slice().reverse();
      return pcInterpAscending(ng, ngAsc, kDesc).y;
    }

    function thresholdLine(x) {
      const { r8, s8, r9, s9 } = threshold;
      const t = (x - r8) / (r9 - r8);
      return s8 + t * (s9 - s8);
    }

    function compute(inputs) {
      const { nr, torque, hp, oat, ng, sandFilterInstalled } = inputs;
      const kFromTq = kFromTorque(nr, torque);
      const marginK = marginKFromOatNg(oat, ng, sandFilterInstalled);
      const hpValueOut = hpChain(hp, kFromTq.k, false);
      const hpMarginOut = hpChain(hp, marginK, true);
      const minTorqueResult = torqueFromK(hpMarginOut, kFromTq.kAtNr, kFromTq.torques);
      const minimumTorque = minTorqueResult.y;
      const torqueMargin = torque - minimumTorque;
      const sandCheckValue = thresholdLine(marginK);
      const sandCheckThreshold = thresholdLine(hpValueOut);
      const passed = sandCheckValue < sandCheckThreshold;
      return {
        minimumTorque, torqueMargin, passed,
        extrapolated: kFromTq.extrapolated || minTorqueResult.extrapolated,
        debug: { kFromTorque: kFromTq.k, marginK, hpValueOut, hpMarginOut, sandCheckValue, sandCheckThreshold },
      };
    }

    return { compute, limits };
  }

  function pcCssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  const PC_GMIN = -20, PC_GMAX = 30, PC_GWARN = 3;
  function pcAngleFor(v){

    return Math.PI - t * Math.PI;
  }

  function pcDrawGauge(canvas, margin){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H - 40, r = 200, rInner = 160;
    ctx.clearRect(0,0,W,H);

    const badC = pcCssVar('--bad') || '#b0281e';
    const warnC = pcCssVar('--warn') || '#b3791b';
    const goodC = pcCssVar('--good') || '#2f7d4f';
    const lineC = pcCssVar('--line') || '#dfe2da';
    const grey = pcCssVar('--grey-strong') || '#6b6558';
    const ink = pcCssVar('--ink') || '#1c2b24';

    ctx.lineWidth = r - rInner;
    ctx.lineCap = 'butt';
    const zones = [
      { from: PC_GMIN, to: 0, color: badC },
      { from: 0, to: PC_GWARN, color: warnC },
      { from: PC_GWARN, to: PC_GMAX, color: goodC },
    ];
    zones.forEach(z => {
      ctx.beginPath();
      ctx.strokeStyle = z.color;
      ctx.globalAlpha = 0.88;
      ctx.arc(cx, cy, (r+rInner)/2, -pcAngleFor(z.from), -pcAngleFor(z.to), false);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.fillStyle = grey;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let v = PC_GMIN; v <= PC_GMAX; v += 10) {
      const a = pcAngleFor(v);
      const x1 = cx + Math.cos(a) * (r + 3);
      const y1 = cy - Math.sin(a) * (r + 3);
      const x2 = cx + Math.cos(a) * (rInner - 3);
      const y2 = cy - Math.sin(a) * (rInner - 3);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineC;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lx = cx + Math.cos(a) * (r + 18);
      const ly = cy - Math.sin(a) * (r + 18);
      ctx.fillText((v>0?'+':'') + v, lx, ly);
    }

    const clamped = Math.max(PC_GMIN, Math.min(PC_GMAX, margin));
    const a = pcAngleFor(clamped);
    const nx = cx + Math.cos(a) * (rInner - 6);
    const ny = cy - Math.sin(a) * (rInner - 6);
    const needleC = margin < 0 ? badC : (margin < PC_GWARN ? warnC : goodC);
    ctx.strokeStyle = needleC;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = needleC; ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = ink; ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
  }

  // Number of decimal places implied by a slider's step (e.g. 0.01 -> 2, 10 -> 0) -- used so the
  // readout next to a slider actually shows the extra precision once a field's step is made finer
  // (a 0.01-step OAT field displayed with only 1 decimal would make the Up/Down buttons look like
  // they're doing nothing).
  function pcStepDecimals(step){
    const s = String(step);
    const i = s.indexOf('.');
    return i === -1 ? 0 : (s.length - i - 1);
  }
  function pcFormatFieldVal(f, val){
    const d = pcStepDecimals(f.step);
    return d > 0 ? val.toFixed(d) : Math.round(val).toLocaleString();
  }

  // and the Arriel 1D1 Bleed Valve Test (the EC135 Power Check has its own compact +/- version of
  // the same idea -- ec135FieldHTML below -- left as-is since it wasn't part of this request).
  function pcFieldHtmlWithSteppers(f, formatFn){
    return (
      '<div class="pc-field">' +
        '<div class="pc-field-head"><span class="pc-field-name">'+f.label+'<span class="pc-field-unit">'+f.unit+'</span></span><span class="pc-field-val" id="'+f.id+'Val">'+formatFn(f, f.value)+'</span></div>' +
        '<div class="pc-field-row">' +
          '<input type="range" id="'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+f.value+'">' +
          '<div class="pc-stepper">' +
            '<button type="button" class="pc-step-btn wide" data-target="'+f.id+'" data-dir="-1" aria-label="Decrease '+f.label+'">&minus;</button>' +
            '<button type="button" class="pc-step-btn wide" data-target="'+f.id+'" data-dir="1" aria-label="Increase '+f.label+'">+</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  // Rounds a stepped value back onto the step grid and clamps it to [min,max], cleaning up the
  // floating-point noise a fine step like 0.01 would otherwise leave behind (e.g. 0.1+0.2).
  function pcRoundToStep(val, step, min, max){
    const decimals = Math.max(pcStepDecimals(step), 6);
    let v = Math.round(val/step) * step;
    v = parseFloat(v.toFixed(decimals));
    return Math.max(min, Math.min(max, v));
  }
  // Delegated click handler for every "Up"/"Down" stepper button inside `container` -- one listener
  // covers all of a view's fields since the buttons are re-rendered along with everything else.
  function pcWireSteppers(container){
    container.addEventListener('click', (e)=>{
      const btn = e.target.closest('.pc-step-btn');
      if (!btn) return;
      const inp = document.getElementById(btn.dataset.target);
      if (!inp) return;
      const step = parseFloat(inp.step) || 1;
      const min = parseFloat(inp.min), max = parseFloat(inp.max);
      const dir = parseFloat(btn.dataset.dir);
      const val = pcRoundToStep(parseFloat(inp.value) + dir*step, step, min, max);
      inp.value = val;
      inp.dispatchEvent(new Event('input', { bubbles:true }));
    });
  }

      const inputs = readInputs();

      const marginFigure = document.getElementById('pcMarginFigure');

      document.getElementById('pcTqObservedOut').textContent = inputs.torque.toFixed(1) + '%';

      chip.classList.add(out.passed ? 'pass' : 'fail');

      const tg = document.getElementById('pcTechGrid');

      tg.innerHTML = [
        ['K (NR, Torque)', d.kFromTorque],
        ['K margin (OAT, Ng)', d.marginK],
        ['Hp value K', d.hpValueOut],
        ['Hp margin K', d.hpMarginOut],
        ['Sand check value', d.sandCheckValue],
        ['Sand check threshold', d.sandCheckThreshold],
      ].map(([k,v])=>'<div>'+k+'<span>'+v.toFixed(4)+'</span></div>').join('');

      pcDrawGauge(document.getElementById('pcGauge'), out.torqueMargin);
    }

    document.getElementById('pcPrintBtn').onclick = ()=>{
      const dateISO = document.getElementById('pcDate').value;
      const reg = document.getElementById('pcReg').value;
      const pilot = document.getElementById('pcPilot').value;
      const inputs = readInputs();
      const out = pcEngine.compute(inputs);
      const recordData = {
        date: dateISO,
        reg: reg,
        pilot: pilot,
        nr: inputs.nr,
        torque: inputs.torque,
        hp: inputs.hp,
        oat: inputs.oat,
        ng: inputs.ng,
        sandFilterInstalled: inputs.sandFilterInstalled,
        out: out,
      };
      openPrint(buildPowercheckPrintHtml(Object.assign({}, recordData, { date: fmtDateNice(dateISO) })));
      // keep a record of every printed report (searchable in Saved Forms, and plotted in Trend
      // monitoring) -- best-effort: saveRecord/storageSet never reject, so this never blocks or
      // breaks the print itself.
      const desc = 'Pilot: '+(pilot||'—')+' — '+(out.passed?'PASSED':'FAILED');
      saveRecord(buildRecord('powercheck', 'AS350B2 Power Check', reg, dateISO, desc, recordData)).catch(()=>{});
    };

    syncSand();
    update();
  }

  // Single-series variant of ec135DrawTrendChart (below), since the AS350 Powercheck has one
  // torque-margin result per record rather than the EC135's per-engine pair.
  function pcDrawSingleTrendChart(canvas, records, valueFn){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const padL = 48, padR = 14, padT = 20, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const allVals = records.map(valueFn);
    if(!allVals.length) return;
    let vMin = Math.min(0, Math.min.apply(null, allVals));
    let vMax = Math.max.apply(null, allVals);
    const pad = (vMax - vMin) * 0.15 || 1;
    vMin -= pad; vMax += pad;

    function xFor(i){ return padL + (records.length<=1 ? plotW/2 : plotW * i/(records.length-1)); }
    function yFor(v){ return padT + plotH * (1 - (v - vMin)/(vMax - vMin)); }

    ctx.strokeStyle = pcCssVar('--line');
    ctx.lineWidth = 1;
    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for(let t=0;t<=ticks;t++){
      const v = vMin + (vMax-vMin)*t/ticks;
      const y = yFor(v);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL-6, y);
    }
    if(vMin < 0 && vMax > 0){
      ctx.strokeStyle = pcCssVar('--bad');
      ctx.setLineDash([4,3]);
      const y0 = yFor(0);
      ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
      ctx.setLineDash([]);
    }

    const pts = records.map((r,i)=>({ x:xFor(i), y:yFor(valueFn(r)) }));
    ctx.strokeStyle = pcCssVar('--accent');
    ctx.fillStyle = pcCssVar('--accent');
    ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
    ctx.stroke();
    pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); });

    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelIdxs = records.length>1 ? [0, Math.floor((records.length-1)/2), records.length-1] : [0];
    labelIdxs.forEach(i=>{
      const label = (fmtDateNice(records[i].date) || records[i].date || '').split(',')[0];
      ctx.fillText(label, xFor(i), H-padB+8);
    });
  }


  // ---------- Arriel 1D1 Bleed Valve Test ----------
  // Digitized from Safran Helicopter Engines Arriel 1D1 Maintenance Manual,
  // Task 75-31-00-750-803-A01 "Bleed Valve Tests (Electrical)", Figures 1301 (opening)
  // and 1302 (closing) - "Rating that causes bleed valve opening/closing", N1(NG)% vs
  // outside temperature, for Zp = 0/5,000/10,000/15,000/20,000 ft. Each of the 5 lines per
  // chart is a straight line (digitized via calibrated pixel-to-data-axis regression from
  // the source PDF at 400dpi), so no curve-fitting is needed - just 2 endpoint points per
  // line. Cross-checked against both worked examples printed in the manual: opening
  // T0=-25 degC/Zp=5,000ft -> 86% (this model: 86.36%), closing T0=20 degC/Zp=15,000ft ->
  // 96% (this model: 96.09%).
  const BLEEDVALVE_DATA = {"opening":[{"zp":0,"t0a":-12.903,"n1a":87.415,"t0b":19.442,"n1b":92.338},{"zp":5000,"t0a":-7.431,"n1a":89.056,"t0b":25.279,"n1b":94.077},{"zp":10000,"t0a":-2.81,"n1a":90.609,"t0b":33.182,"n1b":96.09},{"zp":15000,"t0a":0.716,"n1a":92.067,"t0b":24.549,"n1b":95.752},{"zp":20000,"t0a":-13.146,"n1a":90.871,"t0b":15.429,"n1b":95.533}],"closing":[{"zp":0,"t0a":-6.113,"n1a":89.522,"t0b":24.057,"n1b":94.103},{"zp":5000,"t0a":1.307,"n1a":91.494,"t0b":30.991,"n1b":95.961},{"zp":10000,"t0a":8.242,"n1a":93.369,"t0b":33.667,"n1b":97.186},{"zp":15000,"t0a":-0.274,"n1a":92.958,"t0b":24.665,"n1b":96.812},{"zp":20000,"t0a":-13.169,"n1a":91.924,"t0b":15.298,"n1b":96.57}],"tolerance":{"plus":2,"minus":1},"limits":{"oat":[-50,50],"zp":[0,20000],"n1":[80,102]}};

  function bvLineN1(band, t0){
    const t = (t0 - band.t0a) / (band.t0b - band.t0a);
    return band.n1a + t * (band.n1b - band.n1a);
  }
  function bvBracketIndex(x, xs){
    const n = xs.length;
    if (x <= xs[0]) return 0;
    if (x >= xs[n-1]) return n-2;
    let lo=0, hi=n-1;
    while (lo < hi-1){
      const mid = (lo+hi)>>1;
      if (xs[mid] <= x) lo=mid; else hi=mid;
    }
    return lo;
  }
  function bvGraphN1(bands, t0, zp){
    const zps = bands.map(b=>b.zp);
    const zpClamped = Math.max(zps[0], Math.min(zps[zps.length-1], zp));
    const idx = bvBracketIndex(zpClamped, zps);
    const nLeft = bvLineN1(bands[idx], t0);
    const nRight = bvLineN1(bands[idx+1], t0);
    const zLeft = zps[idx], zRight = zps[idx+1];
    const t = zRight===zLeft ? 0 : (zpClamped-zLeft)/(zRight-zLeft);
    return nLeft + t*(nRight-nLeft);
  }
  function bvCompute(bands, t0, zp, actual){
    const graph = bvGraphN1(bands, t0, zp);
    const lo = graph - BLEEDVALVE_DATA.tolerance.minus;
    const hi = graph + BLEEDVALVE_DATA.tolerance.plus;
    const passed = actual >= lo && actual <= hi;
    const margin = actual < lo ? (actual-lo) : (actual > hi ? (hi-actual) : Math.min(actual-lo, hi-actual));
    return { graph, lo, hi, passed, margin };
  }

  function bvFormatFieldVal(f, val){
    const d = pcStepDecimals(f.step);
    return d > 0 ? val.toFixed(d) : Math.round(val).toLocaleString();

      '</div>';

    document.getElementById('bvReg').value = prefill ? (prefill.reg||'') : '';
    document.getElementById('bvDate').value = prefill ? (prefill.date||todayISO()) : todayISO();
    if (prefill && prefill.pilot) document.getElementById('bvPilot').value = prefill.pilot;

    function setCheck(prefix, result){
      const chip = document.getElementById(prefix+'Chip');
      chip.classList.remove('pass','fail');
      chip.classList.add(result.passed ? 'pass' : 'fail');

      const actualClose = parseFloat(fEls.bvActClose.value);

      const openResult = bvCompute(BLEEDVALVE_DATA.opening, t0, zp, actualOpen);
      const closeResult = bvCompute(BLEEDVALVE_DATA.closing, t0, zp, actualClose);

      const openResult = bvCompute(BLEEDVALVE_DATA.opening, t0, zp, actualOpen);
      const closeResult = bvCompute(BLEEDVALVE_DATA.closing, t0, zp, actualClose);
      const recordData = {
        date: dateISO,
        reg: reg,
        pilot: pilot,
        oat: t0,
        zp: zp,
        actOpen: actualOpen,
        actClose: actualClose,
        openResult: openResult,
        closeResult: closeResult,
      };
      openPrint(buildBleedValvePrintHtml(Object.assign({}, recordData, { date: fmtDateNice(dateISO) })));
      // keep a record of every printed report (searchable in Saved Forms, and plotted in Trend
      // monitoring) -- best-effort: saveRecord/storageSet never reject, so this never blocks or
      // breaks the print itself.
      const allPass = openResult.passed && closeResult.passed;
      const desc = 'Pilot: '+(pilot||'—')+' — '+(allPass?'PASSED':'FAILED');
      saveRecord(buildRecord('bleedvalve', 'Arriel 1D1 Bleed Valve Test', reg, dateISO, desc, recordData)).catch(()=>{});
    };

    update();
  }

  // ---------- EC130 Tail Rotor Balancing (VIBREX 2000 / CHADWICK 8500C+ / ROTORTUNER) ----------
  // Digitizes AMM 64-21-00,5-1A "Adjustment - Balancing of the tail rotor hub". The AMM's three
  // charts (measured phase -> the two nearest of the six balance points, measured amplitude ->
  // total load weight, total load weight -> washer combination) are graphical; here the first two
  // are rebuilt as straight-line math anchored on the AMM's own worked example (a 1.05 ips / 6:40
  // unbalance -> 3.75 g total, split 67% at Point 1 / 33% at Point 6). The third (weight -> washer
  // part numbers) is intentionally left to the AME: balance washers can be trimmed by grinding in
  // 0.01 g steps, so rather than matching a fixed catalog of washer sizes, this tool just states the
  // exact target weight and lets the AME enter the actual total they leave installed at each point --
  // which may be less than what's currently there if material is removed/ground down rather than
  // added. The clock-angle calibration offset (to compensate for the analyzer's accelerometer/
  // target/photoelectric-cell installation shifting between runs) is calculated automatically from
  // the very next run after a logged correction: since that correction's weight and location are
  // known, and the resulting reading is measured, the offset needed to rotate the raw reading into
  // the hub's own reference frame can be solved for directly (see trbAutoCalOffset below) -- no
  // manual guess needed, though it can still be overridden. This is a maintenance aid, not a
  // substitute for the approved AMM procedure -- always follow the current AMM for the actual job.
  const TRB_POINTS = ['1','2','3','4','5','6'];
  // Six balance points sit 60° (2 clock-hours) apart. Walking the AMM's Chart N°1 phase axis from
  // 0:00 to 12:00 in 2-hour steps visits the points in this order (confirmed against the AMM's
  // worked example: phase 6:40 falls between the "1" step (6:00) and the "6" step (8:00), and
  // yields 67% / 33% exactly as printed).
  const TRB_POINT_SEQ = ['4','3','2','1','6','5','4'];
  const TRB_UNBALANCE_THRESHOLD_IPS = 0.05;
  // g per ips, from the AMM's own worked example (1.05 ips -> 3.75 g total load weight).
  const TRB_AMP_TO_WEIGHT_SLOPE = 3.75 / 1.05;

  function trbRound2(n){ return Math.round((n||0) * 100) / 100; }

  function trbBlankPoints(){
    const pts = {};
    TRB_POINTS.forEach(p=>{ pts[p] = { currentG: 0 }; });
    return pts;
  }
  function trbNewJob(){
    return { reg:'', date: todayISO(), ame:'', points: trbBlankPoints(), runs: [] };
  }
  // Defensive migration: a job saved by an earlier version of this tool tracked weight as
  // {existingG, addedWashers:{13,14,15}} against a fixed washer catalog. Collapse that into a
  // single currentG so old saved jobs still open cleanly under the simplified gram-only model.
  const TRB_LEGACY_WASHER_G = { 13:0.77, 14:2.06, 15:0.45 };
  function trbNormalizePoint(pt){
    if(!pt) return { currentG: 0 };
    if(typeof pt.currentG === 'number') return pt;
    let g = pt.existingG || 0;
    if(pt.addedWashers){
      Object.keys(pt.addedWashers).forEach(id=>{ g += (pt.addedWashers[id]||0) * (TRB_LEGACY_WASHER_G[id]||0); });
    }
    return { currentG: trbRound2(g) };
  }
  function trbPointTotalG(pt){ return trbRound2(pt.currentG||0); }

  // Phase parsing: accepts hour (0-12) + minute (0-59) as read directly off the analyzer, exactly
  // as printed on the AMM's Chart N°1 axis (e.g. "6:40").
  function trbPhaseToMinutes(hour, minute){
    hour = ((hour%12)+12)%12; // 12 folds to 0 -- both ends of the chart are the same physical point
    minute = ((minute%60)+60)%60;
    return hour*60 + minute;
  }
  function trbApplyCalOffset(rawMin, offsetMin){
    return ((rawMin + (offsetMin||0)) % 720 + 720) % 720;
  }
  function trbMinutesToClockStr(min){
    min = ((min%720)+720)%720;
    const h = Math.floor(min/60), m = Math.round(min%60);
    return h+':'+String(m).padStart(2,'0');
  }
  function trbBracket(min){
    let k = Math.floor(min/120);
    if(k>5) k = 5;
    if(k<0) k = 0;
    const r = min - k*120;
    return {
      lowerPoint: TRB_POINT_SEQ[k],
      upperPoint: TRB_POINT_SEQ[k+1],
      lowerPct: (120-r)/120*100,
      upperPct: r/120*100,
    };
  }
  function trbAnalyze(ampIps, rawPhaseMin, calOffsetMin, job){
    const correctedMin = trbApplyCalOffset(rawPhaseMin, calOffsetMin);
    if(ampIps <= TRB_UNBALANCE_THRESHOLD_IPS){
      return { balanced:true, correctedMin: correctedMin };
    }
    const totalWeight = ampIps * TRB_AMP_TO_WEIGHT_SLOPE;
    const br = trbBracket(correctedMin);
    const cand = [
      { point: br.lowerPoint, pct: br.lowerPct },
      { point: br.upperPoint, pct: br.upperPct },
    ].filter(c=> c.pct >= 0.5);
    const points = cand.map(c=>{
      const targetAddG = trbRound2(totalWeight * c.pct/100);
      const currentTotal = trbRound2((job.points[c.point]||{}).currentG||0);
      const suggestedTotal = trbRound2(currentTotal + targetAddG);
      return { point: c.point, pct: c.pct, targetAddG: targetAddG, currentTotal: currentTotal, suggestedTotal: suggestedTotal };
    });
    return { balanced:false, correctedMin: correctedMin, totalWeight: trbRound2(totalWeight), points: points };
  }

  // ---------- automatic clock-angle calibration ----------
  // Each point's fixed position on Chart N°1's phase axis, in "corrected" (hub-referenced) minutes
  // -- the same walking order as TRB_POINT_SEQ, at every 120-minute (60°) step.
  const TRB_POINT_POS_MIN = { '4':0, '3':120, '2':240, '1':360, '6':480, '5':600 };

  function trbPolarToXY(mag, minutes){
    const rad = (minutes||0) * Math.PI/360; // 720 minutes == 360° == 2*PI
    return { x: mag*Math.cos(rad), y: mag*Math.sin(rad) };
  }
  function trbXYToAngleMin(x, y){
    if(Math.abs(x) < 1e-9 && Math.abs(y) < 1e-9) return null;
    const rad = Math.atan2(y, x);
    return ((rad * 360/Math.PI) % 720 + 720) % 720;
  }
  // The vector equivalent (in the same "ips at a hub position" units as a chart reading) of a
  // confirmed run's actual point-by-point weight changes -- adding grams at a point contributes a
  // vector at that point's fixed position; removing grams (a negative delta) contributes the
  // opposite way, exactly as if weight had been added 180° across the hub.
  function trbCorrectionVectorXY(points){
    let x = 0, y = 0;
    (points||[]).forEach(p=>{
      const delta = (p.actualTotal||0) - (p.previousTotal||0);
      if(!delta) return;
      const v = trbPolarToXY(delta/TRB_AMP_TO_WEIGHT_SLOPE, TRB_POINT_POS_MIN[p.point]);
      x += v.x; y += v.y;
    });
    return { x: x, y: y };
  }
  // Solves for the clock-angle calibration offset from a known correction: given the raw reading
  // just before a confirmed correction (prevRun) and the raw reading just after it (this run's own
  // amplitude/phase), the change between the two readings should equal the correction vector once
  // both readings are rotated into the hub-referenced frame. Because that required rotation (the
  // offset) only rotates a vector -- it doesn't change its length -- it can be solved for from
  // angles alone, independent of any amplitude/weight mismatch: offset = angle(correction) -
  // angle(before - after). Returns null when there's nothing to calibrate from (no prior correction
  // run) or the inputs are degenerate (e.g. the reading didn't change at all).
  function trbAutoCalOffset(prevRun, newAmpIps, newRawPhaseMin){
    if(!prevRun || !prevRun.points || !prevRun.points.length) return null;
    if(newAmpIps==null || isNaN(newAmpIps) || newRawPhaseMin==null || isNaN(newRawPhaseMin)) return null;
    const before = trbPolarToXY(prevRun.ampIps, prevRun.rawPhaseMin);
    const after = trbPolarToXY(newAmpIps, newRawPhaseMin);
    const diff = { x: before.x - after.x, y: before.y - after.y };
    const angleDiff = trbXYToAngleMin(diff.x, diff.y);
    if(angleDiff === null) return null;
    const c = trbCorrectionVectorXY(prevRun.points);
    const angleC = trbXYToAngleMin(c.x, c.y);
    if(angleC === null) return null;
    return ((angleC - angleDiff) % 720 + 720) % 720;
  }

  // ---------- UI ----------
  function renderTailRotorBalance(prefill){
    showView('TailRotorBalance');
    const el = document.getElementById('viewTailRotorBalance');
    const s = state.settings;
    let job = prefill ? JSON.parse(JSON.stringify(prefill)) : trbNewJob();
    // Older/incomplete saved jobs, or a fresh default, might be missing a point, or still be in the
    // old washer-catalog shape -- never let that blow up the render.
    TRB_POINTS.forEach(p=>{ job.points[p] = trbNormalizePoint(job.points[p]); });
    let pending = null; // { ampIps, rawPhaseMin, calOffsetMin, calOffsetAuto, analysis, actual: {point: newTotalG} }
    const h130Aircraft = (s.aircraft||[]).filter(a => ptrainModelToType(a.model) === 'H130');
    // Once a run's correction has been confirmed, the clock-angle calibration offset for the next
    // run is calculated automatically (see trbAutoCalOffset) from that correction plus the new
    // reading -- computed once, at Analyze time, from whatever's in the amplitude/phase fields then.
    // An AME who wants to enter a known offset instead can flip this switch.
    let calOffsetOverridden = false;
    let manualCalOffsetMin = 0;
    let calOffsetAutoFailed = false;

    function paint(){
      const nextRunNumber = job.runs.length + 1;
      const lastRun = job.runs.length ? job.runs[job.runs.length-1] : null;
      const canAutoCalibrate = !!(lastRun && lastRun.points && lastRun.points.length);

      let calOffsetFieldHtml, calOffsetNoteHtml;
      if(!canAutoCalibrate){
        calOffsetFieldHtml = '<input type="number" step="1" id="trbCalOffset" value="'+(pending?pending.calOffsetMin:manualCalOffsetMin)+'">';
        calOffsetNoteHtml = 'Compensates for the accelerometer/target/photoelectric-cell installation shifting slightly between runs — leave at 0 unless you have a known offset. Once a correction from a run is logged below, this will be calculated automatically for the next run.';
      } else if(calOffsetOverridden){
        calOffsetFieldHtml = '<input type="number" step="1" id="trbCalOffset" value="'+(pending?pending.calOffsetMin:manualCalOffsetMin)+'"> <button type="button" class="btn" id="trbCalAutoBtn" style="margin-left:8px;">Use automatic calculation</button>';
        calOffsetNoteHtml = calOffsetAutoFailed ?
          ('Could not calculate automatically from Run '+lastRun.runNumber+' (its reading and this one\'s were the same, so no rotation could be measured) — defaulted to 0 min. Enter a known offset if you have one, or leave at 0.') :
          'Manually overridden — enter a known calibration offset.';
      } else {
        calOffsetFieldHtml = '<input type="number" id="trbCalOffset" value="'+(pending?pending.calOffsetMin:'')+'" placeholder="auto" disabled> <button type="button" class="btn" id="trbCalOverrideBtn" style="margin-left:8px;">Override manually</button>';
        calOffsetNoteHtml = pending ?
          ('Calculated automatically from Run '+lastRun.runNumber+'\'s confirmed correction: '+pending.calOffsetMin+' min.') :
          ('Calculated automatically from Run '+lastRun.runNumber+'\'s confirmed correction and this run\'s reading, once you click Analyze.');
      }

      el.innerHTML =
        backButton() +
        '<div class="panel">' +
          '<h2 class="form-title">EC130 Tail Rotor Balancing</h2>' +
          '<p class="form-sub">Digitized AMM 64-21-00,5-1A charts (VIBREX 2000 / CHADWICK 8500C+ / ROTORTUNER). Enter measured amplitude (IPS) and phase (clock position) to get a suggested weight/location correction, then log the exact weight actually left installed. Starting with the run after a logged correction, the clock-angle calibration offset is calculated automatically from that correction and the new reading (still overridable). For training and reference use only — always follow the current approved AMM.</p>' +

          '<div class="trb-section">' +
            '<h3>Job</h3>' +
            '<div class="field-grid">' +
              '<div class="field"><label for="trbReg">A/C registration</label><select id="trbReg">'+opts(h130Aircraft, a=>a.reg, a=>a.reg, 'Select registration')+'</select></div>' +
              '<div class="field"><label for="trbDate">Date</label><input type="date" id="trbDate" value="'+(job.date||todayISO())+'"></div>' +
              '<div class="field"><label for="trbAme">AME</label><select id="trbAme">'+opts(s.ames, a=>a.name, a=>a.name, 'Select AME')+'</select></div>' +
            '</div>' +
          '</div>' +

          '<div class="trb-section">' +
            '<h3>Current weight per point</h3>' +
            '<p class="trb-note">Enter what’s already installed at each of the 6 hub positions before this job starts, in grams. Balance washers can be trimmed by grinding/removing material in 0.01 g steps — this figure updates automatically once a run\'s correction is logged below.</p>' +
            '<div style="overflow-x:auto;">' +
            '<table class="pt-table trb-points-table">' +
              '<thead><tr><th>Point</th><th>Current weight (g)</th></tr></thead>' +
              '<tbody>' +
                TRB_POINTS.map(p=>{
                  const pt = job.points[p];
                  return '<tr>' +
                    '<td><b>N°'+p+'</b></td>' +
                    '<td><input type="number" step="0.01" min="0" class="trb-existing-input" data-point="'+p+'" value="'+trbPointTotalG(pt).toFixed(2)+'" style="width:90px;"> g</td>' +
                  '</tr>';
                }).join('') +
              '</tbody>' +
            '</table>' +
            '</div>' +
          '</div>' +

          '<div class="trb-section">' +
            '<h3>Run '+nextRunNumber+' — new measurement</h3>' +
            '<div class="field-grid">' +
              '<div class="field"><label for="trbAmp">Measured amplitude (IPS)</label><input type="number" step="0.01" min="0" id="trbAmp" value="'+(pending?pending.ampIps:'')+'"></div>' +
              '<div class="field"><label>Measured phase (clock position)</label><div class="trb-phase-inputs"><input type="number" min="0" max="12" id="trbPhaseHour" value="'+(pending?Math.floor(pending.rawPhaseMin/60):'')+'" placeholder="H">:<input type="number" min="0" max="59" id="trbPhaseMin" value="'+(pending?String(pending.rawPhaseMin%60).padStart(2,'0'):'')+'" placeholder="MM"></div></div>' +
              '<div class="field"><label for="trbCalOffset">Clock angle calibration offset (min)</label>'+calOffsetFieldHtml+'</div>' +
            '</div>' +
            '<p class="trb-note">'+calOffsetNoteHtml+'</p>' +
            '<div class="btn-row"><button type="button" class="btn primary" id="trbAnalyzeBtn">Analyze</button></div>' +
          '</div>' +

          (pending && pending.analysis ? trbAnalysisSectionHtml(pending) : '') +

          '<div class="trb-section">' +
            '<h3>Run history</h3>' +
            (job.runs.length ? (
              '<div style="overflow-x:auto;">' +
              '<table class="pt-table trb-history-table">' +
                '<thead><tr><th>Run</th><th>Amplitude</th><th>Raw phase</th><th>Cal. offset</th><th>Corrected phase</th><th>Result</th><th>Points adjusted</th></tr></thead>' +
                '<tbody>' +
                  job.runs.map(r=>{
                    const adj = r.balanced ? '—' : (r.points||[]).map(p=>{
                      const delta = trbRound2(p.actualTotal - p.previousTotal);
                      const dir = delta > 0 ? ('+'+delta.toFixed(2)+' g added') : (delta < 0 ? (delta.toFixed(2)+' g removed') : 'no change');
                      return 'N°'+p.point+': '+p.previousTotal.toFixed(2)+' → '+p.actualTotal.toFixed(2)+' g ('+dir+')';
                    }).join('; ');
                    return '<tr>' +
                      '<td>'+r.runNumber+'</td>' +
                      '<td>'+r.ampIps.toFixed(2)+' ips</td>' +
                      '<td>'+trbMinutesToClockStr(r.rawPhaseMin)+'</td>' +
                      '<td>'+(r.calOffsetMin||0)+' min'+(r.calOffsetAuto?' <i>(auto)</i>':'')+'</td>' +
                      '<td>'+trbMinutesToClockStr(r.correctedMin)+'</td>' +
                      '<td>'+(r.balanced ? '<span style="color:var(--good);font-weight:800;">BALANCED</span>' : '<span style="color:var(--warn);font-weight:800;">CORRECTION</span>')+'</td>' +
                      '<td>'+adj+'</td>' +
                    '</tr>';
                  }).join('') +
                '</tbody>' +
              '</table>' +
              '</div>'
            ) : '<p class="trb-note">No runs logged yet.</p>') +
          '</div>' +

          '<div class="btn-row" style="justify-content:flex-end;margin-top:16px;">' +
            '<button type="button" class="btn" id="trbNewJobBtn">✖ New job</button>' +
            '<button type="button" class="btn" id="trbPrintBtn">🖨️ Print report</button>' +
            '<button type="button" class="btn primary" id="trbSaveBtn">💾 Save job</button>' +
          '</div>' +
        '</div>';

      document.getElementById('trbReg').value = job.reg||'';
      if(job.ame) document.getElementById('trbAme').value = job.ame;
      document.getElementById('trbReg').onchange = (e)=>{ job.reg = e.target.value; };
      document.getElementById('trbDate').onchange = (e)=>{ job.date = e.target.value; };
      document.getElementById('trbAme').onchange = (e)=>{ job.ame = e.target.value; };

      el.querySelectorAll('.trb-existing-input').forEach(inp=>{
        inp.addEventListener('change', ()=>{
          const p = inp.dataset.point;
          job.points[p].currentG = Math.max(0, parseFloat(inp.value)||0);
          paint();
        });
      });

      const trbCalOffsetInput = document.getElementById('trbCalOffset');
      if(trbCalOffsetInput){
        trbCalOffsetInput.addEventListener('change', ()=>{
          const v = parseFloat(trbCalOffsetInput.value);
          manualCalOffsetMin = isNaN(v) ? 0 : v;
        });
      }
      const trbCalOverrideBtn = document.getElementById('trbCalOverrideBtn');
      if(trbCalOverrideBtn){
        trbCalOverrideBtn.onclick = ()=>{
          calOffsetOverridden = true;
          manualCalOffsetMin = 0;
          calOffsetAutoFailed = false;
          paint();
        };
      }
      const trbCalAutoBtn = document.getElementById('trbCalAutoBtn');
      if(trbCalAutoBtn){
        trbCalAutoBtn.onclick = ()=>{
          calOffsetOverridden = false;
          calOffsetAutoFailed = false;
          paint();
        };
      }

      document.getElementById('trbAnalyzeBtn').onclick = ()=>{
        const ampIps = parseFloat(document.getElementById('trbAmp').value);
        const hour = parseInt(document.getElementById('trbPhaseHour').value,10);
        const minute = parseInt(document.getElementById('trbPhaseMin').value,10);
        if(isNaN(ampIps) || ampIps < 0){ alert('Please enter a valid measured amplitude (IPS).'); return; }
        if(isNaN(hour) || isNaN(minute)){ alert('Please enter a valid measured phase (hour and minute).'); return; }
        const rawPhaseMin = trbPhaseToMinutes(hour, minute);
        let calOffsetMin, calOffsetAuto;
        if(canAutoCalibrate && !calOffsetOverridden){
          const auto = trbAutoCalOffset(lastRun, ampIps, rawPhaseMin);
          calOffsetMin = (auto!=null) ? Math.round(auto) : 0;
          calOffsetAuto = (auto!=null);
          if(auto==null){ calOffsetOverridden = true; manualCalOffsetMin = 0; calOffsetAutoFailed = true; }
        } else {
          calOffsetMin = parseFloat(document.getElementById('trbCalOffset').value)||0;
          calOffsetAuto = false;
        }
        const analysis = trbAnalyze(ampIps, rawPhaseMin, calOffsetMin, job);
        pending = { ampIps: ampIps, rawPhaseMin: rawPhaseMin, calOffsetMin: calOffsetMin, calOffsetAuto: calOffsetAuto, analysis: analysis, actual: {} };
        if(!analysis.balanced){
          analysis.points.forEach(p=>{ pending.actual[p.point] = p.suggestedTotal; });
        }
        paint();
      };

      if(pending && pending.analysis){
        wireAnalysisSection();
      }

      document.getElementById('trbNewJobBtn').onclick = ()=>{
        if(!confirm('Start a new job? This clears the current points, run history and job header (any unsaved data is lost — saved jobs remain in Saved Forms).')) return;
        job = trbNewJob();
        pending = null;
        calOffsetOverridden = false;
        manualCalOffsetMin = 0;
        calOffsetAutoFailed = false;
        paint();
      };

      document.getElementById('trbPrintBtn').onclick = ()=>{
        openPrint(buildTrbPrintHtml(Object.assign({}, job, { date: fmtDateNice(job.date) })));
      };

      document.getElementById('trbSaveBtn').onclick = ()=>{
        const desc = 'AME: '+(job.ame||'—')+' — '+job.runs.length+' run(s) logged'+(job.runs.length && job.runs[job.runs.length-1].balanced ? ', balanced' : '');
        saveRecord(buildRecord('tailrotorbalance', 'EC130 Tail Rotor Balancing', job.reg, job.date, desc, job)).then(()=>{
          alert('Job saved. You can reopen and continue it later from Saved Forms.');
        }).catch(()=>{ alert('Could not save the job right now, but you can keep working — try Save again in a moment.'); });
      };
    }

    function trbAnalysisSectionHtml(pend){
      const a = pend.analysis;
      if(a.balanced){
        return (
          '<div class="trb-section">' +
