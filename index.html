<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#14284b; --navy2:#1d3a6b; --accent:#2f6fd6; --accent-soft:#e7effc;
  --bg:#f3f5f9; --panel:#ffffff; --line:#d9dee8; --line2:#eef1f6;
  --text:#000000; --muted:#2e333b; --ok:#1f8a4c; --ok-soft:#e3f4ea;
  --warn:#b7791f; --warn-soft:#fdf3e1; --bad:#c0392b; --bad-soft:#fbe9e7;
  --gray-row:#eceff3; --sel:#d5e3fb;
  --radius:8px; --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 var(--font);color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:50px 1fr;height:100vh}
header.top{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
header.top .brand{font-weight:600;font-size:16px;letter-spacing:.2px;display:flex;align-items:center}
header.top .brand small{font-weight:400;opacity:.7;margin-left:8px;font-size:12px}
header.top .sp{flex:1}
#spacePill{cursor:pointer}
#spacePill .sbar{width:46px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;display:inline-block}
#spacePill .sbar i{display:block;height:100%;width:0;background:#46c37b;border-radius:4px}
#spacePill.warn .sbar i{background:#f1c40f}#spacePill.bad .sbar i{background:#ff6b5b}
#spacePill.bad{background:#c0392b}
#wsTabs{display:flex;gap:4px;align-self:stretch;align-items:flex-end;margin-left:10px}
#wsTabs button{background:rgba(255,255,255,.10);color:#fff;border:0;border-radius:8px 8px 0 0;padding:8px 16px 9px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#wsTabs button:hover{background:rgba(255,255,255,.2)}
#wsTabs button.on{background:var(--bg);color:var(--navy)}
#wsTabs .wsb{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:17px}
#wsTabs button.wsre{background:#f1c40f;color:#000;border-radius:6px;align-self:center;padding:5px 10px;font-size:12px}
#wsView{display:none;grid-column:1/3;min-height:0}
#wsView iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#wsView iframe.hide{display:none}
body.has-ws #brandTxt{display:none}
body.has-ws #brandCo{margin-left:0;opacity:1;font-size:15px;font-weight:600}
body.ws-trk #nav,body.ws-trk #main{display:none}
body.ws-trk #wsView{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.12)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#9aa4b5}
.pill.ok .dot{background:#46c37b}.pill.busy .dot{background:#f1c40f}.pill.err .dot{background:#ff6b5b}
header.top button.user{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
nav.side{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
nav.side .grp{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#000;margin:16px 8px 4px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;cursor:pointer}
nav.side a:hover{background:var(--line2)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side a .badge{font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-weight:600}
nav.side a .badge.w{background:var(--warn)}
main{overflow:auto;padding:16px 18px 40px}
h1{font-size:20px;margin:0 0 12px;font-weight:600}
h2{font-size:15px;margin:18px 0 8px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#2560bd}
.btn.danger{color:var(--bad);border-color:#e7b9b3}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-width:0}
::placeholder{color:#8a919c}
input:focus,select:focus,textarea:focus{outline:2px solid #b9d0f6;border-color:var(--accent)}
textarea{resize:vertical;min-height:54px;width:100%}
label.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:46vh}
.tbl-wrap.tall{max-height:68vh}
.tbl-wrap.short{max-height:30vh}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:#f6f8fb;text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;cursor:default}
table.t th.sortable{cursor:pointer}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.t td.wrap{white-space:normal}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f5f8fe}
table.t tr.sel td{background:var(--sel)!important}
table.t tr.na td{background:var(--gray-row);color:#777}
table.t tr.exp td{background:var(--bad-soft)}
table.t tr.soon td{background:var(--warn-soft)}
table.t tr.del td{color:var(--bad);text-decoration:line-through}
table.t td.r,table.t th.r{text-align:right}
table.t td.c,table.t th.c{text-align:center}
table.t input,table.t select{padding:3px 5px;width:100%;font-size:12.5px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--line2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.b{background:var(--bad-soft);color:var(--bad)}.tag.a{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:8px 12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:11.5px;color:#000;font-weight:600}
.f input,.f select{width:100%}
.f input[type=checkbox],label.chk input{width:auto;flex:none}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat .n{font-size:24px;font-weight:600}
.stat .l{color:#000;font-size:12px}
.stat.b .n{color:var(--bad)}.stat.w .n{color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.split{display:grid;grid-template-columns:1fr;gap:12px}
.note{background:var(--warn-soft);border:1px solid #f0d9ae;color:#7a5413;border-radius:6px;padding:8px 10px;font-size:12px}
.note.info{background:var(--accent-soft);border-color:#c6d8f7;color:#244c8f}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.totals{margin-left:auto;min-width:260px}
.totals div{display:flex;justify-content:space-between;padding:2px 0}
.totals .big{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,45,.42);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.25);width:min(760px,100%);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{width:min(1600px,100%)}
tr.undone td{color:var(--muted);text-decoration:line-through}tr.undone td:last-child{text-decoration:none}
.modal table.t th,.modal table.t td{padding-left:4px;padding-right:4px}
.modal table.t input[type=date]{min-width:0}
.mask{padding-left:6px!important;padding-right:6px!important}
.modal.wide .mb,.modal.xwide .mb{padding:12px 12px}
.rolegrid{column-width:230px;column-gap:18px}
.rolegrid .rg{break-inside:avoid;margin:0 0 12px}
.rolegrid .rgh{font-weight:700;text-decoration:underline;margin-bottom:4px}
.rolegrid label.chk{white-space:normal;display:flex;align-items:flex-start;gap:6px;margin:3px 0 3px 10px;line-height:1.3}
.rolegrid label.chk input{margin-top:2px}
#brandLogo{height:30px;width:auto;max-width:120px;object-fit:contain;margin-right:10px;vertical-align:middle;background:#fff;border-radius:4px;padding:2px 4px}
.actiles{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 16px}
.actile{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;min-width:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.actile:hover{border-color:var(--accent)}
.actile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:#f7faff}
.actile .reg{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:.5px}
.actile .l{font-size:12px;color:#000}
.actile .btn{align-self:flex-start}
.actile .x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;line-height:1}
.actile .x:hover{color:var(--bad)}
.actile.add{border-style:dashed;justify-content:center;align-items:center;color:var(--accent)}
.actile.add .reg{color:var(--accent)}
.actile.clear{border-style:dashed;justify-content:center}
.ss{position:relative;flex:1;min-width:0}
.ss>select{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%}
.ss>.ssi{width:100%}
.ssl{position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:70;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.sso{padding:6px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sso.on,.sso[data-i]:hover{background:var(--sel)}
.modal.xwide{width:min(1600px,100%)}
.modal table.t.rc input,.modal table.t.rc select{padding:5px 6px}
.modal table.t.rc td,.modal table.t.rc th{padding-left:4px;padding-right:4px}
.modal.narrow{width:min(460px,100%)}
.modal .mh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.modal .mh h3{margin:0;font-size:15px;flex:1}
.modal .mh .x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.modal .mb{padding:14px 16px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .sp{flex:1}
body.noprice .pr{display:none!important}
input.masked{-webkit-text-security:disc}
body.locked #app{display:none}
#auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,#2a4f8c 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;overflow:auto}
.authcard{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(400px,100%);padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.authcard h3{margin:4px 0 0;font-size:15px}
.authcard p{margin:0 0 4px}
.authhead{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.authhead img{max-height:42px;max-width:120px}
.authhead b{display:block;font-size:17px;color:var(--navy)}
.authhead span{color:var(--muted);font-size:12.5px}
.authfoot{margin-top:10px;text-align:center;font-size:12.5px}
.authfoot a{color:var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2330;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw}
#toast.on{opacity:.95}
#toast.err{background:var(--bad)}
.hide{display:none!important}
/* print */
#print{display:none}
@media print{
  body{background:#fff}
  #app,.mask,#toast{display:none!important}
  #print{display:block}
}
.doc{font:11px/1.35 Arial,Helvetica,sans-serif;color:#000;width:100%;padding:0 3px}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.doc .co{font-size:11px}
.doc .co b{font-size:16px;display:block;margin-bottom:2px;color:#14284b}
.doc .co img{max-height:60px;max-width:220px;display:block;margin-bottom:4px}
.doc table{border-collapse:collapse;width:100%}
.doc .meta td{border:1px solid #777;padding:2px 6px}
.doc .meta th{background:#d9dee8;border:1px solid #777;padding:3px 6px;font-size:13px}
.doc h2.ti{text-align:center;text-decoration:underline;font-weight:400;font-size:20px;margin:6px 0 12px}
.doc .box td,.doc .box th{border:1px solid #777;padding:3px 6px;vertical-align:top;text-align:left}
.doc .box th{background:#e3e7ee}
.doc .lines th{background:#d9dee8;border:1px solid #777;padding:3px 5px;font-size:10.5px}
.doc .lines td{border:1px solid #999;padding:2px 5px}
.doc .r{text-align:right}.doc .c{text-align:center}
.doc .aog{border:2px solid #c0392b;color:#c0392b;font-weight:700;text-align:center;padding:4px;font-size:14px;margin:8px 0}
.doc .sig{display:flex;justify-content:space-around;margin-top:50px}
.doc .sig div{border-top:1px solid #000;width:200px;text-align:center;padding-top:3px}
.labels .lbl{width:4in;height:2in;padding:.06in .1in .05in;font:9px/1.15 Arial,Helvetica,sans-serif;color:#000;overflow:hidden;page-break-after:always;display:flex;flex-direction:column;box-sizing:border-box}
.labels .lbl:last-child{page-break-after:auto}
.labels .lh{display:grid;grid-template-columns:1.1in 1fr auto;font-size:8px;border-bottom:1.5px solid #000;padding-bottom:1px;margin-bottom:2px}
.labels .k{font-weight:700;font-size:9px;white-space:nowrap}
.labels .big{display:grid;grid-template-columns:1.1in minmax(0,1fr);align-items:baseline;line-height:1.05}
.labels .big .k{font-size:12px}
.labels .big .val{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.labels .ds{display:grid;grid-template-columns:1.1in minmax(0,1fr);align-items:baseline;margin:1px 0}
.labels .ds .k{font-size:10px}
.labels .ds .dv{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.labels .cols{display:flex;gap:10px;margin-top:2px;align-items:flex-start}
.labels .cols table{border-collapse:collapse;flex:1;table-layout:fixed}
.labels .cols th{text-align:left;line-height:12.5px;font-size:9.8px;font-weight:700;width:66px;padding:0;white-space:nowrap;vertical-align:top}
.labels .cols td{font-size:9.8px;padding:0;height:12.5px;line-height:12.5px;vertical-align:top;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels .note1{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.labels .foot{display:flex;align-items:flex-end;gap:8px;margin-top:auto}
.labels .foot .bc{flex:0 0 auto;width:1.95in;height:.36in}
.labels .ds.loc{margin:auto 0 1px}
.labels .foot{justify-content:space-between}
.labels .foot .bc svg{width:100%;height:100%;display:block}
.labels .tnq{text-align:right;white-space:nowrap;line-height:1.2}
.labels .tnq .tn{font-size:14px}
.labels .tnq{flex:1;min-width:0}
.labels .tnq .lc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labels .tnq .lc .k{font-size:10px}
.labels .tnq .lc b{font-size:11.5px}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:50px auto 1fr}
  nav.side{display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .grp{display:none}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="brand"><img id="brandLogo" alt="" class="hide"><span id="brandTxt">Inventory Manager</span><small id="brandCo"></small></div>
    <div id="wsTabs"></div>
    <div class="sp"></div>
    <span class="pill hide" id="spacePill" title="Database space used"><span class="sbar"><i id="spaceFill"></i></span><span id="spaceTxt"></span></span>
    <span class="pill" id="syncPill"><span class="dot"></span><span id="syncTxt">Local only</span></span>
    <button class="user" id="userBtn" title="Change user name">👤 <span id="userName"></span></button>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
  <div id="wsView"></div>
</div>
<div id="print"></div>
<div id="toast"></div>
<datalist id="dl-pn"></datalist>
<datalist id="dl-loc"></datalist>
<datalist id="dl-billto"></datalist>
<datalist id="dl-reg"></datalist>
<script>
"use strict";
/* ===================== Utilities ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[, $]/g, '')); return isFinite(n) ? n : 0; };
const money = v => (typeof canPrice === 'function' && !canPrice()) ? '' : num(v).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qtyFmt = v => { const n = num(v); return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, '').replace(/\.$/, ''); };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nowIso = () => new Date().toISOString();
const fmtDate = s => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T12:00:00' : s); if (isNaN(d)) return s; return d.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: '2-digit' }); };
const fmtDT = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: '2-digit' }) + ' ' + d.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' }); };
const addMonths = (dateStr, m) => { const d = new Date(dateStr + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const addDays = (dateStr, n) => { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// part numbers and serial numbers never contain spaces
const noSpace = v => String(v ?? '').replace(/\s+/g, '');
const noSpaceList = (v, sep = ',') => String(v ?? '').split(',').map(noSpace).filter(Boolean).join(sep);
const pnKey = pn => noSpace(pn).toUpperCase();
const pnFix = pn => noSpace(pn).toUpperCase();          // part numbers: no spaces, capitals only
const pnFixList = (v, sep = ', ') => String(v || '').split(',').map(pnFix).filter(Boolean).join(sep);
const clone = o => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const MAP_COLLS = { parts: 8, items: 16, suppliers: 1, reqs: 1, pos: 1, ps: 1, invoices: 2, users: 1, bins: 1, picklists: 1, trk: 0 };   // 0 = every record is its own shard
// history sharded by month
function shardOf(coll, key, rec) {
  if (coll === 'history') return 'history:' + String(rec.date || '').slice(0, 7);
  const n = MAP_COLLS[coll];
  return n === 1 ? coll : n === 0 ? coll + ':' + key : coll + ':' + (hashStr(key) % n);
}

const live = rec => rec && !rec._del;
const S = () => DB.settings;
function user() { return (typeof CURRENT !== 'undefined' && CURRENT) ? CURRENT.name : 'user'; }

/* status of items: stock | quarantine | scrap | repair | deleted */
function partOf(item) { return DB.parts[pnKey(item.pn)]; }
let _idx = null, _idxVer = -1, dataVer = 0;
function itemIndex() {
  if (_idx && _idxVer === dataVer) return _idx;
  _idx = new Map();
  for (const i of Object.values(DB.items)) { if (!live(i)) continue; const k = pnKey(i.pn); let a = _idx.get(k); if (!a) _idx.set(k, a = []); a.push(i); }
  _idxVer = dataVer; return _idx;
}
function itemsOfPart(pn) { return (itemIndex().get(pnKey(pn)) || []).slice(); }
function availQty(pn, base) { return itemsOfPart(pn).filter(i => i.status === 'stock' && (!base || i.base === base)).reduce((a, i) => a + num(i.qty), 0); }
function itemCost(i) { return num(i.price) + num(i.freight); }
function retailOf(i) { if (i.retail !== '' && i.retail != null && num(i.retail) > 0) return num(i.retail); return +(itemCost(i) * (1 + num(S().markup) / 100)).toFixed(2); }
function supplierName(id) { const s = DB.suppliers[id]; return s && live(s) ? s.name : (id || ''); }

function nextTN() {
  let max = Math.max(num(DB.counters.tn), num(S().tnStart || 20000) - 1);
  for (const k in DB.items) { const n = parseInt(k, 10); if (isFinite(n) && String(n) === k && n > max) max = n; }
  DB.counters.tn = max + 1; markDirty('counters'); return String(max + 1);
}
function nextNo(kind) {
  const coll = { req: 'reqs', po: 'pos', ps: 'ps', inv: 'invoices', op: 'invoices' }[kind];
  let max = num(DB.counters[kind]);
  if (kind === 'po') max = Math.max(max, num(S().poStart || 4000) - 1);
  if (kind === 'ps') max = Math.max(max, num(S().psStart || 2000) - 1);
  if (kind === 'op') max = Math.max(max, num(S().opStart || 4000) - 1);
  for (const r of Object.values(DB[coll])) { if (kind === 'inv' && r.kind !== 'Invoice') continue; if (kind === 'op' && r.kind !== 'OpCost') continue; const n = num(r.seq); if (n > max) max = n; }
  DB.counters[kind] = max + 1; markDirty('counters'); return max + 1;
}

// red banner while the shared database can't be reached, and a warning when someone changes data meanwhile
function syncBanner() {
  let b = document.getElementById('syncBanner');
  if (!Sync._err) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'syncBanner'; b.style.cssText = 'position:fixed;left:0;right:0;top:50px;z-index:40;background:#c0392b;color:#fff;padding:7px 14px;font-weight:600;font-size:13px;text-align:center;cursor:pointer'; b.onclick = () => $('#syncPill').click(); document.body.appendChild(b); }
  b.textContent = '⚠ Not connected to the shared database — changes are kept on THIS computer only and other stations won\'t see them. Click for details.';
}
let _syncWarnAt = 0;
function warnIfSyncDown() {
  if (!Sync._err || typeof CURRENT === 'undefined' || !CURRENT || Date.now() - _syncWarnAt < 5 * 60000) return;
  _syncWarnAt = Date.now();
  setTimeout(() => modal({ title: '⚠ Sync problem', size: 'narrow', body: '<p>The <b>Sync</b> badge is <b style="color:var(--bad)">red</b>: what you just changed is saved on this computer, but it has <b>not</b> reached the shared database yet.</p><p class="small">Other stations will not see it until the connection works again. Avoid doing the same work on another computer in the meantime. Click the red badge for details or "Retry now".</p>', buttons: [{ label: 'Details…', onClick: () => setTimeout(() => $('#syncPill').click(), 50) }, { label: 'OK, understood', cls: 'pri' }] }), 300);
}
function putRec(coll, key, rec) { if (coll !== 'history') warnIfSyncDown(); Undo.touch(coll, key); rec._ts = Date.now(); DB[coll][key] = rec; dataVer++; markDirty(coll, key, rec); Undo.shadow(coll, key); if (coll === 'history') Undo.hist(key); return rec; }
function delRec(coll, key) { const r = DB[coll][key]; if (!r) return; Undo.touch(coll, key); dataVer++; const t = { _del: true, _ts: Date.now() }; if (coll === 'history') t.date = r.date; DB[coll][key] = t; markDirty(coll, key, t); Undo.shadow(coll, key); }

/* ===================== Undo journal =====================
   Every write made by one user action (same JS task) is a "group". When the group wrote a
   transaction-history entry, the previous version of every record it touched is stored on that
   history entry, so the whole action can be reversed later from Recent transactions / History. */
const Undo = {
  COLLS: new Set(['parts', 'items', 'pos', 'reqs', 'ps', 'invoices', 'suppliers', 'bins', 'picklists']),
  MAX: 400, snap: new Map(), g: null, off: false,
  // fingerprint of a record's content (ignores the save time), used to detect later changes
  fp(r) { if (!r) return 'none'; const st = v => v && typeof v === 'object' ? (Array.isArray(v) ? '[' + v.map(st).join(',') + ']' : '{' + Object.keys(v).filter(k => k !== '_ts').sort().map(k => JSON.stringify(k) + ':' + st(v[k])).join(',') + '}') : JSON.stringify(v); return hashStr(st(r)).toString(36); },
  shadow(c, k) { if (this.COLLS.has(c)) { const r = DB[c][k]; this.snap.set(c + '|' + k, r ? JSON.stringify(r) : null); } },
  shadowAll(c, map) { if (this.COLLS.has(c)) for (const k in map) this.snap.set(c + '|' + k, JSON.stringify(map[k])); },
  open() { if (this.off) return null; if (!this.g) { this.g = { id: uid(), before: new Map(), hist: [] }; queueMicrotask(() => this.close()); } return this.g; },
  touch(c, k) { if (!this.COLLS.has(c)) return; const g = this.open(); if (!g) return; const id = c + '|' + k; if (!g.before.has(id)) g.before.set(id, this.snap.has(id) ? this.snap.get(id) : null); },
  hist(id) { const g = this.open(); if (g && !g.hist.includes(id)) g.hist.push(id); },
  close() {
    const g = this.g; this.g = null; if (!g || !g.hist.length || !g.before.size) return;
    const hs = g.hist.map(id => DB.history[id]).filter(live); if (!hs.length) return;
    if (g.before.size > this.MAX) { hs.forEach(h => { h.grp = g.id; h.noUndo = 'too large'; h._ts = Date.now(); markDirty('history', h.id, h); }); return; }
    const before = [], after = {};
    for (const [id, v] of g.before) { const i = id.indexOf('|'), c = id.slice(0, i), k = id.slice(i + 1); before.push([c, k, v]); after[id] = this.fp(DB[c][k]); }
    hs.forEach((h, n) => { h.grp = g.id; if (n === 0) h.undo = { before, after, n: hs.length }; h._ts = Date.now(); markDirty('history', h.id, h); });
  },
  group(h) { if (!h || !h.grp) return []; return Object.values(DB.history).filter(x => live(x) && x.grp === h.grp).sort((a, b) => String(a.date).localeCompare(String(b.date))); },
  head(h) { return this.group(h).find(x => x.undo) || null; },
  canUndo(h) { if (!h || h.undone || h.isUndo || !h.grp) return false; const hd = this.head(h); return !!(hd && hd.undo); },
  conflicts(hd) { const out = []; for (const [c, k] of hd.undo.before) { const id = c + '|' + k; const cur = DB[c][k]; if (this.fp(cur) !== hd.undo.after[id]) out.push({ c, k, cur }); } return out; },
  run(hd) {
    this.off = true;
    try {
      for (const [c, k, v] of hd.undo.before) {
        if (v == null) { if (c === 'parts') continue; delRec(c, k); }     // record didn't exist before (parts are kept)
        else putRec(c, k, JSON.parse(v));
      }
      const when = nowIso();
      this.group(hd).forEach(h => { h.undone = { date: when, by: user() }; putRec('history', h.id, h); });
      const f = this.group(hd)[0];
      addHistory({ pn: f.pn, desc: f.desc, tn: '', tran: 'Adjusted', entry: 'Undo', qty: '', ref: f.ref || '', note: `Reversed: ${f.entry || f.tran}${f.ref ? ' ' + f.ref : ''} (${fmtDT(f.date)} by ${f.user})`, isUndo: true });
    } finally { this.off = false; }
  }
};

function addHistory(o) {
  const rec = Object.assign({ id: uid(), date: nowIso(), user: user() }, o);
  const it = o.tn ? DB.items[o.tn] : null;
  if (it) {
    rec.pn = rec.pn ?? it.pn; rec.serBatch = rec.serBatch ?? it.serBatch; rec.base = rec.base ?? it.base;
    rec.location = rec.location ?? it.location; rec.value = rec.value ?? itemCost(it); rec.currency = rec.currency ?? it.currency;
    const p = partOf(it); rec.desc = rec.desc ?? (p ? p.desc : ''); rec.util = rec.util ?? (p ? p.util : '');
  }
  putRec('history', rec.id, rec);
  return rec;
}

/* ===================== Local storage (IndexedDB) ===================== */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('inventory-manager', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { IDB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  get(k) { return new Promise(res => { const tx = IDB.db.transaction('kv').objectStore('kv').get(k); tx.onsuccess = () => res(tx.result); tx.onerror = () => res(undefined); }); },
  set(k, v) { return new Promise(res => { const tx = IDB.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); },
  keys() { return new Promise(res => { const tx = IDB.db.transaction('kv').objectStore('kv').getAllKeys(); tx.onsuccess = () => res(tx.result || []); tx.onerror = () => res([]); }); },
  clear() { return new Promise(res => { const tx = IDB.db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = () => res(); }); }
};

const dirty = new Set();
function markDirty(coll, key, rec) {
  if (coll === 'settings' || coll === 'counters') dirty.add(coll);
  else dirty.add(shardOf(coll, key, rec || DB[coll][key] || {}));
  scheduleFlush();
}
// only real data shards are synced — local extras (document cache 'file:…', clean-up snapshots '_pre_…') are not
function isShardKey(k) { const c = String(k).split(':')[0]; return c === 'settings' || c === 'counters' || c === 'history' || Object.prototype.hasOwnProperty.call(MAP_COLLS, c); }
function shardData(shard) {
  const [coll, idx] = shard.split(':');
  if (coll === 'settings' || coll === 'counters') return DB[coll];
  const out = {};
  for (const [k, r] of Object.entries(DB[coll])) if (shardOf(coll, k, r) === shard) out[k] = r;
  return out;
}
const scheduleFlush = debounce(() => flush(), 600);
let flushing = false;
async function flush() {
  if (flushing) { scheduleFlush(); return; }
  flushing = true;
  const shards = Array.from(dirty).filter(isShardKey); dirty.clear();
  const failed = []; let lastErr = null;
  for (const sh of shards) {
    try { await IDB.set(sh, shardData(sh)); if (Sync.enabled()) await Sync.push(sh); }
    catch (e) { console.error('sync', sh, e); failed.push(sh); lastErr = e; }
  }
  if (failed.length) { failed.forEach(s => dirty.add(s)); Sync.lastError = { when: nowIso(), shards: failed, msg: lastErr && lastErr.message }; Sync.status('err', 'Could not save ' + failed.join(', ') + ' — ' + (lastErr && lastErr.message)); setTimeout(scheduleFlush, 8000); }
  else Sync.status(Sync.enabled() ? 'ok' : 'local');
  flushing = false;
}

function mergeShard(shard, remote) {
  const coll = shard.split(':')[0];
  if (!remote) return false;
  let changed = false;
  if (coll === 'counters') {
    for (const k in remote) if (num(remote[k]) > num(DB.counters[k])) { DB.counters[k] = remote[k]; changed = true; }
    return changed;
  }
  if (coll === 'settings') {
    if (num(remote._ts) > num(DB.settings._ts)) { DB.settings = Object.assign(clone(DEFAULT_SETTINGS), remote); changed = true; }
    return changed;
  }
  const map = DB[coll];
  for (const k in remote) {
    const r = remote[k], l = map[k];
    if (!l || num(r._ts) > num(l._ts)) { map[k] = r; changed = true; dataVer++; Undo.shadow(coll, k); if (coll === 'trk' && typeof trkRemoteChanged === 'function') trkRemoteChanged(k); }
  }
  return changed;
}

// true when this device holds records the remote shard is missing or has older versions of
function localAhead(shard, remote) {
  const coll = shard.split(':')[0]; remote = remote || {};
  if (coll === 'counters') return Object.keys(DB.counters).some(k => num(DB.counters[k]) > num(remote[k]));
  if (coll === 'settings') return num(DB.settings._ts) > num(remote._ts);
  for (const [k, r] of Object.entries(DB[coll])) { if (shardOf(coll, k, r) !== shard) continue; const x = remote[k]; if (!x || num(r._ts) > num(x._ts)) return true; }
  return false;
}
async function loadLocal() {
  const keys = await IDB.keys();
  for (const k of keys) {
    const v = await IDB.get(k); if (!v) continue;
    const coll = k.split(':')[0];
    if (coll === 'settings') DB.settings = Object.assign(clone(DEFAULT_SETTINGS), v);
    else if (coll === 'counters') Object.assign(DB.counters, v);
    else if (DB[coll]) { Object.assign(DB[coll], v); Undo.shadowAll(coll, v); }
    dataVer++;
  }
}

/* ===================== Supabase sync ===================== */
const Sync = {
  cfg() { return lsGet('im.supabase', { url: '', key: '', table: 'inv_store' }); },
  enabled() { const c = Sync.cfg(); return !!(c.url && c.key); },
  seen: lsGet('im.seen', {}),   // shard -> remote updated_at we have merged
  headers() { const c = Sync.cfg(); const h = { apikey: c.key, 'Content-Type': 'application/json' }; if (!/^sb_/.test(c.key)) h.Authorization = 'Bearer ' + c.key; return h; },
  base() { const c = Sync.cfg(); return c.url.replace(/\/+$/, '') + '/rest/v1/' + (c.table || 'inv_store'); },
  status(s, msg) {
    const p = $('#syncPill'); p.className = 'pill ' + (s === 'ok' ? 'ok' : s === 'busy' ? 'busy' : s === 'err' ? 'err' : '');
    $('#syncTxt').textContent = s === 'ok' ? 'Synced' : s === 'busy' ? 'Syncing…' : s === 'err' ? 'Sync error' : 'Local only';
    Sync._err = s === 'err'; syncBanner();
    p.title = msg || (s === 'local' ? 'Data is stored in this browser only. Set up Supabase in Settings to share between stations.' : '');
  },
  async listRemote() {
    const r = await fetch(Sync.base() + '?select=id,updated_at', { headers: Sync.headers() });
    if (!r.ok) throw new Error('Supabase ' + r.status + ': ' + (await r.text()).slice(0, 160));
    return r.json();
  },
  async fetchShard(id) {
    const r = await fetch(Sync.base() + '?select=id,data,updated_at&id=eq.' + encodeURIComponent(id), { headers: Sync.headers() });
    if (!r.ok) throw new Error('Supabase ' + r.status);
    const rows = await r.json(); return rows[0] || null;
  },
  async push(shard) {
    Sync.status('busy');
    // merge with remote first so concurrent edits from another station are kept
    const remote = await Sync.fetchShard(shard);
    if (remote && remote.updated_at !== Sync.seen[shard]) { if (mergeShard(shard, remote.data)) Render.soft(); }
    const ts = nowIso();
    const body = [{ id: shard, data: shardData(shard), updated_at: ts, updated_by: user() }];
    const r = await fetch(Sync.base() + '?on_conflict=id', { method: 'POST', headers: Object.assign(Sync.headers(), { Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(body) });
    if (!r.ok) throw new Error('Supabase ' + r.status + ': ' + (await r.text()).slice(0, 160));
    Sync.seen[shard] = ts; lsSet('im.seen', Sync.seen);
    await IDB.set(shard, shardData(shard));
  },
  async pull(silent) {
    if (!Sync.enabled() || flushing) return;
    try {
      if (!silent) Sync.status('busy');
      const rows = await Sync.listRemote();
      let changed = false;
      for (const row of rows) {
        if (Sync.seen[row.id] === row.updated_at) continue;
        const full = await Sync.fetchShard(row.id);
        if (full && mergeShard(row.id, full.data)) { changed = true; await IDB.set(row.id, shardData(row.id)); }
        if (full && localAhead(row.id, full.data)) dirty.add(row.id);
        Sync.seen[row.id] = row.updated_at;
      }
      lsSet('im.seen', Sync.seen);
      // push any local shards the server doesn't have yet
      const remoteIds = new Set(rows.map(r => r.id));
      const localKeys = await IDB.keys();
      for (const k of localKeys) if (isShardKey(k) && !remoteIds.has(k)) dirty.add(k);
      if (dirty.size) scheduleFlush();
      Sync.status('ok');
      if (changed) Render.soft();
    } catch (e) { console.error(e); Sync.lastError = { when: nowIso(), shards: ['(download)'], msg: e.message }; Sync.status('err', e.message); }
  }
};

   The original <select> stays underneath (invisible) so forms keep working. */
function searchSelect(sel, extra) {

  const wrap = document.createElement('div'); wrap.className = 'ss'; if (sel.style.flex) wrap.style.flex = sel.style.flex;
  sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel); sel.tabIndex = -1;
  const inp = document.createElement('input'); inp.type = 'text'; inp.className = 'ssi'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.placeholder = 'Type to search…'; inp.disabled = sel.disabled;
  const list = document.createElement('div'); list.className = 'ssl hide';
  wrap.append(inp, list);
  const ex = v => (extra ? extra(v) : '') || '';
  const label = () => { const o = sel.selectedOptions[0]; return o && o.value ? o.textContent : ''; };
  const sync = () => { if (document.activeElement !== inp) inp.value = label(); };
  let items = [], hi = 0, typed = false;
  const upd = () => { $$('.sso[data-i]', list).forEach((d, i) => d.classList.toggle('on', i === hi)); const d = list.querySelector(`[data-i="${hi}"]`); if (d) d.scrollIntoView({ block: 'nearest' }); };
  const render = q => {
    const Q = String(q || '').trim().toUpperCase();
    items = [...sel.options].filter(o => o.value && o.value !== '__new__').filter(o => !Q || (o.textContent + ' ' + ex(o.value)).toUpperCase().includes(Q));
    hi = 0;
    list.innerHTML = items.length ? items.slice(0, 300).map((o, i) => `<div class="sso ${i === hi ? 'on' : ''}" data-i="${i}">${esc(o.textContent)}${ex(o.value) ? ` <span class="small muted">${esc(ex(o.value))}</span>` : ''}</div>`).join('') : '<div class="sso muted">No match</div>';
    list.classList.remove('hide');
  };
  const close = () => list.classList.add('hide');
  const pick = o => { sel.value = o.value; inp.value = o.textContent; typed = false; close(); try { inp.select(); } catch (e) { } sel.dispatchEvent(new Event('change', { bubbles: true })); };

/* Generic table. cols: [{k,l,f:(row)=>html,cls,sort}] */
function table(cols, rows, { key = r => r.id, sel, onClick, onDbl, rowCls, empty = 'Nothing to show', multi, limit = 500, wrapCls = '' } = {}) {
  const wrap = document.createElement('div'); wrap.className = 'tbl-wrap ' + wrapCls;
  let shown = Math.min(rows.length, limit);
  const selected = multi ? (multi.set || new Set()) : null;
  const draw = () => {
    if (!rows.length) { wrap.innerHTML = `<div class="empty">${esc(empty)}</div>`; return; }
    let h = '<table class="t"><thead><tr>' + (multi ? `<th class="c"><input type="checkbox" data-all ${rows.length && rows.every(r => selected.has(key(r))) ? 'checked' : ''}></th>` : '') + cols.map(c => `<th class="${c.cls || ''}">${esc(c.l)}</th>`).join('') + '</tr></thead><tbody>';
    for (let i = 0; i < shown; i++) {
      const r = rows[i], k = key(r);
      const cl = [(onClick || onDbl) ? 'click' : '', sel != null && k === sel ? 'sel' : '', multi && selected.has(k) ? 'sel' : '', rowCls ? rowCls(r) : ''].join(' ');
      h += `<tr class="${cl}" data-key="${esc(k)}">` + (multi ? `<td class="c"><input type="checkbox" data-pick ${selected.has(k) ? 'checked' : ''}></td>` : '') + cols.map(c => `<td class="${c.cls || ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('') + '</tr>';
    }
    h += '</tbody></table>';
    if (shown < rows.length) h += `<div class="empty"><button class="btn sm" data-more>Show more (${rows.length - shown} remaining)</button></div>`;
    wrap.innerHTML = h;
  };
  draw();
  wrap.addEventListener('click', e => {
    if (e.target.matches('[data-more]')) { shown = Math.min(rows.length, shown + limit); draw(); return; }
    if (e.target.matches('[data-all]')) { rows.forEach(r => e.target.checked ? selected.add(key(r)) : selected.delete(key(r))); draw(); multi.onChange && multi.onChange(selected); return; }
    const tr = e.target.closest('tr[data-key]'); if (!tr) return;
    const k = tr.dataset.key;
    if (multi && (e.target.matches('[data-pick]') || !onClick)) { if (selected.has(k)) selected.delete(k); else selected.add(k); tr.classList.toggle('sel', selected.has(k)); const cb = $('[data-pick]', tr); if (cb) cb.checked = selected.has(k); multi.onChange && multi.onChange(selected); return; }
    if (e.target.closest('button,input,select,a')) return;
    if (onClick) { $$('tr.sel', wrap).forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); onClick(rows.find(r => String(key(r)) === k), k); }
  });
  if (onDbl) wrap.addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-key]'); if (!tr || e.target.closest('button,input,select')) return; onDbl(rows.find(r => String(key(r)) === tr.dataset.key)); });
  wrap.selected = selected;
  return wrap;
}

const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128svg(text) {
  text = String(text).replace(/[^\x20-\x7E]/g, '');
  const codes = [104]; for (const ch of text) codes.push(ch.charCodeAt(0) - 32);
  let sum = 104; for (let i = 1; i < codes.length; i++) sum += codes[i] * i;
  codes.push(sum % 103); codes.push(106);
  let x = 10, bars = '';
  for (const c of codes) { const p = C128[c]; for (let i = 0; i < p.length; i++) { const w = +p[i]; if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="40"/>`; x += w; } }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x + 10} 40" width="100%" height="100%" preserveAspectRatio="none">${bars}</svg>`;
}

/* ---------- password hashing ---------- */
async function hashPw(pw, salt) {
  const enc = new TextEncoder();
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, key, 256);
    return 'p2:' + Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  throw new Error('This browser cannot hash passwords securely. Open the app from its https:// link.');
}
async function setPassword(u, pw) { u.salt = uid() + uid(); u.pw = await hashPw(pw, u.salt); }
async function checkPassword(u, pw) { try { return (await hashPw(pw, u.salt)) === u.pw; } catch (e) { toast(e.message, true); return false; } }
function liveUsers() { return Object.values(DB.users).filter(u => live(u)); }
function findUser(name) { const n = String(name || '').trim().toLowerCase(); return liveUsers().find(u => u.username.toLowerCase() === n); }

/* ---------- session ---------- */
const Session = {
  get() { try { return JSON.parse(sessionStorage.getItem('im.session') || localStorage.getItem('im.session') || 'null'); } catch (e) { return null; } },
  set(uidv, keep) { const s = JSON.stringify({ uid: uidv, exp: Date.now() + (keep ? 30 : 1) * 864e5 }); try { sessionStorage.setItem('im.session', s); if (keep) localStorage.setItem('im.session', s); else localStorage.removeItem('im.session'); } catch (e) { } },
  clear() { try { sessionStorage.removeItem('im.session'); localStorage.removeItem('im.session'); } catch (e) { } }
};
function sessionUser() {
  const s = Session.get(); if (!s || s.exp < Date.now()) return null;
  const u = DB.users[s.uid]; return u && live(u) && u.active !== false ? u : null;
}
function signOut() { Session.clear(); CURRENT = null; location.hash = ''; location.reload(); }

/* ---------- connect to the shared database (used by login screen, setup link and Settings) ---------- */
async function connectShared(cfg) {
  lsSet('im.supabase', cfg); Sync.seen = {}; lsSet('im.seen', {});
  const remoteUsers = await Sync.fetchShard('users');
  if (remoteUsers && Object.values(remoteUsers.data || {}).some(u => live(u))) {
    // the shared database already has accounts: accounts made on this device before connecting are dropped
    const localOnly = Object.keys(DB.users).filter(k => !(remoteUsers.data || {})[k]);
    localOnly.forEach(k => delete DB.users[k]);
    await IDB.set('users', shardData('users'));
  }
  await Sync.pull();
  for (const k of await IDB.keys()) if (isShardKey(k)) dirty.add(k);
  await flush();
}
function setupLink() { const c = Sync.cfg(); return location.origin + location.pathname + '#setup=' + btoa(JSON.stringify({ url: c.url, key: c.key, table: c.table || 'inv_store' })); }

  return { to: resetEmail(), subject, body, href: 'mailto:' + resetEmail() + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body) };
}

          : `<div class="note">No password-reset email has been set up yet. Ask your administrator to reset your password in person.</div>`) + `
          <div class="authfoot"><a href="#" id="auBk">Back to sign in</a></div>`;
      }

          <h3>Choose a new password</h3>

      ${fld('Make (manufacturer)', 'make', d.make)}${fld('Model', 'model', d.model)}${fld('U/M', 'um', d.um, { opts: S().ums })}${fld('NSN', 'nsn', d.nsn)}

      const f = readForm(m); f.pn = pnFix(f.pn); f.desc = String(f.desc).trim(); f.alternates = pnFixList(f.alternates, ', '); f.supersededBy = pnFix(f.supersededBy); f.supersedes = pnFix(f.supersedes);

/* ===================== Item picker ===================== */
function pickItems({ title = 'Select item(s)', statuses = ['stock'], needQty = true, multi = true, onPick }) {
  let q = '';
  const body = document.createElement('div');
  body.innerHTML = `<div class="bar"><input type="search" id="pkQ" placeholder="Search part number, description, tracking #, serial, location…" style="flex:1"><span class="muted small" id="pkN"></span></div><div id="pkT"></div>`;
  const sel = new Set();
  const draw = () => {
    const Q = q.toUpperCase();
    let rows = Object.values(DB.items).filter(i => live(i) && statuses.includes(i.status) && (!needQty || num(i.qty) > 0));
    if (Q) rows = rows.filter(i => { const p = partOf(i) || {}; return [i.pn, p.desc, i.tn, i.serBatch, i.location, p.alternates].join(' ').toUpperCase().includes(Q); });
    rows.sort((a, b) => a.pn.localeCompare(b.pn) || String(a.tn).localeCompare(String(b.tn), undefined, { numeric: true }));

      rows, { key: i => i.tn, multi: multi ? { set: sel } : null, onClick: multi ? null : (i) => { m.close(); onPick([i]); }, limit: 200, empty: 'No matching item' });
    $('#pkT', body).innerHTML = ''; $('#pkT', body).appendChild(t);
  };
  const m = modal({ title, size: 'wide', body, buttons: multi ? [{ label: 'Cancel' }, { label: 'Add selected', cls: 'pri', onClick: () => { const its = Array.from(sel).map(k => DB.items[k]).filter(Boolean); if (!its.length) { toast('Select at least one item', true); return false; } onPick(its); } }] : [{ label: 'Cancel' }] });

}

/* ===================== Below minimum ===================== */
function belowMinRows(base) {
  const out = [];
  for (const p of Object.values(DB.parts)) {
    if (!live(p) || !(num(p.min) > 0)) continue;
    const stock = availQty(p.pn, base);
    if (stock >= num(p.min)) continue;
    const pi = pendingInfo(p.pn);
    const target = num(p.max) > 0 ? num(p.max) : num(p.min);
    out.push({ p, stock, onOrder: pi.onOrder, onReq: pi.onReq, toOrder: Math.max(0, target - stock - pi.onOrder - pi.onReq) });
  }
  return out.sort((a, b) => a.p.pn.localeCompare(b.p.pn, undefined, { numeric: true }));
}

// ---- Undo button for transactions ----
function undoCell(h) {
  if (h.undone) return `<span class="tag" title="Undone ${esc(fmtDT(h.undone.date))} by ${esc(h.undone.by)}">Undone</span>`;
  if (h.isUndo) return '';
  if (!(isAdmin() || can('hist.undoall') || (h.user === user() && can('hist.undo')))) return '';
  if (Undo.canUndo(h)) return `<button class="btn sm" data-undo="${esc(h.id)}" title="Reverse this transaction">↶ Undo</button>`;
  if (legacyUndoPlan(h)) return `<button class="btn sm" data-undo-qty="${esc(h.id)}" title="Reverse the quantity of this transaction">↶ Undo</button>`;
  return `<button class="btn sm" disabled title="This transaction can't be reversed automatically (it was made before Undo existed, or it changed several records). Correct it manually.">↶ Undo</button>`;
}
// Transactions recorded before the Undo journal existed (or part of a big import): reverse the quantity only
function legacyUndoPlan(h) {
  if (!h || h.undone || h.isUndo || !h.tn || (h.grp && !h.noUndo)) return null;
  const it = DB.items[h.tn]; const q = num(h.qty); if (!it || !live(it) || !q || it.status === 'deleted') return null;
  if (h.tran === 'Entered') { if (!['stock', 'quarantine'].includes(it.status) || num(it.qty) < q) return null; return { it, newQty: num(it.qty) - q, po: h.entry === 'PO' && h.ref ? Object.values(DB.pos).find(p => live(p) && p.no === h.ref) : null }; }
  if (h.tran === 'Adjusted' && h.entry === 'Quantity') { const n = num(it.qty) - q; if (n < 0) return null; return { it, newQty: n }; }
  return null;
}
function undoLegacy(id) {
  const h = DB.history[id]; const pl = legacyUndoPlan(h); if (!pl) { toast('This transaction can no longer be undone', true); return; }
  const { it, newQty, po } = pl;
  modal({ title: 'Undo transaction', body: `<p><b>${esc(h.pn)}</b> — ${esc(h.tran)} / ${esc(h.entry || '')} qty ${qtyFmt(h.qty)} (TN ${esc(h.tn)}) on ${esc(fmtDT(h.date))}</p>
    <p>Tracking # ${esc(it.tn)} goes from qty <b>${qtyFmt(it.qty)}</b> to <b>${qtyFmt(newQty)}</b>${newQty === 0 ? ' and is removed from stock' : ''}.${po ? ` PO ${esc(po.no)} will show this quantity as not received.` : ''}</p>`,
    buttons: [{ label: 'Cancel' }, { label: '↶ Undo', cls: 'danger', onClick: () => {
      Undo.off = true;
      try {
        if (newQty === 0) { it.qty = 0; it.status = 'deleted'; it.deleted = { date: today(), reason: 'Undo of ' + (h.entry || h.tran) + (h.ref ? ' ' + h.ref : '') }; } else it.qty = newQty;
        setItem(it);
        if (po) { const l = (po.lines || []).find(x => pnKey(x.pn) === pnKey(h.pn) && num(x.received) > 0) || (po.lines || []).find(x => num(x.received) > 0); if (l) { l.received = Math.max(0, num(l.received) - num(h.qty)); po.status = poStatus(po); putRec('pos', po.id, po); if (l.reqLine) setReqLine(l.reqId, l.reqLine, { status: 'Ordered' }); } }
        h.undone = { date: nowIso(), by: user() }; putRec('history', h.id, h);
        addHistory({ tn: it.tn, tran: 'Adjusted', entry: 'Undo', qty: newQty - num(it.qty) || -num(h.qty), ref: h.ref || '', note: `Reversed: ${h.entry || h.tran}${h.ref ? ' ' + h.ref : ''} (${fmtDT(h.date)} by ${h.user})`, isUndo: true });
      } finally { Undo.off = false; }
      toast('Transaction reversed'); Render.full();
    } }] });
}
function undoTxn(id, after) {
  const h = DB.history[id]; const hd = Undo.head(h); if (!hd) { toast('This transaction can no longer be undone', true); return; }
  const grp = Undo.group(hd); const bad = Undo.conflicts(hd);
  if (bad.length) {
    const what = bad.slice(0, 5).map(b => b.c === 'items' ? 'tracking # ' + b.k : b.c === 'pos' ? 'PO ' + ((b.cur || {}).no || '') : b.c === 'ps' ? 'packing slip / RO ' + ((b.cur || {}).no || '') : b.c === 'parts' ? 'part ' + b.k : b.c.replace(/s$/, '') + ' ' + ((b.cur || {}).no || b.k)).join(', ');
    modal({ title: "Can't undo yet", size: 'narrow', body: `<p>Something changed after this transaction (${esc(what)}).</p><p>Undo the later transactions first (newest first), then try again.</p>`, buttons: [{ label: 'OK', cls: 'pri' }] });
    return;
  }
  const list = grp.map(x => `<li>${esc(fmtDT(x.date))} — <b>${esc(x.pn || '')}</b> ${esc(x.tran)} / ${esc(x.entry || '')}${x.qty ? ' qty ' + qtyFmt(x.qty) : ''}${x.tn ? ' (TN ' + esc(x.tn) + ')' : ''}${x.ref ? ' — ' + esc(x.ref) : ''}</li>`).join('');
  modal({ title: 'Undo transaction', body: `<p>This puts everything back the way it was before:</p><ul style="margin:6px 0 10px 18px;padding:0">${list}</ul><p class="small muted">Stock, PO / RO / invoice lines and requisitions changed by this action are restored. A note "Undo" is added to the history.</p>`,
    buttons: [{ label: 'Cancel' }, { label: '↶ Undo', cls: 'danger', onClick: () => { Undo.run(hd); toast('Transaction reversed'); if (after) after(); else Render.full(); } }] });
}

/* ===================== Bins / locations & stock count ===================== */
// A bin is a storage location (the "Location" of an item). Bin records hold the description, the count
// interval and the count in progress; bins that only exist on items are listed too.
const binKey = v => String(v || '').trim().toUpperCase();
// every location a part is stored in becomes a permanent bin record — bins are never removed automatically, only with Delete
const PSEUDO_LOC = v => { const k = binKey(v); return !k || k === 'QUARANTINE' || k === 'SCRAP' || k.startsWith('OUT:'); };
function keepBin(it) { if (!it || !live(it) || it.status !== 'stock' || PSEUDO_LOC(it.location)) return; if (typeof CURRENT !== 'undefined' && CURRENT && !can('bins.create') && !keepBin.legacy) return; const k = binKey(it.location); const b = DB.bins[k]; if (b && live(b)) return; putRec('bins', k, { code: String(it.location).trim(), desc: '', base: it.base || '', interval: num(S().binInterval) || 365, created: today(), auto: true }); }
// creating a new bin location needs the "Create new bin locations" permission (and a confirmation, to catch typos)
function binExists(v) { const b = DB.bins[binKey(v)]; return !!(b && live(b)); }
async function checkBins(locs) {
  const unknown = Array.from(new Set((locs || []).map(x => String(x || '').trim()).filter(x => x && !PSEUDO_LOC(x) && !binExists(x))));
  if (!unknown.length) return true;

  unknown.forEach(x => putRec('bins', binKey(x), { code: x, desc: '', base: '', interval: num(S().binInterval) || 365, created: today(), createdBy: user() }));
  refreshDatalists(); return true;
}
function keepAllBins() { let n = 0; keepBin.legacy = true; try { for (const i of Object.values(DB.items)) { if (!live(i) || i.status !== 'stock' || PSEUDO_LOC(i.location)) continue; const k = binKey(i.location); if (!(DB.bins[k] && live(DB.bins[k]))) { keepBin(i); n++; } } } finally { keepBin.legacy = false; } return n; }
function binItems(code) { const k = binKey(code); return Object.values(DB.items).filter(i => live(i) && i.status === 'stock' && num(i.qty) > 0 && binKey(i.location) === k); }
function binRec(code) { return DB.bins[binKey(code)]; }
function allBins() {
  const m = new Map();
  for (const b of Object.values(DB.bins)) if (live(b)) m.set(binKey(b.code), b);
  for (const i of Object.values(DB.items)) if (live(i) && i.status === 'stock' && num(i.qty) > 0 && String(i.location || '').trim()) { const k = binKey(i.location); if (!m.has(k)) m.set(k, { code: String(i.location).trim(), virtual: true }); }
  return Array.from(m.values()).sort((a, b) => binKey(a.code).localeCompare(binKey(b.code), undefined, { numeric: true }));
}
function binNext(b) { return b.lastCount && num(b.interval) ? addDays(b.lastCount, num(b.interval)) : ''; }

// Review & post: compares counted vs stock, then confirms / adjusts / sends to Lost parts
function reviewCounts(bins, after) {
  const rows = [];
  for (const b of bins) { const c = b.count || {}; const lines = c.lines || {};
    for (const i of binItems(b.code)) { const v = lines[i.tn]; const counted = v === '' || v == null ? null : num(v); const diff = counted == null ? null : counted - num(i.qty);
      rows.push({ b, i, counted, diff, dec: counted == null ? 'skip' : diff === 0 ? 'confirm' : counted === 0 ? 'lost' : diff < 0 ? 'lost' : 'adjust' }); }
    for (const tn of Object.keys(lines)) { const i = DB.items[tn]; if (i && live(i) && binKey(i.location) !== binKey(b.code) && lines[tn] !== '' && lines[tn] != null) rows.push({ b, i, counted: num(lines[tn]), diff: null, dec: 'move' }); }
  }
  if (!rows.length) { toast('Nothing to review — no items in the selected bin(s)', true); return; }
  const body = document.createElement('div');
  const DEC = [{ v: 'confirm', l: 'Confirm (no change)' }, { v: 'adjust', l: 'Adjust stock to counted' }, { v: 'lost', l: 'Missing qty → Lost parts' }, { v: 'skip', l: 'Not counted / recount' }];
  const draw = () => {
    const n = rows.filter(r => r.counted != null).length, diffs = rows.filter(r => r.diff).length;
    body.innerHTML = `<p><b>${rows.length}</b> item(s) in <b>${bins.length}</b> bin(s) — <b>${n}</b> counted, <b style="color:${diffs ? 'var(--bad)' : 'inherit'}">${diffs}</b> with a difference.</p>
    <div class="tbl-wrap" style="max-height:60vh"><table class="t"><thead><tr><th>Bin</th><th>Part number</th><th>Description</th><th>TN</th><th>Ser/Batch</th><th class="r">Qty in stock</th><th class="r">Qty counted</th><th class="r">Difference</th><th>Unit</th><th style="min-width:200px">Decision</th></tr></thead><tbody>
    ${rows.map((r, k) => `<tr class="${r.diff ? 'exp' : ''}"><td>${esc(r.b.code)}</td><td><b>${esc(r.i.pn)}</b></td><td>${esc((partOf(r.i) || {}).desc || '')}</td><td>${esc(r.i.tn)}</td><td>${esc(r.i.serBatch || '')}</td><td class="r">${qtyFmt(r.i.qty)}</td><td class="r">${r.counted == null ? '<span class="muted">—</span>' : qtyFmt(r.counted)}</td><td class="r">${r.diff == null ? '' : `<b style="color:${r.diff ? 'var(--bad)' : 'inherit'}">${r.diff > 0 ? '+' : ''}${qtyFmt(r.diff)}</b>`}</td><td>${esc(r.i.um || '')}</td>
      <td>${r.dec === 'move' ? `Found here — move from ${esc(r.i.location || '?')} <span class="muted small">(${esc(r.i.status)})</span>` : `<select data-dec="${k}" ${r.counted == null ? 'disabled' : ''}>${opts(DEC.filter(o => r.counted != null ? (o.v !== 'skip' && (r.diff ? o.v !== 'confirm' : o.v === 'confirm')) && !(o.v === 'lost' && !(r.diff < 0)) : o.v === 'skip'), r.dec)}</select>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">"Missing qty → Lost parts" moves the missing quantity to the Lost parts tab (it can be brought back when found). Items not counted stay as they are and the bin stays open for a recount.</p>`;
  };
  draw();
  body.addEventListener('change', e => { const s = e.target.closest('[data-dec]'); if (s) rows[+s.dataset.dec].dec = s.value; });
  modal({ title: 'Review & post count', size: 'xwide', body, buttons: [{ label: 'Print results', close: false, onClick: () => printCountResults(rows) }, '|', { label: 'Cancel' }, { label: 'Post count', cls: 'pri', perm: 'bins.count', onClick: () => {
    const when = today(), by = user(); let nAdj = 0, nLost = 0, nConf = 0, nMove = 0;

      if (r.dec === 'adjust') { i.lastCount = rec; adjustQty(i, r.counted, `Stock count bin ${r.b.code}: counted ${qtyFmt(r.counted)}, system ${qtyFmt(rec.expected)}`); setItem(i); nAdj++; continue; }

        else {   // split: the counted qty stays, the missing qty becomes a lost item with its own tracking #
          i.lastCount = rec; adjustQty(i, r.counted, `Stock count bin ${r.b.code}: ${qtyFmt(missing)} missing → Lost parts`);
          const lost = Object.assign(clone(i), { tn: nextTN(), qty: missing, splitFrom: i.tn, lastCount: rec }); delete lost._ts; delete lost.acAlert;

    if (after) after(); Render.full();
  } }] });
}

/* ---------- Lost parts ---------- */
function sendToLost(i, reason, countRec, isSplit) {
  const qty = num(i.qty);
  i.lost = { date: today(), by: user(), bin: i.location || '', reason, qty };
  i.prev = { location: i.location, status: 'stock' }; i.status = 'lost'; if (countRec) i.lastCount = countRec;
  setItem(i);
  addHistory({ tn: i.tn, tran: 'Adjusted', entry: 'Lost', qty: isSplit ? 0 : -qty, note: reason });
}

// one-time import of the AMS pick lists (fixed ids, so two stations importing at once don't duplicate,
// and a list someone deleted or renumbered is never brought back)
function seedPickLists() {
  if (!isAdmin()) return; let n = 0;
  for (const s of PL_SEED) {
    const id = 'pl-ams-' + s.no;
    const ex = DB.picklists[id];
    // first import set everyone to "Mario Blais" — put back the real AMS "Created by"
    if (ex && live(ex) && ex.imported === 'AMS' && !ex._byFix) { ex._byFix = 1; if (ex.createdBy === 'Mario Blais' && s.by !== 'Mario Blais') ex.createdBy = s.by; putRec('picklists', id, ex); }
    if (ex) continue;
    if (Object.values(DB.picklists).some(p => live(p) && plNoKey(p.no) === plNoKey(s.nn))) continue;
    putRec('picklists', id, { id, no: String(s.nn), amsNo: String(s.no), model: s.model, name: s.name, date: s.date, note: s.note || '', createdBy: s.by || '', imported: 'AMS', _byFix: 1,
      lines: s.parts.map(l => ({ id: uid(), pn: l.pn, desc: l.desc, qty: l.qty, make: l.make || '', model: l.model || '', loc: l.loc || '', note: l.note || '' })) });
    n++;
  }
  if (n) toast(n + ' pick list(s) imported from AMS');
}
// one-time: drop the old AMS numbers, renumber from 1 grouped by aircraft / engine model (AS350, AS355N, EC120 … Arrius 2F)
function renumberPickLists() {
  if (!isAdmin() || S()._plRenum) return;
  const bySeed = {}; PL_SEED.forEach(s => bySeed['pl-ams-' + s.no] = s);
  const all = Object.values(DB.picklists).filter(live);
  all.filter(p => !bySeed[p.id] && /AS\s*355\s*NP/i.test(p.name)).forEach(p => delRec('picklists', p.id));   // AS355NP no longer needed
  let max = PL_SEED.length;
  Object.values(DB.picklists).filter(live).sort((a, b) => (parseInt(a.no, 10) || 0) - (parseInt(b.no, 10) || 0)).forEach(p => {
    const s = bySeed[p.id];

/* ===================== Workspaces: Inventory Manager | Ops Gear Tracker | Tool & Calibration Tracker =====================
   The two trackers are their own pages (ops-gear-tracker.html, tool-calibration-tracker.html, same folder) shown in a
   frame. They don't talk to a database themselves any more: they read/write through window.parent.TrackerStore, which
   keeps their data in this app's shared database (collection "trk", one row per tracker key) so they use the same
   sign-in, sync and backups as the inventory.
   Attached files (calibration certificates, photos…) are NOT kept inside the tracker data: each file goes to the
   documents table (inv_files, add-only) and the tracker data only keeps a small reference { name, type, fileId }.
   (Keeping 22 PDFs inside the item list made it 12 MB — every save re-sent it all and timed out.) */
const TRACKERS = {
  ops: { prefix: 'opsgear', label: 'Ops Gear Tracker', icon: '🎒', file: './ops-gear-tracker.html', perm: 'ops.view' },
  tool: { prefix: 'tooltracker', label: 'Tool & Calibration Tracker', icon: '🧰', file: './tool-calibration-tracker.html', perm: 'tool.view' }
};
// where the trackers used to live (AME Forms app) — used once to bring their data over
const AME_FORMS_DB = { url: 'https://frlehxadkvgwzyxovwua.supabase.co', key: 'sb_publishable_ioAPLi8DWuC0HCUUYEeQ3Q_dildZYKI' };

const trkUploaded = new Set();
async function trkUpload(id, meta, b64) {
  if (trkUploaded.has(id)) return;
  const local = await IDB.get('file:' + id);
  if (local && local.uploaded) { trkUploaded.add(id); return; }
  try { await Files.put(Object.assign({ id }, meta), b64); }
  catch (e) { if (!/409|duplicate|23505/.test(e.message)) throw e; }   // already in the cloud = fine
  try { const l = await IDB.get('file:' + id); await IDB.set('file:' + id, Object.assign(l || { id }, { data: b64, uploaded: Sync.enabled() })); } catch (e) { }
  if (Sync.enabled()) trkUploaded.add(id);
}
// move every embedded file ({ dataUrl:'data:…' } anywhere in the JSON) to the documents table
async function trkExternalize(key, value) {
  if (typeof value !== 'string' || value.indexOf('"dataUrl":"data:') < 0) return { value, moved: 0 };
  const o = JSON.parse(value); const prefix = key.split(':')[0]; let moved = 0, err = null;
  const walk = async (x, label) => {
    if (Array.isArray(x)) { for (const y of x) await walk(y, label); return; }
    if (!x || typeof x !== 'object') return;
    if (typeof x.dataUrl === 'string' && x.dataUrl.startsWith('data:')) {
      const m = x.dataUrl.match(/^data:([^;,]*)(;base64)?,/); if (!m) return;
      let b64 = x.dataUrl.slice(m[0].length); if (!m[2]) { try { b64 = btoa(unescape(encodeURIComponent(decodeURIComponent(b64)))); } catch (e) { return; } }
      const id = 'trk-' + prefix + '-' + hashStr(b64).toString(36) + '-' + b64.length.toString(36);
      try {
        await trkUpload(id, { kind: prefix, ownerId: key, ownerLabel: label || '', name: x.name || 'file', mime: x.type || m[1] || 'application/octet-stream', size: Math.round(b64.length * 3 / 4), by: user() }, b64);
        delete x.dataUrl; x.fileId = id; x.size = Math.round(b64.length * 3 / 4); if (!x.type) x.type = m[1]; moved++;
      } catch (e) { err = e; }        // keep it inline for now; the next save tries again
      return;
    }
    const lab = x.name && (x.serialNo || x.category) ? x.name + (x.serialNo ? ' S/N ' + x.serialNo : '') : label;
    for (const k in x) if (x[k] && typeof x[k] === 'object') await walk(x[k], lab);
  };
  await walk(o, '');
  if (err) TrackerStore._err = 'Attachment upload failed — ' + err.message;
  return { value: JSON.stringify(o), moved };
}

const TrackerStore = {
  _q: Promise.resolve(), _err: null,
  get(key) { const r = DB.trk[key]; return r && live(r) ? r.value : null; },
  has(prefix) { return Object.values(DB.trk).some(r => r && r.id && r.id.startsWith(prefix + ':')); },
  // writes are queued so an older save can never land after a newer one
  set(key, value) {
    const job = async () => {
      TrackerStore._err = null;
      const { value: v } = await trkExternalize(key, value);
      const r = DB.trk[key];
      if (!(r && live(r) && r.value === v)) putRec('trk', key, { id: key, value: v, by: user() });
      trkBadges();
      return !TrackerStore._err && !Sync._err;
    };
    const p = TrackerStore._q.then(job, job); TrackerStore._q = p.catch(() => { }); return p;
  },
  lastError() { return TrackerStore._err || (Sync._err ? 'Not connected to the shared database — saved on this computer only. ' + ((Sync.lastError && Sync.lastError.msg) || '') : ''); },
  async fileData(id, mime) { return 'data:' + (mime || 'application/octet-stream') + ';base64,' + await Files.get(id); },
  openFile(id, name, mime) { return openDoc({ id, name: name || 'file', mime: mime || '' }); },
  user() { return user(); }
};
window.TrackerStore = TrackerStore;

/* ---------- bring data over from the AME Forms app ---------- */
async function trkImportKeys(prefix, pairs, progress) {
  let files = 0;
  for (const [k, v] of pairs) {
    if (progress) progress(`Saving ${k}…`);
    const before = (String(v).match(/"dataUrl":"data:/g) || []).length;
    await TrackerStore.set(k, v);
    files += before;
  }
  await flush();
  return files;
}
async function trkImportFromAmeForms(prefix, progress) {
  if (progress) progress('Downloading from the AME Forms database…');
  const r = await fetch(AME_FORMS_DB.url + '/rest/v1/app_data?select=key,value&key=like.' + encodeURIComponent(prefix + ':*'), { headers: { apikey: AME_FORMS_DB.key, Authorization: 'Bearer ' + AME_FORMS_DB.key } });
  if (!r.ok) throw new Error('AME Forms database: HTTP ' + r.status);
  const rows = await r.json();
  if (!rows.length) return { keys: 0, files: 0 };
  const files = await trkImportKeys(prefix, rows.map(x => [x.key, typeof x.value === 'string' ? x.value : JSON.stringify(x.value)]), progress);
  return { keys: rows.length, files };
}
async function trkImportBackupFile(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('Not a valid backup file', true); return; }
  const data = j && j.data ? j.data : j;
  const pairs = Object.entries(data || {}).filter(([k]) => /^(opsgear|tooltracker):/.test(k)).map(([k, v]) => [k, typeof v === 'string' ? v : JSON.stringify(v)]);
  if (!pairs.length) { toast('No Ops Gear / Tool tracker data in this file', true); return; }
  const names = ['opsgear', 'tooltracker'].filter(p => pairs.some(([k]) => k.startsWith(p + ':'))).map(p => p === 'opsgear' ? 'Ops Gear Tracker' : 'Tool & Calibration Tracker');
  if (!await confirmBox(`Replace the ${names.join(' and ')} data with the copy in this backup${j.exportedAt ? ' (' + fmtDT(j.exportedAt) + ')' : ''}?\n\n${pairs.length} record(s). Attached files are moved to the documents storage.`, 'Replace', true)) return;
  const m = modal({ title: 'Importing…', size: 'narrow', body: '<p id="trkProg">Starting…</p>' });
  try {
    const files = await trkImportKeys('', pairs, t => { const e = $('#trkProg', m); if (e) e.textContent = t; });
    m.close(); toast(`Imported ${pairs.length} record(s), ${files} attached file(s)`);
    Object.keys(TRACKERS).forEach(w => trkReload(w));
  } catch (e) { m.close(); toast('Import failed: ' + e.message, true); }
}

const _trkBadgeCache = {};
function trkOverdue(prefix) {
  const r = DB.trk[prefix + ':items:v1']; if (!r || !live(r)) return 0;
  if (_trkBadgeCache[prefix] && _trkBadgeCache[prefix].ts === r._ts) return _trkBadgeCache[prefix].n;

    const t0 = today();
    const addM = (iso, mo) => { const [y, m, d] = iso.split('-').map(Number); const tot = y * 12 + (m - 1) + Math.round(mo); const ny = Math.floor(tot / 12), nm = tot % 12; const last = new Date(Date.UTC(ny, nm + 1, 0)).getUTCDate(); return ny + '-' + String(nm + 1).padStart(2, '0') + '-' + String(Math.min(d, last)).padStart(2, '0'); };

      if (due && due < t0) n++;

}

/* ---------- Import suppliers from Excel (e.g. a WinAir vendor list) ----------
   Matches existing suppliers by Supplier ID, then by name. Existing suppliers only get their EMPTY
   fields filled — nothing you already typed is overwritten. */
const SUP_COLS = [
  ['code', /^(supplier |vendor )?id$|^supplier id|^vendor (id|code)|^code$/i], ['name', /^(name|supplier( name)?|vendor( name)?|company)$/i],
  ['address', /^(street )?address/i], ['city', /^city/i], ['state', /^(prov|state|province)/i], ['zip', /^(postal|zip)/i], ['country', /^country/i],
  ['phone', /^(primary )?phone|^tel/i], ['fax', /fax/i], ['email', /e-?mail/i], ['web', /web|url/i],
  ['contact', /^contact( name)?$/i], ['contactPhone', /^contact phone/i], ['contactEmail', /^contact e-?mail/i],
  ['type', /^type$/i], ['account', /account/i], ['approved', /^approved$/i], ['approvalExp', /approval exp/i], ['currency', /currency/i], ['leadDays', /lead|expected days/i], ['terms', /terms/i], ['note', /^notes?$/i]
];
const supNorm = v => String(v || '').toUpperCase().replace(/\[CLOSED\]/g, '').replace(/[^A-Z0-9]/g, '');
async function importSuppliers(file) {
  if (!window.XLSX) { toast('Excel library did not load (offline?)', true); return; }
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]]; const raw = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
  if (!raw.length) { toast('No rows found in ' + file.name, true); return; }
  const heads = Object.keys(raw[0]); const map = {};
  for (const [k, re] of SUP_COLS) { const h = heads.find(x => re.test(String(x).trim()) && !Object.values(map).includes(x)); if (h) map[k] = h; }
  if (!map.name) { toast('Could not find a "Name" column', true); return; }
  const byCode = new Map(), byName = new Map();
  Object.values(DB.suppliers).filter(live).forEach(x => { if (x.code) byCode.set(supNorm(x.code), x); byName.set(supNorm(x.name), x); });
  const plan = [];
  for (const r of raw) {
    const v = {}; for (const k in map) v[k] = String(r[map[k]] ?? '').trim();
    if (!v.name) continue;
    if ('approved' in v) v.approved = /^(y|yes|true|1|approved)$/i.test(v.approved);
    if (v.approvalExp && !/^\d{4}-\d\d-\d\d$/.test(v.approvalExp)) { const d = new Date(v.approvalExp); v.approvalExp = isNaN(d) ? '' : d.toISOString().slice(0, 10); }
    if (v.leadDays) v.leadDays = num(v.leadDays);
    if (v.currency) v.currency = v.currency.toUpperCase();
    let ex = (v.code && byCode.get(supNorm(v.code))) || byName.get(supNorm(v.name));
    let rename = false;
    if (!ex && v.code && byName.get(supNorm(v.code))) { ex = byName.get(supNorm(v.code)); rename = true; }   // supplier was created with its ID as the name (item-list import)
    else if (ex && v.code && supNorm(ex.name) === supNorm(v.code)) rename = true;
    plan.push({ v, ex, rename });
  }
  const nNew = plan.filter(p => !p.ex).length, nUpd = plan.length - nNew;
  modal({ title: 'Import suppliers — ' + file.name, size: 'wide', body: `<p><b>${plan.length}</b> suppliers found: <b>${nNew}</b> new, <b>${nUpd}</b> already in the system (matched by ID or name — only their empty fields will be filled in).</p>
    <p class="small muted">Columns used: ${Object.entries(map).map(([k, h]) => esc(h)).join(', ')}</p>`,
    onOpen: m => { const box = document.createElement('div'); box.appendChild(table([{ l: '', f: p => p.ex ? `<span class="tag a">update</span>${p.rename ? ` <span class="small muted">(renamed from ${esc(p.ex.name)})</span>` : ''}` : '<span class="tag ok">new</span>' }, { l: 'ID', f: p => esc(p.v.code || '') }, { l: 'Name', f: p => `<b>${esc(p.v.name)}</b>` }, { l: 'City', f: p => esc(p.v.city || '') }, { l: 'Country', f: p => esc(p.v.country || '') }, { l: 'Phone', f: p => esc(p.v.phone || '') }, { l: 'Email', f: p => esc(p.v.email || '') }, { l: 'Approved', f: p => p.v.approved ? 'Yes' : '' }], plan, { key: p => p.v.code + p.v.name, wrapCls: 'short' })); $('.mb', m).appendChild(box); },
    buttons: [{ label: 'Cancel' }, { label: 'Import', cls: 'pri', perm: 'sup.edit', onClick: () => {
      let added = 0, upd = 0;
      for (const { v, ex, rename } of plan) {
        if (ex) { let ch = false; if (rename) { ex.name = v.name; if (!ex.code) ex.code = v.code; if ('approved' in v) ex.approved = v.approved; if (v.approvalExp) ex.approvalExp = v.approvalExp; if (v.currency && (!ex.currency || ex.currency === S().defaultCurrency)) ex.currency = v.currency; ch = true; } for (const k in v) { const cur = ex[k]; if ((cur === '' || cur == null || (k === 'country' && !cur)) && v[k] !== '' && v[k] != null) { ex[k] = v[k]; ch = true; } } if (ex.approved !== true && v.approved === true) { ex.approved = true; ch = true; } if (v.note && !String(ex.note || '').includes(v.note)) { ex.note = (ex.note ? ex.note + '\n' : '') + v.note; ch = true; } if (ch) { putRec('suppliers', ex.id, ex); upd++; } }
        else { const rec = Object.assign({ id: uid(), type: '', account: '', address: '', city: '', state: '', zip: '', country: '', phone: '', fax: '', email: '', web: '', contact: '', contactPhone: '', contactEmail: '', approved: false, approvalExp: '', currency: S().defaultCurrency, leadDays: '', terms: '', note: '', code: '', docs: [] }, v); putRec('suppliers', rec.id, rec); added++; }

}

function poLineNet(l) { const up = num(l.unitPrice); const ds = String(l.disc ?? '').trim(); let net = up; if (ds.endsWith('%')) net = up * (1 - num(ds) / 100); else if (ds) net = up - num(ds); return Math.max(0, +net.toFixed(4)); }

  const misc = (po.misc || []).reduce((a, l) => a + num(l.price) * num(l.qty || 1), 0);
  const sub = parts + misc + num(po.addFees); const tax = po.taxName || num(po.taxRate) ? +(sub * num(po.taxRate) / 100).toFixed(2) : 0;

function invTotals(v) {
  const parts = (v.lines || []).reduce((a, l) => a + num(l.price) * num(l.qty), 0);
  const freight = v.kind === 'OpCost' ? (v.lines || []).reduce((a, l) => a + num(l.freight) * num(l.qty), 0) : 0;
  const misc = (v.misc || []).reduce((a, l) => a + num(l.price) * num(l.qty || 1), 0);
  const labor = (v.labor || []).reduce((a, l) => a + num(l.hours) * num(l.rate), 0);
  const hours = (v.labor || []).reduce((a, l) => a + num(l.hours), 0);
  const sub = parts + freight + misc + labor;
  const taxes = v.kind === 'Invoice' ? (S().taxes || []).filter(t => (v.taxes || []).includes(t.name)).map(t => ({ name: t.name, rate: num(t.rate), amt: +(sub * num(t.rate) / 100).toFixed(2) })) : [];
  return { parts, freight, misc, labor, hours, sub, taxes, total: sub + taxes.reduce((a, t) => a + t.amt, 0) };
}
