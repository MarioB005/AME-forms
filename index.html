is by generating a forecast list through AMS to which an example can be found in D.I.R Appendix F."},{"type":"paragraph","html":"The revision of the forecast list will be made upon reception of a copy of the journey log. This copy will be verified and used to update the aircraft maintenance system (ex: parts replaced or inspections completed or amended). "},{"type":"paragraph","html":"All life components and/or calendar life items are tracked by the aircraft maintenance system."},{"type":"paragraph","html":"When maintenance is required, the DOM shall arrange with an appropriately rated Approved Maintenance Organization (A.M.O.) to have the work accomplished in accordance with D.I.R.    Appendix J."},{"type":"subheading","html":"10.1\tProcedures (Aircraft) "},{"type":"paragraph","html":"Once maintenance is completed, the DOM and/or his delegate will review the aircraft's technical files to determine the next maintenance event. They will note it in the journey log using a “Forecast List” D.I.R. Appendix F. If maintenance work is performed outside the main base, the DOM and/or his delegate will amend and provide the Amended “Forecast List” electronically via e-mail following receipt of the aircraft hours and cycles."},{"type":"paragraph","html":"The aircraft may remain in service until that time, unless applicable airworthiness directives are issued or other defects are found. "},{"type":"subheading","html":"10.2\tMaintenance Standards"},{"type":"paragraph","html":"The manufacturer's recommendations of the aircraft, aircraft parts or STC referenced in the MPM section #8 for the maintenance, repair servicing or elementary tasks are to be followed at various workstations, e.g. in the hangar or at the work sites."},{"type":"paragraph","html":"If the manufacturers have not established maintenance standards and procedures, the DOM shall provide the methods acceptable to the aeronautical industry and to Transport Canada."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-14","label":"14","heading":"11.\tMaintenance schedule","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"11.\tMaintenance schedule"},{"type":"paragraph","html":"All company aircraft shall be maintained in accordance with their applicable inspection program approval."},{"type":"paragraph","html":"All inspection program approvals shall be in accordance with C.A.R.’s 605.86 and be approved by Transport Canada prior to use. "},{"type":"subheading","html":"11.1\tAirbus Helicopters AS350 Series, EC130 Series"},{"type":"paragraph","html":"These aircraft shall be maintained in accordance with the inspection program approval no. W0659, W2426 and the manufacturer’s inspection requirements found in the AS350, EC130 O.R.I.O.N. Master Servicing Manuals (MSM)."},{"type":"paragraph","html":"The inspection programs no. W0659 and W2426 are controlled, amended and distributed by the DOM. The original copy is located in the Transport Canada approval binder found in the DOM office."},{"type":"subheading","html":"11.2\tAirbus Helicopters EC120 B Series"},{"type":"paragraph","html":"These aircraft shall be maintained in accordance with the inspection program approval no. W1546 and the manufacturer’s inspection requirements found in the EC 120B O.R.I.O.N. Master Servicing Manuals (MSM)."},{"type":"paragraph","html":"The inspection program no. W1546 is controlled, amended and distributed by the DOM. The original copy is located in the Transport Canada approval binder found in the DOM office."},{"type":"subheading","html":"11.3\tAirbus Helicopters AS355 N, NP Series"},{"type":"paragraph","html":"These aircraft shall be maintained in accordance with the inspection program approval no. W2163 and the manufacturer’s inspection requirements found in the Twin Star AS355N, NP O.R.I.O.N. Master Servicing Manuals (MSM)."},{"type":"paragraph","html":"The inspection program no. W2163 is controlled, amended and distributed by the DOM. The original copy is located in the Transport Canada approval binder found in the DOM office."},{"type":"subheading","html":"11.4\tAirbus Helicopters EC135 Series"},{"type":"paragraph","html":"This aircraft shall be maintained in accordance with the inspection program approval no. RAXD-6701-EC135 and the manufacturer’s inspection requirements found in the EC135 O.R.I.O.N. Master Servicing Manuals (MSM)."},{"type":"paragraph","html":"The inspection program no. RAXD-6701-EC135 is controlled, amended and distributed by the DOM. The original copy is located in the Transport Canada approval binder found in the DOM office."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-16","label":"16","heading":"11.\tMaintenance schedule CONTINUED","revision":"13","revisionDate":"13-Sep-2024","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"11.\tMaintenance schedule CONTINUED"},{"type":"heading","html":"11.4\t Guimbal Cabri G2 Helicopters"},{"type":"paragraph","html":"This aircraft shall be maintained in accordance with the inspection program approval no. RAXD-6701-CABRI G2 and the manufacturer’s inspection requirements found on line (Customer Portal) Maintenance Manual  Ref.# J70-002 Section B and C."},{"type":"paragraph","html":"The inspection program no. RAXD-6701-CABRI G2 is controlled, amended and distributed by the DOM. The original copy is located in the Transport Canada approval binder found in the DOM office."},{"type":"heading","html":"12.\tDeleted"},{"type":"heading","html":"13.\tTechnical records"},{"type":"paragraph","html":"The DOM shall be responsible for the safe keeping of all records required by this document. Records including airframe and engine component log card, current work reports, completed inspection sign off sheets and technical logs are kept in the maintenance office or archived in the stockroom. As per CAR 103.04 these records may also be generated and stored electronically on AMS (Aircraft Maintenance System) program. The electronic data is stored on Phoenix Heli-Flight server and is backed up on the cloud daily where it is protected against lost or tampering. Any of these records can be provided to the Minister upon request. "},{"type":"paragraph","html":"Note: AMS is an electronic tracking system that allows the AMO to generate work reports based on aircraft component due time, inspections due time, defects, etc. This system is designed to produce maintenance entries printed on a label and allows for producing electronic maintenance release. The maintenance release can either be stamped and signed manually by the AME or may be stamped electronically using a security code system specific to each AMEs and protected with a password."},{"type":"paragraph","html":"As required corrections to any entry are made as per CAR 605.93 (5)."},{"type":"paragraph","html":"As per Standards 625.96 these records will be kept indefinitely or until the aircraft ownership is transferred or is no longer registered. "},{"type":"paragraph","html":"The DOM or his delegate shall be responsible to ensure that journey log entries are made as per C.A.R. 605.93 requirements and are transcribed to the technical log within 30 days."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-17","label":"17","heading":"13.\tTechnical records continued","revision":"7","revisionDate":"30-Jan-19","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"13.\tTechnical records continued"},{"type":"paragraph","html":"The DOM or his delegate shall retain copies of all supplemental work packages, for all maintenance performed on company aircraft. For the purpose of this requirement, the supplemental work packages shall include, but shall not be limited to the following:"},{"type":"paragraph","html":"inspection check sheets"},{"type":"paragraph","html":"work orders"},{"type":"paragraph","html":"additional work sheets"},{"type":"paragraph","html":"material requisitions"},{"type":"paragraph","html":"conformity certificates"},{"type":"paragraph","html":"other maintenance related documents."},{"type":"paragraph","html":"The DOM or his delegate shall maintain individual files located in the maintenance office, readily identified for each aircraft operated by the company. The files shall include, but shall not be limited to the following:"},{"type":"paragraph","html":"all supplemental work packages supplied by the A.M.O. as listed above"},{"type":"paragraph","html":"all applicable STC/STA approval packages"},{"type":"paragraph","html":"copies of all regulatory certificates and approvals issued (certificate of registration, certificate of airworthiness, maintenance schedule approvals)"},{"type":"paragraph","html":"a current copy of the aircraft maintenance system forecast report"},{"type":"paragraph","html":"all completed, current inspection check sheets"},{"type":"paragraph","html":"other maintenance related documents."},{"type":"heading","html":"13.1 Addition of new aircraft to existing fleet"},{"type":"heading","html":"The DOM is responsible for the addition of new aircraft to the fleet, either in the form of new purchased aircraft, or when leased aircraft are used a bridging inspection/acceptance check will be carried out on the leased aircraft. The above inspection/checks may be performed by a trained qualified AME I.A.W. Phoenix Heli-Flight training system."},{"type":"heading","html":"14.\tAIRCRAFT JOURNEY LOG AND TECHNICAL LOGBOOKS"},{"type":"paragraph","html":"Phoenix Heli-Flight has established an aircraft journey logbook combined with an aircraft technical logbook."},{"type":"subheading","html":"14.1\tAircraft Journey Logbooks"},{"type":"paragraph","html":"Aircraft journey logbooks consists of a (2) two-page form, presented in numerous numbered copies in the form of a book.  The upper page of each copy (white) is the original and remains in the book.  It is kept in the aircraft in accordance with the Canadian Aviation Regulations. The second copy (yellow) is detachable and is considered the technical log.  "},{"type":"subheading","html":"14.2\tAircraft Technical Logbooks"},{"type":"paragraph","html":"The aircraft's technical log consists of the yellow detachable copies of the Journey Log. It is detached when filled out and retained at the main base."},{"type":"paragraph","html":"Note:"},{"type":"paragraph","html":"Phoenix Heli-Flight does not use the electronic journey log / technical logbooks."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-18","label":"18","heading":"15.\tAIRCRAFT JOURNEY LOG ENTRIES","revision":"6","revisionDate":"30-Aug-2017","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"15.\tAIRCRAFT JOURNEY LOG ENTRIES "},{"type":"paragraph","html":"Definitions of code letters are found in the front section of each logbook."},{"type":"subheading","html":"15.1\tCode Letters of Certification of an Airworthiness Check"},{"type":"paragraph","html":"CODE LETTERS:  A.W.C."},{"type":"paragraph","html":"When the Code Letters « A.W.C. » are entered into the daily airworthiness certification, corrective action block of the journey log, it states that the authorized maintenance person or pilot certifying this entry has performed the following checks: "},{"type":"paragraph","html":"<b>Note: </b>"},{"type":"paragraph","html":"A.W.C. which includes (P-check), (BFF) and (ALF) for the AS350 and (BFF) and (ALF) for AS355 "},{"type":"paragraph","html":"series are to be carried out and signed before the first flight of the day."},{"type":"paragraph","html":"Airbus Helicopters AS350 series"},{"type":"paragraph","html":"Check before the first flight of the day (BFF) "},{"type":"paragraph","html":"Check after the Last Flight of the day (ALF)"},{"type":"paragraph","html":"P-check (Latest 10 FH or 7 days whichever comes first)"},{"type":"paragraph","html":"b)  Airbus Helicopters EC120B, EC130 series"},{"type":"paragraph","html":"     Flight related and inspection checks (VLV)"},{"type":"paragraph","html":"     Daily inspection"},{"type":"paragraph","html":"c)  Airbus Helicopters AS355N, NP series"},{"type":"paragraph","html":"Check before the first flight of the day (BFF) "},{"type":"paragraph","html":"Check after the Last Flight of the day (ALF)"},{"type":"paragraph","html":"d)  Airbus Helicopters EC135 series"},{"type":"paragraph","html":"Flight related Check I.A.W the Flight Manual "},{"type":"paragraph","html":"and Flight Manual Supplements."},{"type":"paragraph","html":"All of the checks mentioned are conducted in accordance with the applicable aircraft flight manual or applicable aircraft maintenance manual."},{"type":"subheading","html":"15.2\tCertification for Maintenance Release "},{"type":"paragraph","html":"CODE LETTERS: M.R."},{"type":"paragraph","html":"When the code letter «M.R.» is entered into the certification code column of the journey log, followed by the AME's signature and license number, it states:"},{"type":"paragraph","html":"\"I certify that the maintenance described has been performed in accordance with the applicable standards of airworthiness\"."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-19","label":"19","heading":"16.\tDefect reporting and rectification","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"subheading","html":"15.3\tCertification for Test Flight (F.T.) &amp; Conditional Maintenance Release (M.R.C.)."},{"type":"paragraph","html":"CODE LETTERS:  F.T. &amp; M.R.C."},{"type":"paragraph","html":"Following maintenance, it may be required for an aircraft to undergo a flight test. This will be determined by the AME or the Director of Maintenance as per CARs 571.10 (4). If this is the case, an entry will be made in the logbook indicating the following: “Subject to Satisfactory Test Flight” followed by the code “MRC” and the AME signature."},{"type":"paragraph","html":"Note: When the entry is made from a work report, the label generated from AMS will have the statement “Subject to Satisfactory Test Flight” printed when selected by the AME and therefore will not require the code “MRC” and signature to be added in the logbook as it will already be on the label. Generating of work reports is further detailed in Phoenix Heli-Flight MPM."},{"type":"paragraph","html":"Following the test flight, the pilot will enter the result (Satisfactory or Unsatisfactory). "},{"type":"paragraph","html":"Should the result be unsatisfactory, the pilot will enter the details of the discrepancy in the logbook. "},{"type":"paragraph","html":"If the results are satisfactory, the pilot will enter the result as follows: Flight test carried out and No Fault Found (NFF). He/she will enter code F.T. and his/her signature to which will attest to the following: "},{"type":"paragraph","html":"\"I (Pilot) hereby certify that I have flown the aircraft described herein and that its performance, flying qualities and functioning of all units, including control systems, meet the standard for the type\"."},{"type":"subheading","html":"15.4\tCertification for Dual Control Check "},{"type":"paragraph","html":"CODE: D.C.C."},{"type":"paragraph","html":"An Independent Check or Dual Control Check is required following maintenance on flight controls or engine controls. The code letter: “D.C.C.”: will be entered in the certification code column of the journey log, followed by the AME or pilot's signature and license number to which will attest to the following:"},{"type":"paragraph","html":"“The AME or Pilot has conducted a dual control check D.C.C. (Independent check) of the flight controls or engine controls affected by the maintenance work performed\"."},{"type":"heading","html":"16.\tDefect reporting and rectification"},{"type":"paragraph","html":"All defects or discrepancies in any part of the aircraft or its equipment shall be entered in the aircraft’s Journey Log before further flight by any authorized personnel who discover the defect. The aircraft will not be flown until the defects or discrepancies are rectified or deferred by a qualified person."},{"type":"paragraph","html":"Where permitted by C.A.R. 605.09 or C.A.R. 605.10 as applicable, aircraft having outstanding defects may be operated. All defective equipment which <b>must not</b> affect the airworthiness of the aircraft or is not required as per an airworthiness directive shall be deferred and identified by the means of a “INOPERATIVE” Label."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-20","label":"20","heading":"16. Defect reporting and rectification CONTINUED","revision":"10","revisionDate":"08-Sep-2021","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"16. Defect reporting and rectification CONTINUED"},{"type":"paragraph","html":"All defects shall be entered in the defect block of the journey log by the person who discovers the defect and shall be rectified in the Corrective Action Block or deferred to the Deferred Block in the journey log. All defects will be reported to the DOM or his delegate and will be done as soon as possible but no later than before the next flight. The DOM or approved AME will assess whether the defect can be deferred or if it must be rectified. Defects shall be numbered with the logbook page number followed by a dash “-” and a number. The number following the dash shall be “1” for the first defect on that logbook page, “2” for a second defect on that same logbook page, etc…. Once on a new log book page the defect number will bear the new log book page number followed by a dash “-“ “1” for the first defect and “2” for the second etc….  The deferred defect record is part of the Forecast List; it is kept at the front of the journey log and is revised regularly. Anytime a deferred defect is rectified, or a new deferred defect is added, the Forecast List is revised. When rectifying a defect listed in deferred defect section, an entry is to be made in the rectification block in journey logbook.  Where for any reason an equipment part has become unserviceable, it is to be isolated and secured to prevent it from disturbing any other equipment. Placards shall be installed identifying the unserviceable equipment part and a proper entry shall be made in the aircraft journey log immediately upon detection of unserviceable equipment and/or part. The DOM will train and authorize pilots to record the deferrals of defects that do not affect the airworthiness of the aircraft when occurring away from base. In any case the DOM will be made aware of the defect and will provide guidance to allow for the deferral of the defect. Deferred defects will be reviewed or rectified anytime a new work report is opened."},{"type":"heading","html":"16.1 Recurring Defects"},{"type":"paragraph","html":"When a defect occurs on an aircraft, it shall be reported to the maintenance department and entered in AMS “Aircraft Maintenance System”. AMS is programmed to alert the AME when a defect reoccurs 3 times within a 15 flight segment. When a defect reoccurs outside these limits, the aircraft is grounded until the defective equipment has been replaced, repaired or rectified."},{"type":"paragraph","html":"At the end of each month the PRM shall review the defect list for the month in AMS program for each aircraft to identify recurring defects. The result of this review shall be kept electronically in the company's maintenance drive for at least two years. If some recurring defects are noted, the defect will be rectified by the AMO and an entry made in the journey log. "},{"type":"heading","html":"17.\tDeleted "},{"type":"heading","html":"18.\tInspection following abnormal occurrences"},{"type":"paragraph","html":"The inspection of company aircraft following an abnormal occurrence such as a bird strike, hard landing, flight in severe turbulence, lightning strike, water immersion, etc., shall be in accordance with the requirements of C.A.R. 605.88 and any applicable manufacturer maintenance manuals. "}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-21","label":"21","heading":"19.\tTechnical dispatch","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"19.\tTechnical dispatch"},{"type":"heading","html":"The DOM will ensure that no aircraft is operated unless it is maintained in accordance with the Maintenance Control Manual (MCM), it is airworthy and appropriately equipped for its intended use. "},{"type":"heading","html":"Immediately following the completion of any scheduled maintenance task specified by the inspection program approval, airworthiness directive, or any other mandatory maintenance requirement, the DOM or his delegate shall ensure that the contracted A.M.O. makes an entry to that effect in the journey log and ensure, where applicable, that a new weight and balance amendment has been created as per section 25.  The DOM or his delegate shall review the technical records for the aircraft to determine the date, air-time, or operating cycles when the next scheduled maintenance task will be due in accordance with section 10 of this manual. "},{"type":"heading","html":"Technical dispatch of company aircrafts shall be made by means of logbook entries to the aircraft journey log. This shall include any attachments referencing procedures for ferry flight operations, extended range operations, all weather operations or any other special operations as required by C.A.R,s. "},{"type":"heading","html":"Where an additional flight authority has been issued, a logbook entry will be made indicating the special condition of the aircraft and the technical dispatch procedures found in C.A.R.’s Part 5 subpart 7 shall be followed. "},{"type":"heading","html":"Before accepting an aircraft, the pilot will review the aircraft Journey Log and Forecast List Appendix F for the next maintenance event, Airworthiness Directives, and the Deferred Defect for any outstanding defects. Prior to flight, the pilot will also verify that a maintenance release was signed, and if required, that the new weight and balance data was entered in the “ForeFlight” program for his next weight &amp; balance calculation.   "},{"type":"heading","html":"There shall be sufficient hours/cycles/days remaining to the next maintenance event to complete the intended flight."},{"type":"paragraph","html":"The final decision to accept an aircraft for any flight shall be the responsibility of the pilot in command."},{"type":"heading","html":"20.\tFlight authority"},{"type":"paragraph","html":"The DOM shall be responsible for all applications made to Transport Canada for company aircraft flight authorities and is authorised to make any required declarations for this purpose. "},{"type":"heading","html":"21.   Deleted"}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-23","label":"23","heading":"22.\tmaintenance agreements","revision":"12","revisionDate":"04-May-2023","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"22.\tmaintenance agreements"},{"type":"paragraph","html":"The primary maintenance provider of Phoenix Heli-Flight aircraft shall be Phoenix Heli-flight AMO #96-100. Maintenance may also be performed by appropriately rated A.M.O.’ s and shall be authorised in writing in the form of a contract. For the purposes of this manual, a contract may be in the form of a purchase order or letter. (Only approved A.M.O.’s shall be used)."},{"type":"paragraph","html":"Contract for maintenance shall specify the scope of work to be performed and upon completion, the work accomplished shall be check for compliance in accordance with C.A.R.’s, approved maintenance schedule as applicable, and this maintenance control manual."},{"type":"paragraph","html":"The DOM shall define all scheduled and unscheduled maintenance tasks to be performed. In the case of unscheduled maintenance requirements arising away from the main base, the pilot in command is to contact the DOM who in turn will take the appropriate action. A maintenance contract / agreement D.I.R. Appendix J will be completed by the DOM which will outline the work to be done and reference the applicable standards. The control sheet, the approved maintenance schedule (if applicable) and any relevant check sheets will form the maintenance package delivered to the AMO. The DOM will confirm that all tasks were carried out and were certified as per the agreement prior to the next flight. All completed work packages will be kept on file with the aircraft records."},{"type":"heading","html":"23.\tCONTROL OF COMPONENTS, PARTS AND MATERIALS"},{"type":"heading","html":"All items received shall be inspected by the DOM or his delegate to ensure quality, identity, authenticity and proper documentation. Where a type certificate holder assigns a proprietary number during the design phase to a standard or commercial part, and the proprietary part number is the only part number shown in the parts catalogue or similar document, only a part bearing the type certificate holder’s proprietary number, or an approved alternative part, shall be installed."},{"type":"heading","html":"All items are received in store under a purchase order. The storeroom clerk affixes a label with an inventory tracking number generated by the inventory program (AMS) on all items received with a previous certification from the manufacturer or from an approved maintenance organization. Items with a serial number will have one label with its own tracking number and items received in bulk such as nuts, bolts, etc. will have one label with a batch number. Original certification will either be kept with the part or with the purchase order. "},{"type":"heading","html":"All components and/or parts having a shelf life are tracked in AMS Inventory Manager and are appropriately disposed of when flagged. All parts must be verified for shelf life prior to installation.  Consumables such as oil, PRC, bonding material, etc. that are issued to the floor will be monitored and tracked in Aircraft Manager for their shelf life on a monthly basis. Expired material will be properly disposed of. "},{"type":"heading","html":"All parts requiring repairs beyond the scope of Phoenix Heli-Flight capability or approval will be sent to an approved repaired / overhaul facility. If a part is obtained from an aeronautical product that was damaged or permanently withdrawn from service, the part shall not be installed unless it can be traced to the manufacturer certificate holder and is inspected in conformity with the instructions for continued airworthiness or, if the part has been repaired or modified, it can be ascertained that the work was performed in accordance with approved data within the meaning of section 571.06 of the Airworthiness Manual. "}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-25","label":"25","heading":"23. CONTROL OF COMPONENTS, PARTS AND MATERIALS CONTINUED","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"23. CONTROL OF COMPONENTS, PARTS AND MATERIALS CONTINUED"},{"type":"heading","html":"All parts that are specified in the type design of an aeronautical product or that are approved alternative parts, are eligible for installation and shall be inspected prior to installing on an aeronautical product and its accompanying documentation shall be verified to ensure that the part conforms to its type design, as is indicated by the maintenance release. The DOM or his delegate shall also review the type certificate holder’s data, such as technical drawings, specification sheets or substantiation reports associated with the type design and ensure the part has been properly configured."},{"type":"subheading","html":"Quarantine Locker"},{"type":"paragraph","html":"The quarantine locker is controlled by the A.M.O."},{"type":"subheading","html":"Vendor Quality Evaluation"},{"type":"paragraph","html":"All Vendors wishing to provide aeronautical products and/or services to Phoenix Heli-Flight Inc. will be required to complete Form D.I.R. to MCM Appendix L. Once completed, the form will be submitted to the DOM and kept electronically in “Inventory Manager”.\t"},{"type":"heading","html":"24.\tStorage of flammable liquids"},{"type":"paragraph","html":"The fuel tank located at the main base used for refuelling aircraft consists of a 61,000 litre fuel storage tank installed above the ground with the necessary pumps, filters, counter, hose reel and ground wire."},{"type":"paragraph","html":"Before each delivery of fuel is unloaded, the documents for the delivered product are checked by the company."},{"type":"paragraph","html":"The tank is sampled weekly I.A.W the procedures described in D.I.R. Appendix O to test for quality and for the presence of foreign matter. Three different checks are performed: a clear and bright check, fuel density check and a water detection check. The inspection result is entered in a log D.I.R. Appendix P and is controlled by the DOM. Form Appendix Q is also used to keep track of fuel quantity. It is filled out and the results are sent to the operations department on a weekly basis."},{"type":"paragraph","html":"The quantity of the fuel tank is controlled by a satellite transmitter to the fuel provider."},{"type":"paragraph","html":"The main fuel tank filters are replaced yearly or if there is evidence of contamination. "},{"type":"paragraph","html":"Oil and grease containers are stored on the maintenance floor in a fireproof cabinet."},{"type":"paragraph","html":"Waste flammable oil is dumped and kept in a large container located on the north side of the maintenance hangar and waste fuel in a designated container located adjacent to the west refueling station. A company specialized in the recycling of waste hazardous material will be contacted to dispose the content of the container when full."},{"type":"heading","html":"25.\tWEIGHT &amp; BALANCE &amp; AMENDMENTS"},{"type":"paragraph","html":"A new weight &amp; balance report D.I.R. Appendix K will be completed according to the requirements of the C.A.R.’s 571 Appendix C, and Chapter 605.92(1)(C) and the manufacturer's recommendations."},{"type":"paragraph","html":"A weight &amp; balance amendment D.I.R. Appendix K will be completed following any modification to the empty weight or the position of the center of gravity of an aircraft modified by an equipment installation, C.A.R’s Chapter 571 Appendix C “Aircraft Weight &amp; Balance Control”."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-25-2","label":"25","heading":"26.\tExtensions and tolerances","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"subheading","html":"25.1\tWeight &amp; Balance and Aircraft Configuration"},{"type":"paragraph","html":"Prior to each flight, pilots will be required to check the configuration (fix equipment installed) of the aircraft using the table found at the front of each logbook. The Table will show pre-calculated configurations with a reference number approved by an AME. This reference number will be entered in the designated column of the logbook prior to every flight. When a pilot or AME makes a change in the configuration of an aircraft, he/she will record the change in the note section of the logbook and reference the new configuration number. Example: A cargo hook is installed – the pilot or AME will write the following in the logbook “Cargo hook installed, Configuration # “X” now in effect.” Refer to Appendix “K” for an example of the configuration Table. After the configuration has been determined and recorded (Per STD 726.08(1)(u)) the pilot will tick the “Check Box” that corresponds to the fixed equipment in the program called “ForeFlight” installed on each of the aircraft dedicated iPads (Appendix C). He /she will then cross check the weight and Center of Gravity with the Table found at the front of each logbook. Once the pilot confirms the calculated value from the program coincides with the configuration table, he/she will continue with calculating the loading of the aircraft by entering the weight of the fuel, passengers and baggage loading in this program. Once all the information has been entered in the program the system will generate a final weight &amp; balance report on PDF. The pilot will check the report and confirm that the weight and balance is and will remain within limits throughout his mission. He will then send the report to the safety manager via email at wnb@phoenixheliflight.com for record keeping. These records will be kept electronically in the server for a minimum of three years. See Appendix D for an example of weight &amp; balance loading summary. Should there be no pre-calculated value in the table “Appendix “K” for an aircraft specific configuration, an AME will perform the calculation, enter the weight and Center of Gravity of the new configured aircraft and certify the change in the logbook."},{"type":"heading","html":"26.\tExtensions and tolerances"},{"type":"paragraph","html":"The DOM or his delegate is responsible to authorize the use of a “Tolerance” for components with “Operating Time Limits” or for “Inspections” relating to Components or Aircraft.  When a “Tolerance” is granted D.I.R. Appendix M shall be completed and an entry shall be made in the journey log. Once the inspection is completed or the component replaced, the proper entries shall be made in the journey log. For approved tolerance limits refer to Notes of the approved MSA’s. "},{"type":"paragraph","html":"The tolerance approval form D.I.R. Appendix M shall remain in the journey log, until such time the inspection or component is replaced.  Once carried out, the tolerance approval is placed in the aircraft files.  In the event of irregular circumstances requiring extensions that will exceed limits established in the MCM and the manufacturer's recommendations, the \"SPECIAL EXTENSION REQUEST\" form D.I.R. Appendix N shall be used.  This form requires prior approval of the manufacturer and Transport Canada."},{"type":"heading","html":"27.\tDeleted "},{"type":"heading","html":"28.\ttraining"},{"type":"paragraph","html":"The purpose of the training program is to ensure that each individual receives training in the regulations, standards, technical aspects, and company procedures appropriate to the tasks that will be required as specified in Standards 726.12. "},{"type":"paragraph","html":"The DOM or his delegate shall provide initial training D.I.R. “Appendix Ha” to all new pilots to ensure that they are aware of the pertinent regulations, standards and air operator procedures and provide elementary tasks &amp; servicing training D.I.R. “Appendix Hb &amp; Hc”, airworthiness directive and associated service bulletins D.I.R. Appendix “Hd” to all pilots IAW CARs 706.11 at least every two  "}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-25-3","label":"25","heading":"28.\ttraining CONTINUED","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"28.\ttraining CONTINUED"},{"type":"paragraph","html":"years. Pilots shall perform each task under the direct supervision of an AME prior to being qualified. Update training will be provided using D.I.R. “Appendix Ha” when new or revised regulations, standards or procedures related to the work for which pilots are responsible are introduced. Until such time as it is revised through an assessment made in respect of the evaluation program, the initial cycle for update training shall not exceed three years. This shall be tracked in DATS. Servicing training will be provided using D.I.R. “Appendix Hb”. Additional training will be provided using D.I.R. “Appendix Hb” when new equipment is introduced where it is shown to be necessary by a finding made under the quality assurance audit program. Anytime new revisions of ADs or SBs are released to which pilots have been previously trained on, pilots will be required to acknowledge the receipt and understanding of the new revised document entered in their training folder in DATS. Pilots will receive additional training and their “Pilot Training Card” Appendix “Hg” will be revised. The procedure used for updating and distributing the new or revised document is found in D.I.R. Appendix “Hh”. All tasks conducted shall be carried out I.A.W. CAR's 571.02 and manufacturer’s instructions and use the most recent methods, techniques, practices and materials as per the manufacturer’s instruction or instructions for continued airworthiness developed by the manufacturer of that aeronautical product."},{"type":"paragraph","html":"Pilots will receive training in aircraft servicing procedures for the aircraft type they are authorised to fly. This training shall include but shall not be limited to refuelling, lubrication, de-icing, pre and post flight inspections, and aircraft ground handling. "},{"type":"paragraph","html":"All pilots will receive training to perform Dual Control Check / Independent Check as per APPENDIX “He”. The DCC / ICC training is a function of the AMO in reference to section 16.6 of the MPM."},{"type":"paragraph","html":"Human factors training will be provided and tracked at an interval not to exceed three years on DATS and shall include instruction on the following:"},{"type":"paragraph","html":"\t(1) Human performance: "},{"type":"paragraph","html":"(2) Factors influencing human error including:"},{"type":"table","rows":[["(i) Fatigue;","(ii) Stress;","(iii) Assertiveness;","(iv) Awareness;"],["(v) Resources;","(vi) Knowledge;","(vii) Teamwork;","(viii) Norms"],["(ix) Complacency;","(x) Pressure;","(xi) Distraction;","(xii) Communication;"]]},{"type":"paragraph","html":"(3) Error management, including error prevention and error containment."},{"type":"paragraph","html":"All maintenance safety related issues will be communicated to staff by means of company memos and/or by verbal briefings."},{"type":"heading","html":"29.\tpersonnel records"},{"type":"paragraph","html":"The person appointed by the Accountable Executive to be the DOM for the maintenance control system shall meet the requirements of C.A.R. 706.03 (Air Operator) and the standards of competence set out in C.A.R. 726.03 as applicable."},{"type":"paragraph","html":"All elementary tasks or specific tasks to which pilots have been trained on will be recorded in the journey log / technical records by the person performing the task. The entry shall include but is not limited to, where applicable, the date, aircraft hours, the product identification, part number, serial number, a brief description of the work performed and the manufacturer or other recommended standards the task was performed under. The DOM shall provide a current copy of the MCM, or relevant portions thereof, to each person who performs or certifies work. "}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-26","label":"26","heading":"29.\tpersonnel records continued","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"29.\tpersonnel records continued"},{"type":"paragraph","html":"Upon successful completion of training, the DOM or his delegate shall update the individual personnel records to reflect the training completed and the qualifications obtained. The training record shall be signed and dated by the DOM or the AME performing the training and the pilot. "},{"type":"paragraph","html":"Pilots will be required to carry their Pilot Training Cards APPENDIX “Hg” which will remain valid for a maximum of two years following the date of issue. This card will show proof of training on elementary task, Update/Additional/Servicing training and AD training. "},{"type":"paragraph","html":"The DOM or his delegate shall establish and maintain the following individual personnel records for each flight crew member under the employment of the company listed in the D.I.R Appendix “G” “Approved Pilots and Qualification” in accordance with C.A.R. 706.13:"},{"type":"paragraph","html":" a) Records of authorization to perform elementary work given in accordance with CARs section 706.10 "},{"type":"paragraph","html":"(b) Records of all training conducted pursuant to CARs section 706.13."},{"type":"paragraph","html":"A copy of each record shall be available on DATS to the person to whom the record refers to on the completion of all training or authorization. Those records are kept electronically in DATS for a minimum of two years."},{"type":"heading","html":"AIRWORTHINESS DIRECTIVES AND SERVICE BULLETINS &amp; Alternative means of compliance"},{"type":"paragraph","html":"All applicable airworthiness directives “ADs” alert service bulletins “ASBs” &amp; alternative means of compliance “AMOCs” shall be executed within the time stipulated by the issuing authority and entered in the appropriate aircraft logs in accordance with the Canadian Aviation Regulations. "},{"type":"paragraph","html":"The accomplishment of the service bulletins will be left to the judgement of the DOM. All SBs, ASBs &amp; ADs that have been complied with will be recorded as having been complied with carried out or as not applicable in the Airframe / Journey Logbook and will also be recorded and tracked electronically in AMS. "},{"type":"paragraph","html":"AD’s /ASBs, or section of, that can be complied with by the pilot which qualifies as elementary work will be listed at the front of the aircraft logbook. These AD’s / ASB’s will have their own reference number which will be referenced to when being complied with during the aircraft daily inspection. Example of a logbook entry will be as follows:  AD/ ASB Ref. #1, #3 &amp; #4 complied with. NFF."},{"type":"paragraph","html":"Technical logs will be updated and the approved inspection schedules will be amended if required. "},{"type":"paragraph","html":"A copy of the AMOC shall be retained with the “Small Aircraft Maintenance Approval” document and the reference number shall be recorded in Appendix “Hd”."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-27","label":"27","heading":"AIRWORTHINESS DIRECTIVES AND SERVICE BULLETINS & Alternative means of compliance Continued","revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"AIRWORTHINESS DIRECTIVES AND SERVICE BULLETINS &amp; Alternative means of compliance Continued"},{"type":"paragraph","html":"The DOM or his delegate is responsible for the reception of all airworthiness directives. Upon receipt of an airworthiness directive, he is to inform all maintenance personnel. A copy of the AD is to be faxed or sent by any other means possible to ensure compliance within the time constraints required by the AD.  The AD shall be complied with within the time required and recorded in the logbook."},{"type":"heading","html":"31.\tService difficulty reporting (SDR)"},{"type":"paragraph","html":"The service difficulty report is used to notify Transport Canada of all mechanical difficulties, failure condition or defects in an aeronautical product (aircraft or component) affecting safety, which, if not corrected, will probably affect the safety of the aircraft, its occupants or any other persons. "},{"type":"paragraph","html":"The DOM shall submit a service difficulty report for each reportable service difficulty that contains the information specified in the form published by the Minister entitled “Service Difficulty Report”. The service difficulty report shall be submitted electronically through the Transport Canada web service difficulty reporting system. The service difficulty shall be submitted to the Minister within three working days after the day on which the reportable service difficulty is discovered."},{"type":"paragraph","html":"If all of the information required under C.A.R’s subsection 521.401(1) is not available within the period specified above, an interim service difficulty report containing the following elements may be submitted within three working days after the day on which the reportable service difficulty is discovered: "},{"type":"paragraph","html":"(a) the aircraft registration, if applicable\t"},{"type":"paragraph","html":"(b) the date of the occurrence of the reportable service difficulty"},{"type":"paragraph","html":"(c) a description of the reportable service difficulty; and"},{"type":"paragraph","html":"(d) the name, mailing address, and telephone and fax numbers of the person submitting the report."},{"type":"paragraph","html":"The person submitting the interim service difficulty report shall submit a complete service difficulty report within 14 days after the day on which the reportable service difficulty is discovered."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-28","label":"28","heading":"32.\tDocuments Incorporated by Reference (D.I.R.) (APPENDIXES)","revision":"11","revisionDate":"15-Dec-2021","changedInCurrentRevision":false,"blocks":[{"type":"heading","html":"32.\tDocuments Incorporated by Reference (D.I.R.) (APPENDIXES)"},{"type":"paragraph","html":"Approval of this maintenance control manual by Transport Canada does not include approval of any D.I.R. Appendixes. "},{"type":"paragraph","html":"D.I.R. Appendixes to which this manual refers to are controlled by the DOM."},{"type":"paragraph","html":"The incorporation of a new D.I.R. Appendix may be in reference to a new or existing paragraph contained in this MCM to which shall be approved by Transport Canada. "},{"type":"paragraph","html":"<b>33. </b><b> </b><b>Quality assurance program</b>"},{"type":"paragraph","html":"The Quality Assurance Program used by Phoenix Heli-Flight can be found in the Quality Assurance Program Manual. All related check lists and follow-up forms for all activities performed in relation to audits can be found within this manual. "},{"type":"paragraph","html":"<b>33.1 </b><b>Auditing System</b>"},{"type":"paragraph","html":"The Quality Assurance Manager is responsible to the DOM and shall establish a QA program to verify the effectiveness, quality and safety of all functions defined within this manual. It shall confirm that the air operator is in compliance with the applicable regulations and with the MCM by addressing operational and environmental conditions, organizational structure, record keeping systems, etc., and ensure that all referenced procedures remain applicable and effective. "},{"type":"paragraph","html":"Check lists and corrective action forms can be found in the D.I.R. Quality Assurance Manual. Any findings affecting Safety shall be addressed immediately. The QA manager will assign the responsibility to develop corrective actions to the appropriate manager.<b> </b>The QA manager or his delegate will perform audits while activities covered by the MCM and maintenance schedules are in progress, including work being performed at night. Audit findings are managed through the company SMS and tracked to completion in DATS system. All audit records will be retained in DATS for a minimum of no less than two audit cycles and two years. "},{"type":"paragraph","html":"<b>33</b><b>.2 Procedures</b>"},{"type":"paragraph","html":"An initial audit will be performed within 12 months after the date on which the air operator certificate is issued and subsequent internal audits will be conducted completely or on a progressive basis every 12 months (plus 30-day tolerance). The duties related to the quality assurance program that involve specific tasks or activities within the company activities shall be fulfilled by persons who are not responsible for carrying out those tasks or activities."},{"type":"paragraph","html":"Audits may be performed by external sources (Audit companies) specializing in the aviation industry. The credentials of these companies shall be checked by the DOM or the QA Manager. The employees of these external agencies will be trained by the DOM or the QA Manager to the Phoenix Heli-Flight quality assurance program IAW MCM / QA manual. The auditors will be evaluated and all records will be kept in DATS for a period of no less than 2 audit cycles or 2 years. External agencies will also be required to use check lists and corrective action forms found in the PHF D.I.R. Quality Assurance Manual and may choose to use their own as a supplement when performing audits."},{"type":"paragraph","html":"The Audit will be performed using the appropriate check list (Annex 1 to 12) found in the D.I.R. Quality Assurance Manual and the result of each Items “Content / Activity to be Checked” will be recorded in the result section. The sample document that was checked or a description of the observation will be recorded in the “Note” section of the check list."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null},{"id":"p-29","label":"29","heading":null,"revision":"9","revisionDate":"15-Apr-2020","changedInCurrentRevision":false,"blocks":[{"type":"paragraph","html":"<b>33.2 Procedures </b><b>Continued</b> "},{"type":"paragraph","html":"Following the completion of the audit all discrepancies shall be recorded on Annex 13 “Corrective Action Form” for each finding and submitted to the Quality Assurance (QA) Manager. The QA Manager will then perform and document the factual review of the finding described in the QA Manual, perform the root cause analysis using the 5 “Why” method described in the QA Manual and provide a short and/or long term action to be taken for each item. Short term corrective actions shall be addressed within 30 days and/or long-term corrective actions shall be addressed within 90 days. Follow-up shall be performed using form Annex 14 “Follow-up Action Form” of the D.I.R. QA Manual within 180 days following the short or long-term corrective action. If during the follow up review and re-audit of the area affected it is found that the corrective action was not effective, the DOM or manager will perform a new root cause analysis and the process will begin again. All time limits initiated by a short term, long term, and follow-up plan shall be entered in DATS which will be set to send an automatic e-mail message to all concerned departments."},{"type":"paragraph","html":"In the event of a conflict between the production criteria and quality, quality shall prevail."},{"type":"paragraph","html":"All snags not covered by the procedures in this manual shall be reported immediately to the Quality Assurance Manager."},{"type":"paragraph","html":"Where deficiencies in company policies and/or procedures are discovered, the DOM or his delegate shall take action to correct them.  Where the deficiencies relate to the performance of maintenance, the details of the deficiencies shall be communicated to the A.M.O. by completing an “Investigation Report” using “Phoenix Heli-Flight DATS system” See Appendix I for example of a DATS report. These investigation reports shall be reviewed by the DOM or QA manager within 30 days. "},{"type":"paragraph","html":"Finding will be rectified using:"},{"type":"paragraph","html":"a) \tThe current DATS system or, "},{"type":"paragraph","html":"b)\tFor finding requiring a QA investigation, by following the procedure as stated above."},{"type":"paragraph","html":"Records of each evaluation, including any decisions made will be kept electronically in the “DATS System”."},{"type":"paragraph","html":"Investigation Report using “Phoenix Heli-Flight DATS system” shall be used whenever actions performed by an employee are subject to negligence or affect safety in relation to maintenance and/ or operational procedures. "},{"type":"paragraph","html":"A copy is sent to the employee so that they may complete the portion of the report indicating the reason for the non-compliance. Once completed, the report will be reviewed by the DOM and Director of Operations for evaluation. The findings shall be transmitted to the employee and a copy put in the employee’s file. The Audit records will be retained electronically on PDF files in DATS for a minimum of no less than two audit cycles and two years. Reminders will be set in DATS to alert the DOM and QA Manager of the upcoming Short Term, Long Term and Follow-up due dates."}],"image":null,"generated":null,"isCertificationPage":false,"certificationImage":null}],"amendments":[{"amendmentNo":1,"dateIssued":"15/08/10","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":2,"dateIssued":"24/07/13","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":3,"dateIssued":"07/10/13","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":4,"dateIssued":"25-Mar-14","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":5,"dateIssued":"30-Apr-15","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":6,"dateIssued":"30-Aug-17","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":7,"dateIssued":"30-Jan-19","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":8,"dateIssued":"16-Sep-19","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":9,"dateIssued":"15-Apr-20","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":10,"dateIssued":"08-Sep-21","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":11,"dateIssued":"15-Dec-21","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":12,"dateIssued":"04-May-23","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":[]},{"amendmentNo":13,"dateIssued":"13-Sep-24","dateReceived":"","dateInserted":"","insertedBy":"","pagesChanged":["iv","1","3","4","11","15"]}],"lastAmendmentNo":13,"pendingPageIds":[]};

  function pcInterpAscending(x, xs, ys) {
    const n = xs.length;
    if (n === 1) return { y: ys[0], extrapolated: false };
    let i, extrapolated = false;
    if (x <= xs[0]) { i = 0; extrapolated = x < xs[0]; }
    else if (x >= xs[n - 1]) { i = n - 2; extrapolated = x > xs[n - 1]; }
    else {
      let lo = 0, hi = n - 1;
      while (lo < hi - 1) {
        const mid = (lo + hi) >> 1;
        if (xs[mid] <= x) lo = mid; else hi = mid;
      }
      i = lo;
    }
    const x0 = xs[i], x1 = xs[i + 1], y0 = ys[i], y1 = ys[i + 1];
    const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
    return { y: y0 + t * (y1 - y0), extrapolated };
  }

  function pcBracketIndex(x, xs) {
    const n = xs.length;
    if (x <= xs[0]) return 0;
    if (x >= xs[n - 1]) return n - 2;
    let lo = 0, hi = n - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (xs[mid] <= x) lo = mid; else hi = mid;
    }
    return lo;
  }

  function pcKAtHpForBand(targetHp, points) {
    const rev = points.slice().reverse();
    const hps = rev.map(p => p[1]);
    const ks = rev.map(p => p[0]);
    return pcInterpAscending(targetHp, hps, ks);
  }

  function pcMakeEngine(data) {
    const { tqnrBands, hpBands, sandFilterNone, sandFilterInstalled, threshold, limits } = data;

    function kFromTorque(nr, torque) {
      const kAtNr = tqnrBands.map(b => {
        const t = (b.nrTop - nr) / (b.nrTop - b.nrBot);
        return b.kTop + t * (b.kBot - b.kTop);
      });
      const torques = tqnrBands.map(b => b.torque);
      const torqueAsc = torques.slice().reverse();
      const kDesc = kAtNr.slice().reverse();
      const r = pcInterpAscending(torque, torqueAsc, kDesc);
      return { k: r.y, extrapolated: r.extrapolated, kAtNr, torques };
    }

    function torqueFromK(targetK, kAtNr, torques) {
      return pcInterpAscending(targetK, kAtNr, torques);
    }

    function hpChain(hp, targetK, anchorAtActual) {
      const actualK = hpBands.map(b => pcKAtHpForBand(hp, b.points).y);
      const groundK = hpBands.map(b => pcKAtHpForBand(0, b.points).y);
      if (!anchorAtActual) {
        const n = hpBands.length - 1;
        const arr = groundK.slice(0, n);
        const idx = pcBracketIndex(targetK, arr);
        const gL = groundK[idx], gR = groundK[idx + 1];
        const aL = actualK[idx], aR = actualK[idx + 1];
        const t = gR === gL ? 0 : (targetK - gL) / (gR - gL);
        return aL + t * (aR - aL);
      } else {
        const arr = actualK;
        const idx = pcBracketIndex(targetK, arr);
        const aL = actualK[idx], aR = actualK[idx + 1];
        const gL = groundK[idx], gR = groundK[idx + 1];
        const t = aR === aL ? 0 : (targetK - aL) / (aR - aL);
        return gL + t * (gR - gL);
      }
    }

    function marginKFromOatNg(oat, ng, sandInstalled) {
      const bands = sandInstalled ? sandFilterInstalled : sandFilterNone;
      const kAtOat = bands.map(b => {
        const oats = b.points.map(p => p[1]);
        const ks = b.points.map(p => p[0]);
        return pcInterpAscending(oat, oats, ks).y;
      });
      const ngVals = bands.map(b => b.ng);
      const ngAsc = ngVals.slice().reverse();
      const kDesc = kAtOat.slice().reverse();
      return pcInterpAscending(ng, ngAsc, kDesc).y;
    }

    function thresholdLine(x) {
      const { r8, s8, r9, s9 } = threshold;
      const t = (x - r8) / (r9 - r8);
      return s8 + t * (s9 - s8);
    }

    function compute(inputs) {
      const { nr, torque, hp, oat, ng, sandFilterInstalled } = inputs;
      const kFromTq = kFromTorque(nr, torque);
      const marginK = marginKFromOatNg(oat, ng, sandFilterInstalled);
      const hpValueOut = hpChain(hp, kFromTq.k, false);
      const hpMarginOut = hpChain(hp, marginK, true);
      const minTorqueResult = torqueFromK(hpMarginOut, kFromTq.kAtNr, kFromTq.torques);
      const minimumTorque = minTorqueResult.y;
      const torqueMargin = torque - minimumTorque;
      const sandCheckValue = thresholdLine(marginK);
      const sandCheckThreshold = thresholdLine(hpValueOut);
      const passed = sandCheckValue < sandCheckThreshold;
      return {
        minimumTorque, torqueMargin, passed,
        extrapolated: kFromTq.extrapolated || minTorqueResult.extrapolated,
        debug: { kFromTorque: kFromTq.k, marginK, hpValueOut, hpMarginOut, sandCheckValue, sandCheckThreshold },
      };
    }

    return { compute, limits };
  }

  const pcEngine = pcMakeEngine(POWERCHECK_DATA);
  let pcSandInstalled = true;

  function pcCssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  const PC_GMIN = -20, PC_GMAX = 30, PC_GWARN = 3;
  function pcAngleFor(v){
    const t = Math.max(0, Math.min(1, (v - PC_GMIN) / (PC_GMAX - PC_GMIN)));
    return Math.PI - t * Math.PI;
  }

  function pcDrawGauge(canvas, margin){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H - 40, r = 200, rInner = 160;
    ctx.clearRect(0,0,W,H);

    const badC = pcCssVar('--bad') || '#b0281e';
    const warnC = pcCssVar('--warn') || '#b3791b';
    const goodC = pcCssVar('--good') || '#2f7d4f';
    const lineC = pcCssVar('--line') || '#dfe2da';
    const grey = pcCssVar('--grey-strong') || '#6b6558';
    const ink = pcCssVar('--ink') || '#1c2b24';

    ctx.lineWidth = r - rInner;
    ctx.lineCap = 'butt';
    const zones = [
      { from: PC_GMIN, to: 0, color: badC },
      { from: 0, to: PC_GWARN, color: warnC },
      { from: PC_GWARN, to: PC_GMAX, color: goodC },
    ];
    zones.forEach(z => {
      ctx.beginPath();
      ctx.strokeStyle = z.color;
      ctx.globalAlpha = 0.88;
      ctx.arc(cx, cy, (r+rInner)/2, -pcAngleFor(z.from), -pcAngleFor(z.to), false);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.fillStyle = grey;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let v = PC_GMIN; v <= PC_GMAX; v += 10) {
      const a = pcAngleFor(v);
      const x1 = cx + Math.cos(a) * (r + 3);
      const y1 = cy - Math.sin(a) * (r + 3);
      const x2 = cx + Math.cos(a) * (rInner - 3);
      const y2 = cy - Math.sin(a) * (rInner - 3);
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineC;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lx = cx + Math.cos(a) * (r + 18);
      const ly = cy - Math.sin(a) * (r + 18);
      ctx.fillText((v>0?'+':'') + v, lx, ly);
    }

    const clamped = Math.max(PC_GMIN, Math.min(PC_GMAX, margin));
    const a = pcAngleFor(clamped);
    const nx = cx + Math.cos(a) * (rInner - 6);
    const ny = cy - Math.sin(a) * (rInner - 6);
    const needleC = margin < 0 ? badC : (margin < PC_GWARN ? warnC : goodC);
    ctx.strokeStyle = needleC;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = needleC; ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = ink; ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
  }

  // Number of decimal places implied by a slider's step (e.g. 0.01 -> 2, 10 -> 0) -- used so the
  // readout next to a slider actually shows the extra precision once a field's step is made finer
  // (a 0.01-step OAT field displayed with only 1 decimal would make the Up/Down buttons look like
  // they're doing nothing).
  function pcStepDecimals(step){
    const s = String(step);
    const i = s.indexOf('.');
    return i === -1 ? 0 : (s.length - i - 1);
  }
  function pcFormatFieldVal(f, val){
    const d = pcStepDecimals(f.step);
    return d > 0 ? val.toFixed(d) : Math.round(val).toLocaleString();
  }
  // Shared "range slider + Up/Down fine-adjust buttons" row, used by both the AS350 B2 Powercheck
  // and the Arriel 1D1 Bleed Valve Test (the EC135 Power Check has its own compact +/- version of
  // the same idea -- ec135FieldHTML below -- left as-is since it wasn't part of this request).
  function pcFieldHtmlWithSteppers(f, formatFn){
    return (
      '<div class="pc-field">' +
        '<div class="pc-field-head"><span class="pc-field-name">'+f.label+'<span class="pc-field-unit">'+f.unit+'</span></span><span class="pc-field-val" id="'+f.id+'Val">'+formatFn(f, f.value)+'</span></div>' +
        '<div class="pc-field-row">' +
          '<input type="range" id="'+f.id+'" min="'+f.min+'" max="'+f.max+'" step="'+f.step+'" value="'+f.value+'">' +
          '<div class="pc-stepper">' +
            '<button type="button" class="pc-step-btn wide" data-target="'+f.id+'" data-dir="-1" aria-label="Decrease '+f.label+'">&minus;</button>' +
            '<button type="button" class="pc-step-btn wide" data-target="'+f.id+'" data-dir="1" aria-label="Increase '+f.label+'">+</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  // Rounds a stepped value back onto the step grid and clamps it to [min,max], cleaning up the
  // floating-point noise a fine step like 0.01 would otherwise leave behind (e.g. 0.1+0.2).
  function pcRoundToStep(val, step, min, max){
    const decimals = Math.max(pcStepDecimals(step), 6);
    let v = Math.round(val/step) * step;
    v = parseFloat(v.toFixed(decimals));
    return Math.max(min, Math.min(max, v));
  }
  // Delegated click handler for every "Up"/"Down" stepper button inside `container` -- one listener
  // covers all of a view's fields since the buttons are re-rendered along with everything else.
  function pcWireSteppers(container){
    container.addEventListener('click', (e)=>{
      const btn = e.target.closest('.pc-step-btn');
      if (!btn) return;
      const inp = document.getElementById(btn.dataset.target);
      if (!inp) return;
      const step = parseFloat(inp.step) || 1;
      const min = parseFloat(inp.min), max = parseFloat(inp.max);
      const dir = parseFloat(btn.dataset.dir);
      const val = pcRoundToStep(parseFloat(inp.value) + dir*step, step, min, max);
      inp.value = val;
      inp.dispatchEvent(new Event('input', { bubbles:true }));
    });
  }

    function syncSand(){
      sandNoneBtn.setAttribute('aria-pressed', String(!pcSandInstalled));

      const out = pcEngine.compute(inputs);

      marginFigure.textContent = sign + Math.abs(out.torqueMargin).toFixed(2) + '%';

      document.getElementById('pcMinTorqueOut').textContent = out.minimumTorque.toFixed(1) + '%';
      document.getElementById('pcTqObservedOut').textContent = inputs.torque.toFixed(1) + '%';

      const chip = document.getElementById('pcStatusChip');
      chip.classList.remove('pass','fail');
      chip.classList.add(out.passed ? 'pass' : 'fail');
      document.getElementById('pcStatusText').textContent = out.passed ? 'PASSED' : 'FAILED';

      document.getElementById('pcExtrapNote').hidden = !out.extrapolated;

      const tg = document.getElementById('pcTechGrid');
      const d = out.debug;
      tg.innerHTML = [
        ['K (NR, Torque)', d.kFromTorque],
        ['K margin (OAT, Ng)', d.marginK],
        ['Hp value K', d.hpValueOut],
        ['Hp margin K', d.hpMarginOut],
        ['Sand check value', d.sandCheckValue],
        ['Sand check threshold', d.sandCheckThreshold],
      ].map(([k,v])=>'<div>'+k+'<span>'+v.toFixed(4)+'</span></div>').join('');

      pcDrawGauge(document.getElementById('pcGauge'), out.torqueMargin);
    }

    document.getElementById('pcPrintBtn').onclick = ()=>{
      const dateISO = document.getElementById('pcDate').value;
      const reg = document.getElementById('pcReg').value;
      const pilot = document.getElementById('pcPilot').value;
      const inputs = readInputs();
      const out = pcEngine.compute(inputs);
      const recordData = {
        date: dateISO,
        reg: reg,
        pilot: pilot,
        nr: inputs.nr,
        torque: inputs.torque,
        hp: inputs.hp,
        oat: inputs.oat,
        ng: inputs.ng,
        sandFilterInstalled: inputs.sandFilterInstalled,
        out: out,
      };
      openPrint(buildPowercheckPrintHtml(Object.assign({}, recordData, { date: fmtDateNice(dateISO) })));
      // keep a record of every printed report (searchable in Saved Forms, and plotted in Trend
      // monitoring) -- best-effort: saveRecord/storageSet never reject, so this never blocks or
      // breaks the print itself.
      const desc = 'Pilot: '+(pilot||'—')+' — '+(out.passed?'PASSED':'FAILED');
      saveRecord(buildRecord('powercheck', 'AS350 B2 Powercheck', reg, dateISO, desc, recordData)).catch(()=>{});
    };

    syncSand();
    update();
  }

  // Single-series variant of ec135DrawTrendChart (below), since the AS350 Powercheck has one
  // torque-margin result per record rather than the EC135's per-engine pair.
  function pcDrawSingleTrendChart(canvas, records, valueFn){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const padL = 48, padR = 14, padT = 20, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const allVals = records.map(valueFn);
    if(!allVals.length) return;
    let vMin = Math.min(0, Math.min.apply(null, allVals));
    let vMax = Math.max.apply(null, allVals);
    const pad = (vMax - vMin) * 0.15 || 1;
    vMin -= pad; vMax += pad;

    function xFor(i){ return padL + (records.length<=1 ? plotW/2 : plotW * i/(records.length-1)); }
    function yFor(v){ return padT + plotH * (1 - (v - vMin)/(vMax - vMin)); }

    ctx.strokeStyle = pcCssVar('--line');
    ctx.lineWidth = 1;
    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for(let t=0;t<=ticks;t++){
      const v = vMin + (vMax-vMin)*t/ticks;
      const y = yFor(v);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
      ctx.fillText(v.toFixed(1), padL-6, y);
    }
    if(vMin < 0 && vMax > 0){
      ctx.strokeStyle = pcCssVar('--bad');
      ctx.setLineDash([4,3]);
      const y0 = yFor(0);
      ctx.beginPath(); ctx.moveTo(padL,y0); ctx.lineTo(W-padR,y0); ctx.stroke();
      ctx.setLineDash([]);
    }

    const pts = records.map((r,i)=>({ x:xFor(i), y:yFor(valueFn(r)) }));
    ctx.strokeStyle = pcCssVar('--accent');
    ctx.fillStyle = pcCssVar('--accent');
    ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
    ctx.stroke();
    pts.forEach(pt=>{ ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); });

    ctx.fillStyle = pcCssVar('--grey-strong');
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelIdxs = records.length>1 ? [0, Math.floor((records.length-1)/2), records.length-1] : [0];
    labelIdxs.forEach(i=>{
      const label = (fmtDateNice(records[i].date) || records[i].date || '').split(',')[0];
      ctx.fillText(label, xFor(i), H-padB+8);
    });
  }


  // ---------- Arriel 1D1 Bleed Valve Test ----------
  // Digitized from Safran Helicopter Engines Arriel 1D1 Maintenance Manual,
  // Task 75-31-00-750-803-A01 "Bleed Valve Tests (Electrical)", Figures 1301 (opening)
  // and 1302 (closing) - "Rating that causes bleed valve opening/closing", N1(NG)% vs
  // outside temperature, for Zp = 0/5,000/10,000/15,000/20,000 ft. Each of the 5 lines per
  // chart is a straight line (digitized via calibrated pixel-to-data-axis regression from
  // the source PDF at 400dpi), so no curve-fitting is needed - just 2 endpoint points per
  // line. Cross-checked against both worked examples printed in the manual: opening
  // T0=-25 degC/Zp=5,000ft -> 86% (this model: 86.36%), closing T0=20 degC/Zp=15,000ft ->
  // 96% (this model: 96.09%).
  const BLEEDVALVE_DATA = {"opening":[{"zp":0,"t0a":-12.903,"n1a":87.415,"t0b":19.442,"n1b":92.338},{"zp":5000,"t0a":-7.431,"n1a":89.056,"t0b":25.279,"n1b":94.077},{"zp":10000,"t0a":-2.81,"n1a":90.609,"t0b":33.182,"n1b":96.09},{"zp":15000,"t0a":0.716,"n1a":92.067,"t0b":24.549,"n1b":95.752},{"zp":20000,"t0a":-13.146,"n1a":90.871,"t0b":15.429,"n1b":95.533}],"closing":[{"zp":0,"t0a":-6.113,"n1a":89.522,"t0b":24.057,"n1b":94.103},{"zp":5000,"t0a":1.307,"n1a":91.494,"t0b":30.991,"n1b":95.961},{"zp":10000,"t0a":8.242,"n1a":93.369,"t0b":33.667,"n1b":97.186},{"zp":15000,"t0a":-0.274,"n1a":92.958,"t0b":24.665,"n1b":96.812},{"zp":20000,"t0a":-13.169,"n1a":91.924,"t0b":15.298,"n1b":96.57}],"tolerance":{"plus":2,"minus":1},"limits":{"oat":[-50,50],"zp":[0,20000],"n1":[80,102]}};

  function bvLineN1(band, t0){
    const t = (t0 - band.t0a) / (band.t0b - band.t0a);
    return band.n1a + t * (band.n1b - band.n1a);
  }
  function bvBracketIndex(x, xs){
    const n = xs.length;
    if (x <= xs[0]) return 0;
    if (x >= xs[n-1]) return n-2;
    let lo=0, hi=n-1;
    while (lo < hi-1){
      const mid = (lo+hi)>>1;
      if (xs[mid] <= x) lo=mid; else hi=mid;
    }
    return lo;
  }
  function bvGraphN1(bands, t0, zp){
    const zps = bands.map(b=>b.zp);
    const zpClamped = Math.max(zps[0], Math.min(zps[zps.length-1], zp));
    const idx = bvBracketIndex(zpClamped, zps);
    const nLeft = bvLineN1(bands[idx], t0);
    const nRight = bvLineN1(bands[idx+1], t0);
    const zLeft = zps[idx], zRight = zps[idx+1];
    const t = zRight===zLeft ? 0 : (zpClamped-zLeft)/(zRight-zLeft);
    return nLeft + t*(nRight-nLeft);
  }
  function bvCompute(bands, t0, zp, actual){
    const graph = bvGraphN1(bands, t0, zp);
    const lo = graph - BLEEDVALVE_DATA.tolerance.minus;
    const hi = graph + BLEEDVALVE_DATA.tolerance.plus;
    const passed = actual >= lo && actual <= hi;
    const margin = actual < lo ? (actual-lo) : (actual > hi ? (hi-actual) : Math.min(actual-lo, hi-actual));
    return { graph, lo, hi, passed, margin };
  }

    const d = pcStepDecimals(f.step);
    return d > 0 ? val.toFixed(d) : Math.round(val).toLocaleString();
  }
