<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Gear Tracker</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#fbfaf6;
    --panel:#ffffff;
    --line:#dfe2da;
    --accent:#c05a2c;
    --grey-strong:#1c2b24;
    --radius:10px;
    --good:#2f7d4f;
    --good-bg:#e6f2ea;
    --warn:#b3791b;
    --warn-bg:#faf1de;
    --bad:#b0281e;
    --bad-bg:#fbe9e7;
    --hold:#5a4aa8;
    --hold-bg:#ece9f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;}
  #app{max-width:1800px;margin:0 auto;padding:18px 24px 60px;}

  h1.tt-title{margin:0 0 2px;font-size:20px;}
  p.tt-sub{margin:0 0 16px;color:var(--grey-strong);font-size:12.5px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}

  .btn{
    padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;font-size:13px;color:var(--ink);font-weight:600;
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{color:#b0281e;}
  .btn.tiny{padding:3px 8px;font-size:11px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .tt-section-switch{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .tt-section-btn{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:800;color:var(--grey-strong);}
  .tt-section-btn.active{background:#123a5e;color:#fff;border-color:#123a5e;}
  .tt-section-btn .cnt{opacity:.85;font-weight:700;margin-left:4px;}

  .mc-header{display:grid;grid-template-columns:1fr 300px;gap:10px;padding:0 0 6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);border-bottom:1px solid var(--line);margin-bottom:4px;}
  .mc-row{display:grid;grid-template-columns:1fr 300px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
  .mc-row input, .mc-row select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel);color:var(--ink);font-family:inherit;}
  .mc-files-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .mc-files-list:empty{margin-bottom:0;}
  .mc-files .tt-att-thumb{width:56px;}
  .mc-files .tt-att-thumb img, .mc-files .tt-att-thumb .file-chip{width:56px;height:56px;}
  #mcRows{max-height:360px;overflow:auto;margin-bottom:4px;}

  .tt-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .tt-tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tt-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:700;color:var(--grey-strong);}
  .tt-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tt-tab .cnt{opacity:.75;font-weight:600;margin-left:3px;}

  .tt-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tt-controls input[type="search"]{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:190px;}
  .tt-controls select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--panel);color:var(--ink);}

  .tt-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .tt-stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;}
  .tt-stat .n{font-size:22px;font-weight:800;line-height:1.1;}
  .tt-stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);font-weight:700;margin-top:2px;}
  .tt-stat.bad .n{color:var(--bad);}
  .tt-stat.warn .n{color:var(--warn);}
  .tt-stat.hold .n{color:var(--hold);}

  .tt-group{margin-bottom:20px;}
  .tt-group-head{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.3px;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
  .tt-group-head .cnt{color:var(--grey-strong);font-weight:600;text-transform:none;font-size:11.5px;}

  .tt-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .tt-card.ok{border-left-color:var(--good);}
  .tt-card.warn{border-left-color:var(--warn);}
  .tt-card.bad{border-left-color:var(--bad);}
  .tt-card.holding{border-left-color:var(--hold);background:var(--hold-bg);}
  .tt-card.nolimit{border-left-color:var(--line);}
  .tt-card.notinstalled{opacity:.6;}
  .tt-card-main{flex:1;min-width:220px;}
  .tt-card-name{font-weight:800;font-size:14px;}
  .tt-card-tag{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:7px;vertical-align:middle;}
  .tt-card-meta{font-size:11.5px;color:var(--grey-strong);margin-top:3px;line-height:1.5;}
  .tt-card-notes{font-size:11.5px;color:var(--ink);margin-top:4px;font-style:italic;}
  .tt-card-due{min-width:170px;text-align:right;}
  .tt-card-due .due-date{font-weight:800;font-size:13.5px;}
  .tt-card-due .due-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;}
  .tt-card-due.ok .due-date, .tt-card-due.ok .due-status{color:var(--good);}
  .tt-card-due.warn .due-date, .tt-card-due.warn .due-status{color:var(--warn);}
  .tt-card-due.bad .due-date, .tt-card-due.bad .due-status{color:var(--bad);}
  .tt-card-due.holding .due-date, .tt-card-due.holding .due-status{color:var(--hold);}
  .tt-card-due.nolimit .due-date, .tt-card-due.nolimit .due-status{color:var(--grey-strong);}
  .tt-card-atts{display:flex;gap:4px;margin-top:4px;font-size:11px;color:var(--grey-strong);}
  .tt-card-actions{display:flex;flex-direction:column;gap:5px;width:100%;align-items:flex-end;margin-top:4px;}
  @media (min-width:640px){ .tt-card-actions{width:auto;} }

  .tt-empty{color:var(--grey-strong);font-size:13px;padding:20px 0;text-align:center;}

  /* ---------- WinAir-style component grid + Calendar Items panel ---------- */
  .wa-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--grey-strong);font-weight:600;white-space:nowrap;}
  .wa-check input{width:15px;height:15px;}

  .wa-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 300px);margin-bottom:6px;background:var(--panel);}
  table.wa-table{width:100%;border-collapse:collapse;font-size:11pt;min-width:920px;}
  table.wa-table thead th{background:#fbf3d6;border-bottom:1px solid #e3d69a;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#7a6a2e;white-space:nowrap;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #e3d69a;}
  table.wa-table tbody tr.item-row{border-bottom:1px solid var(--line);cursor:pointer;}
  table.wa-table tbody tr.item-row:hover{background:#f4f8fb;}
  table.wa-table tbody tr.item-row.notinstalled{opacity:.55;}
  table.wa-table tbody tr.item-row.holding{background:var(--hold-bg);}
  table.wa-table td{padding:7px 10px;vertical-align:middle;}
  table.wa-table tr.grp-row td{background:#eef1ea;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);}
  .grp-files-btn{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:none;letter-spacing:normal;color:var(--grey-strong);white-space:nowrap;}
  .grp-files-btn:hover{border-color:var(--accent);color:var(--ink);}
  .grp-files-btn.has-files{color:#123a5e;border-color:#123a5e;}
  table.wa-table td.nm{font-weight:700;white-space:nowrap;}
  table.wa-table td.nm span{white-space:nowrap;}
  table.wa-table td.num{white-space:nowrap;}
  table.wa-table td.due-cell{font-weight:800;white-space:nowrap;}
  table.wa-table td.due-cell.ok{color:var(--good);}
  table.wa-table td.due-cell.warn{color:var(--warn);}
  table.wa-table td.due-cell.bad{color:var(--bad);}
  table.wa-table td.due-cell.holding{color:var(--hold);}
  table.wa-table td.due-cell.nolimit{color:var(--grey-strong);font-weight:600;}
  table.wa-table td.act-cell{white-space:nowrap;text-align:right;}
  table.wa-table .row-icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer;font-size:12px;line-height:1;padding:4px 6px;margin-left:3px;}
  table.wa-table .row-icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .status-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle;flex-shrink:0;}
  .status-dot.ok{background:var(--good);}
  .status-dot.warn{background:var(--warn);}
  .status-dot.bad{background:var(--bad);}
  .status-dot.holding{background:var(--hold);}
  .status-dot.nolimit{background:#a9b0a5;}

  /* Assemblies (Ops Gear Tracker section only): a parent item ("Mobile Tank Filters
     (On wheels) (#1)") with sub-items ("hoses", "filters", ...) nested directly beneath it. */
  .tt-assembly-badge{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;background:var(--hold-bg);color:var(--hold);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;vertical-align:middle;}
  table.wa-table tbody tr.item-row.tt-child-row td.nm{padding-left:26px;}
  table.wa-table tbody tr.item-row.tt-child-row td.nm::before{content:'\21b3';margin-right:6px;color:var(--grey-strong);font-weight:700;}
  table.wa-table tbody tr.item-row.tt-child-row{background:#fcfcfa;}
  .tt-orphan-note{display:block;font-size:9.5px;font-weight:700;color:var(--grey-strong);margin-top:1px;margin-left:1ch;}

  /* "My Order" drag-to-reorder (Ops Gear Tracker, active list only). */
  table.wa-table tbody tr.item-row.tt-draggable{cursor:grab;}
  table.wa-table tbody tr.item-row.tt-draggable td.nm{padding-left:4px;}
  .tt-drag-handle{display:inline-block;width:16px;text-align:center;color:var(--grey-strong);opacity:.6;margin-right:4px;cursor:grab;user-select:none;vertical-align:middle;}
  table.wa-table tbody tr.item-row.tt-dragging{opacity:.4;}
  table.wa-table tbody tr.item-row.tt-drag-over-before{box-shadow:inset 0 2px 0 0 var(--accent);}
  table.wa-table tbody tr.item-row.tt-drag-over-after{box-shadow:inset 0 -2px 0 0 var(--accent);}
  table.wa-table tbody tr.item-row.tt-drag-reject{cursor:not-allowed;}
  .wa-footer-count{font-size:11px;color:var(--grey-strong);padding:6px 4px 16px;text-align:right;}

  .wa-banner{background:#123a5e;color:#fff;font-weight:800;text-align:center;padding:8px 12px;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;border-radius:8px 8px 0 0;margin-top:18px;}
  .wa-panel{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;background:var(--panel);padding:0 0 14px;margin-bottom:16px;}
  .wa-cal-grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);}
  .wa-cal-cell{padding:12px 14px;border-right:1px solid var(--line);}
  .wa-cal-cell:last-child{border-right:none;}
  .wa-cal-cell label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);margin-bottom:6px;}
  .wa-cal-cell input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel);color:var(--ink);font-family:inherit;}
  .wa-cal-caption{font-size:9.5px;color:var(--grey-strong);margin-top:4px;}
  .wa-cal-caption.req{color:var(--bad);font-weight:700;}
  .wa-flags-row{display:flex;gap:22px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper);font-size:12.5px;}
  .wa-flags-row label{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;}
  .wa-flags-row input{width:15px;height:15px;}
  @media (max-width:640px){
    .wa-cal-grid{grid-template-columns:repeat(2,1fr);}
    .wa-cal-cell:nth-child(2){border-right:none;}
  }

  /* modal */
  .tt-modal-backdrop{position:fixed;inset:0;background:rgba(20,25,20,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;}
  .tt-modal{background:var(--panel);border-radius:12px;max-width:720px;width:100%;padding:22px 24px 24px;}
  .tt-modal h2{margin:0 0 2px;font-size:18px;}
  .tt-modal .sub{margin:0 0 16px;color:var(--grey-strong);font-size:12px;}
  .tt-modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--grey-strong);line-height:1;}

  /* Item Add/Edit form: text that was grey should read black for easier reading. */
  .tt-item-form .sub,
  .tt-item-form .field label,
  .tt-item-form .wa-cal-cell label,
  .tt-item-form .wa-cal-caption:not(.req),
  .tt-item-form .tt-att-block > label,
  .tt-item-form .tt-att-thumb .fn,
  .tt-item-form .tt-modal-close{
    color:var(--ink);
  }

  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:9.5px;color:var(--grey-strong);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:var(--panel);color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field.span2{grid-column:span 2;}
  .field.checkline{flex-direction:row;align-items:center;gap:8px;padding-top:18px;}
  .field.checkline label{text-transform:none;font-size:13px;font-weight:600;order:2;}

  .tt-cat-multi{max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:6px 8px;display:flex;flex-direction:column;gap:2px;}
  .tt-cat-check{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);padding:2px 0;cursor:pointer;}
  .tt-cat-check input{margin:0;cursor:pointer;}

  .tt-undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;}
  .tt-undo-toast.show{opacity:1;}
  .field.checkline input{width:16px;height:16px;order:1;}

  .tt-att-block{margin-bottom:14px;}
  .tt-att-block > label{font-size:11px;color:var(--grey-strong);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:6px;}
  .tt-att-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .tt-att-thumb{position:relative;width:74px;}
  .tt-att-thumb img{width:74px;height:74px;object-fit:cover;border:1px solid var(--line);border-radius:7px;display:block;}
  .tt-att-thumb .file-chip{width:74px;height:74px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--paper);}
  .tt-att-thumb .fn{font-size:9.5px;color:var(--grey-strong);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .tt-att-thumb .rm{position:absolute;top:-6px;right:-6px;background:#b0281e;color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:1;cursor:pointer;}

  .tt-modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:10px;}

  .tt-holding-note{background:var(--hold-bg);color:var(--hold);border:1px solid #cfc6ea;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px;}

  .tt-report-table{width:100%;border-collapse:collapse;font-size:11pt;}
  .tt-report-table th{text-align:left;padding:6px 8px;color:var(--ink);font-size:10pt;text-transform:uppercase;border-bottom:2px solid var(--ink);}
  .tt-report-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tt-report-table tr.grp td{background:var(--paper);font-weight:800;font-size:10pt;text-transform:uppercase;letter-spacing:.3px;padding-top:12px;}

  #printArea{display:none;}
  @page{margin:12mm;size:landscape;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
  }
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1c2b24;padding-bottom:10px;margin-bottom:14px;}
  .pr-head h1{margin:0;font-size:17.5pt;}
  .pr-head .meta{font-size:11px;color:var(--ink);text-align:right;}
  .pr-status-chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;}

  @media (max-width:600px){
    .tt-card{flex-direction:column;}
    .tt-card-due{text-align:left;}
    .tt-card-actions{align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="app">
  <h1 class="tt-title">Ops Gear Tracker</h1>
  <p class="tt-sub">Operational gear — swivels, hooks, long lines, buckets, and more — tracked by due date. Phoenix Heli-Flight.</p>

  <div id="ttSectionSwitch" class="tt-section-switch"></div>

  <div id="ttSummary"></div>

  <div class="tt-toolbar">
    <div class="tt-tabs" id="ttTabs"></div>
    <div class="tt-controls">
      <input type="search" id="ttSearch" placeholder="Search name, serial, tracking #...">
      <select id="ttSortMode">
        <option value="group">Grouped by category</option>
        <option value="due">Flat — by time limit / due date</option>
        <option value="custom">My Order (drag to reorder)</option>
      </select>
      <select id="ttCategoryFilter"><option value="">All categories</option></select>
      <label class="wa-check"><input type="checkbox" id="ttInstalledOnly"> Show installed item(s) only</label>
      <button class="btn primary" id="ttAddBtn">+ Add Item</button>
      <button class="btn" id="ttReportBtn">Forecast List</button>
      <button class="btn" id="ttUndoBtn" title="Undo the last change to the item list">↩️ Undo</button>
    </div>
  </div>

  <div id="ttSyncNote" style="display:none;" class="tt-holding-note"></div>

  <div id="ttListArea"></div>
</div>

<div id="ttModalRoot"></div>
<div id="printArea"></div>

<script>
(function(){
  'use strict';

  // ---------- storage: same Supabase project/table as the main AME Forms app, own key prefix ----------
  const SUPABASE_URL = 'https://frlehxadkvgwzyxovwua.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ioAPLi8DWuC0HCUUYEeQ3Q_dildZYKI';
  const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
  const DATA_KEY = 'opsgear:items:v1';
  const CATMETA_KEY = 'opsgear:catmeta:v1';
  // Default section assignment for categories seen for the first time -- every Ops Gear category is
  // physically tracked equipment (serial/tracking numbers), so nothing defaults into Task Tracker
  // the way Tool Crib Checks/Servo Controls do in the Tool & Calibration Tracker. Mario can still
  // move a category into Task Tracker later (and rename it) from "Manage Categories".
  const DEFAULT_CATEGORY_SECTIONS = {};

  window.__storageLastError = null;

  async function storageGet(key){
    if(SUPABASE_CONFIGURED){
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + encodeURIComponent(key) + '&select=value', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if(res.ok){
          const rows = await res.json();
          if(rows && rows.length){
            try{ localStorage.setItem('cache:'+key, rows[0].value); }catch(e){}
            return rows[0].value;
          }
        } else {
          window.__storageLastError = 'GET ' + key + ': HTTP ' + res.status;
        }
      }catch(e){ window.__storageLastError = 'GET ' + key + ': ' + e; }
    }
    try{ return localStorage.getItem('cache:'+key); }catch(e){ return null; }
  }

  let __storageWriteQueue = Promise.resolve();
  async function storageSet(key, value){
    try{ localStorage.setItem('cache:'+key, value); }catch(e){}
    if(!SUPABASE_CONFIGURED) return true;
    let ok = true;
    const doWrite = async ()=>{
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?on_conflict=key', {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify({ key: key, value: value })
        });
        if(!res.ok){
          ok = false;
          let detail = '';
          try{ detail = await res.text(); }catch(e2){}
          window.__storageLastError = 'PUT ' + key + ': HTTP ' + res.status + (detail?(' — '+detail.slice(0,300)):'');
          console.error('storageSet failed', key, res.status, detail);
        }
      }catch(e){
        ok = false;
        window.__storageLastError = 'PUT ' + key + ': ' + e;
        console.error('storageSet failed', key, e);
      }
    };
    __storageWriteQueue = __storageWriteQueue.then(doWrite, doWrite);
    await __storageWriteQueue;
    return ok;
  }

  function escapeHTML(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function todayISO(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDateNice(iso){
    if(!iso) return '—';
    const [y,m,d] = iso.split('-').map(Number);
    if(!y) return '—';
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
  }
  function addMonths(iso, months){
    const [y,m,d] = iso.split('-').map(Number);
    const totalM = (y*12 + (m-1)) + Math.round(months);
    const ny = Math.floor(totalM/12), nm = totalM%12;
    const dt = new Date(Date.UTC(ny, nm, 1));
    const lastDay = new Date(Date.UTC(ny, nm+1, 0)).getUTCDate();
    dt.setUTCDate(Math.min(d, lastDay));
    return dt.toISOString().slice(0,10);
  }

    if(!due){

    const dueDate = new Date(due+'T00:00:00');

  // "My Order" reordering is scoped to siblings -- a child item can only be dragged among the
  // other children of the same assembly, and a top-level item only among the other top-level
  // items in the same category. This is what a drag is validated against, and what a drop
  // renumbers.
  function sortGroupKey(item){
    return item.parentId ? ('child:'+item.parentId) : ('top:'+(item.category||'Uncategorized'));
  }

  // Gives every item a sortIndex if it doesn't already have one -- both for the very first load
  // (55 seed items, none of which have ever needed a manual order before) and for any item added
  // since. New/never-ordered items are numbered after whatever's already in their group, in
  // whatever order they're currently in, so nothing jumps around the first time "My Order" is
  // opened -- it starts out looking exactly like the grouped view already did.
  function ensureSortIndexes(){
    let changed = false;
    const counters = {};
    ITEMS.forEach(item=>{
      if(typeof item.sortIndex === 'number') return;
      const key = sortGroupKey(item);
      const next = (counters[key] == null) ? nextSortIndexFor(key) : counters[key];
      item.sortIndex = next;
      counters[key] = next + 1;
      changed = true;
    });
    return changed;
  }

  function nextSortIndexFor(groupKey){
    let max = -1;
    ITEMS.forEach(i=>{
      if(sortGroupKey(i) === groupKey && typeof i.sortIndex === 'number' && i.sortIndex > max) max = i.sortIndex;
    });
    return max + 1;
  }

  function sortItemsByCustomOrder(items){
    return items.slice().sort((a,b)=>{
      const ai = (typeof a.sortIndex === 'number') ? a.sortIndex : 999999;
      const bi = (typeof b.sortIndex === 'number') ? b.sortIndex : 999999;
      if(ai !== bi) return ai - bi;
      return (a.name||'').localeCompare(b.name||'');
    });
  }

  // Renumbers an entire sibling group 0..N-1 to match the order the caller hands in, and marks
  // every item whose position actually changed. Always renumbering the whole group (rather than
  // patching just the moved item) keeps sortIndex values small and gap-free, and sidesteps any
  // edge case around ties or stale values left over from ensureSortIndexes().
  function applyCustomOrder(orderedItems){
    let changed = false;
    orderedItems.forEach((item, idx)=>{
      if(item.sortIndex !== idx){ item.sortIndex = idx; changed = true; }
    });
    return changed;
  }

  // ---------- undo ----------
  // Describes the move that turned prevJSON into nextJSON, in plain language, so someone
  // choosing an "Undo" target can tell what they'd be reverting.
  function describeSaveChange(prevJSON, nextJSON){
    try{
      const prev = prevJSON ? JSON.parse(prevJSON) : [];
      const next = JSON.parse(nextJSON);
      const prevById = new Map(prev.map(i=>[i.id,i]));
      const nextById = new Map(next.map(i=>[i.id,i]));
      const added = next.filter(i=>!prevById.has(i.id));
      const removed = prev.filter(i=>!nextById.has(i.id));
      if(added.length && !removed.length && next.length === prev.length + added.length){
        return added.length === 1 ? ('Added "'+added[0].name+'"') : (added.length+' items added');
      }
      if(removed.length && !added.length){
        return removed.length === 1 ? ('Deleted "'+removed[0].name+'"') : (removed.length+' items deleted');
      }
      if(!added.length && !removed.length && next.length === prev.length){
        const changed = [];
        let onlyOrderChanged = true;
        next.forEach(n=>{
          const p = prevById.get(n.id);
          if(!p) return;
          if(JSON.stringify(n) !== JSON.stringify(p)) changed.push(n);
          const pSameOrder = Object.assign({}, p, {sortIndex: n.sortIndex});
          if(JSON.stringify(n) !== JSON.stringify(pSameOrder)) onlyOrderChanged = false;
        });
        if(!changed.length) return 'No change';
        if(onlyOrderChanged) return 'Reordered items';
        return changed.length === 1 ? ('Edited "'+changed[0].name+'"') : (changed.length+' items edited');
      }
      const parts = [];
      if(added.length) parts.push(added.length+' added');
      if(removed.length) parts.push(removed.length+' removed');
      return parts.length ? parts.join(', ') : 'Changes saved';
    }catch(e){ return 'Changes saved'; }
  }

  // Small non-blocking confirmation banner (auto-hides), used for Undo feedback so a click

  let undoToastTimer = null;
  function showUndoToast(msg){
    let el = document.getElementById('ttUndoToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'ttUndoToast';
      el.className = 'tt-undo-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove('show');
    // Force a reflow so re-triggering the class while already visible still restarts the fade.
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 3000);
  }

  // One click undoes just the single most recent change to the item list (add/edit/delete/

  async function undoLastChange(){

    renderAll();
    showUndoToast('Undone: ' + label);
  }

    const p = (item.photoAttachments||[]).length, c = (item.calReportAttachments||[]).length;
    let parts = [];
    if(p) parts.push('📷'+p);
    if(c) parts.push('📄'+c);
    return parts.join(' ');
  }

  function dueCellContent(item, di){
    if(di.status==='holding'){
      return item.holding && item.holding.sentDate ? ('Since ' + fmtDateNice(item.holding.sentDate)) : 'In Holding';
    }
    if(di.status==='nolimit') return di.label;
    const daysStr = di.status==='overdue' ? (Math.abs(di.days)+'d overdue') : ('in '+di.days+'d');
    return fmtDateNice(di.due) + ' <span style="font-weight:600;font-size:10.5px;">('+daysStr+')</span>';
  }

  function renderRowActions(item, di, opts){
    opts = opts || {};
    // Edit and Delete each have their own dedicated row/modal buttons elsewhere (clicking
    // anywhere on the row opens Edit; the edit form itself has its own Delete button), so they
    // aren't duplicated here as separate row icons.
    let html = '<button type="button" class="row-icon-btn" title="Duplicate (clears Serial No., Tracking No. &amp; Date Performed)" data-act="duplicate" data-id="'+item.id+'">📋</button>';
    // "Add Sub-Item" -- only on a top-level (non-child) row, only in the Tool & Calibration
    // Tracker section, and only from the active list (not holding, not a search/filter view
    // where the parent itself might not even be showing).
    if(!opts.tasksMode && !opts.holdingMode && !item.parentId){
      html += '<button type="button" class="row-icon-btn" title="Add Sub-Item" data-act="add-sub" data-id="'+item.id+'">➕</button>';
    }
    if(di.status==='holding'){
      html += '<button type="button" class="row-icon-btn primary" title="Complete / Return" data-act="complete-holding" data-id="'+item.id+'">✅</button>';
    } else {
      html += '<button type="button" class="row-icon-btn" title="Send to Holding" data-act="send-holding" data-id="'+item.id+'">📦</button>';
    }
    return html;
  }

  // opts.isChild: rendered nested directly under its parent's row (indented, with a ⤷ marker).
  // opts.childCount: for a top-level row, how many sub-items are nested under it (adds the
  // "Assembly" badge). opts.tasksMode: hides assembly-only affordances in the Task Tracker
  // section (defensive -- Task Tracker items never actually get a parentId, see openItemForm).
  function renderItemRow(item, opts){
    opts = opts || {};
    const tasksMode = CURRENT_SECTION === 'tasks';
    opts.tasksMode = tasksMode;
    const di = dueInfo(item);
    const notInstalledCls = item.installed ? '' : ' notinstalled';
    const holdingCls = di.status==='holding' ? ' holding' : '';
    const childRowCls = opts.isChild ? ' tt-child-row' : '';
    const childCount = opts.childCount || 0;
    // A child item is normally rendered nested (opts.isChild) right under its parent. If its
    // parent got filtered out of the current view (a category filter, or a search match on the
    // child only) it's rendered here instead, at the top level -- with a note pointing back to
    // its assembly, so it never just silently vanishes from the list.
    const orphanParent = (item.parentId && !opts.isChild) ? ITEMS.find(p=>p.id===item.parentId) : null;
    // "My Order" dragging is scoped to siblings (sortGroupKey), so a row only becomes draggable
    // when it's actually rendered in its real sibling group -- an orphaned sub-item (parent
    // filtered out of view, see above) is shown flat among a different group's rows and can't
    // meaningfully be dragged there.
    const draggableRow = !!opts.draggable && !opts.holdingMode && !orphanParent;
    const dragHandle = draggableRow ? '<span class="tt-drag-handle" title="Drag to reorder">⠿</span>' : '';
    const nameCell =
      dragHandle +
      '<span class="status-dot '+di.cls+'"></span>' +
      '<span>'+escapeHTML(item.name)+'</span>' +
      (childCount ? ' <span class="tt-assembly-badge">Assembly · '+childCount+' item'+(childCount===1?'':'s')+'</span>' : '') +
      (item.notes ? ' <span title="'+escapeHTML(item.notes)+'" style="cursor:help;">📝</span>' : '') +
      (!item.installed ? ' <span style="font-size:9.5px;font-weight:800;color:var(--grey-strong);">(NOT INSTALLED)</span>' : '') +
      (orphanParent ? '<span class="tt-orphan-note">⤷ Part of '+escapeHTML(orphanParent.name)+'</span>' : '');
    const dragAttrs = draggableRow ? ' draggable="true" data-group-key="'+escapeHTML(sortGroupKey(item))+'"' : '';
    const dragRowCls = draggableRow ? ' tt-draggable' : '';

    if(opts.holdingMode){
      let cells = '<td class="nm">'+nameCell+'</td><td>'+escapeHTML(item.category||'')+'</td>';
      if(!tasksMode){
        cells += '<td>'+escapeHTML(item.makeModel||'')+'</td>' +
          '<td class="num">'+escapeHTML(item.serialNo||item.trackingNo||'')+'</td>';
      }
      cells += '<td class="num">'+(item.holding&&item.holding.sentDate?fmtDateNice(item.holding.sentDate):'—')+'</td>' +
        '<td>'+escapeHTML((item.holding&&item.holding.note)||'')+'</td>' +
        '<td class="num">'+attIconStr(item)+'</td>' +
        '<td class="act-cell">'+renderRowActions(item, di, opts)+'</td>';
      return '<tr class="item-row'+holdingCls+childRowCls+dragRowCls+'" data-id="'+item.id+'"'+dragAttrs+'>'+cells+'</tr>';
    }

    let cells = '<td class="nm">'+nameCell+'</td><td>'+escapeHTML(item.action||'')+'</td>';
    if(!tasksMode){
      cells += '<td>'+escapeHTML(item.makeModel||'')+'</td>' +
        '<td class="num">'+escapeHTML(item.partNo||'')+'</td>' +
        '<td class="num">'+escapeHTML(item.serialNo||'')+'</td>' +
        '<td class="num">'+escapeHTML(item.trackingNo||'')+'</td>';
    }
    cells += '<td class="num">'+(item.limitMonths?item.limitMonths+' mo':'No limit')+'</td>' +
      '<td class="num">'+fmtDateNice(item.lastPerformed)+'</td>' +
      '<td class="due-cell '+di.cls+'">'+dueCellContent(item, di)+'</td>' +
      '<td class="num">'+attIconStr(item)+'</td>' +
      '<td class="act-cell">'+renderRowActions(item, di, opts)+'</td>';
    return '<tr class="item-row'+notInstalledCls+holdingCls+childRowCls+dragRowCls+'" data-id="'+item.id+'"'+dragAttrs+'>'+cells+'</tr>';
  }

  function activeHead(tasksMode){
    return tasksMode
      ? '<tr><th>Name</th><th>Action</th><th>Limit</th><th>Last Performed</th><th>Due</th><th>Files</th><th></th></tr>'
      : '<tr><th>Name</th><th>Action</th><th>Make / Model</th><th>Part No.</th><th>Serial No.</th><th>Tracking No.</th><th>Limit</th><th>Last Performed</th><th>Due</th><th>Files</th><th></th></tr>';
  }
  function holdingHead(tasksMode){
    return tasksMode
      ? '<tr><th>Name</th><th>Category</th><th>Sent</th><th>Note</th><th>Files</th><th></th></tr>'
      : '<tr><th>Name</th><th>Category</th><th>Make / Model</th><th>Serial / Tracking</th><th>Sent</th><th>Note</th><th>Files</th><th></th></tr>';
  }
  function activeColCount(tasksMode){ return tasksMode ? 7 : 11; }

  function renderList(){
    const area = document.getElementById('ttListArea');
    const tasksMode = CURRENT_SECTION === 'tasks';
    let pool = sectionItems().filter(i => VIEW_TAB==='holding' ? (i.holding && i.holding.active) : !(i.holding && i.holding.active));
    if(CATEGORY_FILTER) pool = pool.filter(i => (i.category||'Uncategorized') === CATEGORY_FILTER);
    if(INSTALLED_ONLY) pool = pool.filter(i => i.installed);
    pool = pool.filter(i => matchesSearch(i, SEARCH_Q));

    if(pool.length === 0){
      area.innerHTML = '<div class="tt-empty">No items match.</div>';
      return;
    }

    // Assemblies: a sub-item (item.parentId set) nests directly under its parent's row instead
    // of appearing in its own sorted/grouped position -- but only when that parent is still part
    // of this same filtered pool. A sub-item whose parent got filtered out (a category filter,
    // or a search match on the sub-item only) still needs to show up somewhere, so renderItemRow
    // falls back to showing it as a normal row with a "Part of <assembly>" note.
    // Dragging (SORT_MODE === 'custom') needs a real, deliberate order for children too, not
    // the usual due-date sort -- everywhere else (due / group modes) children still sort by due
    // date same as before.
    const isCustomMode = SORT_MODE === 'custom' && VIEW_TAB !== 'holding';
    const childSort = isCustomMode ? sortItemsByCustomOrder : sortItemsByDue;

    const poolIds = new Set(pool.map(i=>i.id));
    const childrenByParent = {};
    pool.forEach(i=>{
      if(i.parentId && poolIds.has(i.parentId)){
        (childrenByParent[i.parentId] = childrenByParent[i.parentId] || []).push(i);
      }
    });
    Object.keys(childrenByParent).forEach(pid=>{ childrenByParent[pid] = childSort(childrenByParent[pid]); });
    const nestedChildIds = new Set();
    Object.values(childrenByParent).forEach(arr=>arr.forEach(c=>nestedChildIds.add(c.id)));

    function renderWithChildren(item, baseOpts){
      let html = renderItemRow(item, Object.assign({}, baseOpts, { childCount: (childrenByParent[item.id]||[]).length }));
      (childrenByParent[item.id]||[]).forEach(child=>{
        html += renderItemRow(child, Object.assign({}, baseOpts, { isChild:true }));
      });
      return html;
    }

    let bodyRows;
    let head;
    if(VIEW_TAB === 'holding'){
      head = holdingHead(tasksMode);
      const visible = sortItemsByDue(pool).filter(i=>!nestedChildIds.has(i.id));
      bodyRows = visible.map(i=>renderWithChildren(i, {holdingMode:true})).join('');
    } else if(SORT_MODE === 'due'){
      head = activeHead(tasksMode);
      const visible = sortItemsByDue(pool).filter(i=>!nestedChildIds.has(i.id));
      bodyRows = visible.map(i=>renderWithChildren(i, {})).join('');
    } else {
      // Both "Grouped by category" and "My Order" share this same category-grouped shape --
      // "My Order" just orders each group by sortIndex instead of due date, and makes its rows
      // draggable.
      head = activeHead(tasksMode);
      const cats = sortedCategories(pool);
      let rows = '';
      const colCount = activeColCount(tasksMode);
      const groupOrder = isCustomMode ? sortItemsByCustomOrder : sortItemsByDue;
      cats.forEach(cat=>{
        const inCatAll = pool.filter(i => (i.category||'Uncategorized') === cat);
        const inCat = groupOrder(inCatAll.filter(i=>!nestedChildIds.has(i.id)));
        if(!inCat.length) return;
        const catMeta = CATEGORY_META[cat] || {};
        const fileCount = Array.isArray(catMeta.attachments) ? catMeta.attachments.length : 0;
        const filesBtnLabel = fileCount ? ('📎 '+fileCount+' file'+(fileCount===1?'':'s')) : '📎 Attach file';
        rows += '<tr class="grp-row"><td colspan="'+colCount+'">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
            '<div>'+escapeHTML(cat)+' <span style="font-weight:600;text-transform:none;color:var(--grey-strong);">('+inCatAll.length+' item'+(inCatAll.length===1?'':'s')+')</span></div>' +
            '<button type="button" class="grp-files-btn'+(fileCount?' has-files':'')+'" data-cat-files="'+escapeHTML(cat)+'">'+filesBtnLabel+'</button>' +
          '</div>' +
        '</td></tr>';
        inCat.forEach(i=>{ rows += renderWithChildren(i, { draggable: isCustomMode }); });
      });
      bodyRows = rows;
    }

    area.innerHTML =
      '<div class="wa-table-wrap"><table class="wa-table"><thead>'+head+'</thead><tbody>'+bodyRows+'</tbody></table></div>' +
      '<div class="wa-footer-count">'+pool.length+' item'+(pool.length===1?'':'s')+' found'+(isCustomMode?' — drag a row (⠿) to reorder it within its category or assembly':'')+'</div>';

    if(isCustomMode) wireDragReorder(area);

    area.querySelectorAll('[data-act]').forEach(btn=>{
      btn.onclick = (e)=>{ e.stopPropagation(); handleCardAction(btn.dataset.act, btn.dataset.id); };
    });
    area.querySelectorAll('[data-cat-files]').forEach(btn=>{
      btn.onclick = (e)=>{ e.stopPropagation(); openCategoryFilesModal(btn.dataset.catFiles); };
    });
    area.querySelectorAll('tr.item-row').forEach(tr=>{
      tr.onclick = ()=>{
        const item = ITEMS.find(i=>i.id===tr.dataset.id);
        if(item) openItemForm(item);
      };
    });
  }

  // "My Order" drag-to-reorder. Native HTML5 drag events on the whole row (not just the ⠿
  // handle) -- a plain click (no pointer movement) still opens the edit form same as always,
  // since the browser only fires drag events once the pointer actually moves, and doesn't fire
  // a click on the source element after a real drag.
  function clearDragIndicators(area){
    area.querySelectorAll('.tt-drag-over-before,.tt-drag-over-after,.tt-drag-reject').forEach(el=>{
      el.classList.remove('tt-drag-over-before','tt-drag-over-after','tt-drag-reject');
    });
  }

  function wireDragReorder(area){
    area.querySelectorAll('tr.item-row.tt-draggable').forEach(tr=>{
      tr.addEventListener('dragstart', (e)=>{
        DRAG_ITEM_ID = tr.dataset.id;
        DRAG_ITEM_GROUP_KEY = tr.dataset.groupKey;
        DRAG_OVER_ID = null;
        DRAG_OVER_POS = null;
        tr.classList.add('tt-dragging');
        try{ e.dataTransfer.setData('text/plain', tr.dataset.id); }catch(err){}
        if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      });
      tr.addEventListener('dragend', ()=>{
        tr.classList.remove('tt-dragging');
        clearDragIndicators(area);
        DRAG_ITEM_ID = null; DRAG_ITEM_GROUP_KEY = null; DRAG_OVER_ID = null; DRAG_OVER_POS = null;
      });
      tr.addEventListener('dragover', (e)=>{
        if(!DRAG_ITEM_ID || DRAG_ITEM_ID === tr.dataset.id) return;
        const sameGroup = DRAG_ITEM_GROUP_KEY && tr.dataset.groupKey === DRAG_ITEM_GROUP_KEY;
        if(!sameGroup){
          // Not calling preventDefault() here is deliberate -- it tells the browser this row
          // isn't a valid drop target, which shows the "no drop" cursor on its own.
          clearDragIndicators(area);
          tr.classList.add('tt-drag-reject');
          return;
        }
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        const rect = tr.getBoundingClientRect();
        const before = (e.clientY - rect.top) < (rect.height/2);
        clearDragIndicators(area);
        tr.classList.add(before ? 'tt-drag-over-before' : 'tt-drag-over-after');
        DRAG_OVER_ID = tr.dataset.id;
        DRAG_OVER_POS = before ? 'before' : 'after';
      });
      tr.addEventListener('dragleave', ()=>{
        tr.classList.remove('tt-drag-over-before','tt-drag-over-after','tt-drag-reject');
      });
      tr.addEventListener('drop', async (e)=>{
        e.preventDefault();
        clearDragIndicators(area);
        if(!DRAG_ITEM_ID || !DRAG_OVER_ID || DRAG_ITEM_ID === DRAG_OVER_ID) return;
        await performReorder(DRAG_ITEM_ID, DRAG_OVER_ID, DRAG_OVER_POS);
      });
    });
  }

  async function performReorder(draggedId, overId, pos){
    const draggedItem = ITEMS.find(i=>i.id===draggedId);
    const overItem = ITEMS.find(i=>i.id===overId);
    if(!draggedItem || !overItem) return;
    const groupKey = sortGroupKey(draggedItem);
    if(sortGroupKey(overItem) !== groupKey) return; // safety net -- dragover already gates this

    const siblings = sortItemsByCustomOrder(ITEMS.filter(i=>sortGroupKey(i)===groupKey));
    const without = siblings.filter(i=>i.id!==draggedId);
    const overIdx = without.findIndex(i=>i.id===overId);
    if(overIdx === -1) return;
    const insertAt = pos === 'before' ? overIdx : overIdx + 1;
    without.splice(insertAt, 0, draggedItem);

    if(applyCustomOrder(without)){
      renderAll();
      await persist();
    }
  }

  function handleCardAction(act, id){
    const item = ITEMS.find(i=>i.id===id);
    if(!item) return;
    if(act === 'edit') openItemForm(item);
    else if(act === 'add-sub') openItemForm(null, { category: item.category, parentId: item.id });
    else if(act === 'duplicate') duplicateItem(item);
    else if(act === 'delete') openDeleteConfirm(item);
    else if(act === 'send-holding') openSendToHolding(item);
    else if(act === 'complete-holding') openCompleteHolding(item);
  }

  // Opens the Add-Item form pre-filled with a copy of an existing item -- everything is carried
  // over (make/model, part no., category, action, limit/warning, notes, attachments, assembly
  // membership) EXCEPT Serial No., Tracking No., and Date Performed, which are blanked out since
  // a duplicate is a distinct physical item/record that hasn't been serialed or calibrated yet.
  // It's also never left "in holding" -- the duplicate itself was never actually sent out.
  // Nothing is added to the list until the form is saved, same as any other new item.
  function duplicateItem(item){
    const draft = JSON.parse(JSON.stringify(item));
    delete draft.id;
    draft.serialNo = '';
    draft.trackingNo = '';
    draft.lastPerformed = null;
    draft.holding = null;
    draft.__isDuplicate = true;
    openItemForm(null, draft);
  }

  // ---------- attachments ----------
  function readFileSmart(file, maxDim, quality){
    maxDim = maxDim || 1600; quality = quality || 0.82;
    return new Promise((resolve, reject)=>{
      if(!file.type || !file.type.startsWith('image/')){
        const r = new FileReader();
        r.onload = ()=> resolve({name:file.name, type:file.type||'application/octet-stream', dataUrl:r.result});
        r.onerror = reject;
        r.readAsDataURL(file);
        return;
      }
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({name:file.name, type:'image/jpeg', dataUrl: canvas.toDataURL('image/jpeg', quality)});
        };
        img.onerror = reject;
        img.src = r.result;
      };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function renderAttThumb(att, idx, kind){
    const isImg = att.type && att.type.startsWith('image/');
    return (
      '<div class="tt-att-thumb" data-kind="'+kind+'" data-idx="'+idx+'">' +
        (isImg ? '<img src="'+att.dataUrl+'">' : '<div class="file-chip">📄</div>') +
        '<div class="fn">'+escapeHTML(att.name||'file')+'</div>' +
        '<button type="button" class="rm" data-rm-kind="'+kind+'" data-rm-idx="'+idx+'">×</button>' +
      '</div>'
    );
  }

  // ---------- category-level file attachments (Manage Categories) ----------
  // Reference files (manuals, spec sheets, photos) that apply to an entire category rather than
  // a single item -- stored on CATEGORY_META[cat].attachments (persisted separately via
  // persistCategoryMeta(), alongside each category's section) rather than on every item in it.
  function renderCategoryFileChips(files){
    return (files||[]).map((a,i)=>renderAttThumb(a,i,'catfile')).join('');
  }
  function wireCategoryFileInputs(){
    document.querySelectorAll('#mcRows .mc-files').forEach(box=>{
      const cat = box.dataset.cat;
      const meta = CATEGORY_META[cat] || {};
      box.dataset.attachments = JSON.stringify(Array.isArray(meta.attachments) ? meta.attachments : []);
      const refreshList = ()=>{
        const files = JSON.parse(box.dataset.attachments || '[]');
        box.querySelector('.mc-files-list').innerHTML = renderCategoryFileChips(files);
        box.querySelectorAll('.rm[data-rm-kind="catfile"]').forEach(btn=>{
          btn.onclick = ()=>{
            const arr = JSON.parse(box.dataset.attachments || '[]');
            arr.splice(Number(btn.dataset.rmIdx), 1);
            box.dataset.attachments = JSON.stringify(arr);
            refreshList();
          };
        });
      };
      refreshList();
      box.querySelector('.mc-file-input').onchange = async (e)=>{
        const files = Array.from(e.target.files || []);
        const arr = JSON.parse(box.dataset.attachments || '[]');
        for(const f of files){
          try{ arr.push(await readFileSmart(f, 2000, 0.85)); }catch(err){ console.error(err); }
        }
        box.dataset.attachments = JSON.stringify(arr);
        refreshList();
        e.target.value = '';
      };
    });
  }

  // Persists a category's attachment list right away (unlike the batch Save in Manage
  // Categories) and re-renders the list/filter so the 📎 badge on the category row -- and in
  // the category filter dropdown -- updates immediately.
  async function saveCategoryFiles(cat, files){
    if(!CATEGORY_META[cat]) CATEGORY_META[cat] = { section: getCategorySection(cat) };
    CATEGORY_META[cat].attachments = files;
    await persistCategoryMeta();
    renderList();
    renderCategoryFilter();
  }

  // Quick-attach modal opened directly from a category's row in the item list (grp-row) -- a
  // lighter-weight alternative to "Manage Categories" for just adding/removing files on one
  // category, with no separate Save step: every add/remove persists right away.
  function openCategoryFilesModal(cat){
    const meta = CATEGORY_META[cat] || {};
    let files = (Array.isArray(meta.attachments) ? meta.attachments : []).slice();
    const html =
      '<div class="tt-modal-backdrop" id="ttModalBackdrop">' +
        '<div class="tt-modal" style="max-width:480px;">' +
          '<h2>'+escapeHTML(cat)+' — Files</h2>' +
          '<p class="sub">Reference files (manuals, spec sheets, photos) attached to this whole category.</p>' +
          '<div class="mc-files-list" id="catFilesList"></div>' +
          '<label class="btn small" style="cursor:pointer;display:inline-block;">📎 Attach file<input type="file" id="catFilesInput" multiple style="display:none;"></label>' +
          '<div class="tt-modal-footer"><div></div><div class="btn-row">' +
            '<button class="btn primary" id="ttCatFilesDone">Done</button>' +
          '</div></div>' +
        '</div>' +
      '</div>';
    document.getElementById('ttModalRoot').innerHTML = html;
    document.getElementById('ttModalBackdrop').onclick = (e)=>{ if(e.target.id==='ttModalBackdrop') closeModal(); };
    document.getElementById('ttCatFilesDone').onclick = closeModal;

    const refresh = ()=>{
      document.getElementById('catFilesList').innerHTML = renderCategoryFileChips(files);
      document.querySelectorAll('#catFilesList .rm[data-rm-kind="catfile"]').forEach(btn=>{
        btn.onclick = async ()=>{
          files.splice(Number(btn.dataset.rmIdx), 1);
          await saveCategoryFiles(cat, files);
          refresh();
        };
      });
    };
    refresh();
    document.getElementById('catFilesInput').onchange = async (e)=>{
      const picked = Array.from(e.target.files || []);
      for(const f of picked){
        try{ files.push(await readFileSmart(f, 2000, 0.85)); }catch(err){ console.error(err); }
      }
      await saveCategoryFiles(cat, files);
      refresh();
      e.target.value = '';
    };
  }

  // ---------- item form (add/edit) ----------
  let FORM_STATE = null;

  // draftOverrides pre-fills a brand-new (non-editing) form -- used for both "Add Sub-Item"
  // (just {category, parentId}) and "Duplicate" (a full copy of another item's fields, with
  // serialNo/trackingNo/lastPerformed/holding already stripped out by duplicateItem() below).
  // draftOverrides.__isDuplicate is only a UI hint (title/subtitle text) and is never itself
  // stored on the item.
  function openItemForm(item, draftOverrides){
    const editing = !!item;
    const isDuplicate = !editing && !!(draftOverrides && draftOverrides.__isDuplicate);
    const defaults = {
      id: uid(), name:'', category:'', action:'Calibration', makeModel:'', partNo:'', serialNo:'', trackingNo:'',
      installed:true, limitMonths:null, lastPerformed:null, manualNextDue:null, warningDays:30, notes:'',
      photoAttachments:[], calReportAttachments:[], holding:null, parentId: null
    };
    FORM_STATE = editing ? JSON.parse(JSON.stringify(item)) : Object.assign({}, defaults, draftOverrides || {});
    if(!editing){ FORM_STATE.id = uid(); delete FORM_STATE.__isDuplicate; }
    if(FORM_STATE.warningDays == null) FORM_STATE.warningDays = 30;
    if(FORM_STATE.parentId === undefined) FORM_STATE.parentId = null;
    const cats = sortedCategories(ITEMS.length ? ITEMS : SEED_ITEMS);
    const actionOptions = ACTION_OPTIONS.slice();
    if(FORM_STATE.action && !actionOptions.includes(FORM_STATE.action)) actionOptions.push(FORM_STATE.action);
    // Task Tracker items (recurring checks) don't have make/model/part/serial/tracking numbers, so
    // those fields start hidden when the item's category (or, for a new item, the section currently
    // open) belongs to Task Tracker -- and the Category field below toggles them live as it's edited.
    const hideDetailFields = FORM_STATE.category ? (getCategorySection(FORM_STATE.category) === 'tasks') : (CURRENT_SECTION === 'tasks');
    // Assemblies (a parent item with sub-items nested under it) only make sense for physical
    // tools/equipment, so this only ever offers choices -- and only shows at all -- in the Ops
    // Gear Tracker section, same as the make/model/part/serial/tracking fields above.
    // Eligible parents: any tools-section item that isn't itself already a child (keeps nesting to
    // one level) and isn't this item being edited (can't be its own parent).
    const parentCandidates = ITEMS.filter(i =>
      i.id !== FORM_STATE.id &&

              '<div class="field"><label>Part No.</label><input id="fPartNo" value="'+escapeHTML(FORM_STATE.partNo)+'"></div>' +

              '<div class="field"><label>Tracking No.</label><input id="fTrackingNo" value="'+escapeHTML(FORM_STATE.trackingNo)+'"></div>' +
              '<div class="field span2"><label>Part of Assembly</label><select id="fParentId">' +
                '<option value="">— None (top-level item / its own assembly) —</option>' +
                parentCandidates.map(p=>'<option value="'+p.id+'"'+(FORM_STATE.parentId===p.id?' selected':'')+'>'+escapeHTML(p.name)+' ('+escapeHTML(p.category||'')+')</option>').join('') +
              '</select></div>' +

          '<div class="wa-banner">Calendar Items</div>' +
          '<div class="wa-panel">' +
            '<div class="wa-cal-grid">' +
              '<div class="wa-cal-cell"><label>Limit</label><input id="fLimitMonths" type="number" min="0" step="1" value="'+(FORM_STATE.limitMonths==null?'':FORM_STATE.limitMonths)+'" placeholder="blank = no limit"><div class="wa-cal-caption">(Number of Months)</div></div>' +
              '<div class="wa-cal-cell"><label>Performed</label><input id="fLastPerformed" type="date" value="'+(FORM_STATE.lastPerformed||'')+'"><div class="wa-cal-caption">Last time completed</div></div>' +
              '<div class="wa-cal-cell"><label>Warning</label><input id="fWarningDays" type="number" min="0" step="1" value="'+(FORM_STATE.warningDays==null?30:FORM_STATE.warningDays)+'"><div class="wa-cal-caption">(Number of Days before due)</div></div>' +
              '<div class="wa-cal-cell"><label>Manual Next Due</label><input id="fManualNextDue" type="date" value="'+(FORM_STATE.manualNextDue||'')+'"><div class="wa-cal-caption req">Overrides the calculated due date</div></div>' +

    document.getElementById('fCalFile').onchange = async (e)=>{

    function wireRemoveButtons(){
      document.querySelectorAll('#ttModalRoot [data-rm-kind]').forEach(btn=>{

          arr.splice(idx,1);

      if(!name){ alert('Please enter a name for this item.'); return; }
      FORM_STATE.name = name;
      FORM_STATE.category = document.getElementById('fCategory').value.trim() || 'Uncategorized';
      FORM_STATE.action = document.getElementById('fAction').value.trim() || 'Check';
      const fieldsHidden = document.getElementById('fDetailFieldsWrap').style.display === 'none';
      if(!fieldsHidden){
        FORM_STATE.makeModel = document.getElementById('fMakeModel').value.trim();
        FORM_STATE.partNo = document.getElementById('fPartNo').value.trim();
        FORM_STATE.serialNo = document.getElementById('fSerialNo').value.trim();
        FORM_STATE.trackingNo = document.getElementById('fTrackingNo').value.trim();
        const selectedParentId = document.getElementById('fParentId').value || null;
        // An assembly that already has sub-items of its own can't also become a sub-item of
        // another assembly -- that would nest three levels deep, which the list/report
        // rendering doesn't support. Move or remove its sub-items first.
        if(selectedParentId && ITEMS.some(i=>i.parentId===FORM_STATE.id)){
          alert('"'+FORM_STATE.name+'" already has sub-items under it, so it can\'t also be made a sub-item of another assembly. Move or remove its sub-items first.');
          return;
        }
        FORM_STATE.parentId = selectedParentId;
      } else {
        FORM_STATE.parentId = null;
      }
      if(!CATEGORY_META[FORM_STATE.category]){
        CATEGORY_META[FORM_STATE.category] = { section: fieldsHidden ? 'tasks' : 'tools' };
        persistCategoryMeta();
      }
      const lm = document.getElementById('fLimitMonths').value;
      FORM_STATE.limitMonths = lm === '' ? null : Number(lm);
      FORM_STATE.lastPerformed = document.getElementById('fLastPerformed').value || null;
      FORM_STATE.manualNextDue = document.getElementById('fManualNextDue').value || null;
      const wd = document.getElementById('fWarningDays').value;
      FORM_STATE.warningDays = wd === '' ? 30 : Number(wd);
      FORM_STATE.installed = document.getElementById('fInstalled').checked;
      FORM_STATE.notes = document.getElementById('fNotes').value.trim();

      const idx = ITEMS.findIndex(i=>i.id===FORM_STATE.id);
      // A brand-new item, or one that just moved to a different category or assembly, goes to
      // the end of its (new) group rather than keeping a sortIndex left over from wherever it
      // used to be -- otherwise it could land in the middle of an unrelated group's "My Order".
      const oldGroupKey = item ? sortGroupKey(item) : null;
      const newGroupKey = sortGroupKey(FORM_STATE);
      if(idx < 0 || oldGroupKey !== newGroupKey || typeof FORM_STATE.sortIndex !== 'number'){
        FORM_STATE.sortIndex = nextSortIndexFor(newGroupKey);
      }
      if(idx >= 0) ITEMS[idx] = FORM_STATE; else ITEMS.push(FORM_STATE);
      closeModal();
      renderAll();
      await persist();
    };
  }

          '<div class="mc-header"><div>Category Name</div><div>Attached Files</div></div>' +

            '<button class="btn" id="ttMcCancel">Cancel</button>' +
            '<button class="btn primary" id="ttMcSave">Save</button>' +
          '</div></div>' +
        '</div>' +
      '</div>';
    document.getElementById('ttModalRoot').innerHTML = html;

    document.getElementById('ttMcCancel').onclick = closeModal;
    wireCategoryFileInputs();
    document.getElementById('ttMcSave').onclick = async ()=>{
      const rowEls = Array.from(document.querySelectorAll('#mcRows .mc-row'));
      const plan = [];
      const usedNames = new Set();
      for(const row of rowEls){
        const origCat = row.dataset.origCat;
        let newName = row.querySelector('.mc-name').value.trim();
        if(!newName) newName = origCat;
        const key = newName.toLowerCase();
        if(usedNames.has(key)){
          alert('Category name "'+newName+'" is used more than once. Please make category names unique, or delete the duplicate row by renaming items to a single category from the item edit form.');
          return;
        }
        usedNames.add(key);
        const filesEl = row.querySelector('.mc-files');
        const attachments = JSON.parse(filesEl.dataset.attachments || '[]');
        plan.push({ from: origCat, to: newName, attachments: attachments });
      }
      plan.forEach(p=>{
        if(p.from !== p.to){
          ITEMS.forEach(i=>{ if((i.category||'Uncategorized') === p.from) i.category = p.to; });
        }
      });
      const newMeta = {};
      plan.forEach(p=>{ newMeta[p.to] = { section: 'tools', attachments: p.attachments }; });
      CATEGORY_META = newMeta;

      closeModal();
      renderAll();
      await persistCategoryMeta();
      await persist();
    };
  }

  function openDeleteConfirm(item){
    // Deleting an assembly doesn't take its sub-items down with it -- they're promoted back to
    // top-level items (parentId cleared) rather than silently deleted along with their parent.
    const childCount = ITEMS.filter(i=>i.parentId===item.id).length;
    const childNote = childCount
      ? ' This item has '+childCount+' sub-item'+(childCount===1?'':'s')+' under it -- '+(childCount===1?'it':'they')+' will be kept, moved back to being top-level item'+(childCount===1?'':'s')+' instead of being deleted.'
      : '';
    const html =
      '<div class="tt-modal-backdrop" id="ttModalBackdrop">' +
        '<div class="tt-modal" style="max-width:420px;">' +
          '<h2>Delete "'+escapeHTML(item.name)+'"?</h2>' +
          '<p class="sub">This removes the item and its attachments permanently. This can\'t be undone.'+childNote+'</p>' +
          '<div class="tt-modal-footer"><div></div><div class="btn-row">' +
            '<button class="btn" id="ttDelCancel">Cancel</button>' +
            '<button class="btn danger" id="ttDelConfirm">Delete</button>' +
          '</div></div>' +
        '</div>' +
      '</div>';
    document.getElementById('ttModalRoot').innerHTML = html;
    document.getElementById('ttDelCancel').onclick = closeModal;
    document.getElementById('ttDelConfirm').onclick = async ()=>{
      ITEMS.forEach(i=>{
        if(i.parentId===item.id){
          i.parentId = null;
          // Promoted to top-level, so its old sortIndex (relative to its old sibling
          // sub-items) no longer means anything in its new group -- send it to the end.
          i.sortIndex = nextSortIndexFor(sortGroupKey(i));
        }
      });
      ITEMS = ITEMS.filter(i=>i.id!==item.id);
      closeModal();
      renderAll();
      await persist();
    };
  }

  function generateReport(catFilters, statusFilter){
    let pool = ITEMS.slice();
    const allCats = sortedCategories(ITEMS);
    // Only actually filter by category when the person narrowed the selection -- if every
    // category is checked (or, as a safety net, none are), treat it the same as "all categories".
    const catFilterActive = Array.isArray(catFilters) && catFilters.length > 0 && catFilters.length < allCats.length;
    if(catFilterActive){
      const catSet = new Set(catFilters);
      pool = pool.filter(i => catSet.has(i.category||'Uncategorized'));
    }
    if(statusFilter) pool = pool.filter(i => dueInfo(i).status === statusFilter);

    const cats = sortedCategories(pool);
    let rows = '';
    cats.forEach(cat=>{
      const inCat = sortItemsByDue(pool.filter(i => (i.category||'Uncategorized') === cat));
      if(!inCat.length) return;
      rows += '<tr class="grp"><td colspan="9">'+escapeHTML(cat)+'</td></tr>';
      inCat.forEach(item=>{
        const di = dueInfo(item);
        const certOnFile = (item.calReportAttachments||[]).length > 0 ? 'Yes ('+item.calReportAttachments.length+')' : 'No';
        const holdStr = (item.holding && item.holding.active) ? ('Yes, since '+fmtDateNice(item.holding.sentDate)) : 'No';
        const chipColor = di.status==='overdue' ? '#fbe9e7;color:#b0281e' : di.status==='soon' ? '#faf1de;color:#b3791b' : di.status==='holding' ? '#ece9f8;color:#5a4aa8' : di.status==='nolimit' ? '#eee;color:#666' : '#e6f2ea;color:#2f7d4f';
        rows += '<tr>' +
          '<td>'+escapeHTML(item.name)+'</td>' +
          '<td>'+escapeHTML(item.action||'')+'</td>' +
          '<td>'+escapeHTML(item.makeModel||'')+'</td>' +
          '<td>'+escapeHTML(item.serialNo||item.trackingNo||'')+'</td>' +
          '<td>'+(item.limitMonths?item.limitMonths+' mo':'No limit')+'</td>' +
          '<td>'+fmtDateNice(item.lastPerformed)+'</td>' +
          '<td>'+(di.due?fmtDateNice(di.due):'—')+'</td>' +
          '<td><span class="pr-status-chip" style="background:'+chipColor+'">'+escapeHTML(di.label)+'</span></td>' +
          '<td>'+certOnFile+'</td>' +
        '</tr>';
      });
    });

    const genDate = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
    const html =
      '<div class="pr-head">' +
        '<h1>Phoenix Heli-Flight — Tool &amp; Calibration Tracking Report</h1>' +
        '<div class="meta">Generated ' + genDate + '<br>' + pool.length + ' item(s)' + (catFilterActive?(' · '+escapeHTML(catFilters.join(', '))):'') + (statusFilter?(' · '+statusFilter):'') + '</div>' +
      '</div>' +
      '<table class="tt-report-table"><thead><tr>' +
        '<th>Name</th><th>Action</th><th>Make/Model</th><th>Serial/Tracking</th><th>Interval</th><th>Last Performed</th><th>Due Date</th><th>Status</th><th>Cert on File</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';

    openPrint(html);
  }

  // ---------- init ----------
  async function init(){
    await loadData();
    await loadCategoryMeta();
    document.getElementById('ttAddBtn').onclick = ()=>openItemForm(null);
    document.getElementById('ttReportBtn').onclick = openReportModal;
    document.getElementById('ttUndoBtn').onclick = undoLastChange;
    document.getElementById('ttSearch').oninput = (e)=>{ SEARCH_Q = e.target.value; renderList(); };
    document.getElementById('ttSortMode').onchange = (e)=>{ SORT_MODE = e.target.value; renderList(); };
    document.getElementById('ttCategoryFilter').onchange = (e)=>{ CATEGORY_FILTER = e.target.value; renderList(); };
    document.getElementById('ttInstalledOnly').onchange = (e)=>{ INSTALLED_ONLY = e.target.checked; renderList(); };
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
