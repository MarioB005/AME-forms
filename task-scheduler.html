<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Scheduler</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#fbfaf6;
    --panel:#ffffff;
    --line:#dfe2da;
    --accent:#c05a2c;
    --grey-strong:#1c2b24;
    --radius:10px;
    --good:#2f7d4f;
    --good-bg:#e6f2ea;
    --warn:#b3791b;
    --warn-bg:#faf1de;
    --bad:#b0281e;
    --bad-bg:#fbe9e7;
    --hold:#5a4aa8;
    --hold-bg:#ece9f8;
    --meet:#2563eb;
    --meet-bg:#e8eefd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-size:14px;}
  #app{max-width:1800px;margin:0 auto;padding:18px 24px 60px;}

  h1.ts-title{margin:0 0 2px;font-size:20px;}
  p.ts-sub{margin:0 0 16px;color:var(--grey-strong);font-size:12.5px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}

  .btn{
    padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;font-size:13px;color:var(--ink);font-weight:600;
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn.danger{color:#b0281e;}
  .btn.tiny{padding:3px 8px;font-size:11px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  .ts-tabs{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .ts-tab{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:800;color:var(--grey-strong);}
  .ts-tab.active{background:#123a5e;color:#fff;border-color:#123a5e;}
  .ts-tab .cnt{opacity:.85;font-weight:700;margin-left:4px;}

  .ts-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .ts-stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;}
  .ts-stat .n{font-size:22px;font-weight:800;line-height:1.1;}
  .ts-stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);font-weight:700;margin-top:2px;}
  .ts-stat.bad .n{color:var(--bad);}
  .ts-stat.warn .n{color:var(--warn);}
  .ts-stat.good .n{color:var(--good);}

  .ts-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .ts-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .ts-controls input[type="search"]{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:190px;}
  .ts-controls select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--panel);color:var(--ink);}
  .wa-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--grey-strong);font-weight:600;white-space:nowrap;}
  .wa-check input{width:15px;height:15px;}

  .wa-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 340px);margin-bottom:6px;background:var(--panel);}
  table.wa-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:980px;}
  table.wa-table thead th{background:#fbf3d6;border-bottom:1px solid #e3d69a;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#7a6a2e;white-space:nowrap;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 #e3d69a;cursor:pointer;user-select:none;}
  table.wa-table thead th.nosort{cursor:default;}
  table.wa-table thead th .arrow{opacity:.55;margin-left:2px;}
  table.wa-table tbody tr.item-row{border-bottom:1px solid var(--line);cursor:pointer;}
  table.wa-table tbody tr.item-row:hover{background:#f4f8fb;}
  table.wa-table tbody tr.item-row.completed{opacity:.55;}
  table.wa-table tbody tr.item-row.completed td.desc{text-decoration:line-through;}
  table.wa-table td{padding:7px 10px;vertical-align:middle;}
  table.wa-table td.desc{white-space:pre-wrap;max-width:520px;}
  table.wa-table td.num{white-space:nowrap;}
  table.wa-table td.due-cell{font-weight:800;white-space:nowrap;}
  table.wa-table td.due-cell.ok{color:var(--good);}
  table.wa-table td.due-cell.warn{color:var(--warn);}
  table.wa-table td.due-cell.bad{color:var(--bad);}
  table.wa-table td.due-cell.nolimit{color:var(--grey-strong);font-weight:600;}
  table.wa-table td.act-cell{white-space:nowrap;text-align:center;}
  .wa-footer-count{font-size:11px;color:var(--grey-strong);padding:6px 4px 16px;text-align:right;}

  .prio-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;border-radius:999px;font-size:10px;text-transform:uppercase;font-weight:800;white-space:nowrap;}
  .prio-badge.p-1{background:var(--bad);color:#fff;}
  .prio-badge.p-m{background:var(--meet);color:#fff;}
  .prio-badge.p-2{background:var(--warn-bg);color:var(--warn);}
  .prio-badge.p-other{background:#e9ece6;color:var(--grey-strong);}

  .ts-empty{color:var(--grey-strong);font-size:13px;padding:30px 0;text-align:center;}

  .att-dot{display:inline-block;font-size:13px;}
  .link-dot{display:inline-block;font-size:12px;color:var(--meet);margin-left:3px;}

  /* modal */
  .ts-modal-backdrop{position:fixed;inset:0;background:rgba(20,25,20,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;}
  .ts-modal{background:var(--panel);border-radius:12px;max-width:720px;width:100%;padding:22px 24px 24px;color:var(--ink);}
  .ts-modal.wide{max-width:880px;}
  .ts-modal h2{margin:0 0 2px;font-size:18px;}
  .ts-modal .sub{margin:0 0 16px;color:var(--grey-strong);font-size:12px;}
  .ts-modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--grey-strong);line-height:1;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:9.5px;color:var(--grey-strong);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--panel);color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field.span2{grid-column:span 2;}
  .field.checkline{flex-direction:row;align-items:center;gap:8px;padding-top:18px;}
  .field.checkline label{text-transform:none;font-size:13px;font-weight:600;order:2;}
  .field.checkline input{width:16px;height:16px;order:1;}

  .ts-linked-chip{display:flex;align-items:center;gap:8px;background:var(--meet-bg);color:#123a5e;border:1px solid #c7d7f2;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:14px;}
  .ts-linked-chip button{margin-left:auto;}

  .ts-att-block{margin-bottom:14px;}
  .ts-att-block > label{font-size:11px;color:var(--grey-strong);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:6px;}
  .ts-att-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .ts-att-thumb{position:relative;width:74px;}
  .ts-att-thumb img{width:74px;height:74px;object-fit:cover;border:1px solid var(--line);border-radius:7px;display:block;}
  .ts-att-thumb .file-chip{width:74px;height:74px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--paper);}
  .ts-att-thumb .fn{font-size:9.5px;color:var(--grey-strong);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .ts-att-thumb .rm{position:absolute;top:-6px;right:-6px;background:#b0281e;color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:1;cursor:pointer;}
  .ts-att-thumb a.ts-att-open{display:block;text-decoration:none;color:inherit;cursor:pointer;}
  .ts-att-thumb a.ts-att-open:hover img, .ts-att-thumb a.ts-att-open:hover .file-chip{opacity:.8;}
  .ts-att-thumb a.ts-att-open:hover .fn{text-decoration:underline;}

  .ts-modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:10px;}

  .ts-undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;}
  .ts-undo-toast.show{opacity:1;}

  /* settings modal: reorderable lists */
  .ts-set-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .ts-set-col h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--grey-strong);}
  .ts-set-list{border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;margin-bottom:8px;}
  .ts-set-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);cursor:grab;}
  .ts-set-item:last-child{border-bottom:none;}
  .ts-set-item.dragging{opacity:.4;}
  .ts-set-item.drag-over-before{box-shadow:inset 0 2px 0 0 var(--accent);}
  .ts-set-item.drag-over-after{box-shadow:inset 0 -2px 0 0 var(--accent);}
  .ts-set-item .handle{color:var(--grey-strong);opacity:.6;user-select:none;}
  .ts-set-item input{flex:1;border:1px solid transparent;background:transparent;font-size:12.5px;padding:3px 4px;border-radius:4px;color:var(--ink);font-family:inherit;}
  .ts-set-item input:focus{border-color:var(--line);background:var(--paper);}
  .ts-set-item .rm{background:none;border:none;color:var(--bad);cursor:pointer;font-size:13px;padding:2px 4px;}
  .ts-set-add{display:flex;gap:6px;}
  .ts-set-add input{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;}

  #printArea{display:none;}
  @page{margin:12mm;size:landscape;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
  }
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1c2b24;padding-bottom:10px;margin-bottom:14px;}
  .pr-head h1{margin:0;font-size:17.5pt;}
  .pr-head .meta{font-size:11px;color:var(--ink);text-align:right;}
  .ts-report-table{width:100%;border-collapse:collapse;font-size:10.5pt;}
  .ts-report-table th{text-align:left;padding:6px 8px;color:var(--ink);font-size:9.5pt;text-transform:uppercase;border-bottom:2px solid var(--ink);}
  .ts-report-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;}

  @media (max-width:640px){
    .ts-controls{width:100%;}
  }
</style>
</head>
<body>
<div id="app">
  <h1 class="ts-title">Task Scheduler</h1>
  <p class="ts-sub">Maintenance task list &amp; meeting notes, by aircraft and AME — Phoenix Heli-Flight.</p>

  <div class="ts-tabs" id="tsTabs"></div>

  <div id="tsSummary"></div>

  <div class="ts-toolbar">
    <div class="ts-controls">
      <input type="search" id="tsSearch" placeholder="Search description, registration, notes...">
      <select id="tsRegFilter"><option value="">All registrations</option></select>
      <select id="tsPrioFilter"><option value="">All priorities</option></select>
      <select id="tsSortMode">
        <option value="smart" selected>Smart order (priority + due date)</option>
        <option value="due">Due date</option>
        <option value="entered">Date entered</option>
        <option value="registration">Registration</option>
        <option value="ame">AME / Participant</option>
      </select>
      <label class="wa-check"><input type="checkbox" id="tsShowCompleted"> Show completed</label>
    </div>
    <div class="ts-controls">
      <button class="btn primary" id="tsAddBtn">+ Add</button>
      <button class="btn" id="tsPrintBtn">Print List</button>
      <button class="btn" id="tsSettingsBtn">⚙️ Settings</button>
      <button class="btn" id="tsUndoBtn" title="Undo the last change">↩️ Undo</button>
    </div>
  </div>

  <div id="tsSyncNote" style="display:none;" class="ts-linked-chip"></div>

  <div id="tsListArea"></div>
</div>

<div id="tsModalRoot"></div>
<div id="printArea"></div>

<script>
(function(){
  'use strict';

  // ---------- storage: same Supabase project/table as the main AME Forms app, own key prefix ----------
  const SUPABASE_URL = 'https://frlehxadkvgwzyxovwua.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ioAPLi8DWuC0HCUUYEeQ3Q_dildZYKI';
  const SUPABASE_CONFIGURED = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
  const DATA_KEY = 'scheduler:data:v1';

  window.__storageLastError = null;

  async function storageGet(key){
    if(SUPABASE_CONFIGURED){
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?key=eq.' + encodeURIComponent(key) + '&select=value', {
          headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
        });
        if(res.ok){
          const rows = await res.json();
          if(rows && rows.length){
            try{ localStorage.setItem('cache:'+key, rows[0].value); }catch(e){}
            return rows[0].value;
          }
        } else {
          window.__storageLastError = 'GET ' + key + ': HTTP ' + res.status;
        }
      }catch(e){ window.__storageLastError = 'GET ' + key + ': ' + e; }
    }
    try{ return localStorage.getItem('cache:'+key); }catch(e){ return null; }
  }

  let __storageWriteQueue = Promise.resolve();
  async function storageSet(key, value){
    try{ localStorage.setItem('cache:'+key, value); }catch(e){}
    if(!SUPABASE_CONFIGURED) return true;
    let ok = true;
    const doWrite = async ()=>{
      try{
        const res = await fetch(SUPABASE_URL + '/rest/v1/app_data?on_conflict=key', {
          method: 'POST',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify({ key: key, value: value })
        });
        if(!res.ok){
          ok = false;
          let detail = '';
          try{ detail = await res.text(); }catch(e2){}
          window.__storageLastError = 'PUT ' + key + ': HTTP ' + res.status + (detail?(' — '+detail.slice(0,300)):'');
          console.error('storageSet failed', key, res.status, detail);
        }
      }catch(e){
        ok = false;
        window.__storageLastError = 'PUT ' + key + ': ' + e;
        console.error('storageSet failed', key, e);
      }
    };
    __storageWriteQueue = __storageWriteQueue.then(doWrite, doWrite);
    await __storageWriteQueue;
    return ok;
  }

  // ---------- utils ----------
  function escapeHTML(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function fmtDateNice(iso){
    if(!iso) return '—';
    const [y,m,d] = String(iso).slice(0,10).split('-').map(Number);
    if(!y) return '—';
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
  }
  function uid(){ return 'task-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

    PREV_STATE = JSON.stringify({ tasks: TASKS, settings: SETTINGS });
  }
  async function undo(){
    if(!PREV_STATE){ showUndoToast('Nothing to undo.'); return; }
    try{
      const restored = JSON.parse(PREV_STATE);
      TASKS = restored.tasks;
      SETTINGS = restored.settings;
      PREV_STATE = null;
      await persist();
      showUndoToast('Undid the last change.');
      renderAll();
    }catch(e){ showUndoToast('Could not undo.'); }
  }

  let toastTimer = null;
  function showUndoToast(msg){
    let el = document.getElementById('tsUndoToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'tsUndoToast';
      el.className = 'ts-undo-toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2600);
  }

  // ---------- priority ordering / colour ----------
  function priorityWeight(p){
    const items = SETTINGS.priorities.items || [];
    const idx = items.findIndex(x=> String(x) === String(p));
    return idx !== -1 ? idx : 999;
  }
  function priorityBadgeClass(p){
    const s = String(p);
    if(s === '1') return 'p-1';
    if(s.toUpperCase() === 'M') return 'p-m';
    if(s === '2') return 'p-2';
    return 'p-other';
  }
  function dueInfo(t){
    if(t.completed) return {cls:'ok', label:'Done'};
    if(!t.dueDate) return {cls:'nolimit', label:'—'};
    const dueDate = new Date(String(t.dueDate).slice(0,10)+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.round((dueDate - today)/86400000);
    if(days < 0) return {cls:'bad', label:'Overdue'};
    if(days <= 7) return {cls:'warn', label:'Due soon'};
    return {cls:'ok', label:'OK'};
  }

  // ---------- filtering / sorting ----------
  function visibleTasks(){
    let list = TASKS.filter(t=> taskType(t) === CURRENT_TAB);
    if(!SHOW_COMPLETED) list = list.filter(t=> !t.completed);
    if(REG_FILTER) list = list.filter(t=> (t.registration||'') === REG_FILTER);
    if(PRIO_FILTER) list = list.filter(t=> String(t.priority) === PRIO_FILTER);
    if(SEARCH_Q){
      const q = SEARCH_Q.toLowerCase();
      list = list.filter(t=>
        (t.description||'').toLowerCase().includes(q) ||
        (t.registration||'').toLowerCase().includes(q) ||
        (t.ameAssigned||'').toLowerCase().includes(q) ||
        (t.notes||'').toLowerCase().includes(q)
      );
    }
    return sortTasks(list);
  }

  function sortTasks(list){
    const dir = SORT_DIR === 'desc' ? -1 : 1;
    return list.slice().sort((a,b)=>{
      if(SORT_MODE === 'smart'){
        if(a.completed !== b.completed) return a.completed ? 1 : -1;
        const aOver = !a.completed && a.dueDate && dueInfo(a).cls === 'bad';
        const bOver = !b.completed && b.dueDate && dueInfo(b).cls === 'bad';
        if(aOver !== bOver) return aOver ? -1 : 1;
        const pw = priorityWeight(a.priority) - priorityWeight(b.priority);
        if(pw !== 0) return pw;
        const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
        const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
        return ad - bd;
      }
      if(SORT_MODE === 'due'){
        const ad = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
        const bd = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
        return (ad - bd) * dir;
      }
      if(SORT_MODE === 'entered'){
        const ad = a.dateEntered ? new Date(a.dateEntered).getTime() : 0;
        const bd = b.dateEntered ? new Date(b.dateEntered).getTime() : 0;
        return (ad - bd) * dir;
      }
      if(SORT_MODE === 'registration') return (String(a.registration||'').localeCompare(String(b.registration||''))) * dir;
      if(SORT_MODE === 'ame') return (String(a.ameAssigned||'').localeCompare(String(b.ameAssigned||''))) * dir;
      return 0;
    });
  }

  // ---------- settings modal (reorderable AMEs / Registrations / Participants / Priorities) ----------
  function openSettingsModal(){
    const SECTIONS = [
      { key:'registrations', label:'Registrations' },
      { key:'ames', label:'AMEs' },
      { key:'participants', label:'Meeting Participants' },
      { key:'priorities', label:'Priorities' }
    ];
    const colHTML = SECTIONS.map(s=>
      '<div class="ts-set-col" data-key="'+s.key+'">' +
        '<h3>'+s.label+'</h3>' +
        '<div class="ts-set-list" id="tsSetList_'+s.key+'"></div>' +
        '<div class="ts-set-add"><input type="text" id="tsSetAddInput_'+s.key+'" placeholder="Add '+s.label.toLowerCase()+'..."><button class="btn small" data-add="'+s.key+'">+ Add</button></div>' +
      '</div>'
    ).join('');
    document.getElementById('tsModalRoot').innerHTML =
      '<div class="ts-modal-backdrop" id="tsSetBackdrop">' +
        '<div class="ts-modal wide">' +
          '<button class="ts-modal-close" id="tsSetCloseBtn">✕</button>' +
          '<h2>Settings</h2>' +
          '<p class="sub">Manage the dropdown lists used across the Task Scheduler. Drag to reorder — priority order also controls sort order.</p>' +
          '<div class="ts-set-cols">' + colHTML + '</div>' +
          '<div class="ts-modal-footer"><div></div><div class="btn-row"><button class="btn primary" id="tsSetDoneBtn">Done</button></div></div>' +
        '</div>' +
      '</div>';
    document.getElementById('tsSetCloseBtn').onclick = closeModal;
    document.getElementById('tsSetDoneBtn').onclick = closeModal;
    document.getElementById('tsSetBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='tsSetBackdrop') closeModal(); });

    let dragIdx = null, dragKey = null;
    function renderListFor(key){
      const items = SETTINGS[key].items;
      const el = document.getElementById('tsSetList_'+key);
      el.innerHTML = items.map((it,i)=>
        '<div class="ts-set-item" draggable="true" data-idx="'+i+'">' +
          '<span class="handle">⠿</span>' +
          '<input type="text" value="'+escapeHTML(String(it))+'" data-idx="'+i+'">' +
          '<button type="button" class="rm" data-idx="'+i+'">✕</button>' +
        '</div>'
      ).join('');
      el.querySelectorAll('.ts-set-item input').forEach(inp=>{
        inp.addEventListener('change', async ()=>{
          const i = Number(inp.dataset.idx);
          const v = inp.value.trim();
          if(v) items[i] = (key==='priorities' && v!=='' && !isNaN(Number(v)) && String(Number(v))===v) ? Number(v) : v;
          await persist();
        });
      });
      el.querySelectorAll('.rm').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          items.splice(Number(btn.dataset.idx),1);
          await persist();
          renderListFor(key);
        });
      });
      el.querySelectorAll('.ts-set-item').forEach(row=>{
        row.addEventListener('dragstart', ()=>{ dragIdx = Number(row.dataset.idx); dragKey = key; row.classList.add('dragging'); });
        row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); el.querySelectorAll('.ts-set-item').forEach(r=>r.classList.remove('drag-over-before','drag-over-after')); });
        row.addEventListener('dragover', (e)=>{
          if(dragKey!==key) return;
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height/2;
          el.querySelectorAll('.ts-set-item').forEach(r=>r.classList.remove('drag-over-before','drag-over-after'));
          row.classList.add(before ? 'drag-over-before' : 'drag-over-after');
        });
        row.addEventListener('drop', async (e)=>{
          e.preventDefault();
          el.querySelectorAll('.ts-set-item').forEach(r=>r.classList.remove('drag-over-before','drag-over-after'));
          if(dragKey!==key || dragIdx===null) return;
          const rect = row.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height/2;
          const targetIdxOriginal = Number(row.dataset.idx);
          if(targetIdxOriginal === dragIdx){ dragIdx = null; dragKey = null; return; }
          const [moved] = items.splice(dragIdx,1);
          let insertIdx = targetIdxOriginal;
          if(dragIdx < targetIdxOriginal) insertIdx -= 1; // list shifted down by the removal above
          if(!before) insertIdx += 1;
          items.splice(insertIdx, 0, moved);
          dragIdx = null; dragKey = null;
          await persist();
          renderListFor(key);
        });
      });
    }
    SECTIONS.forEach(s=> renderListFor(s.key));
    SECTIONS.forEach(s=>{
      document.querySelector('[data-add="'+s.key+'"]').addEventListener('click', async ()=>{
        const inp = document.getElementById('tsSetAddInput_'+s.key);
        const v = inp.value.trim();
        if(!v) return;
        const val = (s.key==='priorities' && !isNaN(Number(v)) && String(Number(v))===v) ? Number(v) : v;
        SETTINGS[s.key].items.push(val);
        inp.value = '';
        await persist();
        renderListFor(s.key);
      });
    });
  }

        '<td>'+escapeHTML(t.description||'')+'</td>' +
        '<td>'+fmtDateNice(t.dueDate)+'</td>' +
        '<td>'+fmtDateNice(t.dateEntered)+'</td>' +
        '<td>'+(t.completed?'Yes':'No')+'</td>' +
      '</tr>';
    }).join('');
    document.getElementById('printArea').innerHTML =
      '<div class="pr-head"><h1>' + (CURRENT_TAB==='meeting'?'Meeting Agenda / Notes':'Aircraft Maintenance Task List') + '</h1>' +
      '<div class="meta">Phoenix Heli-Flight<br>' + stamp + '</div></div>' +
      '<table class="ts-report-table"><thead><tr><th>Priority</th><th>' + COL_LABEL[CURRENT_TAB] + '</th><th>Registration</th><th>Description</th><th>Due Date</th><th>Entered</th><th>Completed</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
    window.print();
  }

  // ---------- wire up static controls ----------
  function initControls(){
    document.getElementById('tsSearch').addEventListener('input', (e)=>{ SEARCH_Q = e.target.value; renderList(); });
    document.getElementById('tsRegFilter').addEventListener('change', (e)=>{ REG_FILTER = e.target.value; renderList(); });
    document.getElementById('tsPrioFilter').addEventListener('change', (e)=>{ PRIO_FILTER = e.target.value; renderList(); });
    document.getElementById('tsSortMode').addEventListener('change', (e)=>{ SORT_MODE = e.target.value; SORT_DIR='asc'; renderList(); });
    document.getElementById('tsShowCompleted').addEventListener('change', (e)=>{ SHOW_COMPLETED = e.target.checked; renderSummary(); renderList(); });
    document.getElementById('tsAddBtn').addEventListener('click', ()=> openEditModal(null));
    document.getElementById('tsPrintBtn').addEventListener('click', printList);
    document.getElementById('tsSettingsBtn').addEventListener('click', openSettingsModal);
    document.getElementById('tsUndoBtn').addEventListener('click', undo);
  }

  async function init(){
    initControls();
    await loadData();
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
